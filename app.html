: 3, "t": "self", "q": "숫자 1, 2, 3, 4, 5, 6이 하나씩 적힌 6장의 카드를 모두 일렬로 나열할 때, 1이 적힌 카드는 맨 앞에 오고 짝수가 적힌 카드끼리는 ==이웃하지 않도록== 나열하는 경우의 수를 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"이웃하지 않도록\" → 평화로운 쪽(홀수)을 먼저 세우고 사이에 끼웁니다.\n**2. 먼저 세우기** 맨 앞은 1로 고정, 나머지 홀수 3, 5의 순서 → 2! = 2\n**3. 끼울 자리 세기** 1 _ ○ _ ○ _ : 맨 앞자리는 1이 차지했으므로 빈칸 V는 3개\n**4. 정산** 짝수 2, 4, 6을 서로 다른 빈칸 3개에 → _{3}P_{3} = 6. 2 × 6 = 12\n**정답: 12**", "ck": ["신호 문장 찾기", "먼저 세우기", "끼울 자리 세기", "정산"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "sa", "q": "남학생 3명과 여학생 2명이 일렬로 설 때, 여학생끼리 이웃하지 않는 경우의 수를 구하시오.", "x": "72|72개|72가지", "s": "**신호 읽기**: \"이웃하지 않는\" → 이웃하면 안 되는 사람을 나중에 빈칸에 끼워 넣으라는 신호입니다.\n**상황 번역**: 이웃해도 되는 남학생 3명을 먼저 세웁니다. 그러면 사이사이와 양 끝에 빈칸 4개가 생기고, 여학생을 서로 다른 빈칸에 넣으면 여학생끼리는 절대 붙지 않습니다.\n**풀이**: 남학생 줄 세우기 3! = 6. 빈칸 4개 중 2개를 골라 서로 다른 여학생을 순서 있게 앉히기(오디션) _{4}P_{2} = 12. 6 × 12 = 72\n**함정**: 여학생은 서로 다른 사람이므로 빈칸을 고르는 것(C)이 아니라 고른 칸에 누가 앉는지까지 정하는 순열(P)입니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "서로 다른 책 5권 중에서 3권을 골라 책꽂이에 일렬로 꽂는 경우의 수를 구하시오.", "x": "60|60개|60가지", "s": "**신호 읽기**: \"골라 일렬로 꽂는\" → 뽑은 뒤 자리 순서가 의미 있으므로 오디션(순열)입니다.\n**상황 번역**: 첫 칸, 둘째 칸, 셋째 칸이라는 서로 다른 역할이 있는 오디션입니다.\n**풀이**: 첫 칸 5권, 둘째 칸 4권, 셋째 칸 3권 → _{5}P_{3} = 5 × 4 × 3 = 60\n**함정**: 순서가 있는지 판단하는 질문: \"뽑힌 두 권의 자리를 바꾸면 다른 경우인가?\" 바꾸면 달라지므로 순열입니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "학생 10명 중에서 대표 2명을 뽑는 경우의 수를 구하시오.", "x": "45|45개|45가지", "s": "**신호 읽기**: \"대표 2명을 뽑는\" → 뽑힌 두 사람에게 역할 구분이 없으므로 장보기(조합)입니다.\n**상황 번역**: 바구니에 두 명을 담기만 하고 순서는 따지지 않습니다.\n**풀이**: _{10}C_{2} = {{10 × 9§2 × 1}} = 45\n**함정**: '회장 1명, 부회장 1명'이었다면 역할이 달라 _{10}P_{2} = 90입니다. 역할의 유무로 P와 C를 가릅니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "흰 공 5개와 검은 공 3개를 일렬로 나열할 때, 검은 공끼리 이웃하지 않도록 나열하는 경우의 수를 구하시오. (단, 같은 색 공끼리는 구별하지 않는다.)", "x": "20|20개|20가지", "s": "**신호 읽기**: \"이웃하지 않도록\" + \"같은 색 공끼리는 구별하지 않는다\" → 빈칸 끼우기 + 고르기만(조합)\n**상황 번역**: 흰 공 5개를 먼저 놓으면(모두 같은 공이라 1가지) 빈칸이 6개 생깁니다. 검은 공은 모두 같으므로 어느 빈칸에 넣을지 고르기만 하면 됩니다.\n**풀이**: _{6}C_{3} = 20\n**함정**: 1번과 달리 끼우는 공이 서로 같으므로 P가 아니라 C입니다. '구별하는가'를 늘 확인합니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "다섯 문자 A, B, C, D, E를 일렬로 나열할 때, A와 B가 이웃하도록 나열하는 경우의 수를 구하시오.", "x": "48|48개|48가지", "s": "**신호 읽기**: \"이웃하도록\" → 붙어야 하는 사람을 끈으로 묶어 한 사람처럼 보라는 신호입니다.\n**상황 번역**: A와 B를 한 묶음으로 보면 줄 서는 대상은 [AB], C, D, E의 4개입니다.\n**풀이**: 4개 줄 세우기 4! = 24. 묶음 안에서 AB, BA 순서 2가지. 24 × 2 = 48\n**함정**: 묶음 안의 순서(×2)를 빠뜨리는 실수가 가장 흔합니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "1부터 6까지의 자연수 중 서로 다른 세 수를 골라 작은 수부터 차례로 a, b, c라 할 때, b = 3인 경우의 수를 구하시오.", "x": "6|6개|6가지", "s": "**신호 읽기**: \"작은 수부터 차례로\"는 순서가 자동으로 정해진다는 신호 → 고르기만(조합)\n**상황 번역**: b = 3을 고정석으로 두면, a는 3보다 작은 수에서, c는 3보다 큰 수에서 하나씩 고르면 됩니다.\n**풀이**: a: {1, 2}에서 1개 → 2가지. c: {4, 5, 6}에서 1개 → 3가지. 2 × 3 = 6\n**함정**: 고른 뒤 크기순으로 자리가 정해지므로 줄 세우기(×순서)를 하지 않습니다.", "src": "변형 6"}, {"l": 2, "t": "sa", "q": "월, 화, 수, 목, 금, 토, 일 중 3일을 골라 학원에 가려고 한다. 학원 가는 날이 서로 이웃(연속)하지 않는 경우의 수를 구하시오. (단, 일요일과 월요일은 이웃하지 않는 것으로 본다.)", "x": "10|10개|10가지", "s": "**신호 읽기**: \"서로 이웃(연속)하지 않는\" → 빈칸 끼우기 신호입니다. 요일은 순서가 이미 정해진 자리입니다.\n**상황 번역**: 학원에 가지 않는 4일을 먼저 늘어놓으면 그 사이사이와 양 끝에 빈칸 5개가 생깁니다. 학원 가는 날을 서로 다른 빈칸에 넣으면 연속하지 않습니다.\n**풀이**: 빈칸 5개 중 3개를 고르기 _{5}C_{3} = 10. 요일 순서는 정해져 있으므로 고르기만 합니다.\n**함정**: 7일 중 3일을 고르는 _{7}C_{3} = 35에서 연속인 경우를 빼려고 하면 경우가 복잡해집니다. 빈칸 끼우기가 안전합니다.", "src": "변형 7"}, {"l": 3, "t": "self", "q": "3명 이상이 이웃하지 않아야 할 때, 전체에서 '셋이 뭉친 경우'만 빼면 틀리는 이유를 서술하시오.", "x": null, "s": "**정답: 셋이 모두 뭉친 경우만 빼면, 그중 두 명만 이웃하고 한 명은 떨어져 있는 경우가 그대로 남는다. 이 경우에도 '이웃하는 사람'이 있으므로 조건 '아무도 이웃하지 않음'을 어긴 배열이 답에 섞이게 된다.**\n**신호 읽기**: 틀리는 이유를 묻는 서술형은 '빼지 못한 경우'를 구체적으로 보여 주면 됩니다.\n**상황 번역**: '아무도 이웃하지 않음'의 반대(뒷문)는 '셋 모두 뭉침'이 아니라 '적어도 두 명이 이웃함'입니다.\n**풀이**: 그래서 이웃하지 않는 조건은 '먼저 세우고 빈칸에 끼우기'로 바로 세는 것이 가장 정확하다는 처방까지 씁니다.\n**함정**: 예를 하나 들어 주면 설득력이 커집니다. 예: A, B, C 중 A와 B만 붙은 배열 'AB□C'", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "남학생 4명, 여학생 2명, 선생님 1명이 일렬로 설 때, 여학생끼리 이웃하지 않고 선생님은 맨 앞에 서는 경우의 수를 구하시오.", "x": "480|480개|480가지", "s": "**신호 읽기**: \"맨 앞에 서는\" → 고정석, \"이웃하지 않고\" → 빈칸 끼우기. 조건 두 개를 차례로 처리합니다.\n**상황 번역**: 선생님을 맨 앞에 고정하면 남은 자리는 6개입니다. 그 안에서 남학생 4명을 먼저 세우면 빈칸 5개가 생깁니다.\n**풀이**: 남학생 4! = 24. 빈칸 5개에 서로 다른 여학생 2명 _{5}P_{2} = 20. 24 × 20 = 480\n**함정**: 선생님 바로 뒤 빈칸에 여학생이 서도 여학생끼리는 이웃하지 않으므로 그 빈칸도 셉니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "영어 단어 MATRIX의 6개 문자를 일렬로 나열할 때, M이 맨 앞에 오고 모음 A와 I가 서로 이웃하지 않는 경우의 수를 구하시오.", "x": "72|72개|72가지", "s": "**신호 읽기**: [고난도] 고정석(M 맨 앞) + 이웃 금지(모음 A, I) 두 조건입니다.\n**상황 번역**: M을 맨 앞에 고정하면 나머지 다섯 자리에 T, R, X, A, I가 들어갑니다. 이웃해도 되는 자음 T, R, X를 먼저 세우고 빈칸 4개에 모음을 끼웁니다.\n**풀이**: 자음 3! = 6. 빈칸 4개에 서로 다른 모음 2개 _{4}P_{2} = 12. 6 × 12 = 72\n**함정**: 맨 앞 빈칸(M 바로 뒤)에 모음이 와도 모음끼리는 이웃하지 않으므로 포함합니다. M은 고정되어 있어 빈칸 계산에만 영향을 주지 않습니다.", "src": "변형 10"}]}, {"id": "a9", "u": "D", "ex": "1-1", "t": "9. 주문서와 가격표론", "color": "검정", "emoji": "⚫", "en": "Theory of Order Sheet and Price List", "th": [["p", "행렬은 숫자를 가로줄(행)과 세로줄(열)에 맞춰 늘어놓은 **표**입니다. 엑셀 표처럼 칸마다 주소가 있어서, i행 j열에 있는 수를 (i, j) 성분 a_{ij}라고 부릅니다. 덧셈·뺄셈은 **같은 주소의 칸끼리**, 실수배는 **모든 칸에 똑같이** 계산합니다. 그래서 크기(행과 열의 개수)가 같은 표끼리만 더하고 뺄 수 있습니다."], ["p", "행렬의 곱셈은 처음 보면 낯설지만 '**주문서 × 가격표**'로 읽으면 자연스럽습니다. 앞 행렬의 한 가로줄(주문서: 품목별 수량)과 뒤 행렬의 한 세로줄(가격표: 품목별 가격)을 칸마다 곱해서 모두 더하면, 그 주문의 총 금액이 됩니다. 그래서 **앞 행렬의 열 개수(주문서 품목 수)와 뒤 행렬의 행 개수(가격표 품목 수)가 같아야** 곱할 수 있고, 결과는 (앞의 행 개수) × (뒤의 열 개수) 크기의 표가 됩니다. 주문서와 가격표의 순서를 바꾸면 계산의 뜻이 달라지므로 일반적으로 AB ≠ BA입니다."], ["li", "**유사 상황 독해법**: \"(i, j) ==성분==\"은 칸 주소, \"A + B==,== kA\"는 같은 칸 계산, \"AB\"는 주문서의 가로줄 × 가격표의 세로줄 신호입니다."], ["p", "**[보충] 행렬 계산표**"], ["tbl", [["계산", "할 수 있는 조건", "방법"], ["A + B, A − B", "크기가 같다", "같은 칸끼리 더하고 뺀다"], ["kA", "언제나", "모든 칸에 k를 곱한다"], ["AB", "A의 열 개수 = B의 행 개수", "A의 i행과 B의 j열을 칸마다 곱해 더한 값이 (i, j) 성분"]]], ["p", "⟦a¤b¦c¤d⟧⟦p¤q¦r¤s⟧ = ⟦ap + br¤aq + bs¦cp + dr¤cq + ds⟧"]], "sum": ["신호: \"(i, j) 성분\", \"AB\" → **같은 칸 계산, 가로줄 × 세로줄**", "**유사 상황 독해법**: \"(i, j) ==성분==\"은 칸 주소, \"A + B==,== kA\"는 같은 칸 계산, \"AB\"는 주문서의 가로줄 × 가격표의 세로줄 신호입니다."], "fl": [["\"(i, j) 성분\", \"AB\" — 이 신호를 보면 꺼낼 도구는?", "같은 칸 계산, 가로줄 × 세로줄"], ["계산: A + B, A − B → 할 수 있는 조건 / 방법?", "크기가 같다 / 같은 칸끼리 더하고 뺀다"], ["계산: kA → 할 수 있는 조건 / 방법?", "언제나 / 모든 칸에 k를 곱한다"], ["계산: AB → 할 수 있는 조건 / 방법?", "A의 열 개수 = B의 행 개수 / A의 i행과 B의 j열을 칸마다 곱해 더한 값이 (i, j) 성분"], ["유사 상황 독해법이란?", "\"(i, j) ==성분==\"은 칸 주소, \"A + B==,== kA\"는 같은 칸 계산, \"AB\"는 주문서의 가로줄 × 가격표의 세로줄 신호입니다."]], "bk": {"q": "책을 덮고 「주문서와 가격표론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"(i, j) 성분\", \"AB\"", "꺼낼 도구: 같은 칸 계산, 가로줄 × 세로줄", "유사 상황 독해법", "칸 주소 읽기", "주소마다 계산", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "2 × 2 행렬 A의 (i, j) ==성분== a_{ij}가 a_{ij} = 2i − j일 때, 행렬 A를 구하시오.", "x": null, "s": "**1. 칸 주소 읽기** a_{11}, a_{12}는 1행, a_{21}, a_{22}는 2행입니다.\n**2. 주소마다 계산** a_{11} = 2 − 1 = 1, a_{12} = 2 − 2 = 0, a_{21} = 4 − 1 = 3, a_{22} = 4 − 2 = 2\n**3. 정산** A = ⟦1¤0¦3¤2⟧", "ck": ["칸 주소 읽기", "주소마다 계산", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "두 행렬 A = ⟦1¤2¦3¤4⟧, B = ⟦2¤0¦−1¤1⟧에 대하여 2A − B를 구하시오.", "x": null, "s": "**1. 모든 칸에 2배** 2A = ⟦2¤4¦6¤8⟧\n**2. 같은 칸끼리 빼기** ⟦2 − 2¤4 − 0¦6 − (−1)¤8 − 1⟧\n**3. 정산** 2A − B = ⟦0¤4¦7¤7⟧", "ck": ["모든 칸에 2배", "같은 칸끼리 빼기", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "사과 3개와 배 2개를 사려고 한다. 가게 갑에서는 사과가 1000원, 배가 2000원이고, 가게 을에서는 사과가 1200원, 배가 1800원이다. 주문서 ⟦3¤2⟧와 가격표 ⟦1000¤1200¦2000¤1800⟧의 ==곱==을 구하고, 어느 가게에서 사는 것이 더 싼지 말하시오.", "x": null, "s": "**1. 곱할 수 있는지 확인** 주문서는 1 × 2, 가격표는 2 × 2이므로 품목 수 2가 같아 곱할 수 있고, 결과는 1 × 2입니다.\n**2. 가로줄 × 세로줄** 갑: 3 × 1000 + 2 × 2000 = 7000, 을: 3 × 1200 + 2 × 1800 = 7200\n**3. 정산** ⟦7000¤7200⟧. 가게 갑이 200원 더 쌉니다.", "ck": ["곱할 수 있는지 확인", "가로줄 × 세로줄", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "두 행렬 A = ⟦1¤2¦0¤3⟧, B = ⟦a¤1¦b¤2⟧에 대하여 ==AB = BA==일 때, a + b의 값을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"AB\", \"BA\" → 주문서 × 가격표 계산, 순서를 바꾸면 결과가 다를 수 있습니다.\n**2. AB 계산** AB = ⟦a + 2b¤5¦3b¤6⟧\n**3. BA 계산** BA = ⟦a¤2a + 3¦b¤2b + 6⟧\n**4. 같은 칸 비교** a + 2b = a → b = 0, 5 = 2a + 3 → a = 1 → a + b = 1\n**정답: 1**", "ck": ["신호 문장 찾기", "AB 계산", "BA 계산", "같은 칸 비교"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "self", "q": "2 × 2 행렬 A의 (i, j) 성분이 a_{ij} = ij일 때, 행렬 A를 구하시오.", "x": null, "s": "**정답: ⟦1¤2¦2¤4⟧**\n**신호 읽기**: \"(i, j) 성분이 a_{ij} = ij\"는 칸마다 주소(행 번호 i, 열 번호 j)를 넣어 값을 채우라는 신호입니다.\n**상황 번역**: i는 가로줄 번호(몇 번째 주문서), j는 세로줄 번호(몇 번째 품목)입니다.\n**풀이**: a_{11} = 1, a_{12} = 2, a_{21} = 2, a_{22} = 4\n**함정**: 행과 열의 순서를 바꾸지 않습니다. a_{12}는 1행 2열(첫째 줄 오른쪽 칸)입니다.", "src": "변형 1"}, {"l": 1, "t": "self", "q": "A = ⟦2¤−1¦0¤3⟧, B = ⟦1¤4¦−2¤1⟧일 때, A + B를 구하시오.", "x": null, "s": "**정답: ⟦3¤3¦−2¤4⟧**\n**신호 읽기**: 행렬의 덧셈 → 같은 자리 칸끼리 더합니다.\n**상황 번역**: 두 가게의 같은 품목 판매량을 칸별로 합치는 장면입니다.\n**풀이**: ⟦2 + 1¤−1 + 4¦0 − 2¤3 + 1⟧ = ⟦3¤3¦−2¤4⟧\n**함정**: 덧셈은 크기(행과 열의 개수)가 같은 행렬끼리만 할 수 있습니다.", "src": "변형 2"}, {"l": 1, "t": "self", "q": "2번 문항의 두 행렬 A, B에 대하여 3A − 2B를 구하시오.", "x": null, "s": "**정답: ⟦4¤−11¦4¤7⟧**\n**신호 읽기**: 실수배는 모든 칸에 같은 수를 곱하고, 뺄셈은 같은 칸끼리 뺍니다.\n**상황 번역**: 3A는 주문량을 모두 3배로, 2B는 모두 2배로 늘린 표입니다.\n**풀이**: 3A = ⟦6¤−3¦0¤9⟧, 2B = ⟦2¤8¦−4¤2⟧ → ⟦6 − 2¤−3 − 8¦0 − (−4)¤9 − 2⟧ = ⟦4¤−11¦4¤7⟧\n**함정**: 음수를 뺄 때 0 − (−4) = 4처럼 괄호를 씁니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "⟦1¤2¦3¤4⟧⟦2¦1⟧을 계산하시오.", "x": null, "s": "**정답: ⟦4¦10⟧**\n**신호 읽기**: 행렬의 곱셈 → 앞 행렬의 가로줄(주문서)과 뒤 행렬의 세로줄(가격표)을 짝지어 곱해 더합니다.\n**상황 번역**: 첫째 주문서 (1개, 2개), 둘째 주문서 (3개, 4개)를 가격표 (2원, 1원)로 계산합니다.\n**풀이**: 1행: 1 × 2 + 2 × 1 = 4. 2행: 3 × 2 + 4 × 1 = 10\n**함정**: 결과의 크기는 (앞의 행 개수)×(뒤의 열 개수) = 2 × 1입니다. 결과를 가로로 쓰지 않습니다.", "src": "변형 4"}, {"l": 2, "t": "self", "q": "⟦1¤2¦0¤1⟧⟦3¤0¦1¤2⟧를 계산하시오.", "x": null, "s": "**정답: ⟦5¤4¦1¤2⟧**\n**신호 읽기**: 2 × 2 행렬끼리의 곱 → 결과의 칸 (i, j)는 앞의 i행과 뒤의 j열의 짝 곱의 합입니다.\n**상황 번역**: 결과 칸마다 \"어느 주문서 × 어느 가격표\"인지 먼저 정합니다.\n**풀이**: (1, 1): 1 × 3 + 2 × 1 = 5, (1, 2): 1 × 0 + 2 × 2 = 4, (2, 1): 0 × 3 + 1 × 1 = 1, (2, 2): 0 × 0 + 1 × 2 = 2\n**함정**: 같은 자리끼리 곱하는(칸별 곱) 것이 아닙니다. 덧셈과 곱셈의 규칙이 다르다는 점이 이 유형의 핵심입니다.", "src": "변형 5"}, {"l": 2, "t": "self", "q": "A = ⟦1¤2¦3¤4⟧, B = ⟦0¤1¦1¤0⟧일 때, AB와 BA를 각각 구하고 같은지 비교하시오.", "x": null, "s": "**정답: AB = ⟦2¤1¦4¤3⟧, BA = ⟦3¤4¦1¤2⟧, 서로 다르다**\n**신호 읽기**: AB와 BA를 비교하라는 문제는 '행렬의 곱셈은 순서를 바꾸면 결과가 달라질 수 있다'를 확인하는 문제입니다.\n**상황 번역**: AB는 A가 주문서, B가 가격표이고, BA는 역할이 뒤바뀝니다. 주문서와 가격표의 역할이 바뀌면 계산 내용이 달라집니다.\n**풀이**: AB: (1, 1) = 1 × 0 + 2 × 1 = 2, (1, 2) = 1 × 1 + 2 × 0 = 1, (2, 1) = 3 × 0 + 4 × 1 = 4, (2, 2) = 3 × 1 + 4 × 0 = 3. BA: (1, 1) = 0 × 1 + 1 × 3 = 3, (1, 2) = 0 × 2 + 1 × 4 = 4, (2, 1) = 1 × 1 + 0 × 3 = 1, (2, 2) = 1 × 2 + 0 × 4 = 2\n**함정**: 수의 곱셈처럼 AB = BA라고 생각하면 안 됩니다. 이 결과를 보면 B를 뒤에 곱하면 열이, 앞에 곱하면 행이 바뀝니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "행렬 X에 대하여 X + ⟦1¤2¦3¤4⟧ = ⟦5¤5¦5¤5⟧일 때, X를 구하시오.", "x": null, "s": "**정답: ⟦4¤3¦2¤1⟧**\n**신호 읽기**: 행렬 방정식 X + A = B → 수의 방정식처럼 X = B − A로 옮기면 됩니다.\n**상황 번역**: 같은 칸끼리의 덧셈이므로 칸마다 따로 '□ + 1 = 5'를 푸는 것과 같습니다.\n**풀이**: X = ⟦5 − 1¤5 − 2¦5 − 3¤5 − 4⟧ = ⟦4¤3¦2¤1⟧\n**함정**: 이항할 때 부호가 바뀌는 것은 수의 방정식과 같습니다.", "src": "변형 7"}, {"l": 3, "t": "self", "q": "2 × 3 행렬끼리는 곱할 수 없는 이유를 '주문서와 가격표' 비유로 서술하시오.", "x": null, "s": "**정답: 행렬의 곱은 앞 행렬의 가로줄(주문서)에 적힌 품목 수량과 뒤 행렬의 세로줄(가격표)에 적힌 가격을 하나씩 짝지어 곱하는 계산이다. 2 × 3 행렬끼리 곱하면 주문서에는 품목이 3개인데 가격표(세로줄)에는 가격이 2개뿐이라 짝이 맞지 않으므로 곱할 수 없다.**\n**신호 읽기**: 곱셈의 조건 '앞의 열 개수 = 뒤의 행 개수'를 비유로 풀어 쓰는 서술형입니다.\n**상황 번역**: 주문서 품목 수(앞의 열 개수)와 가격표 품목 수(뒤의 행 개수)가 같아야 계산서가 만들어집니다.\n**풀이**: 이 조건이 맞을 때 결과 크기는 (앞의 행 개수)×(뒤의 열 개수)라는 점까지 쓰면 완성입니다.\n**함정**: \"크기가 같아서 안 된다\"는 틀린 설명입니다. 덧셈은 크기가 같아야 하고, 곱셈은 앞의 열과 뒤의 행만 같으면 됩니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "⟦a¤1¦2¤b⟧ + ⟦3¤c¦d¤1⟧ = ⟦5¤4¦0¤6⟧일 때, a + b + c + d의 값을 구하시오.", "x": "8|8개|8가지", "s": "**신호 읽기**: 행렬의 등식 → 같은 자리 칸끼리 같다는 식 네 개로 바꿉니다.\n**상황 번역**: 덧셈 결과의 각 칸을 하나씩 비교합니다.\n**풀이**: (1, 1): a + 3 = 5 → a = 2. (1, 2): 1 + c = 4 → c = 3. (2, 1): 2 + d = 0 → d = −2. (2, 2): b + 1 = 6 → b = 5. 합 2 + 5 + 3 − 2 = 8\n**함정**: 칸의 위치를 헷갈리면 b와 c가 바뀝니다. 칸마다 주소를 적어 두고 비교합니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "행렬 A = ⟦1¤0¦2¤1⟧에 대하여 A를 5번 곱한 행렬 AAAAA를 구하시오.", "x": null, "s": "**정답: ⟦1¤0¦10¤1⟧**\n**신호 읽기**: [고난도] 같은 행렬을 여러 번 곱하는 문제 → 몇 번 직접 곱해서 규칙을 찾으라는 신호입니다.\n**상황 번역**: 한 번 곱할 때마다 어느 칸이 어떻게 변하는지 관찰합니다.\n**풀이**: AA = ⟦1¤0¦4¤1⟧, (AA)A = ⟦1¤0¦6¤1⟧. A를 한 번 더 곱할 때마다 (2, 1) 성분만 2씩 커지고 나머지는 그대로입니다. 5번 곱하면 (2, 1) 성분은 2 × 5 = 10\n**함정**: 규칙을 찾은 뒤 4번 곱한 것(⟦1¤0¦8¤1⟧)까지 직접 확인하면 실수를 막을 수 있습니다.", "src": "변형 10"}]}, {"id": "b1", "u": "E", "ex": "2-2", "t": "1. 경사로 표지판론", "color": "빨강", "emoji": "🔴", "en": "Theory of the Slope Sign", "th": [["p", "좌표평면은 바둑판 모양의 도시 지도입니다. 지도 위의 두 점 사이 거리는 '가로로 얼마, 세로로 얼마 갔는가'를 두 변으로 하는 직각삼각형의 빗변이므로 피타고라스 정리 그대로 √{(x_{2} − x_{1})^{2} + (y_{2} − y_{1})^{2}}입니다. 선분을 m:n으로 나누는 **내분점**은 시소 위의 균형점과 같습니다. A 쪽에서 m, B 쪽에서 n만큼 떨어진 점이므로, 가까운 쪽 끝점의 좌표에 더 큰 비중이 실립니다."], ["p", "직선은 도로이고, 도로마다 **경사로 표지판(기울기)**이 붙어 있습니다. 기울기는 '오른쪽으로 1칸 갈 때 위로 몇 칸 올라가는가'입니다. 직선 하나는 **표지판(기울기) + 지나는 한 지점**만 알면 완전히 정해집니다: y − y_{1} = m(x − x_{1})"], ["p", "두 도로의 관계도 표지판으로 읽습니다. 표지판이 같으면 영원히 만나지 않는 **평행**한 도로(단, 같은 도로가 아니어야 함)이고, 한 도로의 표지판을 90° 돌린 표지판은 **기울기의 곱이 − 1**이 됩니다(**수직**). 점에서 도로까지의 거리는 도로로 가는 여러 길 중 **가장 짧은 길, 즉 수직으로 내린 길**의 길이입니다."], ["li", "**1:1 매칭 기호 독해법**: ==\"==m:n==으로 내분\"== → 가까운 끝점에 큰 비중. ==\"평행한 직선\"== → 기울기 같게. ==\"수직인 직선\"== → 기울기 곱 − 1. ==\"점과 직선 사이의 거리\"== → 직선을 ax + by + c = 0 꼴로 바꾼 뒤 거리 공식."], ["p", "**[보충] 꺼내 쓸 공식표**"], ["tbl", [["신호", "도구"], ["두 점 사이의 거리", "√{(x_{2} − x_{1})^{2} + (y_{2} − y_{1})^{2}}"], ["m:n 내분점", "({{mx_{2} + nx_{1}§m + n}}, {{my_{2} + ny_{1}§m + n}}), 중점은 m = n"], ["기울기 m, 점 (x_{1}, y_{1})", "y − y_{1} = m(x − x_{1})"], ["두 점을 지나는 직선", "기울기 {{y_{2} − y_{1}§x_{2} − x_{1}}}를 먼저 구하기"], ["평행 / 수직", "m_{1} = m_{2} (절편은 다름) / m_{1}m_{2} = −1"], ["점 (x_{1}, y_{1})과 직선 ax + by + c = 0 사이의 거리", "{{| ax_{1} + by_{1} + c |§√{a^{2} + b^{2}}}}"]]], ["p", "**[보충] 일반형에서 평행 읽기**: ax + by + c = 0과 a′ x + b′ y + c′ = 0은 {{a§a′}} = {{b§b′}} ≠ {{c§c′}}이면 평행입니다. 세 비가 모두 같으면 같은 직선(일치)이므로 평행이 아닙니다."]], "sum": ["신호: \"내분하는 점\", \"평행\", \"수직\", \"점과 직선 사이의 거리\" → **기울기(표지판), 거리 공식**", "**1:1 매칭 기호 독해법**: ==\"==m:n==으로 내분\"== → 가까운 끝점에 큰 비중. ==\"평행한 직선\"== → 기울기 같게. ==\"수직인 직선\"== → 기울기 곱 − 1. ==\"점과 직선 사이의 거리\"== → 직선을 ax + by + c = 0 꼴로 바꾼 뒤 거리 공식."], "fl": [["\"내분하는 점\", \"평행\", \"수직\", \"점과 직선 사이의 거리\" — 이 신호를 보면 꺼낼 도구는?", "기울기(표지판), 거리 공식"], ["신호: 두 점 사이의 거리 → 도구?", "√{(x_{2} − x_{1})^{2} + (y_{2} − y_{1})^{2}}"], ["신호: m:n 내분점 → 도구?", "({{mx_{2} + nx_{1}§m + n}}, {{my_{2} + ny_{1}§m + n}}), 중점은 m = n"], ["신호: 기울기 m, 점 (x_{1}, y_{1}) → 도구?", "y − y_{1} = m(x − x_{1})"], ["신호: 두 점을 지나는 직선 → 도구?", "기울기 {{y_{2} − y_{1}§x_{2} − x_{1}}}를 먼저 구하기"]], "bk": {"q": "책을 덮고 「경사로 표지판론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"내분하는 점\", \"평행\", \"수직\", \"점과 직선 사이의 거리\"", "꺼낼 도구: 기울기(표지판), 거리 공식", "1:1 매칭 기호 독해법", "가로·세로 이동량", "시소의 균형점", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "두 점 A(1, 2), B(4, 6)에 대하여 ==선분== AB==의 길이와 선분== AB==를== 2:1==로 내분하는 점==의 좌표를 구하시오.", "x": null, "s": "**1. 가로·세로 이동량** 가로 4 − 1 = 3, 세로 6 − 2 = 4 → ‾{AB} = √{9 + 16} = 5\n**2. 시소의 균형점** 2:1이면 B 쪽에 더 가까우므로 B에 비중 2: ({{2 × 4 + 1 × 1§3}}, {{2 × 6 + 1 × 2§3}})\n**3. 정산** 길이 5, 내분점 (3, {{14§3}})", "ck": ["가로·세로 이동량", "시소의 균형점", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "점 (2, 1)을 지나고 직선 2x − y + 3 = 0에 ==수직인== 직선의 방정식을 구하시오.", "x": null, "s": "**1. 표지판 읽기** 2x − y + 3 = 0 → y = 2x + 3, 기울기 2\n**2. 90° 돌린 표지판** 기울기의 곱이 − 1 → 새 기울기 −{{1§2}}\n**3. 정산** y − 1 = −{{1§2}}(x − 2) → x + 2y − 4 = 0", "ck": ["표지판 읽기", "90° 돌린 표지판", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "점 (1, 3)과 ==직선== 3x + 4y − 5 = 0 ==사이의 거리==를 구하시오.", "x": null, "s": "**1. 도로 식 확인** 이미 ax + by + c = 0 꼴: a = 3, b = 4, c = −5\n**2. 공식 대입** {{|3 × 1 + 4 × 3 − 5|§√{9 + 16}}} = {{10§5}}\n**3. 정산** 2", "ck": ["도로 식 확인", "공식 대입", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "두 점 A(−1, 2), B(5, 8)에 대하여 선분 AB를 ==2 : 1로 내분하는 점==을 지나고 직선 AB에 ==수직인 직선==의 y절편을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"내분하는 점\" + \"수직\" → 내분점 공식과 기울기 곱 −1을 꺼냅니다.\n**2. 내분점** P = ({{2 × 5 + 1 × (−1)§3}}, {{2 × 8 + 1 × 2§3}}) = (3, 6)\n**3. 경사로 표지판** 직선 AB의 기울기 {{8 − 2§5 − (−1)}} = 1 → 수직인 직선의 기울기는 −1\n**4. 정산** y − 6 = −(x − 3) → y = −x + 9 → y절편 9\n**정답: 9**", "ck": ["신호 문장 찾기", "내분점", "경사로 표지판", "정산"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "sa", "q": "두 점 (−1, 2), (2, 6) 사이의 거리를 구하시오.", "x": "5|5개|5가지", "s": "**신호 읽기**: \"두 점 사이의 거리\"는 지도 위 직각삼각형의 빗변을 구하라는 신호입니다.\n**상황 번역**: (−1, 2)에서 (2, 6)까지 가로로 2 − (−1) = 3칸, 세로로 6 − 2 = 4칸 이동했습니다. 이 두 이동이 직각삼각형의 두 변입니다.\n**풀이**: 빗변 = √{3^{2} + 4^{2}} = √{25} = 5\n**함정**: 음수 좌표를 뺄 때 2 − (−1)을 2 − 1로 계산하는 실수가 가장 흔합니다. 괄호를 꼭 씁니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "두 점 A(−2, 1), B(4, 7)에 대하여 선분 AB를 1:2로 내분하는 점의 좌표를 구하시오.", "x": "(0, 3)|(0,3)", "s": "**신호 읽기**: \"1:2로 내분\"은 시소의 균형점을 찾으라는 신호입니다.\n**상황 번역**: 1:2는 A에서 1만큼, B에서 2만큼 떨어진 점이므로 A에 더 가깝습니다. 가까운 A의 좌표에 큰 비중 2를, B에 작은 비중 1을 줍니다.\n**풀이**: x = {{1 × 4 + 2 × (−2)§3}} = 0, y = {{1 × 7 + 2 × 1§3}} = 3\n**함정**: 공식의 mx_{2} + nx_{1}에서 m이 x_{2}(먼 쪽 점)에 곱해진다는 점이 헷갈리면 \"가까운 점에 큰 비중\"으로 확인합니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "두 점 (1, 5), (3, −1)을 잇는 선분의 중점의 좌표를 구하시오.", "x": "(2, 2)|(2,2)", "s": "**신호 읽기**: \"중점\"은 비중이 1:1인 시소의 한가운데입니다.\n**상황 번역**: 두 점의 좌표를 칸마다 평균 내면 됩니다.\n**풀이**: ({{1 + 3§2}}, {{5 + (−1)§2}}) = (2, 2)\n**함정**: 중점은 내분점 공식에서 m = n = 1인 특별한 경우라는 점을 연결해 두면 공식을 따로 외울 필요가 없습니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "두 점 (1, 2), (3, 8)을 지나는 직선의 방정식을 구하시오.", "x": "y = 3x − 1|y=3x-1|3x-1", "s": "**신호 읽기**: \"두 점을 지나는 직선\"은 표지판(기울기)이 아직 없는 도로입니다. 표지판부터 만듭니다.\n**상황 번역**: 오른쪽으로 3 − 1 = 2칸 갈 때 위로 8 − 2 = 6칸 올라가므로, 1칸당 3칸 → 기울기 3\n**풀이**: 기울기 3, 지나는 점 (1, 2) → y − 2 = 3(x − 1) → y = 3x − 1\n**함정**: 기울기를 구할 때 분자와 분모의 빼는 순서를 같게 해야 합니다. {{8 − 2§3 − 1}}처럼 같은 점을 앞에 둡니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "직선 y = 2x + 1에 평행하고 점 (1, 4)를 지나는 직선의 방정식을 구하시오.", "x": "y = 2x + 2|y=2x+2|2x+2", "s": "**신호 읽기**: \"평행\"은 같은 표지판을 단 다른 도로입니다.\n**상황 번역**: 기울기는 2로 그대로 가져오고, 지나는 지점만 (1, 4)로 바꿉니다.\n**풀이**: y − 4 = 2(x − 1) → y = 2x + 2\n**함정**: 결과가 원래 직선 y = 2x + 1과 같아지면 평행이 아니라 같은 도로입니다. 절편이 다른지 마지막에 확인합니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "직선 x + 3y − 1 = 0에 수직이고 원점을 지나는 직선의 방정식을 구하시오.", "x": "y = 3x|y=3x|3x", "s": "**신호 읽기**: \"수직\"은 표지판을 90° 돌리라는 신호이며, 기울기의 곱이 − 1이 됩니다.\n**상황 번역**: x + 3y − 1 = 0을 y = −{{1§3}}x + {{1§3}}로 바꾸면 표지판은 −{{1§3}}입니다. 곱해서 − 1이 되는 수는 3입니다.\n**풀이**: 원점을 지나므로 y = 3x\n**함정**: 일반형 그대로 x의 계수 1을 기울기로 읽으면 틀립니다. 반드시 y = ⋯ 꼴로 바꿔 표지판을 읽습니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "점과 직선 사이의 거리를 '점에서 수직으로 내린 선분의 길이'로 정하는 이유를 '도로까지 가는 가장 짧은 길' 비유로 서술하시오.", "x": null, "s": "**정답: 점에서 도로까지 가는 길은 무수히 많지만, 비스듬히 가는 길은 모두 직각삼각형의 빗변이 되어 수직으로 가는 길(다른 한 변)보다 길다. 그래서 가장 짧은 길인 수선의 길이를 '거리'로 정한다.**\n**신호 읽기**: '왜 그렇게 정하는가'를 묻는 서술형은 비유와 수학적 근거를 함께 써야 합니다.\n**상황 번역**: 점 P에서 도로에 수선을 내린 발을 H, 도로 위 다른 점을 Q라 하면 삼각형 PHQ는 ∠ H = 90^{°}인 직각삼각형입니다.\n**풀이**: 빗변 ‾{PQ}는 언제나 ‾{PH}보다 길므로, 거리는 하나로 정해지는 최단 길이 ‾{PH}입니다.\n**함정**: \"수직이니까\"만 쓰면 근거가 부족합니다. '빗변이 가장 길다'는 비교까지 써야 합니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "원점과 직선 3x − 4y + 10 = 0 사이의 거리를 구하시오.", "x": "2|2개|2가지", "s": "**신호 읽기**: \"원점과 직선 사이의 거리\"는 점과 직선 사이 거리 공식에 (0, 0)을 넣는 문제입니다.\n**상황 번역**: 도로 3x − 4y + 10 = 0은 이미 ax + by + c = 0 꼴입니다.\n**풀이**: {{|0 − 0 + 10|§√{9 + 16}}} = {{10§5}} = 2\n**함정**: 분모의 √{a^{2} + b^{2}}에 c를 넣지 않습니다. 분모는 도로의 방향(표지판)만 담고 있습니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "평행한 두 직선 x + 2y − 1 = 0, x + 2y + 4 = 0 사이의 거리를 구하시오.", "x": null, "s": "**정답: √{5}**\n**신호 읽기**: \"평행한 두 직선 사이의 거리\"는 한 도로 위의 아무 점에서 다른 도로까지의 거리와 같습니다.\n**상황 번역**: 평행한 두 도로 사이의 폭은 어디서 재도 같으므로, 계산하기 쉬운 점 하나를 고릅니다. x + 2y − 1 = 0 위의 점 (1, 0)\n**풀이**: (1, 0)과 x + 2y + 4 = 0 사이 거리 = {{|1 + 0 + 4|§√{1 + 4}}} = {{5§√{5}}} = √{5}\n**함정**: 고른 점이 정말 첫 직선 위에 있는지(1 + 0 − 1 = 0) 먼저 확인합니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "세 점 A(1, 1), B(4, 5), C(5, −2)를 꼭짓점으로 하는 삼각형 ABC의 넓이를 선분 AB의 길이와 점 C에서 직선 AB까지의 거리를 이용하여 구하시오.", "x": "{{25§2}}|25/2", "s": "**신호 읽기**: [고난도] 문제가 \"길이와 거리를 이용하여\"라고 도구를 지정했습니다. 밑변 = 선분 길이, 높이 = 점과 직선 사이 거리로 번역합니다.\n**상황 번역**: 삼각형 넓이 = {{1§2}} ×(밑변 ‾{AB})×(꼭짓점 C에서 도로 AB까지의 거리)\n**풀이**: ‾{AB} = √{3^{2} + 4^{2}} = 5. 직선 AB: 기울기 {{4§3}}, y − 1 = {{4§3}}(x − 1) → 4x − 3y − 1 = 0. C(5, −2)까지 거리 = {{|20 + 6 − 1|§5}} = 5. 넓이 = {{1§2}} × 5 × 5 = {{25§2}}\n**함정**: 직선 AB의 식을 ax + by + c = 0 꼴로 정리하지 않고 거리 공식에 넣으면 틀립니다. 정리 후 두 점 A, B를 대입해 0이 되는지 확인합니다.", "src": "변형 10"}]}, {"id": "b2", "u": "E", "ex": "2-2", "t": "2. 레이더 반경론", "color": "주황", "emoji": "🟠", "en": "Theory of Radar Range", "th": [["p", "원의 방정식 (x − a)^{2} + (y − b)^{2} = r^{2}은 '중심 (a, b)에 세운 레이더 기지가 반지름 r까지 탐지한다'는 문장을 수식으로 옮긴 것입니다. 원 위의 모든 점은 기지에서 정확히 r만큼 떨어져 있습니다. 그래서 원 문제를 만나면 가장 먼저 **레이더 기지(중심)와 탐지 거리(반지름)**를 찾아야 합니다. 식이 x^{2} + y^{2} + Ax + By + C = 0처럼 풀어져 있으면 완전제곱식으로 묶어 기지 위치를 드러냅니다."], ["p", "직선을 레이더 앞을 지나가는 비행 경로라고 생각해 봅시다. 비행기가 레이더망에 몇 번 걸리는지 알려면 연립해서 근을 셀 수도 있지만, 훨씬 간단한 방법이 있습니다. **기지에서 비행 경로까지의 최단 거리** d를 재서 탐지 거리 r과 비교하는 것입니다. 경로가 탐지 거리 안쪽을 지나면 두 번 걸리고(d < r), 경계를 스치면 한 번(d = r), 바깥을 지나면 걸리지 않습니다(d > r)."], ["li", "**유사 상황 독해법**: \"==서로 다른 두 점에서 만난다==\", \"==접한다==\", \"==만나지 않는다==\"가 보이면 연립하기 전에 '기지에서 경로까지 거리'부터 떠올리세요. 이때 꺼내는 도구가 점과 직선 사이의 거리 공식입니다."], ["p", "**[보충] 레이더 판정표**"], ["tbl", [["기지~경로 거리 d와 반지름 r", "위치 관계", "교점"], ["d < r", "서로 다른 두 점에서 만난다", "2개"], ["d = r", "접한다", "1개"], ["d > r", "만나지 않는다", "0개"]]], ["p", "**[보충] 꺼내 쓸 도구 (유형 1에서 가져오기)**"], ["li", "점 (x_{1}, y_{1})과 직선 ax + by + c = 0 사이의 거리 d = {{| ax_{1} + by_{1} + c |§√{a^{2} + b^{2}}}}는 유형 1의 '도로까지 가장 짧은 길'입니다. 이 유형에서는 기지(중심)에서 비행 경로(직선)까지 잴 때 씁니다."], ["li", "원 위의 점에서 그은 접선은 그 점과 중심을 잇는 반지름에 수직입니다. 그래서 접선의 기울기는 반지름 기울기와 곱해서 − 1이 되는 값입니다(유형 1의 수직 조건)."], ["li", "\"지름의 양 끝점\"이 주어지면 중심은 두 점의 중점, 반지름은 두 점 사이 거리의 절반입니다."]], "sum": ["신호: \"접한다\", \"두 점에서 만난다\" → **중심~직선 거리 d와 반지름 r 비교**", "**유사 상황 독해법**: \"==서로 다른 두 점에서 만난다==\", \"==접한다==\", \"==만나지 않는다==\"가 보이면 연립하기 전에 '기지에서 경로까지 거리'부터 떠올리세요. 이때 꺼내는 도구가 점과 직선 사이의 거리 공식입니다.", "점 (x_{1}, y_{1})과 직선 ax + by + c = 0 사이의 거리 d = {{| ax_{1} + by_{1} + c |§√{a^{2} + b^{2}}}}는 유형 1의 '도로까지 가장 짧은 길'입니다. 이 유형에서는 기지(중심)에서 비행 경로(직선)까지 잴 때 씁니다.", "원 위의 점에서 그은 접선은 그 점과 중심을 잇는 반지름에 수직입니다. 그래서 접선의 기울기는 반지름 기울기와 곱해서 − 1이 되는 값입니다(유형 1의 수직 조건).", "\"지름의 양 끝점\"이 주어지면 중심은 두 점의 중점, 반지름은 두 점 사이 거리의 절반입니다."], "fl": [["\"접한다\", \"두 점에서 만난다\" — 이 신호를 보면 꺼낼 도구는?", "중심~직선 거리 d와 반지름 r 비교"], ["기지~경로 거리 d와 반지름 r: d < r → 위치 관계 / 교점?", "서로 다른 두 점에서 만난다 / 2개"], ["기지~경로 거리 d와 반지름 r: d = r → 위치 관계 / 교점?", "접한다 / 1개"], ["기지~경로 거리 d와 반지름 r: d > r → 위치 관계 / 교점?", "만나지 않는다 / 0개"], ["유사 상황 독해법이란?", "\"==서로 다른 두 점에서 만난다==\", \"==접한다==\", \"==만나지 않는다==\"가 보이면 연립하기 전에 '기지에서 경로까지 거리'부터 떠올리세요. 이때 꺼내는 도구가 점과 직선 사이의 거리 공식입니다."]], "bk": {"q": "책을 덮고 「레이더 반경론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"접한다\", \"두 점에서 만난다\"", "꺼낼 도구: 중심~직선 거리 d와 반지름 r 비교", "유사 상황 독해법", "기지 숨김 해제", "탐지 거리 읽기", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "방정식 x^{2} + y^{2} − 4x + 2y − 4 = 0이 나타내는 원의 ==중심의 좌표와 반지름의 길이==를 구하시오.", "x": null, "s": "**1. 기지 숨김 해제** x끼리, y끼리 모아 완전제곱식을 만듭니다. (x^{2} − 4x + 4) + (y^{2} + 2y + 1) = 4 + 4 + 1\n**2. 탐지 거리 읽기** (x − 2)^{2} + (y + 1)^{2} = 9 = 3^{2}\n**3. 정산** 중심 (2, −1), 반지름 3", "ck": ["기지 숨김 해제", "탐지 거리 읽기", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "원 x^{2} + y^{2} = 5와 직선 y = 2x + k가 ==접할== 때, 실수 k의 값을 모두 구하시오.", "x": null, "s": "**1. 기지와 탐지 거리** 기지는 원점 (0, 0), 탐지 거리는 √{5}입니다.\n**2. 경로까지 거리** 직선을 2x − y + k = 0으로 바꾸면 d = {{|k|§√{2^{2} + (−1)^{2}}}} = {{|k|§√{5}}}\n**3. 정산** 접하려면 d = r: {{|k|§√{5}}} = √{5} → |k| = 5 → k = 5 또는 k = −5", "ck": ["기지와 탐지 거리", "경로까지 거리", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "원 (x − 1)^{2} + (y − 2)^{2} = 4와 직선 3x + 4y + k = 0이 ==서로 다른 두 점에서 만나==도록 하는 실수 k의 값의 범위를 구하시오.", "x": null, "s": "**1. 기지와 탐지 거리** 기지 (1, 2), 탐지 거리 2\n**2. 경로까지 거리** d = {{|3 · 1 + 4 · 2 + k|§√{3^{2} + 4^{2}}}} = {{|k + 11|§5}}\n**3. 정산** 두 번 걸리려면 d < r: {{|k + 11|§5}} < 2 → |k + 11| < 10 → −21 < k < −1", "ck": ["기지와 탐지 거리", "경로까지 거리", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "원 x^{2} + y^{2} − 4x − 2y + 1 = 0 위의 점 P와 직선 3x − 4y + 13 = 0 사이의 거리의 ==최댓값==과 ==최솟값==의 합을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** 원 위의 점과 직선 사이 거리 → 레이더 기지(중심)~경로 거리 d부터 잽니다.\n**2. 기지와 반경** (x − 2)^{2} + (y − 1)^{2} = 4 → 중심 (2, 1), r = 2\n**3. 기지~경로 거리** d = {{|6 − 4 + 13|§5}} = 3 > r → 만나지 않습니다.\n**4. 정산** 최댓값 d + r = 5, 최솟값 d − r = 1 → 합 6\n**정답: 6**", "ck": ["신호 문장 찾기", "기지와 반경", "기지~경로 거리", "정산"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "self", "q": "중심이 (2, −3)이고 반지름의 길이가 4인 원의 방정식을 구하시오.", "x": null, "s": "**정답: (x − 2)^{2} + (y + 3)^{2} = 16**\n**신호 읽기**: \"중심이 ~이고 반지름이 ~인 원\"은 레이더 기지와 탐지 거리를 그대로 알려 준 문장입니다.\n**상황 번역**: 원 위의 점 (x, y)는 기지 (2, −3)에서 정확히 4만큼 떨어져 있습니다. 두 점 사이 거리의 제곱이 4^{2}이라는 문장을 식으로 쓰면 됩니다.\n**풀이**: (x − 2)^{2} + (y − (−3))^{2} = 4^{2} → (x − 2)^{2} + (y + 3)^{2} = 16\n**함정**: 중심의 y좌표가 − 3이면 식에는 (y + 3)으로 부호가 바뀌어 들어갑니다. 우변은 반지름 4가 아니라 그 제곱 16입니다.", "src": "변형 1"}, {"l": 1, "t": "self", "q": "원 x^{2} + y^{2} + 6x − 8y = 0의 중심의 좌표와 반지름의 길이를 구하시오.", "x": null, "s": "**정답: 중심 (−3, 4), 반지름 5**\n**신호 읽기**: 식이 x^{2} + y^{2} + Ax + By + C = 0처럼 풀어져 있으면 기지 위치가 숨어 있다는 신호입니다.\n**상황 번역**: 완전제곱식으로 묶어 '(x-중심)²+(y-중심)²=반지름²' 꼴로 되돌립니다.\n**풀이**: (x^{2} + 6x + 9) + (y^{2} − 8y + 16) = 9 + 16 → (x + 3)^{2} + (y − 4)^{2} = 25 → 중심 (−3, 4), 반지름 5\n**함정**: 완전제곱을 만들려고 왼쪽에 더한 9와 16을 오른쪽에도 똑같이 더해야 합니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "원 x^{2} + y^{2} = 25 위의 점 (3, 4)에서의 접선의 방정식을 구하시오.", "x": "3x + 4y = 25|3x+4y=25", "s": "**신호 읽기**: \"원 위의 점에서의 접선\"은 반지름과 접선이 수직이라는 [보충] 도구를 꺼내라는 신호입니다.\n**상황 번역**: 기지 (0, 0)에서 접점 (3, 4)로 가는 반지름의 표지판(기울기)은 {{4§3}}입니다. 접선은 이 반지름과 수직이므로 기울기의 곱이 − 1 → 접선 기울기 −{{3§4}}\n**풀이**: y − 4 = −{{3§4}}(x − 3) → 4y − 16 = −3x + 9 → 3x + 4y = 25\n**함정**: 접선의 기울기를 반지름 기울기 {{4§3}}로 그대로 쓰는 실수가 많습니다. 확인: 기지에서 3x + 4y − 25 = 0까지 거리 {{25§5}} = 5가 반지름과 같으므로 정말 접합니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "원 x^{2} + y^{2} = 4와 직선 x + y = k가 접할 때, 양수 k의 값을 구하시오.", "x": null, "s": "**정답: k = 2√{2}**\n**신호 읽기**: \"접할 때\"는 기지~경로 거리 d와 반지름 r이 같다는 신호입니다(d = r).\n**상황 번역**: 기지 (0, 0), 탐지 거리 2, 비행 경로 x + y − k = 0\n**풀이**: d = {{|0 + 0 − k|§√{1 + 1}}} = {{|k|§√{2}}} = 2 → |k| = 2√{2}. 양수이므로 k = 2√{2}\n**함정**: 절댓값 때문에 k = ± 2√{2} 두 개가 나옵니다. 문제의 '양수' 조건을 마지막에 반드시 적용합니다.", "src": "변형 4"}, {"l": 2, "t": "self", "q": "원 (x − 3)^{2} + y^{2} = 9와 직선 y = x의 위치 관계를 판정하시오.", "x": null, "s": "**정답: 서로 다른 두 점에서 만난다**\n**신호 읽기**: \"위치 관계를 판정\"은 레이더 판정표를 쓰라는 신호입니다.\n**상황 번역**: 기지 (3, 0), 탐지 거리 3, 비행 경로 x − y = 0\n**풀이**: d = {{|3 − 0|§√{2}}} = {{3√{2}§2}} ≈ 2.12. d < r = 3이므로 경로가 탐지망 안쪽을 지나 두 번 걸립니다.\n**함정**: {{3√{2}§2}}와 3의 크기 비교가 어려우면 양변을 제곱합니다. {{18§4}} = 4.5 < 9", "src": "변형 5"}, {"l": 2, "t": "self", "q": "두 점 A(−1, 2), B(5, 8)을 1:2로 내분하는 점을 중심으로 하고 원점을 지나는 원의 방정식을 구하시오.", "x": null, "s": "**정답: (x − 1)^{2} + (y − 4)^{2} = 17**\n**신호 읽기**: \"내분하는 점을 중심으로\"는 유형 1의 시소 균형점으로 기지 위치부터 찾으라는 신호이고, \"원점을 지나는\"은 탐지 거리를 알려 주는 단서입니다.\n**상황 번역**: 1:2 내분이면 A에 더 가까우므로 A에 비중 2를 줍니다.\n**풀이**: 중심 ({{1 × 5 + 2 × (−1)§3}}, {{1 × 8 + 2 × 2§3}}) = (1, 4). 원점까지의 거리가 반지름이므로 r^{2} = 1^{2} + 4^{2} = 17\n**함정**: 반지름을 따로 구해 √{17}을 다시 제곱하는 대신, 거리의 제곱을 바로 우변에 쓰면 계산 실수가 줄어듭니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "두 점 (−1, 2), (3, 6)을 지름의 양 끝점으로 하는 원의 방정식을 구하시오.", "x": null, "s": "**정답: (x − 1)^{2} + (y − 4)^{2} = 8**\n**신호 읽기**: \"지름의 양 끝점\"은 [보충]의 '중심은 중점, 반지름은 절반'을 꺼내라는 신호입니다.\n**상황 번역**: 레이더 기지는 지름의 한가운데에 있습니다.\n**풀이**: 중심 ({{−1 + 3§2}}, {{2 + 6§2}}) = (1, 4). 지름 = √{4^{2} + 4^{2}} = 4√{2} → 반지름 2√{2}, r^{2} = 8\n**함정**: 지름의 길이를 반지름으로 착각해 r^{2} = 32로 쓰지 않도록 합니다. 확인: 끝점 (3, 6)을 넣으면 4 + 4 = 8로 맞습니다.", "src": "변형 7"}, {"l": 3, "t": "self", "q": "원과 직선의 위치 관계를 판별식 대신 '기지~경로 거리'로 판정하면 좋은 점을 레이더 비유로 서술하시오.", "x": null, "s": "**정답: 연립해서 이차방정식을 만들고 판별식을 계산하지 않아도, 기지에서 경로까지의 거리 하나만 재서 탐지 거리와 비교하면 교점의 개수를 알 수 있다. 계산이 짧고, 그림으로 위치를 바로 볼 수 있다.**\n**신호 읽기**: 두 방법을 비교하는 서술형은 '무엇을 하지 않아도 되는지'와 '무엇만 하면 되는지'를 대비해 씁니다.\n**상황 번역**: 판별식은 비행기 경로를 레이더 식에 직접 넣어 보는 방법이고, 거리 비교는 기지에서 경로까지 줄자로 한 번 재는 방법입니다.\n**풀이**: d < r이면 두 번, d = r이면 한 번, d > r이면 걸리지 않는다는 판정표를 함께 쓰면 완성도가 높습니다.\n**함정**: \"더 쉽다\"만 쓰면 근거가 없습니다. 어떤 계산이 생략되는지를 구체적으로 적습니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "원 x^{2} + y^{2} = 9 위의 점과 직선 3x + 4y − 25 = 0 사이의 거리의 최솟값과 최댓값을 구하시오.", "x": null, "s": "**정답: 최솟값 2, 최댓값 8**\n**신호 읽기**: \"원 위의 점과 직선 사이 거리의 최솟값·최댓값\"은 기지~경로 거리에서 반지름만큼 빼고 더하라는 신호입니다.\n**상황 번역**: 원 위의 점은 기지에서 반지름 3만큼 떨어진 곳을 돌아다닙니다. 경로에 가장 가까울 때는 기지보다 3만큼 경로 쪽, 가장 멀 때는 3만큼 반대쪽에 있습니다.\n**풀이**: 기지 (0, 0)에서 3x + 4y − 25 = 0까지 d = {{25§5}} = 5. 최솟값 5 − 3 = 2, 최댓값 5 + 3 = 8\n**함정**: d > r일 때만 최솟값이 d − r입니다. 경로가 원을 지나가면(d < r) 최솟값은 0이 됩니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "원 x^{2} + y^{2} − 2x − 4y + k = 0이 x축에 접할 때, 상수 k의 값을 구하시오.", "x": "k = 1|k=1|1", "s": "**신호 읽기**: [고난도] \"x축에 접할 때\"는 기지에서 x축까지의 거리가 반지름과 같다는 신호입니다.\n**상황 번역**: x축까지의 거리는 기지의 y좌표의 크기입니다.\n**풀이**: (x − 1)^{2} + (y − 2)^{2} = 5 − k → 기지 (1, 2), 반지름 √{5 − k}. 기지에서 x축까지 거리 2 = √{5 − k} → 5 − k = 4 → k = 1\n**함정**: 원이 되려면 5 − k > 0이어야 합니다. 구한 k = 1이 이 조건을 만족하는지 확인합니다.", "src": "변형 10"}]}, {"id": "b3", "u": "E", "ex": "2-2", "t": "3. 거울 반사 최단 거리론", "color": "노랑", "emoji": "🟡", "en": "Theory of Mirror Reflection", "th": [["p", "당구공을 쿠션에 한 번 맞혀 다른 공을 맞히는 장면을 떠올려 봅시다. 공은 쿠션에서 꺾여 두 조각의 길을 지나갑니다. 그런데 쿠션 너머에 거울 속 세상이 있다고 생각하면, 꺾인 길은 거울 속 공을 향해 곧게 날아가는 한 줄의 길과 길이가 똑같습니다. 두 점을 잇는 가장 짧은 길은 곧은 직선이므로, 꺾인 길의 길이가 가장 짧아지는 순간도 이 직선 위에서 생깁니다."], ["p", "그래서 이 유형의 문제에서 \"**~ 위를 움직이는 점** P\"가 나오면, 그 점이 서 있는 선(x축, y축, 직선 y = x 등)을 **거울**로 봅니다. 고정된 점 하나를 거울 너머로 옮겨 **그림자 점(대칭점)**을 만들고, 그림자 점과 다른 고정점 사이의 거리를 재면 그것이 최솟값입니다. 거울까지의 거리는 진짜 점에서 재든 그림자 점에서 재든 같기 때문입니다."], ["p", "거울로 옮기는 것은 점만이 아닙니다. 원이나 직선 같은 **도형 전체**도 평행이동하거나 대칭이동할 수 있습니다. 도형을 옮길 때는 그 도형의 방정식에서 x, y를 규칙대로 바꾸면 됩니다. 원이라면 중심만 옮기고 반지름은 그대로 두는 것과 같은 결과가 나옵니다."], ["li", "**유사 상황 독해법**: \"==축 위를 움직인다==\", \"==직선 위를 움직인다==\"가 나오면 그 선에 형광펜을 치고 '여기가 거울'이라고 적으세요. 주인공은 움직이는 점이 아니라 그 점이 서 있는 거울입니다. \"==평행이동한 도형==\", \"==대칭이동한 도형==\"은 방정식의 x, y를 바꾸는 신호입니다."], ["p", "**[보충] 그림자 점과 이동 좌표표** (공통수학2에서 다루는 대칭이동은 아래 네 거울입니다.)"], ["tbl", [["이동", "점 (a, b)가 옮겨 간 자리"], ["x축에 대한 대칭이동", "(a, −b)"], ["y축에 대한 대칭이동", "(−a, b)"], ["원점에 대한 대칭이동", "(−a, −b)"], ["직선 y = x에 대한 대칭이동", "(b, a)"], ["x축 방향으로 m, y축 방향으로 n만큼 평행이동", "(a + m, b + n)"]]], ["p", "**[보충] 도형의 이동 규칙** (방정식 f(x, y) = 0)"], ["tbl", [["이동", "바꾸는 방법", "옮겨 간 도형"], ["x축 방향으로 m, y축 방향으로 n 평행이동", "x 대신 x − m, y 대신 y − n", "f(x − m, y − n) = 0"], ["x축 대칭", "y 대신 −y", "f(x, −y) = 0"], ["y축 대칭", "x 대신 −x", "f(−x, y) = 0"], ["원점 대칭", "x 대신 −x, y 대신 −y", "f(−x, −y) = 0"], ["직선 y = x 대칭", "x와 y를 서로 바꾸기", "f(y, x) = 0"]]], ["p", "평행이동에서 + m만큼 옮기는데 식에는 x − m이 들어가는 이유: 옮긴 도형 위의 점을 m만큼 되돌리면 원래 도형 위에 있어야 하기 때문입니다."], ["p", "**[보충] 거울 쓰기 전 체크**: 두 점이 거울의 **양쪽**에 있으면 반사가 필요 없습니다. 선분 AB가 이미 거울을 지나므로 최솟값은 그냥 ‾{AB}입니다. 삼각형 둘레 문제는 고정점이 두 거울이 만드는 **예각 안쪽**에 있어야 두 번 반사가 성립합니다."]], "sum": ["신호: \"==~ 위를 움직이는 점==\" + \"==최솟값==\" → 그 선이 **거울선**", "고정점을 거울 너머로 옮긴 **그림자 점(대칭점)**과 진짜 점을 직선으로 이으면 최단 경로", "그림자 점: x축 (a, −b) · y축 (−a, b) · y = x (b, a) · y = −x (−b, −a) · y = c (a, 2c − b)", "두 점이 거울 **양쪽**에 있으면 반사 없이 바로 ‾{AB}", "삼각형 둘레 최소: 고정점을 두 거울에 각각 반사 → 두 그림자 점 사이 거리"], "fl": [["\"x축 위를 움직이는 점 P에 대하여 ‾{AP} + ‾{PB}의 최솟값\" — 거울은?", "x축. A를 x축에 대칭한 A′과 B 사이 거리 ‾{A′B}"], ["점 (a, b)를 직선 y = x에 대칭하면?", "(b, a)"], ["점 (a, b)를 직선 y = c에 대칭하면?", "(a, 2c − b)"], ["두 점이 거울선의 양쪽에 있으면 최솟값은?", "반사할 필요 없이 그냥 ‾{AB}"]], "bk": {"q": "책을 덮고 「거울 반사 최단 거리론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: ~ 위를 움직이는 점 + 최솟값", "움직이는 점이 있는 선 = 거울선", "고정점의 그림자 점(대칭점) 만들기", "그림자 점 좌표표: x축, y축, y = x, y = −x, y = c", "그림자 점과 진짜 점 사이 직선 거리", "두 점이 거울 양쪽이면 반사 불필요"]}, "pr": [{"l": 3, "t": "self", "q": "좌표평면 위에 고정된 점 A(4, 2)가 있다. x축 위를 움직이는 점 P와 직선 y = x 위를 움직이는 점 Q에 대하여 삼각형 APQ의 둘레의 길이의 ==최솟값==을 구하시오.", "x": null, "s": "**1. 거울선 포착** 점 P가 움직이는 [x축]이 첫 번째 거울, 점 Q가 움직이는 [직선 y = x]가 두 번째 거울입니다.\n**2. 그림자 점 생성** 고정점 A(4, 2)를 x축 거울 너머 아래로 튕겨내면 y부호가 바뀐 A_{1}(4, −2)가 됩니다. 같은 점 A(4, 2)를 대각선 거울(y = x) 너머로 튕겨내면 앞뒤 좌표가 바뀐 A_{2}(2, 4)가 됩니다.\n**3. 정산** 두 그림자 점 사이를 일직선 거리 공식으로 연결합니다. ‾{A_{1}A_{2}} = √{(4 − 2)^{2} + (−2 − 4)^{2}} = √{4 + 36} = 2√{10}", "ck": ["거울선 포착", "그림자 점 생성", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "좌표평면 위에 두 점 A(3, 1), B(6, 4)가 있다. A에서 출발하여 직선 y = x 위를 움직이는 점 P와 x축 위를 움직이는 점 Q를 차례로 거쳐 B에 이르는 경로의 길이 ‾{AP} + ‾{PQ} + ‾{QB}의 ==최솟값==을 구하시오.", "x": null, "s": "**1. 거울선 포착** 점 P가 움직이는 대각선 [y = x]가 첫 번째 거울, 점 Q가 움직이는 바닥 [x축]이 두 번째 거울입니다.\n**2. 거울 튕기기** 두 고정점 A, B를 각각 자기 쪽 거울 너머로 튕깁니다. 점 A(3, 1)을 y = x에 대칭이동하면 A′(1, 3), 점 B(6, 4)를 x축에 대칭이동하면 B′(6, −4)입니다.\n**3. 정산** 두 그림자 점 사이의 직선 거리를 구합니다. ‾{A′ B′} = √{(6 − 1)^{2} + (−4 − 3)^{2}} = √{25 + 49} = √{74}", "ck": ["거울선 포착", "거울 튕기기", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "좌표평면 위에 고정된 두 점 A(−1, 3), B(5, 5)가 있다. x축 위를 움직이는 점 P에 대하여 ‾{AP} + ‾{PB}의 ==최솟값==을 구하시오.", "x": null, "s": "**1. 거울선 포착** 동점 P가 바닥 [x축] 위를 움직이므로 바닥이 단일 거울선입니다.\n**2. 거울 튕기기** 고정점 A(−1, 3)을 x축 너머로 튕겨 y부호가 뒤집힌 가상 점 A′(−1, −3)을 확보합니다.\n**3. 정산** 가상 끝점 A′과 진짜 점 B(5, 5)를 팽팽하게 연결합니다. ‾{A′ B} = √{6^{2} + 8^{2}} = 10", "ck": ["거울선 포착", "거울 튕기기", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "두 점 A(1, 3), B(4, 1)과 y축 위를 움직이는 점 Q, x축 위를 움직이는 점 P에 대하여 ‾{AQ} + ‾{QP} + ‾{PB}의 ==최솟값==을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"~ 위를 움직이는 점\"이 두 개 → 거울이 y축, x축 두 장입니다.\n**2. 그림자 점 만들기** A를 y축에 대칭 → A′(−1, 3), B를 x축에 대칭 → B′(4, −1)\n**3. 경로 펴기** ‾{AQ} + ‾{QP} + ‾{PB} = ‾{A′Q} + ‾{QP} + ‾{PB′} ≥ ‾{A′B′}\n**4. 정산** ‾{A′B′} = √{5^{2} + 4^{2}} = √{41}\n**정답: √{41}**", "ck": ["신호 문장 찾기", "그림자 점 만들기", "경로 펴기", "정산"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "sa", "q": "두 점 A(−2, 3), B(4, 5)와 x축 위의 점 P에 대하여 ‾{AP} + ‾{BP}의 최솟값은?", "x": "10|10개|10가지", "s": "**신호 읽기**: \"x축 위의 점 P\"와 \"‾{AP} + ‾{BP}의 최솟값\"이 함께 나왔습니다. 움직이는 점이 서 있는 x축이 거울입니다.\n**상황 번역**: A(−2, 3)과 B(4, 5)는 둘 다 x축 위쪽, 즉 거울의 같은 쪽에 있습니다. 이대로는 꺾인 길이므로, A를 거울 너머로 보내 그림자 점 A′(−2, −3)을 만듭니다. 거울까지의 거리는 그림자에서 재도 같으므로 ‾{AP} = ‾{A′ P}입니다.\n**풀이**: ‾{AP} + ‾{BP} = ‾{A′ P} + ‾{BP} ≥ ‾{A′ B}. 꺾인 길이 한 직선으로 펴질 때 가장 짧습니다. ‾{A′ B} = √{(4 + 2)^{2} + (5 + 3)^{2}} = √{36 + 64} = 10\n**함정**: 두 점이 같은 쪽에 있는지 먼저 확인합니다. 그림자 점은 x축 거울이면 y좌표의 부호만 바뀝니다.", "src": "변형 1"}, {"l": 1, "t": "mc", "q": "두 점 A(1, 4), B(6, 2)와 y축 위의 점 P에 대하여 ‾{AP} + ‾{BP}의 최솟값은?", "x": ["√{53}", "√{41}", "√{61}", "7", "√{29}"], "s": "**신호 읽기**: \"y축 위의 점 P\" → 이번 거울은 세로로 선 y축입니다.\n**상황 번역**: A(1, 4)와 B(6, 2)는 모두 y축 오른쪽에 있습니다. y축 거울에 비친 그림자는 x좌표의 부호가 바뀐 A′(−1, 4)입니다.\n**풀이**: 최솟값 = ‾{A′ B} = √{(6 + 1)^{2} + (2 − 4)^{2}} = √{49 + 4} = √{53}\n**함정**: 거울이 y축일 때 y좌표를 바꾸는 실수가 잦습니다. \"거울에 수직인 방향의 좌표만 뒤집힌다\"로 기억합니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "두 점 A(2, 5), B(7, 8)과 직선 y = x 위의 점 P에 대하여 ‾{AP} + ‾{BP}의 최솟값은?", "x": ["2√{10}", "√{34}", "√{58}", "2√{13}", "√{26}"], "s": "**신호 읽기**: \"직선 y = x 위의 점 P\" → 대각선 거울입니다.\n**상황 번역**: A(2, 5), B(7, 8)은 모두 y > x인 쪽에 있습니다. y = x 거울에 비친 그림자는 x와 y가 자리를 바꾼 A′(5, 2)입니다.\n**풀이**: 최솟값 = ‾{A′ B} = √{(7 − 5)^{2} + (8 − 2)^{2}} = √{4 + 36} = 2√{10}\n**함정**: 같은 쪽 판정은 y − x의 부호로 합니다. 5 − 2 > 0, 8 − 7 > 0이므로 같은 쪽입니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "점 A(1, 2)를 x축 방향으로 3만큼, y축 방향으로 − 1만큼 평행이동한 점을 B라 하자. x축 위의 점 P에 대하여 ‾{AP} + ‾{PB}의 최솟값은?", "x": null, "s": "**정답: 3√{2}**\n**신호 읽기**: 앞부분은 평행이동(점 옮기기), 뒷부분은 x축 거울 최단 거리입니다. 두 단계로 끊어 읽습니다.\n**상황 번역**: 평행이동은 미끄럼틀처럼 점을 그대로 밀어 옮기는 것이므로 B(1 + 3, 2 − 1) = (4, 1)입니다. A, B가 모두 x축 위쪽이므로 A의 그림자 A′(1, −2)를 만듭니다.\n**풀이**: 최솟값 = ‾{A′ B} = √{3^{2} + 3^{2}} = 3√{2}\n**함정**: y축 방향으로 − 1만큼 이동은 y좌표에서 1을 빼는 것입니다.", "src": "변형 4"}, {"l": 2, "t": "mc", "q": "점 A(1, 3)에서 출발하여 x축 위의 점 P를 거쳐 점 B(4, 7)에 이르는 최단 거리를 구하시오.", "x": ["√{109}", "5", "√{89}", "√{97}", "11"], "s": "**신호 읽기**: \"x축 위의 점 P를 거쳐 ~에 이르는 최단 거리\" → 빛이 바닥 거울에 한 번 튕기는 장면입니다.\n**상황 번역**: 출발점 A(1, 3)의 그림자 A′(1, −3)에서 도착점 B(4, 7)로 곧게 가는 길이가 최단 거리입니다.\n**풀이**: ‾{A′ B} = √{(4 − 1)^{2} + (7 + 3)^{2}} = √{9 + 100} = √{109}\n**함정**: B를 튕겨도 답은 같습니다. 하나만 튕기면 되고, 둘 다 튕기면 다시 같은 쪽이 되어 틀립니다.", "src": "변형 5"}, {"l": 2, "t": "mc", "q": "점 A(6, 2)와 직선 y = x 위의 점 P, x축 위의 점 Q에 대하여 삼각형 APQ의 둘레의 최솟값은?", "x": ["4√{5}", "2√{10}", "6√{2}", "2√{13}", "√{58}"], "s": "**신호 읽기**: 움직이는 점이 두 개(P는 y = x 위, Q는 x축 위)이고 \"삼각형의 둘레\" → 거울이 두 장인 장면입니다.\n**상황 번역**: 둘레 ‾{AP} + ‾{PQ} + ‾{QA}에서 A가 두 거울에 각각 비친 그림자 A_{1}(y = x 너머: (2, 6))과 A_{2}(x축 너머: (6, −2))를 만들면 ‾{AP} = ‾{A_{1}P}, ‾{QA} = ‾{QA_{2}}가 됩니다.\n**풀이**: 둘레 = ‾{A_{1}P} + ‾{PQ} + ‾{QA_{2}} ≥ ‾{A_{1}A_{2}} = √{(6 − 2)^{2} + (−2 − 6)^{2}} = √{80} = 4√{5}\n**함정**: [보충]의 체크처럼 A(6, 2)가 두 거울이 만드는 예각 안쪽(0 < y < x)에 있어야 이 방법이 성립합니다.", "src": "변형 6"}, {"l": 2, "t": "mc", "q": "두 고정점 A(−3, 1), B(2, 4)와 직선 y = 2 위를 움직이는 점 P에 대하여 ‾{AP} + ‾{BP}의 최솟값은?", "x": ["√{34}", "√{26}", "√{58}", "5", "√{41}"], "s": "**신호 읽기**: \"직선 y = 2 위를 움직이는 점\" → 거울은 y = 2입니다. 그런데 거울을 쓰기 전에 [보충]의 '양쪽 체크'를 먼저 합니다.\n**상황 번역**: A(−3, 1)은 y = 2 아래, B(2, 4)는 위에 있습니다. 두 점이 거울을 사이에 두고 마주 서 있으므로 선분 AB가 이미 거울을 통과합니다. 튕길 필요가 없습니다.\n**풀이**: 최솟값 = ‾{AB} = √{(2 + 3)^{2} + (4 − 1)^{2}} = √{34}\n**함정**: 습관적으로 A를 y = 2에 튕겨 A′(−3, 3)으로 계산하면 √{5^{2} + 1^{2}} = √{26}이라는 틀린 값이 나옵니다. 거울 문제의 첫 단계는 언제나 '같은 쪽인가?'입니다.", "src": "변형 7"}, {"l": 3, "t": "mc", "q": "좌표평면 위 두 점 A(1, 2), B(3, 5)가 있다. y축 위의 점 Q와 x축 위의 점 P에 대하여 ‾{AQ} + ‾{QP} + ‾{PB}의 최솟값은?", "x": ["√{65}", "√{53}", "√{73}", "8", "√{58}"], "s": "**신호 읽기**: 경로 A → Q(y축) → P(x축) → B가 두 번 꺾입니다. 거울 두 장을 각각 한 번씩 씁니다.\n**상황 번역**: A는 y축 거울로 튕겨 A′(−1, 2), B는 x축 거울로 튕겨 B′(3, −5)로 보냅니다. 그러면 세 조각 ‾{A′ Q} + ‾{QP} + ‾{PB′}이 한 직선으로 펴질 수 있습니다.\n**풀이**: 최솟값 = ‾{A′ B′} = √{(3 + 1)^{2} + (−5 − 2)^{2}} = √{16 + 49} = √{65}\n**함정**: 각 점은 '자기와 직접 이어진 거울'로만 튕깁니다. A는 Q와 이어져 있으므로 y축, B는 P와 이어져 있으므로 x축입니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "원 (x − 1)^{2} + y^{2} = 4를 x축 방향으로 2만큼, y축 방향으로 −3만큼 평행이동한 뒤, 직선 y = x에 대하여 대칭이동한 원의 방정식을 구하시오.", "x": null, "s": "**정답: (x + 3)^{2} + (y − 3)^{2} = 4**\n**신호 읽기**: \"평행이동한 뒤 대칭이동한 원\"은 점이 아니라 도형 전체를 옮기는 문제입니다. [보충] 도형의 이동 규칙을 순서대로 적용합니다.\n**상황 번역**: 원은 중심만 옮기면 됩니다. 반지름 2는 옮겨도 변하지 않습니다. 중심 (1, 0)이 어디로 가는지 따라갑니다.\n**풀이**: 평행이동: (1 + 2, 0 − 3) = (3, −3). y = x 대칭: 좌표를 바꿔 (−3, 3). 따라서 (x + 3)^{2} + (y − 3)^{2} = 4. 식으로 해도 같습니다: x 대신 x − 2, y 대신 y + 3 → (x − 3)^{2} + (y + 3)^{2} = 4, 이어서 x와 y를 바꾸면 (y − 3)^{2} + (x + 3)^{2} = 4\n**함정**: x축 방향으로 + 2 옮기는데 식에는 x − 2가 들어갑니다. 헷갈리면 중심 좌표로 옮겨 보고 식과 맞는지 확인합니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "점 A(1, 2)와 원 (x − 6)^{2} + (y − 4)^{2} = 1 위의 점 Q, x축 위의 점 P에 대하여 ‾{AP} + ‾{PQ}의 최솟값을 구하시오.", "x": null, "s": "**정답: √{61} − 1**\n**신호 읽기**: [고난도] 도착점 Q가 한 점이 아니라 원 위를 움직입니다. '거울 + 레이더(유형 2)'를 겹친 문제입니다.\n**상황 번역**: x축 거울로 A를 튕겨 A′(1, −2)를 만들면 ‾{AP} + ‾{PQ} = ‾{A′ P} + ‾{PQ} ≥ ‾{A′ Q}입니다. 이제 'A′에서 원 위의 점까지 가장 가까운 거리'만 구하면 됩니다. 원 밖의 점에서 원까지 가장 가까운 점은 중심을 향해 곧게 가다 원에 닿는 점입니다.\n**풀이**: 중심 C(6, 4), 반지름 1. ‾{A′ C} = √{5^{2} + 6^{2}} = √{61} → 최솟값 = √{61} − 1\n**함정**: 원 전체가 x축 위쪽에 있어야 선분 A′ C가 x축을 지나 P가 생깁니다. 중심의 y좌표 4가 반지름 1보다 크므로 성립합니다.", "src": "변형 10"}]}, {"id": "b4", "u": "F", "ex": "2-2", "t": "4. 벤 다이어그램 칸 칠하기론", "color": "초록", "emoji": "🟢", "en": "Theory of Coloring Venn Cells", "th": [["p", "집합 문제의 문장은 길지만, 두 집합 A, B가 등장하는 순간 전체집합 U는 벤 다이어그램에서 딱 **네 칸**으로 나뉩니다. ① A에만 있는 칸, ② A와 B가 겹친 칸, ③ B에만 있는 칸, ④ 어디에도 없는 바깥 칸. 집합의 연산은 이 네 칸 중 **어느 칸에 색을 칠하라는 명령**입니다."], ["li", "A ∪ B(합집합, \"또는\"): ①②③ 칠하기. A ∩ B(교집합, \"그리고\"): ②만 칠하기"], ["li", "A − B(차집합, \"A이지만 B는 아닌\"): ①만 칠하기. A^{C}(여집합, \"A가 아닌\"): ③④ 칠하기"], ["p", "드모르간의 법칙 (A ∪ B)^{C} = A^{C} ∩ B^{C}도 칸으로 보면 외울 필요가 없습니다. 왼쪽은 '①②③이 아닌 칸'이고, 오른쪽은'A 밖(③④)이면서 B 밖(①④)인 칸'이므로 둘 다 ④ 한 칸입니다."], ["p", "원소의 개수 문제에서 n(A) + n(B)를 하면 겹친 칸 ②가 **두 번** 칠해집니다. 그래서 한 번 빼 줍니다: n(A ∪ B) = n(A) + n(B) − n(A ∩ B). 부분집합의 개수는 원소마다 '넣을까, 말까' 두 갈래가 있으므로 원소가 n개이면 2^{n}개입니다."], ["li", "**1:1 매칭 기호 독해법**: ==\"또는\", \"적어도 한 곳\"== → ∪. ==\"모두\", \"둘 다\"== → ∩. ==\"~만\", \"~이지만 ~은 아닌\"== → 차집합. ==\"어느 곳에도 ~하지 않은\"== → 바깥 칸 (A ∪ B)^{C}. A ∩ B = A==,== A ∪ B = B → A ⊂ B."], ["p", "**[보충] 칸 번역표**"], ["tbl", [["문장", "칸", "개수 계산"], ["적어도 하나", "①②③", "n(A) + n(B) − n(A ∩ B)"], ["둘 다", "②", "n(A ∩ B)"], ["A만", "①", "n(A) − n(A ∩ B)"], ["한 가지만", "①③", "n(A ∪ B) − n(A ∩ B)"], ["어느 것도 아닌", "④", "n(U) − n(A ∪ B)"]]], ["p", "**[보충] 부분집합 고정석과 품절**: \"반드시 포함\"하는 원소는 이미 자리를 잡은 고정석, \"포함하지 않는\" 원소는 매장에서 빠진 품절입니다. 남은 원소 k개만 넣을까 말까를 고르므로 2^{k}개입니다. \"적어도 하나 포함\"은 전체에서 '하나도 포함하지 않는' 경우를 빼는 뒷문으로 셉니다."]], "sum": ["신호: \"또는\", \"모두\", \"~만\", \"적어도 하나 포함\" → **네 칸 나누기, n(A ∪ B)**", "A ∪ B(합집합, \"또는\"): ①②③ 칠하기. A ∩ B(교집합, \"그리고\"): ②만 칠하기", "A − B(차집합, \"A이지만 B는 아닌\"): ①만 칠하기. A^{C}(여집합, \"A가 아닌\"): ③④ 칠하기", "**1:1 매칭 기호 독해법**: ==\"또는\", \"적어도 한 곳\"== → ∪. ==\"모두\", \"둘 다\"== → ∩. ==\"~만\", \"~이지만 ~은 아닌\"== → 차집합. ==\"어느 곳에도 ~하지 않은\"== → 바깥 칸 (A ∪ B)^{C}. A ∩ B = A==,== A ∪ B = B → A ⊂ B."], "fl": [["\"또는\", \"모두\", \"~만\", \"적어도 하나 포함\" — 이 신호를 보면 꺼낼 도구는?", "네 칸 나누기, n(A ∪ B)"], ["문장: 적어도 하나 → 칸 / 개수 계산?", "①②③ / n(A) + n(B) − n(A ∩ B)"], ["문장: 둘 다 → 칸 / 개수 계산?", "② / n(A ∩ B)"], ["문장: A만 → 칸 / 개수 계산?", "① / n(A) − n(A ∩ B)"], ["문장: 한 가지만 → 칸 / 개수 계산?", "①③ / n(A ∪ B) − n(A ∩ B)"]], "bk": {"q": "책을 덮고 「벤 다이어그램 칸 칠하기론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"또는\", \"모두\", \"~만\", \"적어도 하나 포함\"", "꺼낼 도구: 네 칸 나누기, n(A ∪ B)", "1:1 매칭 기호 독해법", "네 칸 채우기", "왼쪽 칠하기", "정산 (드모르간 확인)"]}, "pr": [{"l": 3, "t": "self", "q": "전체집합 U = {1, 2, 3, 4, 5, 6, 7, 8}의 두 부분집합 A = {1, 2, 3, 4}, B = {2, 4, 6, 8}에 대하여 (A ∪ B)^{C}와 A^{C} ∩ B^{C}를 각각 구하시오.", "x": null, "s": "**1. 네 칸 채우기** ① A만 {1, 3}, ② 겹친 칸 {2, 4}, ③ B만 {6, 8}, ④ 바깥 {5, 7}\n**2. 왼쪽 칠하기** A ∪ B는 ①②③이므로 (A ∪ B)^{C}는 ④ = {5, 7}\n**3. 정산 (드모르간 확인)** A^{C} = {5, 6, 7, 8}, B^{C} = {1, 3, 5, 7} → A^{C} ∩ B^{C} = {5, 7}. 두 결과가 같습니다.", "ck": ["네 칸 채우기", "왼쪽 칠하기", "정산 (드모르간 확인)"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "두 집합 A = {1, 3, 5, 7, 9}, B = {3, 6, 9}에 대하여 A − B==와== B − A를 구하고, (A − B) ∪ (A ∩ B)가 어떤 집합과 같은지 말하시오.", "x": null, "s": "**1. 겹친 칸 찾기** ② A ∩ B = {3, 9}\n**2. \"~만\" 칸 칠하기** A − B는 ① = {1, 5, 7}, B − A는 ③ = {6}\n**3. 정산** ①과 ②를 합치면 A 전체입니다. (A − B) ∪ (A ∩ B) = A", "ck": ["겹친 칸 찾기", "\"~만\" 칸 칠하기", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "집합 A = {1, 2, 3, 4, 5, 6}의 부분집합 중 1, 2를 ==반드시 포함==하고 6은 ==포함하지 않는== 부분집합의 개수를 구하시오.", "x": null, "s": "**1. 고정석 배치** 1, 2는 이미 자리를 잡았으므로 고민할 필요가 없습니다.\n**2. 품절 처리** 6은 아예 매장에서 빠졌습니다.\n**3. 정산** 남은 원소 3, 4, 5만 '넣을까 말까' 두 가지씩 고르면 됩니다 → 2^{3} = 8", "ck": ["고정석 배치", "품절 처리", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "전체집합 U의 두 부분집합 A, B에 대하여 n(U) = 30, n(A) = 18, n(B) = 15, ==n(A^{C} ∩ B^{C}) = 5==일 때, ==n(A − B)==의 값을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** 여집합의 교집합, 차집합 → 벤 다이어그램 네 칸으로 번역합니다.\n**2. 바깥 칸** A^{C} ∩ B^{C}는 ④ 바깥 칸 → n(A ∪ B) = 30 − 5 = 25\n**3. 겹친 칸** n(A ∩ B) = 18 + 15 − 25 = 8\n**4. 정산** n(A − B)는 ① A에만 있는 칸 → 18 − 8 = 10\n**정답: 10**", "ck": ["신호 문장 찾기", "바깥 칸", "겹친 칸", "정산"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "self", "q": "두 집합 A = {1, 2, 3, 4}, B = {3, 4, 5}에 대하여 A ∪ B, A ∩ B, A − B를 구하시오.", "x": null, "s": "**정답: A ∪ B = {1, 2, 3, 4, 5}, A ∩ B = {3, 4}, A − B = {1, 2}**\n**신호 읽기**: 세 기호가 한꺼번에 나왔습니다. 네 칸을 먼저 채우면 세 질문이 칸 고르기로 바뀝니다.\n**상황 번역**: ① A만 {1, 2}, ② 겹친 칸 {3, 4}, ③ B만 {5}\n**풀이**: A ∪ B는 ①②③ = {1, 2, 3, 4, 5}, A ∩ B는 ② = {3, 4}, A − B는 ① = {1, 2}\n**함정**: 합집합에서 겹친 원소 3, 4를 두 번 쓰지 않습니다. 집합은 같은 원소를 한 번만 씁니다.", "src": "변형 1"}, {"l": 1, "t": "self", "q": "집합 {a, b, c, d, e}의 부분집합의 개수와 진부분집합의 개수를 구하시오.", "x": null, "s": "**정답: 부분집합 32개, 진부분집합 31개**\n**신호 읽기**: \"부분집합의 개수\"는 원소마다 '넣을까, 말까'를 고르는 장면입니다.\n**상황 번역**: 원소 5개가 각각 두 갈래 선택을 하므로 곱의 법칙으로 2 × 2 × 2 × 2 × 2\n**풀이**: 부분집합 2^{5} = 32개. 진부분집합은 자기 자신을 뺀 것이므로 32 − 1 = 31개\n**함정**: 공집합도 부분집합입니다(아무것도 넣지 않은 경우). 진부분집합에서 빼는 것은 공집합이 아니라 자기 자신입니다.", "src": "변형 2"}, {"l": 1, "t": "self", "q": "전체집합 U = {1, 2, 3, ⋯, 10}의 부분집합 A = {x | x는 짝수}에 대하여 A^{C}를 구하시오.", "x": null, "s": "**정답: A^{C} = {1, 3, 5, 7, 9}**\n**신호 읽기**: \"A^{C}\"는 전체집합 안에서 A가 아닌 칸을 칠하라는 명령입니다.\n**상황 번역**: 전체 1부터 10 중 짝수 칸을 비우고 나머지를 칠합니다.\n**풀이**: A = {2, 4, 6, 8, 10}이므로 A^{C} = {1, 3, 5, 7, 9}\n**함정**: 여집합은 항상 전체집합 U를 기준으로 합니다. U가 바뀌면 여집합도 바뀝니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "n(A) = 12, n(A ∩ B) = 5일 때, n(A − B)를 구하시오.", "x": "7|7개|7가지", "s": "**신호 읽기**: \"n(A − B)\"는 ① 'A만' 칸의 원소 수입니다.\n**상황 번역**: A 전체(①+②)에서 겹친 칸 ②를 빼면 ①만 남습니다.\n**풀이**: n(A − B) = n(A) − n(A ∩ B) = 12 − 5 = 7\n**함정**: n(A) − n(B)로 계산하면 안 됩니다. 빼는 것은 B 전체가 아니라 A와 겹친 부분뿐입니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "n(A) = 12, n(B) = 9, n(A ∪ B) = 17일 때, n(A ∩ B)를 구하시오.", "x": "4|4개|4가지", "s": "**신호 읽기**: n(A), n(B), n(A ∪ B)가 주어지고 겹친 칸을 묻습니다.\n**상황 번역**: n(A) + n(B)는 겹친 칸 ②를 두 번 센 값이고, n(A ∪ B)는 한 번만 센 값입니다. 그 차이가 바로 ②입니다.\n**풀이**: 17 = 12 + 9 − n(A ∩ B) → n(A ∩ B) = 21 − 17 = 4\n**함정**: 공식을 거꾸로 쓰는 문제입니다. \"두 번 센 것 − 한 번 센 것 = 겹친 칸\"으로 기억하면 공식을 몰라도 풀립니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "집합 {1, 2, 3, 4, 5, 6, 7}의 부분집합 중 홀수를 적어도 하나 포함하는 부분집합의 개수를 구하시오.", "x": "120|120개|120가지", "s": "**신호 읽기**: \"적어도 하나 포함\"은 앞문이 여러 갈래(홀수 1개, 2개, 3개, 4개 포함)로 쪼개지는 신호입니다. 뒷문으로 셉니다.\n**상황 번역**: 뒷문 = 홀수를 하나도 포함하지 않는 부분집합 = 짝수 {2, 4, 6}만으로 만든 부분집합\n**풀이**: 전체 2^{7} = 128, 뒷문 2^{3} = 8 → 128 − 8 = 120\n**함정**: 뒷문 8개에는 공집합도 들어 있습니다. 공집합은 홀수를 하나도 포함하지 않으므로 빼는 것이 맞습니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "드모르간의 법칙 (A ∪ B)^{C} = A^{C} ∩ B^{C}가 성립하는 이유를 벤 다이어그램의 '칸 칠하기'로 서술하시오.", "x": null, "s": "**정답: 왼쪽 (A ∪ B)^{C}는 '①②③이 아닌 칸'이므로 바깥 칸 ④이다. 오른쪽 A^{C} ∩ B^{C}는'A 밖(③④)'과'B 밖(①④)'에 공통으로 칠해진 칸이므로 역시 ④이다. 같은 칸을 칠하므로 두 집합은 같다.**\n**신호 읽기**: '이유를 서술'하라는 문제는 양쪽을 각각 칸으로 번역한 뒤 같은 칸임을 보여야 합니다.\n**상황 번역**: 벤 다이어그램의 네 칸에 번호를 붙여 두면 말로 정확히 쓸 수 있습니다.\n**풀이**: 문장 예: \"어느 동아리에도 가입하지 않은 학생 = 수학 동아리가 아니면서 과학 동아리도 아닌 학생\"처럼 일상 문장으로 덧붙이면 더 좋습니다.\n**함정**: 기호를 다시 옮겨 쓰기만 하면 설명이 아닙니다. 칸(그림)으로 바꾸는 과정을 반드시 씁니다.", "src": "변형 7"}, {"l": 3, "t": "self", "q": "두 집합 A = {1, a}, B = {1, 2, 3}에 대하여 A ∩ B = A가 성립하도록 하는 a의 값을 모두 구하시오. (단, a ≠ 1)", "x": null, "s": "**정답: a = 2 또는 a = 3**\n**신호 읽기**: \"A ∩ B = A\"는 'A와 겹친 칸이 A 전체'라는 뜻, 즉 A가 B 안에 통째로 들어간 그림(A ⊂ B)입니다.\n**상황 번역**: A의 원소 1과 a가 모두 B 안에 있어야 합니다. 1은 이미 B에 있습니다.\n**풀이**: a ∈ {1, 2, 3}이고 a ≠ 1이므로 a = 2 또는 3\n**함정**: 집합 기호 문장을 그림으로 바꾸지 않으면 'A ∩ B = A'에서 무엇을 해야 할지 막힙니다. \"겹친 부분 = 자기 전체\"는 \"자기가 통째로 안에 있다\"입니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "어느 반 학생 50명 중 수학 동아리 가입자는 30명, 과학 동아리 가입자는 25명이고, 두 동아리 중 어느 곳에도 가입하지 않은 학생은 5명이다. 두 동아리에 모두 가입한 학생 수와 한 동아리에만 가입한 학생 수를 구하시오.", "x": null, "s": "**정답: 둘 다 가입 10명, 한 곳에만 가입 35명**\n**신호 읽기**: \"어느 곳에도 가입하지 않은\" → 바깥 칸 ④, \"모두 가입한\" → 겹친 칸 ②, \"한 곳에만\" → ①③입니다.\n**상황 번역**: 전체 50명에서 바깥 칸 5명을 빼면 적어도 한 곳에 가입한 학생(①②③)이 됩니다.\n**풀이**: n(A ∪ B) = 50 − 5 = 45. 45 = 30 + 25 − n(A ∩ B) → n(A ∩ B) = 10. 한 곳에만 = 45 − 10 = 35 (수학만 20, 과학만 15)\n**함정**: 한 곳에만 가입한 학생을 30 + 25 − 10 = 45로 쓰면 겹친 칸이 포함됩니다. 겹친 칸을 한 번 더 빼야 ①③만 남습니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "전체집합 U = {1, 2, 3, ⋯, 10}의 두 부분집합 A = {1, 2, 3, 4, 5}, B = {4, 5, 6, 7}에 대하여 A ∩ X = {1, 2}이고 B ∩ X ≠ ∅인 U의 부분집합 X의 개수를 구하시오.", "x": "24|24개|24가지", "s": "**신호 읽기**: [고난도] \"A ∩ X = {1, 2}\"는 A의 원소 중 1, 2만 X에 들어가고 3, 4, 5는 들어가지 않는다는 고정석·품절 신호입니다.\n**상황 번역**: 고정석 1, 2 / 품절 3, 4, 5 / 남은 원소 6, 7, 8, 9, 10은 자유롭게 넣을까 말까. 그런데 \"B ∩ X ≠ ∅\"이므로 B의 원소 중 하나는 들어가야 합니다. B의 4, 5는 품절이므로 6이나 7 중 적어도 하나가 필요합니다.\n**풀이**: 자유 원소 5개로 2^{5} = 32. 뒷문(6, 7 모두 없음)은 8, 9, 10만 자유 → 2^{3} = 8. 32 − 8 = 24\n**함정**: 조건이 두 개 겹치면 하나씩 번역해 표로 정리합니다. 4, 5가 B에 있지만 이미 품절이라 B 조건을 채우는 데 쓸 수 없다는 점을 놓치기 쉽습니다.", "src": "변형 10"}]}, {"id": "b5", "u": "F", "ex": "2-2", "t": "5. 출입증과 건물론", "color": "파랑", "emoji": "🔵", "en": "Theory of Pass and Building", "th": [["p", "명제 문제는 문장이 길고 '이면', '조건', '충분' 같은 말이 겹쳐 나와서 문과 학생이 가장 자신 있게 덤볐다가 가장 많이 미끄러지는 단원입니다. 해법은 문장을 **그림(집합)**으로 번역하는 것입니다. 유형 4에서 익힌 벤 다이어그램이 여기서 판정 도구가 됩니다. 조건 p를 참이 되게 하는 원소를 모은 진리집합 P를 'p 출입증을 가진 사람들', 진리집합 Q를 'q 건물 안에 있는 사람들'이라고 생각해 봅시다."], ["p", "\"p이면 q이다\"가 참이라는 말은 \"p 출입증을 가진 사람은 한 명도 빠짐없이 q 건물 안에 있다\"는 뜻이고, 그림으로는 **작은 원** P**가 큰 원** Q **안에 쏙 들어간 모습(**P ⊂ Q**)**입니다. 이 한 장의 그림으로 필요조건·충분조건, 범위 문제, 대우까지 모두 읽을 수 있습니다."], ["li", "**충분조건과 필요조건**: 안쪽의 작은 원(P)이 ==충분조건==, 바깥의 큰 원(Q)이 ==필요조건==입니다. 'VIP 출입증이 있으면 들어가기에 충분하다', '건물 안에 있으려면 적어도 그 건물 출입이 필요하다'로 기억하세요."], ["li", "**역은 따로 확인**: \"p이면 q\"가 참이어도 \"q이면 p\"는 거짓일 수 있습니다. 건물 안에 있다고 모두 VIP는 아니니까요."], ["li", "**'모든'과 '어떤'**: \"==모든== x에 대하여\"가 참이려면 진리집합이 전체집합 그 자체여야 하고, \"==어떤== x에 대하여\"는 진리집합이 공집합만 아니면 참입니다."], ["p", "**[보충] 문장별 번역표**"], ["tbl", [["신호 문장", "그림 번역", "꺼낼 도구"], ["\"p이면 q이다\"가 참", "출입증 소지자가 모두 건물 안", "P ⊂ Q"], ["\"p는 q이기 위한 충분조건\"", "p가 작은 원", "P ⊂ Q"], ["\"p는 q이기 위한 필요조건\"", "p가 큰 원", "Q ⊂ P"], ["\"필요충분조건\"", "두 원이 완전히 겹침", "P = Q"], ["\"대우\"", "거울에 비친 문장", "~ q → ~ p (참·거짓이 같다)"]]], ["p", "**[보충] 절대부등식 (산술평균과 기하평균의 관계)**: a > 0, b > 0일 때 {{a + b§2}} ≥ √{ab} (등호는 a = b일 때). 이 도구는 유형 8(유리함수)의 거리 합 최솟값에서 다시 쓰입니다."]], "sum": ["신호: \"p이면 q\", \"충분조건\", \"필요조건\" → **진리집합의 포함 P ⊂ Q**", "**충분조건과 필요조건**: 안쪽의 작은 원(P)이 ==충분조건==, 바깥의 큰 원(Q)이 ==필요조건==입니다. 'VIP 출입증이 있으면 들어가기에 충분하다', '건물 안에 있으려면 적어도 그 건물 출입이 필요하다'로 기억하세요.", "**역은 따로 확인**: \"p이면 q\"가 참이어도 \"q이면 p\"는 거짓일 수 있습니다. 건물 안에 있다고 모두 VIP는 아니니까요.", "**'모든'과 '어떤'**: \"==모든== x에 대하여\"가 참이려면 진리집합이 전체집합 그 자체여야 하고, \"==어떤== x에 대하여\"는 진리집합이 공집합만 아니면 참입니다."], "fl": [["\"p이면 q\", \"충분조건\", \"필요조건\" — 이 신호를 보면 꺼낼 도구는?", "진리집합의 포함 P ⊂ Q"], ["신호 문장: \"p이면 q이다\"가 참 → 그림 번역 / 꺼낼 도구?", "출입증 소지자가 모두 건물 안 / P ⊂ Q"], ["신호 문장: \"p는 q이기 위한 충분조건\" → 그림 번역 / 꺼낼 도구?", "p가 작은 원 / P ⊂ Q"], ["신호 문장: \"p는 q이기 위한 필요조건\" → 그림 번역 / 꺼낼 도구?", "p가 큰 원 / Q ⊂ P"], ["신호 문장: \"필요충분조건\" → 그림 번역 / 꺼낼 도구?", "두 원이 완전히 겹침 / P = Q"]], "bk": {"q": "책을 덮고 「출입증과 건물론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"p이면 q\", \"충분조건\", \"필요조건\"", "꺼낼 도구: 진리집합의 포함 P ⊂ Q", "충분조건과 필요조건", "역은 따로 확인", "'모든'과 '어떤'", "출입증과 건물 그리기", "포함 관계 번역", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "두 조건 p: − 1 ≤ x ≤ 3, q: x ≤ a에 대하여 명제 'p이면 q이다'가 ==참이 되도록== 하는 실수 a의 최솟값을 구하시오.", "x": null, "s": "**1. 출입증과 건물 그리기** P = {x | − 1 ≤ x ≤ 3}, Q = {x | x ≤ a}를 수직선에 그립니다.\n**2. 포함 관계 번역** 명제가 참 ⇔ P ⊂ Q. 범위 −1 ≤ x ≤ 3 전체가 통째로 x ≤ a 안에 들어가야 하므로 오른쪽 끝 3이 a보다 크면 안 됩니다. 3 ≤ a\n**3. 정산** a의 최솟값은 3 (끝점 3도 건물 안에 들어가야 하므로 등호 포함)", "ck": ["출입증과 건물 그리기", "포함 관계 번역", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "두 조건 p: |x − 1| ≤ 2, q: x^{2} − 2x − 8 ≤ 0에 대하여 p는 q이기 위한 ==무슨 조건==인지 말하시오.", "x": null, "s": "**1. 진리집합 구하기** |x − 1| ≤ 2 → −1 ≤ x ≤ 3, x^{2} − 2x − 8 ≤ 0 → (x + 2)(x − 4) ≤ 0 → −2 ≤ x ≤ 4\n**2. 원 크기 비교** P = {x | − 1 ≤ x ≤ 3}은 Q = {x | − 2 ≤ x ≤ 4} 안에 쏙 들어가지만 Q가 P 안에 들어가지는 않습니다. P ⊂ Q, P ≠ Q\n**3. 정산** p가 작은 원이므로 p는 q이기 위한 충분조건(필요조건은 아님)입니다.", "ck": ["진리집합 구하기", "원 크기 비교", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "실수 x, y에 대하여 명제 'x + y ≤ 2==이면== x ≤ 1 ==또는== y ≤ 1==이다=='의 참, 거짓을 대우를 이용하여 판정하시오.", "x": null, "s": "**1. 거울 문장 만들기** 대우는 앞뒤를 바꾸고 둘 다 부정합니다. 'x ≤ 1 또는 y ≤ 1'의 부정은'x > 1 그리고 y > 1','x + y ≤ 2'의 부정은 'x + y > 2'\n**2. 대우 판정** 'x > 1이고 y > 1이면 x + y > 2이다' → 1보다 큰 두 수의 합은 2보다 크므로 참\n**3. 정산** 대우가 참이므로 원래 명제도 참", "ck": ["거울 문장 만들기", "대우 판정", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "두 조건 p: |x − 1| ≤ 2, q: a − 3 ≤ x ≤ a + 3에 대하여 p가 q이기 위한 ==충분조건==이 되도록 하는 정수 a의 개수를 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"충분조건\" → 작은 원 p가 큰 원 q 안에: P ⊂ Q\n**2. 출입증 영역 그리기** P = {x | −1 ≤ x ≤ 3}, Q = {x | a − 3 ≤ x ≤ a + 3}\n**3. 건물 안에 넣기** a − 3 ≤ −1 이고 a + 3 ≥ 3 → 0 ≤ a ≤ 2\n**4. 정산** a = 0, 1, 2 → 3개\n**정답: 3**", "ck": ["신호 문장 찾기", "출입증 영역 그리기", "건물 안에 넣기", "정산"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "self", "q": "전체집합 U = {1, 2, 3, 4, 5, 6}에서 조건 'x는 소수이다'의 진리집합을 구하시오.", "x": null, "s": "**정답: {2, 3, 5}**\n**신호 읽기**: \"진리집합\"은 조건을 참으로 만드는 원소, 즉 출입증을 가진 사람들의 명단입니다.\n**상황 번역**: 전체집합 U에 있는 사람 1~6을 한 명씩 검문해 '소수' 출입증이 있는지 확인합니다.\n**풀이**: 소수는 1과 자기 자신만을 약수로 갖는 1보다 큰 수 → 2, 3, 5\n**함정**: 1은 소수가 아닙니다. 진리집합은 항상 전체집합 안에서만 찾습니다.", "src": "변형 1"}, {"l": 1, "t": "self", "q": "명제 'x = 1이면 x^{2} = 1이다'의 역과 대우를 쓰고, 각각의 참, 거짓을 판정하시오.", "x": null, "s": "**정답: 역: 'x^{2} = 1이면 x = 1이다' (거짓), 대우: 'x^{2} ≠ 1이면 x ≠ 1이다' (참)**\n**신호 읽기**: \"역\"은 앞뒤만 바꾼 문장, \"대우\"는 앞뒤를 바꾸고 둘 다 부정한 거울 문장입니다.\n**상황 번역**: 원래 명제는 P = {1}, Q = {−1, 1}에서 P ⊂ Q이므로 참입니다. 역은 Q ⊂ P를 묻는데 − 1이 P 밖에 있으므로 거짓입니다.\n**풀이**: 역의 반례 x = −1. 대우는 원래 명제와 참·거짓이 항상 같으므로 참입니다.\n**함정**: 역과 대우를 헷갈리지 않도록 \"역 = 자리만 바꿈, 대우 = 자리 바꾸고 부정까지\"로 구분합니다. 역은 따로 확인해야 합니다.", "src": "변형 2"}, {"l": 1, "t": "self", "q": "두 조건 p: x = 2, q: x^{2} = 4에 대하여 p는 q이기 위한 무슨 조건인지 말하시오.", "x": null, "s": "**정답: 충분조건 (필요조건은 아님)**\n**신호 읽기**: \"p는 q이기 위한 무슨 조건\"은 두 원의 크기를 비교하라는 신호입니다.\n**상황 번역**: P = {2}, Q = {−2, 2}. 작은 원 P가 큰 원 Q 안에 쏙 들어갑니다.\n**풀이**: P ⊂ Q이고 P ≠ Q → 작은 원 p는 충분조건. Q ⊂ P는 아니므로 필요조건은 아닙니다.\n**함정**: \"x = 2이면 x^{2} = 4\"만 확인하고 끝내면 필요조건 여부를 놓칩니다. 반대 방향도 꼭 확인합니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "명제 'x^{2} ≠ 1이면 x ≠ 1이다'의 대우를 쓰고, 원래 명제의 참·거짓을 판정하시오.", "x": null, "s": "**정답: 대우: 'x = 1이면 x^{2} = 1이다' (참). 따라서 원래 명제도 참**\n**신호 읽기**: \"≠\"가 들어간 명제는 직접 판정이 어렵습니다. 대우(거울 문장)로 바꾸라는 신호입니다.\n**상황 번역**: 부정이 두 번 들어가면 문장이 꼬이지만, 대우로 바꾸면 부정이 사라져 간단해집니다.\n**풀이**: 'x^{2} ≠ 1'의 부정은'x^{2} = 1','x ≠ 1'의 부정은 'x = 1'. 대우 'x = 1이면 x^{2} = 1'은 참이므로 원래 명제도 참\n**함정**: 대우를 만들 때 앞뒤 자리를 바꾸는 것을 잊고 부정만 하면 '이' 명제가 되어 버립니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "두 조건 p: − 1 < x < 2, q: x < a에 대하여 p가 q이기 위한 충분조건이 되도록 하는 실수 a의 값의 범위를 구하시오.", "x": "a ≥ 2|a>=2", "s": "**신호 읽기**: \"p가 q이기 위한 충분조건\" → p가 작은 원 → P ⊂ Q\n**상황 번역**: 출입증 구간 −1 < x < 2가 통째로 건물 x < a 안에 들어가야 합니다. 수직선에 그리면 오른쪽 끝 2가 a를 넘으면 안 됩니다.\n**풀이**: a ≥ 2. a = 2일 때 Q = {x | x < 2}이고 P의 끝 2는 P에 포함되지 않으므로 그래도 P ⊂ Q입니다.\n**함정**: 끝점의 등호는 '빈 동그라미(포함 안 됨)'와 '채운 동그라미(포함)'를 수직선에 그려서 판정합니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "두 조건 p: x > a, q: x > 2에 대하여 p가 q이기 위한 필요조건이 되도록 하는 실수 a의 값의 범위를 구하시오.", "x": "a ≤ 2|a<=2", "s": "**신호 읽기**: \"p가 필요조건\"이면 p가 큰 원입니다 → Q ⊂ P\n**상황 번역**: 건물 x > 2에 있는 사람이 모두 출입증 구역 x > a 안에 있어야 합니다. 수직선에서 a가 2보다 왼쪽(또는 같은 자리)에 있어야 합니다.\n**풀이**: a ≤ 2 (a = 2이면 두 집합이 같아 포함 관계가 성립)\n**함정**: 충분조건과 필요조건의 방향을 바꾸어 쓰는 실수가 가장 많습니다. \"충분 = 작은 원, 필요 = 큰 원\"을 먼저 적고 시작합니다.", "src": "변형 6"}, {"l": 2, "t": "sa", "q": "명제 '모든 실수 x에 대하여 x^{2} − 2x + k > 0이다'가 참이 되도록 하는 실수 k의 값의 범위를 구하시오.", "x": "k > 1|k>1", "s": "**신호 읽기**: \"모든 실수 x에 대하여\"가 참 → 진리집합이 전체집합(실수 전체)이어야 합니다.\n**상황 번역**: 이차식 x^{2} − 2x + k의 그래프가 어디서든 x축 위에 떠 있어야 합니다. 공통수학1의 판별식 도구로 번역하면 'x축과 만나지 않는다' → D < 0\n**풀이**: {{D§4}} = 1 − k < 0 → k > 1\n**함정**: 부등호가 > 0이므로 D = 0(접하는 경우)이면 x = 1에서 값이 0이 되어 거짓입니다. 등호를 넣지 않습니다.", "src": "변형 7"}, {"l": 3, "t": "self", "q": "명제 '어떤 실수 x에 대하여 x^{2} < 0이다'가 거짓인 이유를 출입증과 건물 비유로 서술하시오.", "x": null, "s": "**정답: 제곱해서 음수가 되는 실수는 하나도 없으므로 진리집합이 공집합이다. 출입증을 가진 사람이 한 명도 없으니 '어떤 사람이 출입증을 가지고 있다'는 말은 거짓이 된다.**\n**신호 읽기**: '어떤'이 들어간 명제는 진리집합이 비어 있지 않아야 참입니다.\n**상황 번역**: 출입증 명단(진리집합)을 만들어 보니 아무도 없는 상황입니다.\n**풀이**: 실수 x에 대하여 x^{2} ≥ 0이므로 x^{2} < 0을 만족하는 x가 없습니다. 진리집합 = ∅\n**함정**: '모든'과 '어떤'의 판정 기준을 함께 써 주면 서술이 완성됩니다. '모든'은 전체가, '어떤'은 한 명이라도 있어야 참입니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "x > 0일 때, x + {{9§x}}의 최솟값과 그때의 x의 값을 구하시오.", "x": null, "s": "**정답: 최솟값 6 (x = 3일 때)**\n**신호 읽기**: \"x > 0\"과 \"x + {{9§x}}의 최솟값\"은 곱이 일정한 두 양수의 합 → 절대부등식(산술평균 ≥ 기하평균)의 신호입니다.\n**상황 번역**: x와 {{9§x}}는 곱하면 항상 9로 일정합니다. 곱이 일정한 두 양수는 서로 같을 때 합이 가장 작습니다.\n**풀이**: x + {{9§x}} ≥ 2√{x × {{9§x}}} = 2 × 3 = 6. 등호는 x = {{9§x}}, 즉 x = 3일 때\n**함정**: 등호가 성립하는 x가 실제로 존재하는지 확인해야 최솟값이라고 말할 수 있습니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "양수 a, b에 대하여 a + b = 4일 때, ab의 최댓값과 {{1§a}} + {{1§b}}의 최솟값을 구하시오.", "x": null, "s": "**정답: ab의 최댓값 4, {{1§a}} + {{1§b}}의 최솟값 1**\n**신호 읽기**: [고난도] \"합이 일정(a + b = 4)\"한 두 양수 → 절대부등식을 거꾸로 쓰는 문제입니다.\n**상황 번역**: {{a + b§2}} ≥ √{ab}에 a + b = 4를 넣으면 곱의 상한이 나옵니다. 둘째 식은 통분하면 {{a + b§ab}}이므로 곱이 클수록 작아집니다.\n**풀이**: 2 ≥ √{ab} → ab ≤ 4 (등호 a = b = 2). {{1§a}} + {{1§b}} = {{4§ab}} ≥ {{4§4}} = 1 (등호 a = b = 2)\n**함정**: 두 번째 식에 절대부등식을 따로 쓰면 {{1§a}} + {{1§b}} ≥ {{2§√{ab}}}처럼 상수가 아닌 값이 나와 막힙니다. 통분해서 첫 결과를 다시 쓰는 것이 핵심입니다.", "src": "변형 10"}]}, {"id": "b6", "u": "G", "ex": "2-2", "t": "6. 인형 뽑기 껍질 벗기기론", "color": "남색", "emoji": "🔷", "en": "Theory of Shell Separation", "th": [["p", "함수는 **자판기**입니다. 정해진 버튼(정의역의 원소)을 누르면 반드시 음료 하나(함숫값)가 나옵니다. 누를 수 있는 버튼 전체가 **정의역**, 자판기가 내놓을 수 있다고 적힌 메뉴 전체가 **공역**, 실제로 나온 음료들만 모은 것이 **치역**입니다. 한 버튼에서 음료가 두 개 나오거나 아무것도 나오지 않으면 함수가 아닙니다."], ["p", "**합성함수**는 자판기 두 대를 이어 붙인 것입니다. 첫 번째 자판기 g에서 나온 결과를 그대로 두 번째 자판기 f의 버튼으로 넣으면 최종 결과 f(g(x))가 나옵니다. 이것을 (f ° g)(x) = f(g(x))라고 씁니다. 기호에서는 f가 앞에 있지만 **먼저 작동하는 것은 안쪽의** g입니다. 자판기를 잇는 순서를 바꾸면 결과도 달라지므로 일반적으로 f ° g ≠ g ° f입니다. 다만 세 대를 이을 때 어디부터 묶어 계산해도 결과는 같습니다((f ° g) ° h = f ° (g ° h))."], ["p", "시험에서 가장 자주 나오는 것은 f(f(x)) = k 같은 **합성함수 방정식**입니다. 이 식을 한 번에 풀려고 하면 막힙니다. 인형 뽑기 기계를 떠올려 보세요. 큰 상자를 먼저 열어야 안쪽 상자가 나오듯, 안쪽 f(x)를 상자 t 하나로 감싸고 두 단계로 나눠 풉니다."], ["li", "1단계: f(t) = k를 풀어 상자 안에 들어 있는 값 t를 구합니다. 그래프에 가로선 y = k를 긋고 교점의 x좌표를 읽는 일입니다."], ["li", "2단계: 상자를 열어 f(x) = t를 풉니다. 1단계에서 나온 값마다 그 높이로 가로선을 다시 긋고, 교점을 모두 셉니다."], ["li", "**유사 상황 독해법**: \"(f ° g)(x)\"는 안쪽 g부터 계산, \"f(f(x)) = k\"는 상자 씌우기 두 단계, \"==모든 실근의 합==\"은 그래프의 대칭축을 쓰라는 신호입니다."], ["p", "**[보충] 대칭축으로 합 구하기**: 그래프가 좌우 대칭인 산(텐트) 모양이면, 한 가로선과의 두 교점은 대칭축을 사이에 두고 마주 봅니다. 그래서 두 교점의 합은 (대칭축의 x좌표)× 2이고, 근을 하나하나 구할 필요가 없습니다."], ["p", "**[보충] 놓치기 쉬운 체크**: 2단계의 가로선이 치역(그래프의 높이 범위) 밖이면 교점이 0개입니다. 가로선이 꼭대기를 스치면 교점이 1개뿐입니다."]], "sum": ["신호: ==f(f(x)) = k== → 안쪽 f(x)를 **빨간 상자 t**로 치환", "1단계: f(t) = k → 가로선 y = k를 그어 상자 t의 값들을 확보", "2단계: 각 t마다 f(x) = t → 가로선 y = t를 다시 그어 교점의 개수·위치를 정산", "==대칭형== 그래프: 모든 실근의 합 = 대칭축 위치 × 교점 개수", "체크: 2단계 가로선이 치역 밖이면 0개, 꼭대기를 스치면 1개"], "fl": [["f(f(x)) = k를 보면 가장 먼저 할 일은?", "f(x) = t로 치환해 f(t) = k부터 푼다"], ["2단계에서 하는 일은?", "구한 t마다 가로선 y = t를 원래 그래프에 그어 교점을 센다"], ["대칭축이 x = 2인 텐트형 그래프에서 교점이 4개면 실근의 합은?", "2 × 4 = 8"], ["2단계 가로선이 치역 밖이면?", "교점 0개"]], "bk": {"q": "책을 덮고 「인형 뽑기 껍질 벗기기론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["f(x) = t 치환 (빨간 상자)", "1단계: 가로선 y = k로 t 확보", "2단계: 가로선 y = t로 x 확보", "대칭형이면 실근의 합 = 대칭축 × 교점 수", "치역 밖 0개, 꼭대기 1개 체크"]}, "pr": [{"l": 3, "t": "self", "q": "0 ≤ x ≤ 4에서 정의된 대칭형 텐트 모양의 함수 f(x)가 있다. (f(0) = 0, f(2) = 4, f(4) = 0) 방정식 f(f(x)) = 2의 ==모든 실근의 합==을 구하시오.", "x": null, "s": "**1. 1차 포장지 해독** 안쪽 f(x) = t로 치환해 f(t) = 2를 풉니다. 높이가 2인 곳에 가로선을 그으면 비례상 정확히 산의 절반인 t = 1과 t = 3이 나옵니다.\n**2. 2차 알맹이 해독** 상자를 열어 진짜 x의 최종 가로선 2개를 긋습니다. [스토리 A] f(x) = 1: 대칭인 두 근 발생. [스토리 B] f(x) = 3: 대칭인 두 근 발생.\n**3. 정산** 그래프는 x = 2를 기준으로 대칭이므로 각 스토리의 두 실근의 합은 축의 2배인 4입니다 → 4 + 4 = 8", "ck": ["1차 포장지 해독", "2차 알맹이 해독", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "정의역이 {x | 0 ≤ x ≤ 2}인 함수 f(x)의 그래프가 x = 1을 꼭대기로 하는 텐트 모양이다. (f(0) = 0, f(1) = 2, f(2) = 0) 이때 방정식 f(f(x)) = 1을 만족하는 ==모든 실근의 합==을 구하시오.", "x": null, "s": "**1. 1차 포장지 해독** 안쪽 f(x) = t로 묶어 f(t) = 1을 마주합니다. 꼭대기 높이가 2이므로 높이 1인 지점에 가로선을 그으면 t = 0.5와 t = 1.5가 나옵니다.\n**2. 2차 알맹이 해독** 포장을 찢어 최종 두 갈래 식 f(x) = 0.5, f(x) = 1.5를 만듭니다.\n**3. 정산** 그래프는 x = 1을 거울 축으로 대칭이므로 두 스토리의 합이 각각 2입니다 → 2 + 2 = 4", "ck": ["1차 포장지 해독", "2차 알맹이 해독", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "함수 f(x) = x^{2} − 2x − 3에 대하여 방정식 f(f(x)) = 0의 ==서로 다른 실근의 개수==를 구하시오.", "x": null, "s": "**1. 1차 포장지 해독** 안쪽 식을 t로 치환하여 f(t) = 0을 독해합니다. (t + 1)(t − 3) = 0에서 t = −1, 3이 상자의 진짜 정체입니다.\n**2. 2차 알맹이 해독** 그래프 f(x) = (x − 1)^{2} − 4는 꼭짓점 높이가 − 4인 아래로 볼록한 그릇 모양입니다. f(x) = −1 가로선은 꼭짓점보다 위이므로 교점 2개, f(x) = 3 가로선도 교점 2개입니다.\n**3. 정산** 교점을 모두 더합니다 → 2 + 2 = 4개", "ck": ["1차 포장지 해독", "2차 알맹이 해독", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "함수 f(x) = x^{2} − 4x + 3에 대하여 방정식 ==f(f(x)) = 3==의 모든 실근의 합을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** f(f(x)) = k → 안쪽 f(x)를 빨간 상자 t로 치환합니다.\n**2. 1단계: 상자 값 확보** f(t) = 3 → t^{2} − 4t = 0 → t = 0 또는 t = 4\n**3. 2단계: 가로선 다시 긋기** f(x) = 0 → x = 1, 3 (2개), f(x) = 4 → x^{2} − 4x − 1 = 0 → x = 2 ± √{5} (2개)\n**4. 대칭 정산** 그래프가 x = 2에 대해 대칭이므로 실근 4개의 합 = 2 × 4 = 8\n**정답: 8**", "ck": ["신호 문장 찾기", "1단계: 상자 값 확보", "2단계: 가로선 다시 긋기", "대칭 정산"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "sa", "q": "함수 f(x)가 최고차항의 계수가 1인 이차함수이고 축이 x = 3이다. f(f(x)) = 0의 서로 다른 실근의 개수가 2일 때, f(3)의 값은?", "x": "f(3) = 0|f(3)=0", "s": "**신호 읽기**: \"f(f(x)) = 0\"과 \"서로 다른 실근의 개수\"가 함께 나왔습니다. 안쪽 f(x)를 상자 t로 감싸 두 단계로 나눕니다.\n**상황 번역**: 1단계 f(t) = 0 → 상자 값 t를 구함. 2단계 f(x) = t → 가로선 y = t와 포물선의 교점 개수를 셈. 포물선은 축 x = 3, 꼭짓점 높이 f(3)인 아래로 볼록한 산입니다. f(x) = (x − 3)^{2} + f(3)\n**풀이**: 꼭짓점 높이 f(3)에 따라 세 경우로 나눕니다. ① f(3) > 0이면 포물선이 x축 위에 떠 있어 상자가 없음(실근 0개). ② f(3) < 0이면 상자 t가 2개 생기고, 두 값 모두 꼭짓점 높이보다 커서 가로선마다 교점 2개 → 4개. ③ f(3) = 0이면 상자는 t = 3 하나, 가로선 y = 3은 꼭짓점(높이 0)보다 위라 교점 2개(x = 3 ± √{3}) → 정확히 2개. 따라서 f(3) = 0\n**함정**: 1단계 상자의 개수와 2단계 교점의 개수를 혼동하지 않습니다. 실근의 개수는 2단계 교점의 총합입니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "텐트형 함수 f(x)가 f(0) = 0, f(1) = 2, f(2) = 0을 만족할 때, f(f(x)) = 1.5의 모든 실근의 합을 구하시오.", "x": "4|4개|4가지", "s": "**신호 읽기**: \"텐트 모양\"과 \"모든 실근의 합\"은 대칭축을 이용하라는 신호입니다.\n**상황 번역**: 텐트는 x = 1을 축으로 좌우 대칭이고 높이는 0부터 2까지입니다. 1단계 f(t) = 1.5에서 상자 값을 구하고, 2단계에서 각 상자 높이로 가로선을 긋습니다.\n**풀이**: 1단계: 왼쪽 변 y = 2t에서 t = 0.75, 오른쪽 변 y = −2t + 4에서 t = 1.25. 2단계: 가로선 y = 0.75와 y = 1.25는 모두 0과 2 사이라 각각 교점 2개. 한 가로선의 두 교점은 축 x = 1에 대해 대칭이므로 합이 1 × 2 = 2. 총합 2 + 2 = 4\n**함정**: 교점을 일일이 구할 필요가 없습니다. '한 가로선의 두 교점 합 = 축 × 2'를 쓰면 계산이 사라집니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "f(x)가 증가함수일 때, 방정식 f(f(x)) = x의 기하학적 의미는 함수 y = f(x)의 그래프와 어떤 직선의 교점을 찾는 문맥인지 기술하시오.", "x": ["직선 y = x", "직선 y = −x", "x축", "y축", "직선 y = 1"], "s": "**신호 읽기**: \"증가함수\"와 \"f(f(x)) = x\"는 함수를 두 번 통과해 제자리로 돌아오는 장면입니다.\n**상황 번역**: 어떤 x에서 f(x) > x라면, 증가함수는 큰 값을 넣으면 큰 값이 나오므로 f(f(x)) > f(x) > x가 되어 제자리로 돌아올 수 없습니다. f(x) < x일 때도 마찬가지로 f(f(x)) < x입니다.\n**풀이**: 따라서 f(f(x)) = x가 되려면 처음부터 f(x) = x여야 합니다. 이것은 그래프 y = f(x)와 직선 y = x의 교점을 찾는 문제입니다.\n**함정**: 이 결론은 증가함수일 때만 성립합니다. 감소함수에서는 y = x 밖에서도 해가 생길 수 있습니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "두 함수 f(x) = 2x + 1, g(x) = x^{2}에 대하여 (f ° g)(x)와 (g ° f)(x)를 각각 구하고, 두 함수가 같은지 비교하시오.", "x": null, "s": "**정답: (f ° g)(x) = 2x^{2} + 1, (g ° f)(x) = 4x^{2} + 4x + 1, 서로 다르다**\n**신호 읽기**: \"(f ° g)(x)\"는 자판기 두 대를 잇는 기본 계산입니다. 기호의 오른쪽(안쪽)에 있는 g가 먼저 작동합니다.\n**상황 번역**: (f ° g)(x) = f(g(x))는 'x를 g에 넣고, 나온 값을 f에 넣기'. (g ° f)(x) = g(f(x))는 순서가 반대입니다.\n**풀이**: f(g(x)) = f(x^{2}) = 2x^{2} + 1. g(f(x)) = g(2x + 1) = (2x + 1)^{2} = 4x^{2} + 4x + 1. x = 1만 넣어도 3과 9로 다르므로 두 함수는 같지 않습니다.\n**함정**: f ° g를 'f 먼저'로 읽는 실수가 가장 흔합니다. 이 문항처럼 순서를 바꾸면 결과가 달라지므로 합성함수는 교환법칙이 성립하지 않습니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "f(x) = x^{2} − 2x일 때, 방정식 f(f(x)) = −1을 만족하는 모든 실근의 합을 구하시오.", "x": "2|2개|2가지", "s": "**신호 읽기**: 이차함수 합성 방정식과 \"모든 실근의 합\" → 상자 두 단계 + 근과 계수의 관계입니다.\n**상황 번역**: f(x) = x^{2} − 2x = (x − 1)^{2} − 1은 꼭짓점 (1, −1)인 포물선입니다.\n**풀이**: 1단계 t^{2} − 2t = −1 → (t − 1)^{2} = 0 → 상자 t = 1 하나. 2단계 x^{2} − 2x = 1 → x^{2} − 2x − 1 = 0. 판별식 {{D§4}} = 1 + 1 > 0이므로 서로 다른 두 실근이 있고, 합은 −{{−2§1}} = 2\n**함정**: 근과 계수의 관계로 합을 쓰기 전에 실근이 정말 있는지 판별식으로 확인해야 합니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "0 ≤ x ≤ 2에서 정의된 대칭형 텐트 모양의 함수 f(x)가 f(0) = 0, f(1) = 2, f(2) = 0을 만족할 때, f(f(x)) = 0.5의 실근의 개수는?", "x": "4개|4|4가지", "s": "**신호 읽기**: 텐트 그래프 + \"실근의 개수\" → 1단계 상자 값, 2단계 가로선 교점 세기입니다.\n**상황 번역**: 텐트의 높이 범위는 0 ≤ y ≤ 2이므로, 2단계 가로선이 이 범위 안에 있어야 교점이 생깁니다.\n**풀이**: 1단계 f(t) = 0.5 → t = 0.25, 1.75. 2단계 가로선 y = 0.25, y = 1.75 모두 0과 2 사이이고 꼭대기(2)가 아니므로 각각 교점 2개 → 총 4개\n**함정**: [보충]의 체크처럼 가로선이 꼭대기 높이와 같으면 교점은 1개, 범위 밖이면 0개입니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "방정식 f(x) = 0의 세 근이 1, 2, 3일 때, 방정식 f(f(x)) = 0을 푸는 과정을 f(x) = t 치환(상자 씌우기)을 이용하여 단계별로 서술하시오.", "x": null, "s": "**정답: ① f(x) = t로 치환하면 f(t) = 0이 된다. ② f의 근이 1, 2, 3이므로 상자 값은 t = 1, 2, 3이다. ③ 이제 f(x) = 1, f(x) = 2, f(x) = 3을 각각 풀어야 하므로 그래프 y = f(x)에 가로선 y = 1, y = 2, y = 3을 긋는다. ④ 세 가로선과 그래프의 교점의 x좌표가 모두 해이며, 교점의 개수를 더하면 실근의 개수가 된다.**\n**신호 읽기**: '과정을 단계별로 서술'하는 문제는 치환 → 1단계 → 2단계 → 정산의 순서를 그대로 문장으로 씁니다.\n**상황 번역**: 인형 뽑기에서 먼저 바깥 상자를 열고(1단계), 그 안에서 나온 번호표마다 다시 인형을 찾는(2단계) 장면입니다.\n**풀이**: 1단계에서 나온 값이 2단계에서는 '가로선의 높이'로 바뀐다는 점을 꼭 적습니다.\n**함정**: 1단계의 값 1, 2, 3을 그대로 답으로 쓰는 실수가 가장 흔합니다. 그것은 x가 아니라 상자 t의 값입니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "f(x)의 그래프가 다섯 점 (0, 3), (1, 0), (2, 3), (3, 0), (4, 3)을 차례로 이은 W모양이다. f(f(x)) = 3을 만족하는 실근의 개수를 구하는 과정을 쓰시오.", "x": "6개|6|6가지", "s": "**신호 읽기**: [고난도] W모양 그래프의 합성 방정식입니다. 꼭짓점 높이(0과 3)를 먼저 표시해 둡니다.\n**상황 번역**: W는 (0, 3)→(1, 0)→(2, 3)→(3, 0)→(4, 3)으로 내려갔다 올라가기를 두 번 합니다. 높이 범위는 0 ≤ y ≤ 3\n**풀이**: 1단계 f(t) = 3 → 가로선 y = 3은 위쪽 꼭짓점 세 곳을 스치므로 t = 0, 2, 4. 2단계 ① f(x) = 0: 아래 꼭짓점 2곳(x = 1, 3) → 2개. ② f(x) = 2: 네 직선 구간을 하나씩 지나 4개. ③ f(x) = 4: 최고 높이 3보다 높아 0개. 합계 2 + 4 + 0 = 6개\n**함정**: 1단계에서 꼭짓점을 스치는 값이 상자로 나오고, 2단계에서 그 값이 범위 밖이면 교점이 없습니다. 높이 범위를 먼저 적어 두면 실수하지 않습니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "f(0) = 1, f(1) = 0, f(2) = 2이고 세 점을 차례로 선분으로 이은 함수 f(x) (0 ≤ x ≤ 2)에 대하여 f(f(x)) = 2의 실근을 구하시오.", "x": "x = 2|x=2|2", "s": "**신호 읽기**: 꺾은선 그래프의 합성 방정식입니다. 그래프 높이가 2가 되는 곳을 찾는 일이 두 번 반복됩니다.\n**상황 번역**: 그래프는 (0, 1)에서 (1, 0)으로 내려갔다가 (2, 2)로 올라갑니다. 높이 2는 오른쪽 끝 점에서만 나옵니다.\n**풀이**: 1단계 f(t) = 2 → t = 2. 2단계 f(x) = 2 → x = 2\n**함정**: 정의역이 0 ≤ x ≤ 2로 제한되어 있으므로 그래프 밖으로 선을 늘려 교점을 만들지 않습니다.", "src": "변형 9"}, {"l": 3, "t": "mc", "q": "f(x) = |x − 1|일 때, f(f(x)) = 0의 해를 구하시오.", "x": ["x = 0 또는 x = 2", "x = 1", "x = 0", "x = 2", "x = −1 또는 x = 1"], "s": "**신호 읽기**: 절댓값 함수의 합성입니다. y = |x − 1|은 꼭짓점이 (1, 0)인 V자 그래프입니다.\n**상황 번역**: 1단계 f(t) = 0은 V의 바닥, 2단계 f(x) = t는 V에 가로선 긋기입니다.\n**풀이**: 1단계 |t − 1| = 0 → t = 1. 2단계 |x − 1| = 1 → V에 가로선 y = 1 → x − 1 = ± 1 → x = 0 또는 2\n**함정**: 절댓값 방정식 |A| = 1은 A = 1과 A = −1 두 갈래입니다. 한쪽만 풀면 해를 놓칩니다.", "src": "변형 10"}]}, {"id": "b7", "u": "G", "ex": "2-2", "t": "7. 3:3 미팅 매너론", "color": "보라", "emoji": "🟣", "en": "Theory of One-to-One Match", "th": [["p", "3:3 미팅에서 남학생 세 명(정의역)이 각자 여학생 한 명(공역)을 지목한다고 해 봅시다. 함수는 '모든 남학생이 정확히 한 명씩 지목한다'는 규칙입니다. **역함수**는 그 지목 화살표를 거꾸로 되돌려, 지목받은 여학생이 자기를 지목한 남학생을 가리키게 하는 것입니다."], ["p", "그런데 되돌리기가 항상 가능한 것은 아닙니다. 두 남학생이 같은 여학생을 지목했다면, 그 여학생은 누구에게 화살표를 돌려줘야 할지 정할 수 없습니다. 또 아무에게도 지목받지 못한 여학생이 있다면 그 여학생에게서는 출발할 화살표가 없습니다. 그래서 역함수가 존재하려면 **겹치는 지목도 없고 빈자리도 없는 일대일 대응**이어야 합니다."], ["p", "그래프로 보면, 정의역과 공역이 실수 전체인 함수는 그래프가 중간에 끊기거나 오르내리지 않고 **한 방향으로만**(계속 증가하거나 계속 감소) 나아가야 일대일 대응이 됩니다. 구간마다 식이 다른 함수라면 '조각들이 이어져 있는가', '조각들의 기울기 방향이 같은가'를 확인합니다."], ["li", "**유사 상황 독해법**: \"==역함수가 존재할 때==\"는 '그래프가 한 방향으로만 가도록 기울기의 부호를 통일하라'는 신호입니다. \"f^{−1}(b)==의 값==\"은'f(a) = b가 되는 a를 찾으라'는 신호입니다."], ["p", "**[보충] 역함수 구하기 3단계**"], ["oli", "y = f(x)를 x에 대하여 풉니다. (예: y = 2x − 3 → x = {{y + 3§2}})"], ["oli", "x와 y를 서로 바꿉니다. (→ y = {{x + 3§2}}, 즉 f^{−1}(x) = {{x + 3§2}})"], ["oli", "원래 함수의 치역을 역함수의 정의역으로 씁니다."], ["p", "f(a) = b이면 f^{−1}(b) = a입니다(같은 화살표를 양쪽에서 읽은 것). 그래서 f^{−1}(f(x)) = x, f(f^{−1}(x)) = x이고, 함숫값 하나만 필요하면 역함수 식을 구하지 않고 f(a) = b인 a를 찾는 편이 빠릅니다."], ["p", "**[보충] 구간별 직선 함수 체크 3단계**"], ["oli", "**연결**: 경계에서 두 조각이 붙어 있는가? (떨어져 있으면 빈자리나 겹치는 지목이 생깁니다.)"], ["oli", "**방향 통일**: 모든 조각의 기울기 부호가 같은가? 두 조각이면 (첫 조각의 기울기) × (둘째 조각의 기울기) > 0"], ["oli", "**기울기 0 금지**: 평평한 구간이 있으면 여러 사람이 같은 값을 지목합니다."], ["p", "**[보충] 거울 보너스**: y = f(x)와 y = f^{−1}(x)의 그래프는 직선 y = x에 대하여 대칭입니다. f가 ==증가함수==이면 두 그래프의 교점은 모두 y = x 위에 있으므로 f(x) = x를 풀면 됩니다."]], "sum": ["신호: \"==역함수가 존재==할 때\" → **일대일 대응**이어야 한다", "그래프가 꺾이지 않고 한 방향으로만: **기울기 부호 통일**", "구간별 직선 함수 3단계: ① 경계에서 연결 ② 기울기 부호 같음 (곱 > 0) ③ 기울기 0 금지", "절댓값 함수는 꺾이는 점에서 구간을 나눠 각 구간의 기울기를 확인", "거울 보너스: y = f(x)와 y = f^{−1}(x)는 y = x 대칭 · f가 ==증가함수==면 교점은 f(x) = x로"], "fl": [["\"역함수가 존재한다\"를 행동 강령으로 바꾸면?", "기울기의 부호를 통일해 한 방향으로만 뻗게 하라"], ["두 조각 직선 함수가 역함수를 가질 조건(기울기)?", "(첫 조각 기울기) × (둘째 조각 기울기) > 0"], ["일대일 함수와 일대일 대응의 차이는?", "일대일 대응은 치역 = 공역 (빈 의자가 없다)"], ["f가 증가함수일 때 y = f(x)와 역함수의 교점은?", "모두 직선 y = x 위 → f(x) = x를 푼다"]], "bk": {"q": "책을 덮고 「3:3 미팅 매너론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["역함수 존재 ⇔ 일대일 대응", "기울기 부호 통일", "경계에서 연결", "기울기 곱 > 0, 기울기 0 금지", "절댓값은 구간을 나눠 기울기 확인", "증가함수면 교점은 y = x 위"]}, "pr": [{"l": 3, "t": "self", "q": "구간에 따라 나누어진 함수 f(x) = ⦃(k − 3)x + 1 (x ≥ 0)¦(2k + 1)x + 1 (x < 0)⦄의 ==역함수가 존재==하도록 하는 k의 범위를 구하시오.", "x": null, "s": "**1. 연속성 독해** 경계선 x = 0에서 두 직선이 y = 1로 꼭 붙어 맞물려 있습니다. 끊어진 공백 지역이 없습니다.\n**2. 기울기 부호 일치** 미팅 화살표가 꼬이지 않으려면 두 구간 직선의 기울기 부호(방향)가 같아야 합니다.\n**3. 정산** (오른쪽 기울기) × (왼쪽 기울기) > 0을 적용합니다. (k − 3)(2k + 1) > 0 ⇒ k < −{{1§2}} 또는 k > 3", "ck": ["연속성 독해", "기울기 부호 일치", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "실수 전체의 집합에서 정의된 함수 f(x) = (2 − a)x + |x − 1|의 ==역함수가 존재==할 때, 실수 a의 값의 범위를 구하시오.", "x": null, "s": "**1. 절댓값 구간 분할 문맥** 절댓값 내부가 0이 되는 x = 1을 기준으로 두 토막으로 나눕니다. x ≥ 1일 때 f(x) = (3 − a)x − 1, x < 1일 때 f(x) = (1 − a)x + 1\n**2. 기울기 곱 양수 필터 가동** 두 직선의 기울기 부호가 같아야 하므로 곱이 양수여야 합니다.\n**3. 정산** (3 − a)(1 − a) > 0 ⇒ a < 1 또는 a > 3", "ck": ["절댓값 구간 분할 문맥", "기울기 곱 양수 필터 가동", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "함수 f(x) = ⦃(a + 3)x − 1 (x < 0)¦(2 − a)x − 1 (x ≥ 0)⦄의 ==역함수가 존재==하도록 하는 정수 a의 개수를 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"역함수가 존재\" → 일대일 대응, 그래프가 한 방향으로만 뻗어야 합니다.\n**2. 경계 연결 확인** x = 0에서 두 식 모두 −1 → 이미 연결되어 있습니다.\n**3. 기울기 부호 통일** (a + 3)(2 − a) > 0 → −3 < a < 2 (기울기 0도 자동 제외)\n**4. 정산** a = −2, −1, 0, 1 → 4개\n**정답: 4**", "ck": ["신호 문장 찾기", "경계 연결 확인", "기울기 부호 통일", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "함수 f(x) = x^{2} − 2x + 2 (x ≥ 1)의 역함수를 g(x)라 할 때, 두 곡선 y = f(x), y = g(x)의 두 교점을 양 끝점으로 하는 선분의 길이를 구하시오.", "x": null, "s": "**1. 일대일 대응 문맥 독해** f(x) = (x − 1)^{2} + 1은 x ≥ 1에서 끊어짐 없이 한 방향으로 증가하므로 역함수가 존재합니다.\n**2. 거울선과의 교점 파악** 증가함수와 그 역함수의 교점은 거울선 y = x와의 교점입니다. x^{2} − 2x + 2 = x → x^{2} − 3x + 2 = 0 → x = 1, 2\n**3. 정산** 교점 (1, 1), (2, 2) 사이의 거리 → √{(2 − 1)^{2} + (2 − 1)^{2}} = √{2}", "ck": ["일대일 대응 문맥 독해", "거울선과의 교점 파악", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 1, "t": "mc", "q": "함수 f(x) = (a − 5)x + 3이 실수 전체에서 역함수를 갖기 위한 a의 조건은?", "x": ["a ≠ 5", "a = 5", "a > 5", "a < 5", "a ≠ 0"], "s": "**신호 읽기**: \"실수 전체에서 역함수를 갖기 위한 조건\"은 일대일 대응(모든 의자에 정확히 한 명씩) 조건을 묻는 신호입니다.\n**상황 번역**: 일차함수의 그래프가 직선이면 기울기가 0이 아닌 한 모든 y값에 정확히 한 번씩 화살표가 꽂힙니다. 기울기가 0이면 모든 손님이 한 의자에 몰립니다.\n**풀이**: 기울기 a − 5 ≠ 0 → a ≠ 5\n**함정**: 상수함수(기울기 0)는 함수이지만 일대일 대응이 아니므로 역함수가 없습니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "구간별 함수 f(x) = ⦃2x + 1 (x ≥ 1)¦(m − 1)x + 2 (x < 1)⦄의 역함수가 존재하기 위한 m의 값은?", "x": "m = 2|m=2|2", "s": "**신호 읽기**: 구간별로 정의된 함수의 역함수 조건은 ① 두 토막이 이음매에서 끊기지 않고 ② 기울기 부호가 같을 것, 두 가지를 확인하라는 신호입니다.\n**상황 번역**: 이음매 x = 1에서 두 직선의 높이가 다르면 빈 의자가 생기거나 한 의자에 두 명이 앉습니다.\n**풀이**: 오른쪽 토막 2 × 1 + 1 = 3, 왼쪽 토막 (m − 1) + 2 = m + 1. 이음 조건 m + 1 = 3 → m = 2. 이때 왼쪽 기울기 m − 1 = 1과 오른쪽 기울기 2가 모두 양수라 화살표가 꼬이지 않습니다.\n**함정**: 이음 조건만 확인하고 기울기 부호를 확인하지 않으면, 꺾여 되돌아오는 그래프를 놓칩니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "함수 f(x) = |x − 2| + kx + 5의 역함수가 존재하지 않도록 하는 정수 k를 모두 구하시오.", "x": ["−1, 0, 1", "0", "−1, 1", "−2, −1, 0, 1, 2", "0, 1"], "s": "**신호 읽기**: 절댓값이 섞인 일차식은 꺾이는 점(x = 2)을 기준으로 두 토막으로 나누라는 신호입니다.\n**상황 번역**: 두 토막의 기울기가 같은 부호(둘 다 오르막이거나 둘 다 내리막)여야 일대일 대응입니다. 이 함수는 이음매에서 항상 이어져 있으므로 기울기만 보면 됩니다.\n**풀이**: x ≥ 2: (k + 1)x + 3, x < 2: (k − 1)x + 7. 역함수 존재 ⇔ (k + 1)(k − 1) > 0 ⇔ k < −1 또는 k > 1. 존재하지 않는 정수는 −1, 0, 1\n**함정**: 기울기가 0인 토막이 하나라도 있으면(k = ± 1) 역함수가 없습니다. 곱이 0인 경우를 빼먹지 않습니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "일대일 대응과 일대일 함수의 차이를 미팅룸의 '공역 공백 의자' 개념으로 설명하시오.", "x": null, "s": "**정답: 일대일 함수는 서로 다른 손님이 서로 다른 의자에 앉기만 하면 되므로 아무도 앉지 않은 빈 의자가 남아도 된다. 일대일 대응은 거기에 더해 빈 의자가 하나도 없어야(치역 = 공역) 한다.**\n**신호 읽기**: 두 개념의 차이를 묻는 서술형은 공통점과 차이점을 한 문장씩 씁니다.\n**상황 번역**: 역함수는 의자(공역)에서 손님(정의역)으로 화살표를 되감는 것이므로, 빈 의자가 있으면 그 의자에서 출발할 화살표가 없습니다.\n**풀이**: 그래서 역함수가 존재하려면 일대일 함수로는 부족하고 일대일 대응이어야 한다는 결론까지 씁니다.\n**함정**: \"겹치지 않는다\"만 쓰면 일대일 함수의 설명에 그칩니다. '빈 의자'의 유무가 핵심 차이입니다.", "src": "변형 4"}, {"l": 2, "t": "mc", "q": "역함수가 존재하는 함수 f(x)가 증가함수일 때, y = f(x)와 그 역함수의 교점은 항상 어떤 직선 위에 존재하는가?", "x": ["직선 y = x", "직선 y = −x", "x축", "y축", "직선 x = 1"], "s": "**신호 읽기**: \"증가함수와 그 역함수의 교점\"은 거울선 y = x를 떠올리라는 신호입니다.\n**상황 번역**: 역함수의 그래프는 원래 그래프를 y = x에 비춘 거울상입니다. 증가함수는 유형 6의 3번처럼 f(f(x)) = x의 해가 f(x) = x의 해와 같습니다.\n**풀이**: 따라서 두 그래프의 교점은 원래 그래프와 y = x의 교점이며, 모두 직선 y = x 위에 있습니다.\n**함정**: 감소함수에서는 y = x 밖의 교점이 생길 수 있으므로 '증가함수'라는 조건을 함께 씁니다.", "src": "변형 5"}, {"l": 2, "t": "self", "q": "함수 f(x) = 2x − 3의 역함수 f^{−1}(x)를 구하고, f^{−1}(5)의 값을 구하시오.", "x": null, "s": "**정답: f^{−1}(x) = {{x + 3§2}}, f^{−1}(5) = 4**\n**신호 읽기**: \"역함수를 구하시오\"는 [보충] 역함수 구하기 3단계를 쓰라는 신호입니다.\n**상황 번역**: 화살표를 되감는 식을 만드는 일입니다. y가 나왔을 때 어떤 x에서 출발했는지를 거꾸로 구합니다.\n**풀이**: ① y = 2x − 3을 x에 대해 풀면 x = {{y + 3§2}} ② x와 y를 바꾸면 y = {{x + 3§2}} ③ 정의역과 치역은 모두 실수 전체. f^{−1}(5) = {{5 + 3§2}} = 4\n**함정**: 값만 필요하면 f(a) = 5를 풀어도 됩니다: 2a − 3 = 5 → a = 4. 확인: f(4) = 5이므로 f^{−1}(5) = 4가 맞습니다.", "src": "변형 6"}, {"l": 2, "t": "sa", "q": "집합 X = {1, 2, 3}에서 X로의 함수 중 역함수가 존재하는 함수의 총 개수를 구하시오.", "x": "6개|6|6가지", "s": "**신호 읽기**: 유한집합에서 \"역함수가 존재하는 함수의 개수\"는 일대일 대응의 개수, 즉 줄 세우기(순열)입니다.\n**상황 번역**: 손님 1, 2, 3이 의자 1, 2, 3에 한 명씩 앉습니다. 겹치지도 비지도 않아야 합니다.\n**풀이**: 1번 손님 3가지, 2번 손님 2가지, 3번 손님 1가지 → 3! = 6\n**함정**: 전체 함수의 개수(3^{3} = 27)와 혼동하지 않습니다. 역함수 조건이 붙으면 같은 의자에 두 명이 앉는 경우가 모두 빠집니다.", "src": "변형 7"}, {"l": 3, "t": "mc", "q": "f(x) = x^{2} − 4x + 6 (x ≥ a)의 역함수가 존재하고, 원래 함수와 역함수의 교점이 1개가 되도록 하는 a의 범위는?", "x": ["2 < a ≤ 3", "a ≥ 2", "2 ≤ a < 3", "a > 3", "2 < a < 3"], "s": "**신호 읽기**: [고난도] 이차함수의 정의역을 x ≥ a로 자른 것은 '한쪽 날개만 쓰라'는 신호이고, \"역함수와 교점의 개수\"는 y = x와의 교점 개수로 번역하라는 신호입니다.\n**상황 번역**: f(x) = (x − 2)^{2} + 2는 축 x = 2인 포물선입니다. 역함수가 있으려면 오른쪽 날개(증가 구간)만 써야 하므로 a ≥ 2. 증가함수이므로 역함수와의 교점은 y = x와의 교점입니다.\n**풀이**: x^{2} − 4x + 6 = x → x^{2} − 5x + 6 = 0 → x = 2, 3. 정의역 x ≥ a 안에 남는 교점이 1개여야 합니다. a = 2이면 2개, 2 < a ≤ 3이면 x = 3 하나, a > 3이면 0개 → 2 < a ≤ 3\n**함정**: a = 2를 포함하면 교점이 두 개가 됩니다. 경계값은 하나씩 직접 넣어 확인합니다.", "src": "변형 8"}, {"l": 3, "t": "mc", "q": "함수 f(x) = |x + 1| − |x − 3| + ax의 역함수가 존재하도록 하는 a의 범위를 구하시오.", "x": ["a < −2 또는 a > 0", "a > 0", "−2 < a < 0", "a < −2", "a ≠ 0"], "s": "**신호 읽기**: 절댓값이 두 개 → 꺾이는 점 x = −1, x = 3을 기준으로 세 토막으로 나누라는 신호입니다.\n**상황 번역**: 세 토막 모두 같은 방향(오르막 또는 내리막)으로 기울어 있어야 일대일 대응이 됩니다.\n**풀이**: x < −1: −(x + 1) + (x − 3) + ax → 기울기 a. −1 ≤ x ≤ 3: (x + 1) + (x − 3) + ax → 기울기 a + 2. x > 3: (x + 1) − (x − 3) + ax → 기울기 a. 부호가 같아야 하므로 a(a + 2) > 0 → a < −2 또는 a > 0\n**함정**: 각 토막에서 절댓값을 벗길 때 부호를 정확히 정해야 합니다. 토막마다 x값 하나(예: − 2, 0, 4)를 넣어 부호를 확인합니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "역함수 구조에서 f(a) = b ⇔ f^{−1}(b) = a가 성립하는 본질적 이유를 '화살표 되감기' 비유로 서술하시오.", "x": null, "s": "**정답: 원래 함수가 a에서 출발한 화살표로 b를 맞혔다면, 역함수는 그 화살표를 거꾸로 되감아 b에서 출발해 a로 돌아가는 것이다. 일대일 대응에서는 각 의자에 꽂힌 화살표가 정확히 하나뿐이므로 되감으면 엇갈림 없이 원래 출발점으로 돌아간다.**\n**신호 읽기**: \"본질적 이유\"를 묻는 서술형은 정의(화살표의 방향)로 돌아가 설명합니다.\n**상황 번역**: f(a) = b는 'a → b 화살표', f^{−1}(b) = a는 'b → a 화살표'입니다. 같은 화살표를 양쪽에서 읽은 것입니다.\n**풀이**: 일대일 대응이라는 조건 때문에 되감기가 하나로 정해진다는 점을 꼭 씁니다.\n**함정**: 식 f(a) = b ⇔ f^{−1}(b) = a를 다시 쓰기만 하면 설명이 아닙니다. '왜 하나로 정해지는가(일대일 대응)'까지 써야 합니다.", "src": "변형 10"}]}, {"id": "b8", "u": "G", "ex": "2-2", "t": "8. 자석의 밀어내는 힘론", "color": "갈색", "emoji": "🟤", "en": "Theory of Asymptotic Symmetry", "th": [["p", "같은 극끼리 마주 보는 두 자석 사이에 작은 쇠구슬을 굴린다고 상상해 보세요. 구슬은 자석에 가까이 갈 수는 있어도 끝내 닿지 못하고 밀려납니다. 유리함수의 그래프가 바로 이렇게 움직입니다."], ["p", "y = {{k§x − p}} + q에서 x = p이면 분모가 0이 되는데, 0으로는 나눌 수 없으므로 그래프는 세로선 x = p에 절대 닿지 못합니다. 또 k ≠ 0이면 {{k§x − p}}는 아무리 작아져도 0이 되지는 않으므로 y는 가로선 y = q에도 닿지 못합니다. 이 두 선이 그래프를 밀어내는 **자석 벽, 점근선**입니다."], ["p", "두 자석 벽이 만나는 점 (p, q)가 그래프의 **심장**입니다. 유리함수의 그래프는 기본 모양 y = {{k§x}}를 심장이 (p, q)에 오도록 그대로 미끄러뜨려 옮긴 것이므로, 심장을 중심으로 대칭이고, 심장을 지나는 기울기 1, −1인 두 직선에 대해서도 대칭입니다. k > 0이면 두 가지가 심장의 오른쪽 위와 왼쪽 아래에, k < 0이면 오른쪽 아래와 왼쪽 위에 있습니다."], ["li", "**유사 상황 독해법**: ==점근선==, ==대칭의 중심==, ==대칭축== 이야기가 나오면 계산부터 하지 말고 \"심장 (p, q)가 어디인가?\"부터 찾으세요. 대칭축은 반드시 심장을 지납니다."], ["p", "**[보충] 표준형 만들기 (분자 쪼개기)**: y = {{2x + 3§x − 1}}처럼 주어지면 분자를 '분모의 몇 배 + 나머지'로 쪼갭니다. 2x + 3 = 2(x − 1) + 5이므로 y = {{2(x − 1) + 5§x − 1}} = 2 + {{5§x − 1}} → 심장 (1, 2), k = 5"], ["p", "**[보충] 심장 읽는 법**"], ["tbl", [["주어진 식", "심장 읽는 법"], ["y = {{k§x − p}} + q", "바로 (p, q)"], ["y = {{ax + b§cx + d}} (c ≠ 0, ad − bc ≠ 0)", "수직 점근선 x = −{{d§c}}, 수평 점근선 y = {{a§c}}"], ["대칭축", "y = (x − p) + q, y = − (x − p) + q"]]], ["p", "**[보충] 거리의 합 최솟값**: 그래프 위의 점에서 두 점근선까지의 거리는 |x − p|와 {{|k|§|x − p|}} 꼴이므로, 곱이 |k|로 일정합니다. 합의 최솟값은 절대부등식(유형 5)으로 2√{|k|}입니다."]], "sum": ["신호: ==점근선==, ==대칭== → 수식 변형보다 먼저 **심장 좌표 (p, q)**", "y = {{k§x − p}} + q → 점근선 x = p, y = q · 심장 (p, q)", "y = {{ax + b§cx + d}} → 수직 점근선 x = −{{d§c}}, 수평 점근선 y = {{a§c}}", "대칭축은 심장을 지나는 기울기 ±1 직선: y = (x − p) + q, y = −(x − p) + q", "그래프 위 점에서 두 점근선까지 거리 합의 최솟값 = 2√{|k|}"], "fl": [["y = {{2x − 1§x + 1}}의 심장 좌표는?", "(−1, 2)"], ["y = {{ax + b§cx + d}}의 수평 점근선은?", "y = {{a§c}}"], ["유리함수의 대칭축 기울기는?", "1 또는 −1, 반드시 심장 (p, q)를 지난다"], ["y = {{k§x − p}} + q 위의 점에서 두 점근선까지 거리 합의 최솟값은?", "2√{|k|} (산술·기하평균)"]], "bk": {"q": "책을 덮고 「자석의 밀어내는 힘론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호: 점근선, 대칭 → 심장 (p, q)", "y = k/(x − p) + q 의 점근선", "y = (ax + b)/(cx + d)의 점근선 x = −d/c, y = a/c", "대칭축 y = ±(x − p) + q", "점대칭의 중심 = 심장", "거리 합 최솟값 2√|k|"]}, "pr": [{"l": 3, "t": "self", "q": "유리함수 y = {{2x + 5§x − 1}}의 그래프가 두 직선 y = x + a와 y = −x + b에 대하여 각각 ==선대칭==일 때, a + b의 값을 구하시오.", "x": null, "s": "**1. 심장 좌표 추출** 분수 식을 쪼개어 점근선을 읽습니다. y = {{2(x − 1) + 7§x − 1}} = {{7§x − 1}} + 2 → 심장은 (1, 2)\n**2. 직선 관통 매칭** 두 직선은 그래프를 반으로 접는 거울선이므로 반드시 심장 (1, 2)를 지나야 합니다.\n**3. 정산** 2 = 1 + a → a = 1, 2 = −1 + b → b = 3 → a + b = 4", "ck": ["심장 좌표 추출", "직선 관통 매칭", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "유리함수 f(x) = {{ax + 1§2x − c}}의 그래프의 ==점근선==의 방정식이 x = 2, y = 1일 때, 상수 a, c의 합 a + c의 값을 구하시오.", "x": null, "s": "**1. 자석 바리케이드 역추적** 점근선이 x = 2, y = 1이라는 말은 심장이 (2, 1)이라는 뜻입니다.\n**2. 분모 공식 대입** 분모 2x − c가 x = 2에서 0이 되어야 하므로 4 − c = 0 → c = 4\n**3. 높이 공식 대입** x계수끼리의 비율 {{a§2}}가 수평 점근선 높이 1이 되어야 하므로 {{a§2}} = 1 → a = 2\n**4. 정산** a + c = 2 + 4 = 6", "ck": ["자석 바리케이드 역추적", "분모 공식 대입", "높이 공식 대입", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "함수 y = {{2x + 5§x + 1}}의 그래프가 점 (a, b)에 대하여 ==대칭==이고, 직선 y = x + c에 대하여 ==대칭==일 때, a + b + c의 값을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"대칭\" → 수식 변형보다 먼저 심장 좌표 (p, q)\n**2. 심장 찾기** y = {{3§x + 1}} + 2 → 점근선 x = −1, y = 2, 심장 (−1, 2) → a = −1, b = 2\n**3. 대칭축** 대칭축은 심장을 지나는 기울기 ±1 직선 → y = x + c가 (−1, 2)를 지나야 하므로 c = 3\n**4. 정산** a + b + c = −1 + 2 + 3 = 4\n**정답: 4**", "ck": ["신호 문장 찾기", "심장 찾기", "대칭축", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "함수 f(x) = {{k§x}} (k > 0) 위의 임의의 점 P에서 두 점근선에 내린 수선의 발을 각각 Q, R이라 할 때, 직사각형 OQPR의 넓이를 구하고, 선분 PQ와 PR의 길이의 합의 ==최솟값==을 k에 관한 식으로 나타내시오. (단, 점 P는 제1사분면 위의 점)", "x": null, "s": "**1. 유리함수 본질 해석** 기본형의 두 점근선은 x축과 y축입니다. 점 P를 (a, {{k§a}})로 둡니다.\n**2. 넓이 문맥 독해** 넓이는 가로 a × 세로 {{k§a}}이므로 a가 약분되어 항상 k입니다.\n**3. 길이 합 최솟값 (절대부등식)** a + {{k§a}} ≥ 2√{a × {{k§a}}} = 2√{k}", "ck": ["유리함수 본질 해석", "넓이 문맥 독해", "길이 합 최솟값 (절대부등식)"], "src": "수능 기출 연계", "ex": 1}, {"l": 1, "t": "self", "q": "유리함수 y = {{x + 3§x − 2}}의 수직 점근선과 수평 점근선의 방정식을 각각 구하시오.", "x": null, "s": "**정답: 수직 점근선 x = 2, 수평 점근선 y = 1**\n**신호 읽기**: \"점근선\"은 그래프가 다가가기만 하고 닿지 못하는 자석 벽 두 개를 찾으라는 신호입니다.\n**상황 번역**: 세로 벽은 분모가 0이 되는 곳(0으로 나눌 수 없어 그래프가 갈 수 없는 곳), 가로 벽은 x가 아주 커질 때 y가 다가가는 높이입니다.\n**풀이**: 분모 x − 2 = 0 → 세로 벽 x = 2. y = {{x + 3§x − 2}} = 1 + {{5§x − 2}}로 바꾸면 x가 커질수록 {{5§x − 2}}가 0에 가까워지므로 가로 벽 y = 1\n**함정**: 가로 벽은 분자·분모의 x 계수의 비 {{1§1}}로 빨리 읽을 수 있지만, 식을 {{k§x − p}} + q 꼴로 바꾸는 방법을 함께 알아 두면 다른 문제에도 씁니다.", "src": "변형 1"}, {"l": 1, "t": "mc", "q": "함수 y = {{2x − 1§x + 1}}의 그래프가 어떤 점에 대하여 대칭인지 그 심장 좌표를 구하시오.", "x": ["(−1, 2)", "(1, 2)", "(−1, −1)", "(2, −1)", "(1, −2)"], "s": "**신호 읽기**: \"어떤 점에 대하여 대칭\"은 두 자석 벽이 만나는 심장(점근선의 교점)을 찾으라는 신호입니다.\n**상황 번역**: 유리함수의 두 가지는 심장을 중심으로 180° 돌리면 서로 겹칩니다.\n**풀이**: 세로 벽 x = −1(분모 0), 가로 벽 y = {{2§1}} = 2 → 심장 (−1, 2)\n**함정**: 분모 x + 1 = 0에서 x = −1입니다. 부호를 그대로 옮겨 x = 1로 쓰는 실수가 흔합니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "유리함수 y = {{ax + b§x + c}}의 점근선이 x = 1, y = 3일 때, 상수 a, c의 값은?", "x": ["a = 3, c = −1", "a = 3, c = 1", "a = 1, c = −3", "a = −3, c = 1", "a = 1, c = 3"], "s": "**신호 읽기**: 점근선이 주어지고 계수를 묻는 문제는 1번의 읽기를 거꾸로 하는 것입니다.\n**상황 번역**: 세로 벽 x = 1 → 분모가 x = 1에서 0. 가로 벽 y = 3 → x 계수의 비가 3\n**풀이**: 1 + c = 0 → c = −1. {{a§1}} = 3 → a = 3\n**함정**: b는 점근선을 정하지 않습니다(그래프의 휘어진 정도만 바꿈). 그래서 이 문제에서는 b를 구할 수 없고, 묻지도 않았습니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "유리함수의 곡선이 점근선과 만날 수 없는 이유를 대수학적 법칙으로 서술하시오.", "x": null, "s": "**정답: y = {{k§x − p}} + q (k ≠ 0)에서 x = p이면 분모가 0이 되어 함숫값이 정의되지 않으므로 그래프는 세로 벽 x = p에 닿을 수 없다. 또 k ≠ 0이므로 {{k§x − p}}는 결코 0이 될 수 없어 y는 q가 될 수 없다. 그래서 가로 벽 y = q에도 닿을 수 없다.**\n**신호 읽기**: \"대수학적 법칙으로 서술\"은 '0으로 나눌 수 없다'와 '0이 아닌 수를 나눈 값은 0이 아니다'라는 두 규칙을 쓰라는 신호입니다.\n**상황 번역**: 자석이 밀어내는 힘의 정체가 바로 이 두 규칙입니다.\n**풀이**: 세로 벽과 가로 벽을 각각 한 문장씩 나누어 설명하면 완성됩니다.\n**함정**: \"그래프를 보면 안 만난다\"는 관찰이지 이유가 아닙니다. 식의 규칙으로 설명해야 합니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "함수 y = {{x + 4§x − 1}}의 그래프를 평행이동하여 y = {{k§x}}와 겹치게 할 때, 상수 k의 값은?", "x": "k = 5|k=5|5", "s": "**신호 읽기**: \"평행이동하여 y = {{k§x}}와 겹치게\"는 식을 표준형 {{k§x − p}} + q로 바꾸라는 신호입니다.\n**상황 번역**: 평행이동은 심장의 위치만 옮기고 모양(휘어진 정도 k)은 바꾸지 못합니다.\n**풀이**: {{x + 4§x − 1}} = {{(x − 1) + 5§x − 1}} = 1 + {{5§x − 1}} → k = 5\n**함정**: 분자를 '분모 + 나머지'로 쪼개는 것이 핵심입니다. x + 4 = (x − 1) + 5처럼 분모를 일부러 만들어 냅니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "유리함
