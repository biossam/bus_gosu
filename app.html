수 y = {{4x − 2§x − 3}}의 그래프가 직선 y = −x + b에 대하여 대칭일 때, 상수 b의 값은?", "x": "b = 7|b=7|7", "s": "**신호 읽기**: \"직선에 대하여 대칭\"은 그 직선이 심장을 지나야 한다는 신호입니다. 유리함수의 대칭축은 심장을 지나는 기울기 ± 1인 두 직선입니다.\n**상황 번역**: 심장은 세로 벽 x = 3, 가로 벽 y = {{4§1}} = 4 → (3, 4)\n**풀이**: y = −x + b에 (3, 4) 대입 → 4 = −3 + b → b = 7\n**함정**: 대칭축의 기울기가 − 1이라는 조건은 문제에 이미 있으므로, 남은 일은 심장을 지나게 하는 것뿐입니다.", "src": "변형 6"}, {"l": 2, "t": "mc", "q": "함수 y = {{x§x − 2}} 위의 제1사분면의 점 P에서 두 점근선에 내린 수선의 길이의 합의 최솟값은?", "x": ["2√{2}", "2", "4", "√{2}", "2√{3}"], "s": "**신호 읽기**: \"두 점근선에 내린 수선의 길이의 합의 최솟값\"은 곱이 일정한 두 양수의 합 → 절대부등식(유형 5)의 신호입니다.\n**상황 번역**: y = {{x§x − 2}} = 1 + {{2§x − 2}}. 심장 (2, 1)에서 오른쪽으로 a만큼 간 점 P(2 + a, 1 + {{2§a}})를 잡으면, 세로 벽까지 거리는 a, 가로 벽까지 거리는 {{2§a}}입니다. 두 거리의 곱은 항상 k = 2로 일정합니다.\n**풀이**: a + {{2§a}} ≥ 2√{a × {{2§a}}} = 2√{2}, 등호는 a = √{2}일 때\n**함정**: 점 P를 (x, y)로 두고 계산하면 식이 복잡해집니다. 심장에서 얼마나 떨어졌는지(a)로 두는 것이 핵심입니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "두 유리함수 y = {{x + 1§x − 1}}과 y = {{2x + 3§x − 2}}의 점근선들로 둘러싸인 도형의 넓이를 구하시오.", "x": "1|1개|1가지", "s": "**신호 읽기**: [고난도] \"점근선들로 둘러싸인 도형\"은 네 개의 자석 벽을 그리라는 신호입니다.\n**상황 번역**: 첫 함수의 벽 x = 1, y = 1, 둘째 함수의 벽 x = 2, y = 2. 세로 벽 두 개와 가로 벽 두 개가 사각형을 만듭니다.\n**풀이**: 가로 길이 2 − 1 = 1, 세로 길이 2 − 1 = 1 → 넓이 1\n**함정**: 둘째 함수 {{2x + 3§x − 2}}의 가로 벽은 x 계수의 비 {{2§1}} = 2입니다. 상수항 3을 쓰지 않습니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "유리함수의 대칭축의 기울기가 항상 1 또는 − 1인 본질적 이유를 기하학적으로 서술하시오.", "x": null, "s": "**정답: 기본형 y = {{k§x}}의 그래프는 x와 y를 바꾸어도(y = x에 비춰도) 같은 식이 되고, x를 −x로, y를 −y로 동시에 바꾸어도(y = −x에 비춰도) 같은 식이 되므로 두 직선 y = x, y = −x에 대하여 대칭이다. 평행이동은 그래프의 모양과 기울기를 바꾸지 않으므로 대칭축도 기울기 1, − 1을 그대로 유지한 채 심장으로 옮겨 간다.**\n**신호 읽기**: '본질적 이유'는 기본형에서의 성질 + 평행이동이 보존하는 것, 두 단계로 씁니다.\n**상황 번역**: 모든 유리함수는 y = {{k§x}}를 심장까지 미끄러뜨려 옮긴 것입니다.\n**풀이**: 기본형에서 대칭인 이유를 식으로 한 줄, 평행이동이 기울기를 보존한다는 점을 한 줄 씁니다.\n**함정**: \"원래 그렇다\"가 아니라, 기본형에서 x, y를 바꿔도 식이 같다는 확인이 근거입니다.", "src": "변형 9"}, {"l": 3, "t": "mc", "q": "함수 y = {{3x + 1§x − 1}}의 그래프가 지나지 않는 사분면을 점근선과 y절편 문맥으로 판정하시오.", "x": ["없음 (네 사분면을 모두 지난다)", "제1사분면", "제2사분면", "제3사분면", "제4사분면"], "s": "**신호 읽기**: \"지나지 않는 사분면\"은 심장 위치 + 두 절편으로 그래프의 대략적인 모양을 그리라는 신호입니다.\n**상황 번역**: y = {{3x + 1§x − 1}} = 3 + {{4§x − 1}} → 심장 (1, 3), k = 4 > 0이므로 두 가지는 심장의 오른쪽 위와 왼쪽 아래에 있습니다.\n**풀이**: 오른쪽 가지(x > 1)는 y > 3 → 제1사분면. 왼쪽 가지는 x → − ∞일 때 3 아래에서 출발해 x절편 −{{1§3}}, y절편 − 1을 지나 아래로 내려갑니다. x < −{{1§3}}에서 y > 0(제2사분면), −{{1§3}} < x < 0에서 y < 0(제3사분면), 0 < x < 1에서 y < 0(제4사분면)\n**함정**: 심장만 보고 판단하면 틀리기 쉽습니다. 왼쪽 가지가 축을 어디서 가로지르는지(절편)를 반드시 확인합니다.", "src": "변형 10"}]}, {"id": "b9", "u": "G", "ex": "2-2", "t": "9. 미사일 발사대 경계론", "color": "검정", "emoji": "⚫", "en": "Theory of Boundary Demarcation", "th": [["p", "무리함수 y = √{x}에서 근호 안은 0 이상이어야 합니다. 음수의 제곱근은 실수가 아니기 때문입니다. 그래서 그래프는 근호 안이 0이 되는 점에서 **딱 시작**하고, 그 반대쪽으로는 한 칸도 가지 않습니다. 발사대에서 쏘아 올린 미사일처럼 한 방향으로만 날아가는 반쪽 곡선입니다."], ["p", "이 반쪽 곡선과 직선의 교점을 셀 때 문제가 생깁니다. 두 식을 연립하려고 양변을 제곱하는 순간, 원래 없던 아래쪽 반쪽(근호 앞이 −인 곡선)까지 식에 들어옵니다. 이 **유령 곡선** 때문에 판별식만으로 교점을 세면 존재하지 않는 교점까지 세게 됩니다. 그래서 무리함수의 교점 문제는 판별식에만 맡기지 않고, 직선을 움직이며 교점 개수가 바뀌는 **두 개의 경계 벽**을 직접 찾습니다."], ["li", "벽 1: 직선이 발사대(시작점)를 정확히 지나는 순간. 발사대 좌표를 직선에 대입해서 구합니다. 판별식은 쓰지 않습니다."], ["li", "벽 2: 직선이 미사일 곡선에 스치듯 접하는 순간. 이때만 판별식 D = 0을 씁니다."], ["p", "두 벽 사이에서는 교점이 2개, 벽 바깥에서는 1개나 0개가 됩니다. 어느 쪽이 어느 칸인지는 그림을 그려 직선을 위아래로 움직여 보며 정합니다."], ["li", "**유사 상황 독해법**: 무리함수를 보면 먼저 ==발사대==(시작점)를 찾고, 근호 안 x 앞의 부호(좌우)와 근호 앞의 부호(상하)로 날아가는 방향을 정하세요."], ["p", "**[보충] 발사대 찾는 법**: y = √{ax + b} + c 꼴이면 근호 안을 a로 묶어 y = √{a(x + {{b§a}})} + c로 바꿉니다. 근호 안이 0이 되는 x = −{{b§a}}, 그때의 y = c가 발사대 (−{{b§a}}, c)입니다. 정의역은 근호 안이 0 이상인 x의 범위, 치역은 발사대 높이부터 날아가는 방향의 범위입니다."], ["p", "**[보충] 발사대와 방향** (a > 0)"], ["tbl", [["무리함수", "발사대(시작점)", "날아가는 방향"], ["y = √{a(x − p)} + q", "(p, q)", "오른쪽 위"], ["y = √{−a(x − p)} + q", "(p, q)", "왼쪽 위"], ["y = −√{a(x − p)} + q", "(p, q)", "오른쪽 아래"], ["y = −√{−a(x − p)} + q", "(p, q)", "왼쪽 아래"]]], ["p", "**[보충] 신호 문장**: \"==서로 다른 두 점에서 만나도록==\", \"==오직 한 점에서 만나도록==\", \"==만나지 않도록==\". 문장마다 두 벽 사이의 어느 칸을 묻는지가 다릅니다. 발사대를 지나는 순간은 교점에 포함되므로 보통 등호가 들어가고, 접하는 순간은 교점이 1개뿐이라 '두 점' 범위에서는 빠집니다."]], "sum": ["신호: \"==두 점에서 만나==\", \"==한 점에서 만나==\", \"==만나지 않==\", \"==교점==\" → **발사대(시작점)**부터", "무작정 제곱해 판별식만 쓰면 유령 곡선(반대 부호 반쪽)까지 세어 오답", "기준벽 1: 직선이 **시작점**을 지날 때 — 대입만 (교점에 포함되므로 보통 등호)", "기준벽 2: 직선이 곡선에 **접할 때** — D = 0", "방향: √ 앞 부호(위·아래) × x 앞 부호(오른쪽·왼쪽)"], "fl": [["y = √{a(x − p)} + q (a > 0)의 발사대와 방향은?", "(p, q), 오른쪽 위"], ["y = −√{−a(x − p)} + q (a > 0)의 방향은?", "왼쪽 아래"], ["무리함수와 직선의 교점 개수, 두 기준벽은?", "시작점을 지날 때(대입) · 접할 때(D = 0)"], ["제곱해서 판별식만 쓰면 왜 틀리나?", "y = −√{x} 같은 유령 곡선까지 함께 세기 때문"]], "bk": {"q": "책을 덮고 「미사일 발사대 경계론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["발사대(시작점) 찾기", "√ 앞·x 앞 부호로 방향 읽기", "기준벽 1: 시작점 대입", "기준벽 2: 접할 때 D = 0", "제곱하면 유령 곡선 주의", "두 벽 사이 어느 칸인지 + 등호 처리"]}, "pr": [{"l": 3, "t": "self", "q": "무리함수 y = √{2x − 6}의 그래프와 직선 y = x + k가 서로 다른 ==두 점에서 만나==도록 하는 실수 k의 값의 범위를 구하시오.", "x": null, "s": "**1. 발사대 고정석 포착** y = √{2(x − 3)}이므로 발사대는 (3, 0)입니다.\n**2. 경계선 1 (아래쪽 벽)** 직선이 (3, 0)을 지나는 순간: 0 = 3 + k → k = −3 (두 점 접촉이므로 등호 포함)\n**3. 경계선 2 (위쪽 벽)** 연립 후 제곱하여 판별식 D = 0을 씁니다. √{2x − 6} = x + k → x^{2} + (2k − 2)x + k^{2} + 6 = 0, {{D§4}} = (k − 1)^{2} − (k^{2} + 6) = −2k − 5 = 0 → k = −{{5§2}} (접할 때는 1점이므로 등호 제외)\n**4. 정산** −3 ≤ k < −{{5§2}}", "ck": ["발사대 고정석 포착", "경계선 1 (아래쪽 벽)", "경계선 2 (위쪽 벽)", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "무리함수 y = √{4 − 2x}의 그래프와 직선 y = −x + k가 서로 다른 ==두 점에서 만나==도록 하는 실수 k의 값의 범위를 구하시오.", "x": null, "s": "**1. 발사대 방향 독해** y = √{−2(x − 2)}이므로 발사대 (2, 0)에서 왼쪽 위로 날아가는 미사일입니다.\n**2. 경계 1 (시작점 대입)** 0 = −2 + k → k = 2 (등호 포함)\n**3. 경계 2 (접할 때)** 연립 후 제곱하면 x^{2} − 2(k − 1)x + k^{2} − 4 = 0, {{D§4}} = (k − 1)^{2} − (k^{2} − 4) = −2k + 5 = 0 → k = {{5§2}} (등호 제외)\n**4. 정산** 접할 때(2.5)보다 낮고 시작점(2)과 같거나 높아야 두 번 만납니다 → 2 ≤ k < {{5§2}}", "ck": ["발사대 방향 독해", "경계 1 (시작점 대입)", "경계 2 (접할 때)", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "함수 y = √{2x − 4}의 그래프와 직선 y = x + k가 ==서로 다른 두 점에서 만나==도록 하는 실수 k의 값의 범위를 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"서로 다른 두 점에서 만나\" → 발사대(시작점)부터 찾습니다.\n**2. 기준벽 1: 발사대** 시작점 (2, 0)을 지날 때 0 = 2 + k → k = −2 (이때 x = 2, 4에서 두 점)\n**3. 기준벽 2: 접할 때** (x + k)^{2} = 2x − 4 → x^{2} + (2k − 2)x + k^{2} + 4 = 0, {{D§4}} = −2k − 3 = 0 → k = −{{3§2}}\n**4. 정산** 두 벽 사이(발사대 포함, 접선 제외) → −2 ≤ k < −{{3§2}}\n**정답: −2 ≤ k < −{{3§2}}**", "ck": ["신호 문장 찾기", "기준벽 1: 발사대", "기준벽 2: 접할 때", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "무리함수 y = √{x}의 그래프 위의 점 P와 직선 y = x + 4 사이의 거리의 ==최솟값==을 구하시오.", "x": null, "s": "**1. 거리의 최솟값 문맥 독해** 직선 y = x + 4를 평행이동시켜 곡선과 처음으로 스치듯 접하는 순간(D = 0)을 찾습니다.\n**2. 접선 공식 매칭** √{x} = x + m ⇒ x^{2} + (2m − 1)x + m^{2} = 0\n**3. 정산** D = (2m − 1)^{2} − 4m^{2} = −4m + 1 = 0 ⇒ m = {{1§4}}. 평행한 두 직선 y = x + 4와 y = x + {{1§4}} 사이의 거리는 {{| 4 − {{1§4}} |§√{1^{2} + (−1)^{2}}}} = {{15√{2}§8}}", "ck": ["거리의 최솟값 문맥 독해", "접선 공식 매칭", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 1, "t": "mc", "q": "무리함수 y = √{x + 2}의 발사대(시작점) 좌표를 구하시오.", "x": ["(−2, 0)", "(2, 0)", "(0, −2)", "(0, 2)", "(−2, 2)"], "s": "**신호 읽기**: \"발사대(시작점)\"는 루트 안이 0이 되는 점입니다. 루트 안은 음수가 될 수 없으므로 그래프는 여기서 시작합니다.\n**상황 번역**: x + 2 = 0일 때 미사일이 발사대를 떠납니다.\n**풀이**: x = −2, 그때 y = √{0} = 0 → (−2, 0)\n**함정**: 발사대의 y좌표는 루트 밖에 더해진 수입니다. 이 문제는 더해진 수가 없으므로 0입니다.", "src": "변형 1"}, {"l": 1, "t": "self", "q": "함수 y = √{3 − x}의 미사일 발사 방향을 사분면 문맥으로 설명하시오.", "x": null, "s": "**정답: 발사대 (3, 0)에서 왼쪽 위로 날아간다. 그래프는 제1사분면(0 < x < 3)과 제2사분면(x < 0)을 지난다.**\n**신호 읽기**: 루트 안 x 앞의 부호와 루트 앞의 부호가 미사일의 방향을 정합니다.\n**상황 번역**: 루트 안이 3 − x ≥ 0이려면 x ≤ 3 → 발사대에서 왼쪽으로만 갈 수 있습니다. 루트 앞이 +이므로 y ≥ 0 → 위로 날아갑니다.\n**풀이**: 발사대 (3, 0)에서 왼쪽 위로 뻗으며, x가 3에서 0까지는 제1사분면, 0보다 작아지면 제2사분면을 지납니다.\n**함정**: \"−x이니까 아래로\"라고 착각하기 쉽습니다. 루트 '안'의 부호는 좌우를, 루트 '밖'의 부호는 상하를 정합니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "무리함수 y = √{x}의 그래프와 직선 y = k가 만나는 교점의 개수가 k의 값에 따라 어떻게 달라지는지 말하시오.", "x": ["k ≥ 0이면 1개, k < 0이면 0개", "항상 1개", "항상 2개", "k > 0이면 2개, k ≤ 0이면 0개", "k의 값에 관계없이 0개"], "s": "**신호 읽기**: 가로선 y = k와 무리함수의 교점은 미사일이 날아가는 높이 범위를 보면 바로 나옵니다.\n**상황 번역**: y = √{x}는 원점에서 출발해 오른쪽 위로 끝없이 올라가므로 높이 0 이상의 모든 값을 정확히 한 번씩 지납니다.\n**풀이**: k ≥ 0이면 교점 1개(x = k^{2}), k < 0이면 미사일이 그 높이로 내려가지 않으므로 0개\n**함정**: k = 0일 때 발사대 한 점에서 만나는 것도 교점 1개입니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "기계적으로 무리함수에 판별식만 쓰면 생기는 '유령 곡선의 저주(오답)'에 대해 서술하시오.", "x": null, "s": "**정답: 무리함수와 직선을 연립하며 양변을 제곱하면, 원래 그래프 y = √{x}에 아래쪽 반쪽 y = −√{x}(유령 곡선)까지 붙은 포물선 y^{2} = x와 직선의 교점을 세게 된다. 그래서 판별식만으로 센 교점 개수에는 실제로 존재하지 않는 유령 쪽 교점이 섞여 답이 틀릴 수 있다.**\n**신호 읽기**: 판별식의 한계를 묻는 서술형은 '제곱이 무엇을 바꾸는가'를 중심으로 씁니다.\n**상황 번역**: 무리함수는 발사대에서 한 방향으로만 날아가는 반쪽 곡선인데, 제곱하면 양쪽으로 날아가는 온전한 포물선이 됩니다.\n**풀이**: 그래서 판별식은 '접하는 순간' 하나만 찾는 데 쓰고, 교점 개수는 발사대 위치와 그림으로 판정해야 한다는 결론까지 씁니다.\n**함정**: \"제곱하면 틀린다\"만 쓰면 부족합니다. 어떤 곡선이 추가되는지(유령 곡선)를 구체적으로 씁니다.", "src": "변형 4"}, {"l": 2, "t": "mc", "q": "y = √{2x}와 y = x + k가 접할 때의 k값을 판별식 필터로 구하시오.", "x": ["k = {{1§2}}", "k = 1", "k = 2", "k = {{1§4}}", "k = −{{1§2}}"], "s": "**신호 읽기**: \"접할 때\"는 판별식 필터를 쓰는 유일한 순간입니다.\n**상황 번역**: 접하는 경우는 유령 곡선과 상관없이 오른쪽 위 미사일 위에서 일어나므로 판별식을 써도 됩니다.\n**풀이**: √{2x} = x + k → 2x = (x + k)^{2} → x^{2} + (2k − 2)x + k^{2} = 0. {{D§4}} = (k − 1)^{2} − k^{2} = −2k + 1 = 0 → k = {{1§2}}\n**함정**: 구한 접점이 진짜 미사일 위에 있는지 확인합니다. k = {{1§2}}이면 x = {{1§2}}, y = 1 > 0이므로 진짜 곡선 위입니다.", "src": "변형 5"}, {"l": 2, "t": "mc", "q": "무리함수 y = √{x − 3}의 그래프와 직선 y = x + k가 만나지 않기 위한 k의 범위를 구하시오.", "x": ["k > −{{11§4}}", "k < −{{11§4}}", "k > −3", "k ≥ −{{11§4}}", "k < −3"], "s": "**신호 읽기**: \"만나지 않기 위한\" 조건은 직선을 아래에서 위로 움직이며 교점 개수가 바뀌는 경계(벽) 두 개를 찾으라는 신호입니다.\n**상황 번역**: 벽 1 = 직선이 발사대 (3, 0)을 지날 때, 벽 2 = 직선이 미사일에 접할 때\n**풀이**: 벽 1: 0 = 3 + k → k = −3. 벽 2: x − 3 = (x + k)^{2} → x^{2} + (2k − 1)x + k^{2} + 3 = 0, D = (2k − 1)^{2} − 4(k^{2} + 3) = −4k − 11 = 0 → k = −{{11§4}}. 직선을 올리면 k < −3: 1번, −3 ≤ k < −{{11§4}}: 2번, k = −{{11§4}}: 1번(접함), k > −{{11§4}}: 0번\n**함정**: − 3과 −{{11§4}} = −2.75의 크기 순서를 정확히 비교해야 벽의 순서가 맞습니다.", "src": "변형 6"}, {"l": 2, "t": "mc", "q": "함수 y = √{2x − 4}의 그래프와 직선 y = kx가 오직 한 점에서만 만나도록 하는 k의 값을 모두 구하시오.", "x": ["k = 0 또는 k = {{1§2}}", "k = {{1§2}}", "k = 0", "0 ≤ k < {{1§2}}", "k = 1"], "s": "**신호 읽기**: 원점을 지나는 직선 y = kx를 회전시키며 교점 개수를 보는 문제입니다. 회전의 벽은 '발사대를 지날 때'와 '접할 때'입니다.\n**상황 번역**: 발사대는 (2, 0)이고 미사일은 오른쪽 위로 날아갑니다. 원점에서 발사대를 지나는 직선은 y = 0(기울기 0)입니다.\n**풀이**: 접할 때: 2x − 4 = k^{2}x^{2} → k^{2}x^{2} − 2x + 4 = 0, {{D§4}} = 1 − 4k^{2} = 0 → k = {{1§2}} (k > 0). 회전해 보면 k < 0: 0개, k = 0: 발사대 1개, 0 < k < {{1§2}}: 2개, k = {{1§2}}: 1개, k > {{1§2}}: 0개 → 한 점에서만 만나는 것은 k = 0, {{1§2}}\n**함정**: 판별식만 쓰면 k = −{{1§2}}도 나오지만, 기울기가 음수인 직선은 오른쪽 위 미사일과 만나지 않는 유령 쪽 접선입니다.", "src": "변형 7"}, {"l": 3, "t": "mc", "q": "무리함수 y = −√{x + 1} (아래로 날아가는 미사일)과 직선 y = −x + k가 서로 다른 두 점에서 만나기 위한 k의 범위를 구하시오.", "x": ["−{{5§4}} < k ≤ −1", "−{{5§4}} ≤ k ≤ −1", "k > −{{5§4}}", "−1 ≤ k < 0", "k < −1"], "s": "**신호 읽기**: [고난도] 루트 앞이 −이므로 미사일은 발사대 (−1, 0)에서 오른쪽 아래로 떨어집니다. 기울기 − 1인 직선을 위아래로 움직이며 벽을 찾습니다.\n**상황 번역**: 벽 1 = 발사대를 지날 때, 벽 2 = 접할 때. 두 번 만나는 구간은 두 벽 사이입니다.\n**풀이**: 벽 1: 0 = 1 + k → k = −1. 벽 2: −√{x + 1} = −x + k → √{x + 1} = x − k. u = √{x + 1} (u ≥ 0)로 두면 x = u^{2} − 1이고 u = u^{2} − 1 − k → u^{2} − u − (1 + k) = 0. 두 근이 모두 u ≥ 0이어야 두 교점: 판별식 1 + 4(1 + k) > 0 → k > −{{5§4}}, 두 근의 곱 −(1 + k) ≥ 0 → k ≤ −1 → −{{5§4}} < k ≤ −1\n**함정**: 발사대를 지나는 경우(k = −1)도 발사대 한 점 + 다른 한 점으로 두 번 만나므로 등호가 들어갑니다. 접할 때(k = −{{5§4}})는 한 번이라 빠집니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "두 식을 연립하여 제곱할 때, 원래는 없던 가짜 근이 추가되는 이유를 부호의 관점에서 설명하시오.", "x": null, "s": "**정답: 제곱하면 y = √{x}와 y = −√{x}가 모두 y^{2} = x라는 하나의 식이 된다. 원래 식에 있던 'y ≥ 0'이라는 부호 조건이 제곱으로 사라지므로, 음수 쪽 곡선 위의 점도 해로 들어와 가짜 근이 생긴다.**\n**신호 읽기**: '부호의 관점'을 지정했으므로 제곱이 부호 정보를 지운다는 점을 중심으로 씁니다.\n**상황 번역**: 3^{2} = 9, (−3)^{2} = 9처럼 제곱하면 +와 −가 같은 결과가 되어 구별할 수 없습니다.\n**풀이**: 그래서 제곱한 식으로 구한 근은 원래 식에 넣어 √{}의 값이 음수가 되지 않는지 확인해야 한다는 처방까지 쓰면 완성입니다.\n**함정**: '가짜 근'이 왜 생기는지(부호 정보 소실)와 어떻게 거르는지(대입 확인)를 함께 써야 합니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "무리함수 y = √{x − 2} + 1의 역함수를 구하고, 역함수의 '정의역 제한 조건'을 본체와 비교하여 서술하시오.", "x": null, "s": "**정답: 역함수 y = (x − 1)^{2} + 2 (x ≥ 1). 본체의 치역 y ≥ 1이 역함수의 정의역 x ≥ 1이 된다.**\n**신호 읽기**: 무리함수의 역함수는 '이차함수의 반쪽'입니다. 정의역 제한을 반드시 함께 써야 합니다.\n**상황 번역**: 본체는 발사대 (2, 1)에서 오른쪽 위로 날아가므로 정의역 x ≥ 2, 치역 y ≥ 1. 역함수는 화살표를 되감는 것이므로 정의역과 치역이 서로 자리를 바꿉니다.\n**풀이**: y = √{x − 2} + 1에서 x와 y를 바꾸면 x = √{y − 2} + 1 → x − 1 = √{y − 2} → 양변 제곱 y = (x − 1)^{2} + 2. 이때 x − 1 = √{} ≥ 0이므로 x ≥ 1\n**함정**: (x ≥ 1)을 빼면 포물선 전체가 되어 역함수가 아닙니다. 제곱하기 직전의 '루트는 0 이상' 조건이 정의역 제한이 됩니다.", "src": "변형 10"}]}, {"id": "p1", "u": "H", "ex": "PS", "t": "1. 쌍둥이 지우개론", "color": "빨강", "emoji": "🔴", "en": "Theory of the Twin Eraser", "th": [["p", "공통수학1의 순열은 '서로 다른 n명 중 r명을 뽑아 줄 세우기'였습니다. 확률과 통계에서는 이 규칙이 두 방향으로 풀립니다. 첫째, **같은 것을 또 뽑아도 되는 경우(중복순열)**입니다. 비밀번호의 각 자리에 0부터 9까지 아무 숫자나 다시 쓸 수 있듯이, r개의 자리마다 n개의 선택지가 매번 그대로 남아 있으므로 _{n}Π_{r} = n^{r}입니다."], ["p", "둘째, **줄 세울 대상 중에 똑같이 생긴 쌍둥이가 섞인 경우(같은 것이 있는 순열)**입니다. 일단 쌍둥이에게 이름표를 붙여 모두 다르다고 생각하고 n!가지로 줄을 세웁니다. 그런데 이름표를 떼면 쌍둥이끼리 자리를 바꾼 배열은 사진상 똑같습니다. 그래서 쌍둥이끼리 자리를 바꾸는 가짓수(p!, q!, ...)로 나누어 **겹친 사진을 지우개로 지웁니다**: {{n!§p! q!⋯}}"], ["li", "**유사 상황 독해법**: \"==중복을 허락하여==\", \"==서로 다른 상자에 넣는==\"은 중복순열, \"==같은 문자가 있는==\", \"==최단 경로==\"는 같은 것이 있는 순열 신호입니다."], ["p", "**[보충] 상황별 도구표**"], ["tbl", [["신호 문장", "상황", "도구"], ["\"중복을 허락하여 r개를 택해 일렬로\"", "자리마다 선택지 n개", "_{n}Π_{r} = n^{r}"], ["\"서로 다른 공 r개를 서로 다른 상자 n개에\"", "공마다 상자 고르기", "n^{r}"], ["\"X에서 Y로의 함수의 개수\" (n(X) = r, n(Y) = n)", "원소마다 화살표 고르기", "n^{r}"], ["\"같은 문자 p개, q개가 있는 n개를 일렬로\"", "쌍둥이 지우기", "{{n!§p! q!}}"], ["\"바둑판 도로의 최단 경로\"", "→와 ↑를 나열", "{{(→ 개수 + ↑ 개수)!§(→ 개수)! (↑ 개수)!}}"]]], ["p", "**[보충] 함정 자리 두 곳**: ① 숫자로 자연수를 만들 때 맨 앞자리에는 0이 올 수 없습니다. 그래서 맨 앞자리의 선택지를 먼저 세고, 나머지 자리를 셉니다. ② \"빈 상자가 없도록\"처럼 모든 상자를 채우라는 조건이 붙으면 n^{r}을 그대로 쓸 수 없습니다. 공을 상자별로 몇 개씩 나눌지(예: 2개, 1개, 1개)를 먼저 정하고, 그 나눔마다 경우의 수를 세어 더합니다."]], "sum": ["신호: \"중복을 허락하여\", \"같은 문자\", \"최단 경로\" → **n^{r}, {{n!§p! q!}}**", "**유사 상황 독해법**: \"==중복을 허락하여==\", \"==서로 다른 상자에 넣는==\"은 중복순열, \"==같은 문자가 있는==\", \"==최단 경로==\"는 같은 것이 있는 순열 신호입니다."], "fl": [["\"중복을 허락하여\", \"같은 문자\", \"최단 경로\" — 이 신호를 보면 꺼낼 도구는?", "n^{r}, {{n!§p! q!}}"], ["신호 문장: \"중복을 허락하여 r개를 택해 일렬로\" → 상황 / 도구?", "자리마다 선택지 n개 / _{n}Π_{r} = n^{r}"], ["신호 문장: \"서로 다른 공 r개를 서로 다른 상자 n개에\" → 상황 / 도구?", "공마다 상자 고르기 / n^{r}"], ["신호 문장: \"X에서 Y로의 함수의 개수\" (n(X) = r, n(Y) = n) → 상황 / 도구?", "원소마다 화살표 고르기 / n^{r}"], ["신호 문장: \"같은 문자 p개, q개가 있는 n개를 일렬로\" → 상황 / 도구?", "쌍둥이 지우기 / {{n!§p! q!}}"]], "bk": {"q": "책을 덮고 「쌍둥이 지우개론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"중복을 허락하여\", \"같은 문자\", \"최단 경로\"", "꺼낼 도구: n^{r}, {{n!§p! q!}}", "유사 상황 독해법", "조건 자리 먼저", "나머지 자리", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "숫자 1, 2, 3, 4 중에서 ==중복을 허락하여== 세 개를 택해 만들 수 있는 세 자리 자연수 중 홀수의 개수를 구하시오.", "x": null, "s": "**1. 조건 자리 먼저** 홀수가 되려면 일의 자리가 1 또는 3이어야 합니다 → 2가지\n**2. 나머지 자리** 백의 자리와 십의 자리는 중복을 허락하므로 각각 4가지 → 4^{2} = 16\n**3. 정산** 16 × 2 = 32", "ck": ["조건 자리 먼저", "나머지 자리", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "여섯 개의 문자 a, a, a, b, b, c를 ==모두 일렬로 나열==하는 경우의 수를 구하시오.", "x": null, "s": "**1. 이름표 붙이기** 모두 다르다고 보면 6! = 720가지입니다.\n**2. 쌍둥이 지우기** a끼리 바꾸는 3!가지, b끼리 바꾸는 2!가지는 같은 배열입니다.\n**3. 정산** {{6!§3! 2!}} = 60", "ck": ["이름표 붙이기", "쌍둥이 지우기", "정산"], "src": "분당 기출", "ex": 1}, {"l": 3, "t": "self", "q": "가로 방향으로 4칸, 세로 방향으로 3칸인 바둑판 모양의 도로가 있다. 왼쪽 아래 끝 A에서 오른쪽 위 끝 B까지 가는 ==최단 경로== 중, A에서 오른쪽으로 2칸, 위로 1칸 간 지점 P를 지나는 경로의 수를 구하시오.", "x": null, "s": "**1. 경로를 문자로 번역** 최단 경로는 → 4개와 ↑ 3개를 나열하는 것입니다.\n**2. 두 구간으로 끊기** A → P: → 2개, ↑ 1개 → {{3!§2! 1!}} = 3. P → B: → 2개, ↑ 2개 → {{4!§2! 2!}} = 6\n**3. 정산** 3 × 6 = 18", "ck": ["경로를 문자로 번역", "두 구간으로 끊기", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 3, "t": "self", "q": "여섯 개의 숫자 1, 1, 2, 2, 2, 3을 모두 사용하여 만들 수 있는 여섯 자리 자연수 중 ==양 끝의 숫자가 모두 2==인 것의 개수를 구하시오.", "x": null, "s": "**1. 고정석 배치** 양 끝에 2를 하나씩 놓으면 남은 숫자는 1, 1, 2, 3입니다.\n**2. 가운데 네 자리 나열** 1이 2개 있는 네 숫자의 나열 → {{4!§2!}} = 12\n**3. 정산** 12", "ck": ["고정석 배치", "가운데 네 자리 나열", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "sa", "q": "_{4}Π_{2}의 값을 구하시오.", "x": "16|16개|16가지", "s": "**신호 읽기**: _{n}Π_{r}은 \"서로 다른 n개에서 중복을 허락하여 r개를 택해 일렬로\" 세운 수입니다.\n**상황 번역**: _{4}Π_{2}는 자리 2개마다 선택지 4개가 매번 그대로 남아 있는 비밀번호 장면입니다.\n**풀이**: 4 × 4 = 4^{2} = 16\n**함정**: _{4}P_{2} = 12와 헷갈리지 않습니다. 중복을 허락하면 둘째 자리의 선택지가 줄지 않습니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "서로 다른 편지 3통을 서로 다른 우체통 4개에 넣는 경우의 수를 구하시오. (빈 우체통이 있어도 된다.)", "x": "64|64개|64가지", "s": "**신호 읽기**: \"서로 다른 편지를 서로 다른 우체통에\" + \"빈 우체통이 있어도 된다\" → 편지마다 우체통을 고르는 중복순열입니다.\n**상황 번역**: 편지 한 통이 우체통 하나를 고르고, 다음 편지도 같은 우체통을 또 골라도 됩니다. 고르는 주체는 편지(3통), 선택지는 우체통(4개)입니다.\n**풀이**: 4 × 4 × 4 = 4^{3} = 64\n**함정**: 3^{4}로 쓰는 실수가 많습니다. '누가 고르는가(지수)'와 '무엇 중에서 고르는가(밑)'를 먼저 정합니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "숫자 0, 1, 2 중에서 중복을 허락하여 만들 수 있는 네 자리 자연수의 개수를 구하시오.", "x": "54|54개|54가지", "s": "**신호 읽기**: \"중복을 허락하여\" + \"네 자리 자연수\" → 중복순열 + [보충]의 함정 자리(맨 앞 0 불가)\n**상황 번역**: 맨 앞자리는 0이 올 수 없으므로 1, 2의 2가지. 나머지 세 자리는 0, 1, 2 중 아무거나 3가지씩\n**풀이**: 2 × 3 × 3 × 3 = 54\n**함정**: 전체 3^{4} = 81에서 맨 앞이 0인 3^{3} = 27을 빼도 54로 같습니다. 두 방법으로 검산합니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "영어 단어 banana의 6개 문자를 모두 일렬로 나열하는 경우의 수를 구하시오.", "x": "60|60개|60가지", "s": "**신호 읽기**: \"문자를 모두 일렬로\" + 같은 문자가 있음 → 같은 것이 있는 순열(쌍둥이 지우개)\n**상황 번역**: banana에는 a가 3개, n이 2개, b가 1개 있습니다. 이름표를 붙여 6!가지로 세운 뒤, a끼리 자리 바꾼 3!가지와 n끼리 자리 바꾼 2!가지가 같은 사진이므로 지웁니다.\n**풀이**: {{6!§3! 2!}} = {{720§12}} = 60\n**함정**: 1개뿐인 b는 1! = 1이라 나누지 않아도 됩니다. 같은 문자의 개수를 먼저 정확히 셉니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "다섯 개의 숫자 1, 1, 1, 2, 2를 모두 사용하여 만들 수 있는 다섯 자리 자연수의 개수를 구하시오.", "x": "10|10개|10가지", "s": "**신호 읽기**: 같은 숫자가 여러 개인 나열 → 쌍둥이 지우개\n**상황 번역**: 1이 3개, 2가 2개인 다섯 자리 나열입니다.\n**풀이**: {{5!§3! 2!}} = 10\n**함정**: 0이 없으므로 맨 앞자리 함정은 없습니다. 0이 섞여 있었다면 따로 처리해야 합니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "가로 3칸, 세로 3칸인 바둑판 모양의 도로에서 한쪽 모서리에서 대각선 반대쪽 모서리까지 가는 최단 경로의 수를 구하시오.", "x": "20|20개|20가지", "s": "**신호 읽기**: \"바둑판 도로의 최단 경로\" → →와 ↑를 나열하는 같은 것이 있는 순열입니다.\n**상황 번역**: 가로 3칸, 세로 3칸이므로 최단 경로는 → 3개와 ↑ 3개를 한 줄로 늘어놓는 방법과 같습니다.\n**풀이**: {{6!§3! 3!}} = 20\n**함정**: 최단 경로는 되돌아가는 화살표(←, ↓)를 쓰지 않습니다. 그래서 →와 ↑의 개수가 칸 수로 정해집니다.", "src": "변형 6"}, {"l": 2, "t": "sa", "q": "여섯 개의 문자 a, a, b, b, c, c를 일렬로 나열할 때, 양 끝에 같은 문자가 오는 경우의 수를 구하시오.", "x": "18|18개|18가지", "s": "**신호 읽기**: \"양 끝에 같은 문자\" → 양 끝을 고정석으로 먼저 채우고, 가운데를 쌍둥이 지우개로 셉니다.\n**상황 번역**: 양 끝에 놓을 문자를 a, b, c 중 하나 고릅니다(3가지). 그러면 가운데 네 자리에는 나머지 두 종류가 2개씩 남습니다.\n**풀이**: 가운데 나열 {{4!§2! 2!}} = 6. 3 × 6 = 18\n**함정**: 양 끝에 같은 문자 2개를 쓰고 나면 그 문자는 하나도 남지 않습니다. 남은 문자의 개수를 정확히 다시 셉니다.", "src": "변형 7"}, {"l": 3, "t": "self", "q": "같은 것이 있는 순열에서 n!을 같은 것의 개수의 계승으로 나누는 이유를 '쌍둥이 지우개' 비유로 서술하시오.", "x": null, "s": "**정답: 쌍둥이에게 이름표를 붙여 모두 다르다고 세면, 이름표를 뗐을 때 쌍둥이끼리 자리만 바꾼 배열들은 같은 사진이 된다. 한 사진이 쌍둥이끼리 자리를 바꾸는 가짓수(p!, q!, ...)만큼 겹쳐 세어졌으므로 그 수로 나누어 겹친 사진을 지운다.**\n**신호 읽기**: 나누는 이유를 묻는 서술형은 '몇 번씩 겹쳐 세었는가'를 보여 주면 됩니다.\n**상황 번역**: 예: aab에서 a_{1}a_{2}b와 a_{2}a_{1}b는 이름표를 떼면 같은 aab입니다. 한 배열이 2! = 2번씩 세어졌습니다.\n**풀이**: 그래서 {{3!§2!}} = 3(aab, aba, baa)이 됩니다. 이런 작은 예를 하나 곁들이면 서술이 완성됩니다.\n**함정**: \"같으니까 나눈다\"만 쓰면 무엇으로 나누는지 설명이 안 됩니다. '겹친 횟수 = 쌍둥이끼리 자리 바꾸는 수'를 씁니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "두 집합 X = {1, 2, 3}, Y = {a, b}에 대하여 X에서 Y로의 함수의 개수를 구하시오.", "x": "8|8개|8가지", "s": "**신호 읽기**: \"X에서 Y로의 함수의 개수\" → X의 원소마다 Y에서 화살표 도착점을 고르는 중복순열입니다.\n**상황 번역**: 고르는 주체는 X의 원소 3개, 선택지는 Y의 원소 2개. 같은 도착점을 여러 원소가 골라도 됩니다.\n**풀이**: 2 × 2 × 2 = 2^{3} = 8\n**함정**: 지수와 밑을 바꾸면 3^{2} = 9가 됩니다. 2번 문항처럼 '누가 고르는가'를 먼저 정합니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "서로 다른 공 4개를 서로 다른 상자 3개에 넣을 때, 빈 상자가 없도록 넣는 경우의 수를 구하시오.", "x": "36|36개|36가지", "s": "**신호 읽기**: [고난도] \"빈 상자가 없도록\" → [보충]의 함정 자리 ②. n^{r}을 그대로 쓸 수 없습니다.\n**상황 번역**: 공 4개를 상자 3개에 빈 상자 없이 넣으려면 공의 개수가 (2개, 1개, 1개)로 나뉘어야 합니다.\n**풀이**: ① 공 2개를 받을 상자 고르기 3가지. ② 그 상자에 넣을 공 2개 고르기 _{4}C_{2} = 6. ③ 남은 공 2개를 남은 상자 2개에 하나씩 2! = 2. 3 × 6 × 2 = 36\n**함정**: 뒷문으로도 확인할 수 있습니다. 전체 3^{4} = 81에서 빈 상자가 생기는 경우를 빼면 81 − 3 × 2^{4} + 3 × 1 = 36으로 같습니다.", "src": "변형 10"}]}, {"id": "p2", "u": "H", "ex": "PS", "t": "2. 마트 장보기와 순서 박탈론", "color": "주황", "emoji": "🟠", "en": "Theory of Deprived Choice", "th": [["p", "경우의 수 문제를 풀 때 학생들이 가장 혼란스러워하는 순열(P)과 조합(C)의 갈림길은 문장 속 부등호 단서 하나로 정리됩니다. 'x_{1} < x_{2}이면 f(x_{1}) < f(x_{2})'처럼 모든 원소의 크기 순서를 한 줄로 정해 주는 부등호가 등장하는 순간, 우리의 순서 정렬 권한(! 또는 P)은 완전히 박탈당합니다. 매장에서 어떤 원소를 뽑아 오든 큰 수는 큰 의자에, 작은 수는 작은 의자에 들어가야 한다는 규칙이 순서를 딱 한 가지로 고정해 버리기 때문입니다."], ["p", "따라서 이 문맥은 줄 세우기를 포기하고 바구니에 고르기만 하는 **[마트 장보기(조합** C**)]**가 되며, 등호(≤)까지 붙어 있다면 똑같은 상품을 바구니에 또 담아도 되는 **[중복 장보기(중복조합** H**)]**가 됩니다. 이것은 공통수학1에서 배운 장보기(조합 C)에 \"같은 상품 또 담기\"라는 규칙 하나가 더해진 장면입니다. 반대로 부등호 조건이 아예 없는 함수는 순서가 박탈되지 않으므로, 원소마다 화살표를 고르는 유형 1의 n^{r}로 셉니다. 중복조합은 상품 사이에 칸막이 막대를 꽂는 그림으로 이해할 수 있습니다. 상품 r개와 칸막이 n − 1개를 한 줄로 놓고 칸막이 자리만 고르면 되므로 _{n}H_{r} = _{n + r − 1}C_{r}입니다."], ["li", "**1:1 매칭 기호 독해법**: 부등호만 깔끔하게 있다(f(x_{1}) < f(x_{2})) → 중복 없는 조합 _{n}C_{r}. 늘어지는 등호가 묻어 있다(f(x_{1}) ≤ f(x_{2})) → 또 담아도 되는 중복조합 _{n}H_{r}"], ["p", "**[보충] 문장별 도구표**"], ["tbl", [["문장", "상황", "도구"], ["x_{1} < x_{2}이면 f(x_{1}) < f(x_{2})", "같은 상품 두 번 금지", "_{n}C_{r}"], ["x_{1} < x_{2}이면 f(x_{1}) ≤ f(x_{2})", "같은 상품 또 담기 가능", "_{n}H_{r}"], ["a + b + c = r (음이 아닌 정수)", "3종류 과자를 r개 담기", "_{3}H_{r}"], ["a + b + c = r (자연수)", "과자를 하나씩 먼저 담아 두기", "_{3}H_{r − 3}"]]], ["p", "**[보충] 고정석 먼저**: \"f(2) = 4\"처럼 값이 정해진 자리가 있으면 그 자리를 먼저 앉히고, 앞팀(작은 값)과 뒷팀(큰 값)으로 나눠 장을 본 뒤 곱합니다."]], "sum": ["신호: f(x_{1}) ≤ f(x_{2}), \"음이 아닌 정수해\" → **_{n}H_{r} = _{n + r − 1}C_{r}**", "**1:1 매칭 기호 독해법**: 부등호만 깔끔하게 있다(f(x_{1}) < f(x_{2})) → 중복 없는 조합 _{n}C_{r}. 늘어지는 등호가 묻어 있다(f(x_{1}) ≤ f(x_{2})) → 또 담아도 되는 중복조합 _{n}H_{r}"], "fl": [["f(x_{1}) ≤ f(x_{2}), \"음이 아닌 정수해\" — 이 신호를 보면 꺼낼 도구는?", "_{n}H_{r} = _{n + r − 1}C_{r}"], ["문장: x_{1} < x_{2}이면 f(x_{1}) < f(x_{2}) → 상황 / 도구?", "같은 상품 두 번 금지 / _{n}C_{r}"], ["문장: x_{1} < x_{2}이면 f(x_{1}) ≤ f(x_{2}) → 상황 / 도구?", "같은 상품 또 담기 가능 / _{n}H_{r}"], ["문장: a + b + c = r (음이 아닌 정수) → 상황 / 도구?", "3종류 과자를 r개 담기 / _{3}H_{r}"], ["문장: a + b + c = r (자연수) → 상황 / 도구?", "과자를 하나씩 먼저 담아 두기 / _{3}H_{r − 3}"]], "bk": {"q": "책을 덮고 「마트 장보기와 순서 박탈론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: f(x_{1}) ≤ f(x_{2}), \"음이 아닌 정수해\"", "꺼낼 도구: _{n}H_{r} = _{n + r − 1}C_{r}", "1:1 매칭 기호 독해법", "고정석 배치", "앞팀·뒷팀 쇼핑", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "두 집합 X = {1, 2, 3, 4}, Y = {1, 2, 3, 4, 5, 6, 7}에 대하여 다음 조건을 만족시키는 함수 f:X → Y의 개수를 구하시오. (가) x_{1} < x_{2}==이면== f(x_{1}) < f(x_{2})이다. (나) f(2) = 4이다.", "x": null, "s": "**1. 고정석 배치** f(2) = 4를 먼저 고정합니다. 등호가 없으므로 일반 장보기(C)입니다.\n**2. 앞팀·뒷팀 쇼핑** f(1)은 {1, 2, 3}에서 1개 → _{3}C_{1} = 3. f(3), f(4)는 {5, 6, 7}에서 2개 → _{3}C_{2} = 3\n**3. 정산** 3 × 3 = 9", "ck": ["고정석 배치", "앞팀·뒷팀 쇼핑", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "두 집합 X = {1, 2, 3, 4, 5}, Y = {1, 2, 3, 4, 5, 6}에 대하여 다음 조건을 만족시키는 함수 f:X → Y의 개수를 구하시오. (가) x_{1} < x_{2}==이면== f(x_{1}) ≤ f(x_{2})이다. (나) f(3) = 3이다.", "x": null, "s": "**1. 중복 필터 장착** f(3) = 3을 고정하고, 등호(≤)를 보는 순간 중복 장보기(H)로 바꿉니다.\n**2. 앞팀·뒷팀 쇼핑** f(1), f(2)는 {1, 2, 3}에서 중복 허용 2개 → _{3}H_{2} = _{4}C_{2} = 6. f(4), f(5)는 {3, 4, 5, 6}에서 중복 허용 2개 → _{4}H_{2} = _{5}C_{2} = 10\n**3. 정산** 6 × 10 = 60", "ck": ["중복 필터 장착", "앞팀·뒷팀 쇼핑", "정산"], "src": "분당 기출", "ex": 1}, {"l": 3, "t": "self", "q": "다음 조건을 만족시키는 ==음이 아닌 정수== x_{1}, x_{2}, x_{3}, x_{4}의 모든 순서쌍 (x_{1}, x_{2}, x_{3}, x_{4})의 개수를 구하시오. (가) x_{1} + x_{2} + x_{3} + x_{4} = 10 (나) x_{1} ≤ 2", "x": null, "s": "**1. 중복조합 방정식 독해** 조건 (가)는 4종류 과자를 10개 담는 중복 장보기이며 기본형은 _{4}H_{10}입니다.\n**2. 제약 조건 끊어 읽기** x_{1} = 0, 1, 2인 세 경우로 나눕니다.\n**3. 정산** x_{1} = 0: _{3}H_{10} = 66, x_{1} = 1: _{3}H_{9} = 55, x_{1} = 2: _{3}H_{8} = 45 → 66 + 55 + 45 = 166", "ck": ["중복조합 방정식 독해", "제약 조건 끊어 읽기", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 3, "t": "self", "q": "두 집합 X = {1, 2, 3}, Y = {1, 2, 3, 4, 5, 6}에 대하여 x_{1} < x_{2}==이면== f(x_{1}) ≤ f(x_{2})를 만족하는 함수 f:X → Y 중에서 ==치역의 원소가 모두 홀수==인 함수의 개수를 구하시오.", "x": null, "s": "**1. 매장 정리 필터** 살 수 있는 상품은 홀수 {1, 3, 5} 세 종류뿐입니다.\n**2. 순서 박탈 + 중복 필터** 등호(≤)가 있으므로 같은 홀수를 또 담아도 되고, 순서는 부등호가 정해 줍니다. (_{n}H_{r} 필터)\n**3. 정산** 세 종류에서 중복 허용 3개 → _{3}H_{3} = _{5}C_{3} = 10", "ck": ["매장 정리 필터", "순서 박탈 + 중복 필터", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "sa", "q": "X = {1, 2, 3}, Y = {1, 2, 3, 4, 5}일 때, 증가함수(x_{1} < x_{2} ⇒ f(x_{1}) < f(x_{2}))의 개수는?", "x": "10|10개|10가지", "s": "**신호 읽기**: \"x_{1} < x_{2} ⇒ f(x_{1}) < f(x_{2})\"(증가함수) → 등호 없는 부등호가 순서를 정해 주는 장면 → 조합 C\n**상황 번역**: 공역 Y에서 함숫값으로 쓸 수 3개를 바구니에 담기만 하면, 작은 수부터 f(1), f(2), f(3)에 자동으로 배정됩니다.\n**풀이**: 5개 중 3개 고르기 _{5}C_{3} = 10\n**함정**: 고른 세 수를 다시 줄 세우면(× 3!) 부등호 조건을 어긴 함수까지 세게 됩니다. 순서 권한은 부등호에 빼앗겼습니다.", "src": "변형 1"}, {"l": 1, "t": "self", "q": "중복조합 기호 H를 조합 기호 C로 바꾸는 공식을 적고, 칸막이 그림으로 그 이유를 설명하시오.", "x": null, "s": "**정답: _{n}H_{r} = _{n + r − 1}C_{r}**\n**신호 읽기**: 공식의 이유를 칸막이 그림으로 설명하라는 문제입니다.\n**상황 번역**: n종류 상품을 중복 허용해 r개 담는 것은, 상품 r개(○)와 종류를 나누는 칸막이 n − 1개(|)를 한 줄로 늘어놓는 것과 같습니다. 예: ○○|○| 은 첫 종류 2개, 둘째 1개, 셋째 0개\n**풀이**: 전체 n + r − 1자리 중 상품 ○가 놓일 r자리만 고르면 배열이 하나로 정해지므로 _{n + r − 1}C_{r}\n**함정**: 칸막이 개수는 종류 수보다 하나 적은 n − 1개입니다. 종류가 3개면 칸막이는 2개입니다.", "src": "변형 2"}, {"l": 1, "t": "self", "q": "부등호 단서가 '순서 배열의 자격'을 박탈하는 원리를 '컴퓨터의 자동 정렬 기능' 비유로 쓰시오.", "x": null, "s": "**정답: 장바구니에 상품을 담기만 하면, 부등호라는 정렬 규칙이 상품을 크기순으로 자동 정렬해 의자(f(1), f(2), ...)에 배치한다. 사람이 순서를 정할 여지가 1가지뿐이므로 순서를 세는 순열이 아니라 고르기만 하는 조합을 쓴다.**\n**신호 읽기**: 비유를 지정한 서술형입니다. '자동 정렬'이 무엇에 해당하는지(부등호 조건) 연결합니다.\n**상황 번역**: 컴퓨터 파일을 '이름순 정렬'로 두면 파일을 어떤 순서로 넣든 결과 목록은 하나입니다.\n**풀이**: 그래서 경우의 수는 '어떤 파일(값)을 넣을지'만으로 정해진다는 결론을 씁니다.\n**함정**: '순서가 없다'가 아니라 '순서가 하나로 정해진다'가 정확한 표현입니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "X = {1, 2, 3, 4}, Y = {1, 2, 3, 4, 5, 6}에 대하여 x_{1} < x_{2}이면 f(x_{1}) ≤ f(x_{2})를 만족하는 함수 f:X → Y의 개수는?", "x": "126|126개|126가지", "s": "**신호 읽기**: \"x_{1} < x_{2}이면 f(x_{1}) ≤ f(x_{2})\" → 등호가 묻어 있으므로 같은 값을 또 담을 수 있는 중복조합 H\n**상황 번역**: 공역 6종류 중에서 함숫값 4개를 중복 허용으로 담으면, 작은 수부터 f(1) ~ f(4)에 자동 배정됩니다.\n**풀이**: _{6}H_{4} = _{9}C_{4} = 126\n**함정**: _{n}H_{r}에서 n은 종류의 수(공역 6), r은 담을 개수(정의역 4)입니다. 바꾸어 넣으면 _{4}H_{6}가 되어 틀립니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "방정식 a + b + c = 7을 만족하는 음이 아닌 정수 a, b, c의 순서쌍의 개수를 중복조합으로 구하시오.", "x": "36|36개|36가지", "s": "**신호 읽기**: \"a + b + c = 7\" + \"음이 아닌 정수\" → 3종류 과자를 7개 담는 중복조합 ([보충] 도구표 셋째 줄)\n**상황 번역**: a, b, c는 각 과자를 몇 개 담았는지입니다. 0개도 허용됩니다.\n**풀이**: _{3}H_{7} = _{9}C_{7} = _{9}C_{2} = 36\n**함정**: _{9}C_{7}보다 _{9}C_{2}로 바꿔 계산하면 빠릅니다(_{n}C_{r} = _{n}C_{n − r}).", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "방정식 a + b + c = 7을 만족하는 자연수 a, b, c의 순서쌍의 개수를 '과자 한 개 먼저 담아 두기' 비유로 구하시오.", "x": "15|15개|15가지", "s": "**신호 읽기**: \"자연수\" 해 → 각 과자를 최소 1개씩 사야 한다는 조건 ([보충] 도구표 넷째 줄)\n**상황 번역**: a, b, c에 1개씩 먼저 담아 두면 남은 7 − 3 = 4개만 자유롭게(0개 이상) 나누면 됩니다.\n**풀이**: _{3}H_{4} = _{6}C_{4} = _{6}C_{2} = 15\n**함정**: 5번(음이 아닌 정수)과 같은 방정식이라도 '자연수'면 먼저 담아 두는 단계가 필요합니다. 문제의 수의 범위를 반드시 확인합니다.", "src": "변형 6"}, {"l": 2, "t": "sa", "q": "X = {1, 2, 3}, Y = {1, 2, 3, 4, 5, 6}에서 f(1) < f(2) < f(3)이고 f(2) = 3인 함수 f:X → Y의 개수는?", "x": "6|6개|6가지", "s": "**신호 읽기**: 증가 조건 + 고정석 f(2) = 3 → 고정석을 기준으로 앞팀·뒷팀을 나눠 장보기 ([보충] 고정석 먼저)\n**상황 번역**: f(1) < 3이므로 앞팀은 {1, 2}에서, f(3) > 3이므로 뒷팀은 {4, 5, 6}에서 고릅니다. 등호가 없으므로 조합 C\n**풀이**: 앞팀 _{2}C_{1} = 2, 뒷팀 _{3}C_{1} = 3 → 2 × 3 = 6\n**함정**: 고정값 3은 앞팀·뒷팀 어느 쪽에도 들어가지 않습니다(등호가 없으므로).", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "a ≤ b ≤ c ≤ d ≤ 5를 만족하는 자연수 순서쌍 (a, b, c, d)의 개수를 구하시오.", "x": "70|70개|70가지", "s": "**신호 읽기**: [고난도] 함수가 아니라 부등식 a ≤ b ≤ c ≤ d ≤ 5로 주어졌지만, 등호 섞인 부등호가 순서를 정한다는 점은 같습니다.\n**상황 번역**: 1부터 5까지 다섯 종류에서 중복 허용으로 4개를 담으면, 작은 것부터 a, b, c, d에 자동 배정됩니다.\n**풀이**: _{5}H_{4} = _{8}C_{4} = 70\n**함정**: '자연수'이고'≤ 5'이므로 종류는 1~5의 5개입니다. 종류 수를 문장에서 정확히 읽어 냅니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "조합(C)과 중복조합(H)의 차이를 '장바구니 중복 담기 허용 여부'로 대조하여 서술하시오.", "x": null, "s": "**정답: 조합은 한 번 담은 상품을 다시 담을 수 없는 '품절' 상황이고, 중복조합은 같은 상품을 여러 번 담아도 되는 '무한 재고' 상황이다. 둘 다 담는 순서는 따지지 않는다.**\n**신호 읽기**: 두 개념을 대조하는 서술형은 공통점(순서 무시)과 차이점(중복 허용 여부)을 함께 씁니다.\n**상황 번역**: 문제에서는 부등호의 등호 유무(< vs ≤), 또는 '중복을 허락하여'라는 말이 이 차이를 알려 줍니다.\n**풀이**: 기호로는 _{n}C_{r}(r ≤ n) vs _{n}H_{r}(r이 n보다 커도 됨)까지 쓰면 완성입니다.\n**함정**: 차이점만 쓰면 반쪽 답입니다. 둘 다 '장보기(순서 없음)'라는 공통점을 꼭 씁니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "_{3}H_{0}과 _{3}H_{1}의 값을 각각 구하고 그 쇼핑 상황의 뜻을 설명하시오.", "x": null, "s": "**정답: _{3}H_{0} = 1, _{3}H_{1} = 3**\n**신호 읽기**: 작은 값의 중복조합을 쇼핑 장면으로 해석하는 문제입니다.\n**상황 번역**: _{3}H_{0}은 3종류 매장에서 0개를 담는 것, _{3}H_{1}은 1개만 담는 것입니다.\n**풀이**: 아무것도 담지 않는 방법은 '빈 바구니' 1가지. 1개만 담는 방법은 세 종류 중 하나를 고르는 3가지. 공식으로도 _{2}C_{0} = 1, _{3}C_{1} = 3\n**함정**: '0개 담기'를 0가지로 생각하기 쉽지만, 빈 바구니도 하나의 경우입니다.", "src": "변형 10"}]}, {"id": "p3", "u": "H", "ex": "PS", "t": "3. 괄호 n개에서 하나씩 뽑기론", "color": "노랑", "emoji": "🟡", "en": "Theory of One-from-Each-Bracket", "th": [["p", "(a + b)^{n}은 똑같은 괄호 (a + b)가 n개 줄지어 있는 상태입니다. 전개한다는 것은 각 괄호에서 a 또는 b 중 **딱 하나씩** 뽑아 곱하는 일입니다. 그러므로 a^{n − r}b^{r}이라는 항은 \"n개의 괄호 중 b를 뽑을 괄호 r개를 고르는 방법\"만큼 생겨나고, 그 개수가 바로 _{n}C_{r}입니다. 이항정리는 외우는 공식이 아니라 **괄호 고르기(조합)**라는 장면 번역입니다."], ["li", "**1:1 매칭 기호 독해법**: x^{k}==의 계수==를 구하라 → 일반항 _{n}C_{r}a^{n − r}b^{r}을 쓰고 x의 지수가 k가 되는 r을 찾는다. ==상수항==을 구하라 → x의 지수가 0이 되는 r을 찾는다. _{n}C_{0} + _{n}C_{1} + ⋯ + _{n}C_{n} → (1 + 1)^{n} = 2^{n}, 괄호마다 '뽑는다/안 뽑는다' 두 갈래."], ["p", "**[보충] 이항정리 독해표**"], ["tbl", [["문장", "번역", "도구"], ["(a + b)^{n}의 전개식", "괄호 n개에서 하나씩 뽑기", "Σ_{n}C_{r}a^{n − r}b^{r}"], ["x^{k}의 계수", "지수가 k가 되는 r 찾기", "일반항 정리"], ["상수항", "지수가 0이 되는 r 찾기", "일반항 정리"], ["이항계수의 합", "괄호마다 2갈래", "2^{n}"], ["부호가 번갈아 바뀌는 합", "(1 − 1)^{n}", "0"]]], ["p", "**[보충] 파스칼의 삼각형**: _{n − 1}C_{r − 1} + _{n − 1}C_{r} = _{n}C_{r}. 위의 두 수를 더하면 아래 수가 되는 이 규칙은 '특정 괄호 하나에서 b를 뽑았느냐 안 뽑았느냐'로 경우를 나눈 결과입니다."], ["p", "**[보충] 음수·분수 항 처리**: (2x − {{1§x}})^{6}처럼 b 자리에 부호나 분수가 있으면 b를 괄호째 r제곱합니다. (−{{1§x}})^{r} = (−1)^{r}x^{−r}이므로 부호 (−1)^{r}과 x의 지수 −r을 따로 정리한 뒤, 전체 지수를 문제에서 요구하는 값에 맞춥니다."]], "sum": ["신호: \"x^{k}의 계수\", \"상수항\" → **일반항 _{n}C_{r}a^{n − r}b^{r}**", "**1:1 매칭 기호 독해법**: x^{k}==의 계수==를 구하라 → 일반항 _{n}C_{r}a^{n − r}b^{r}을 쓰고 x의 지수가 k가 되는 r을 찾는다. ==상수항==을 구하라 → x의 지수가 0이 되는 r을 찾는다. _{n}C_{0} + _{n}C_{1} + ⋯ + _{n}C_{n} → (1 + 1)^{n} = 2^{n}, 괄호마다 '뽑는다/안 뽑는다' 두 갈래."], "fl": [["\"x^{k}의 계수\", \"상수항\" — 이 신호를 보면 꺼낼 도구는?", "일반항 _{n}C_{r}a^{n − r}b^{r}"], ["문장: (a + b)^{n}의 전개식 → 번역 / 도구?", "괄호 n개에서 하나씩 뽑기 / Σ_{n}C_{r}a^{n − r}b^{r}"], ["문장: x^{k}의 계수 → 번역 / 도구?", "지수가 k가 되는 r 찾기 / 일반항 정리"], ["문장: 상수항 → 번역 / 도구?", "지수가 0이 되는 r 찾기 / 일반항 정리"], ["문장: 이항계수의 합 → 번역 / 도구?", "괄호마다 2갈래 / 2^{n}"]], "bk": {"q": "책을 덮고 「괄호 n개에서 하나씩 뽑기론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"x^{k}의 계수\", \"상수항\"", "꺼낼 도구: 일반항 _{n}C_{r}a^{n − r}b^{r}", "1:1 매칭 기호 독해법", "일반항 세우기", "지수 맞추기", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "(x + 2)^{5}의 전개식에서 x^{3}==의 계수==를 구하시오.", "x": null, "s": "**1. 일반항 세우기** 괄호 5개에서 2를 r번, x를 5 − r번 뽑습니다. 일반항: _{5}C_{r}x^{5 − r}2^{r}\n**2. 지수 맞추기** 5 − r = 3에서 r = 2\n**3. 정산** _{5}C_{2} × 2^{2} = 10 × 4 = 40", "ck": ["일반항 세우기", "지수 맞추기", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "(2x − {{1§x}})^{6}의 전개식에서 ==상수항==을 구하시오.", "x": null, "s": "**1. 일반항 세우기** _{6}C_{r}(2x)^{6 − r}(−{{1§x}})^{r} = _{6}C_{r} 2^{6 − r}(−1)^{r}x^{6 − 2r}\n**2. 지수 0 맞추기** 6 − 2r = 0에서 r = 3\n**3. 정산** _{6}C_{3} × 2^{3} × (−1)^{3} = 20 × 8 × (−1) = −160", "ck": ["일반항 세우기", "지수 0 맞추기", "정산"], "src": "분당 기출", "ex": 1}, {"l": 3, "t": "self", "q": "_{10}C_{1} + _{10}C_{2} + ⋯ + _{10}C_{10}의 값을 구하시오.", "x": null, "s": "**1. 2갈래 장면 번역** _{10}C_{0} + _{10}C_{1} + ⋯ + _{10}C_{10} = (1 + 1)^{10} = 2^{10} = 1024\n**2. 빠진 항 확인** 문제의 합은 _{10}C_{0} = 1이 빠져 있습니다.\n**3. 정산** 1024 − 1 = 1023", "ck": ["2갈래 장면 번역", "빠진 항 확인", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 3, "t": "self", "q": "자연수 n에 대하여 (1 + x)^{n}의 전개식에서 x^{2}==의 계수가== 28일 때, n의 값을 구하시오.", "x": null, "s": "**1. 일반항 세우기** x^{2}은 괄호 n개 중 2개에서 x를 뽑을 때 생기므로 계수는 _{n}C_{2}입니다.\n**2. 방정식 세우기** {{n(n − 1)§2}} = 28, n(n − 1) = 56\n**3. 정산** n = 8 (n = −7은 자연수가 아니므로 제외)", "ck": ["일반항 세우기", "방정식 세우기", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "self", "q": "이항정리를 이용하여 (a + b)^{4}을 전개하시오.", "x": null, "s": "**정답: a^{4} + 4a^{3}b + 6a^{2}b^{2} + 4ab^{3} + b^{4}**\n**신호 읽기**: \"이항정리를 이용하여 전개\" → 괄호 4개에서 하나씩 뽑는 경우를 세라는 신호입니다.\n**상황 번역**: a^{4 − r}b^{r}은 괄호 4개 중 b를 뽑을 괄호 r개를 고르는 _{4}C_{r}가지만큼 생깁니다.\n**풀이**: _{4}C_{0} = 1, _{4}C_{1} = 4, _{4}C_{2} = 6, _{4}C_{3} = 4, _{4}C_{4} = 1 → a^{4} + 4a^{3}b + 6a^{2}b^{2} + 4ab^{3} + b^{4}\n**함정**: 계수가 좌우 대칭(1, 4, 6, 4, 1)인지 확인하면 실수를 잡을 수 있습니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "(x − 1)^{6}의 전개식에서 x^{4}의 계수를 구하시오.", "x": "15|15개|15가지", "s": "**신호 읽기**: \"x^{4}의 계수\" → 일반항을 쓰고 x의 지수가 4가 되는 r을 찾습니다.\n**상황 번역**: 괄호 (x − 1) 6개에서 − 1을 r번, x를 6 − r번 뽑습니다. 일반항 _{6}C_{r}x^{6 − r}(−1)^{r}\n**풀이**: 6 − r = 4 → r = 2 → _{6}C_{2} × (−1)^{2} = 15\n**함정**: − 1을 짝수 번 뽑으면 부호는 +입니다. 부호를 (−1)^{r}로 따로 챙깁니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "(x + 3)^{4}의 전개식에서 x의 계수를 구하시오.", "x": "108|108개|108가지", "s": "**신호 읽기**: \"x의 계수\" → x의 지수가 1인 항을 찾습니다.\n**상황 번역**: 괄호 (x + 3) 4개 중 x는 1번, 3은 3번 뽑아야 합니다.\n**풀이**: _{4}C_{3} × x^{1} × 3^{3} = 4 × 27x → 계수 108\n**함정**: 3^{r}을 빠뜨리고 _{4}C_{3} = 4만 답으로 쓰는 실수가 흔합니다. 계수에는 뽑은 수의 곱이 모두 들어갑니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "(x^{2} + {{1§x}})^{6}의 전개식에서 상수항을 구하시오.", "x": "15|15개|15가지", "s": "**신호 읽기**: \"상수항\" → x의 지수가 0이 되는 r을 찾습니다. 분수 항이 있으므로 [보충] 음수·분수 항 처리를 씁니다.\n**상황 번역**: ({{1§x}})^{r} = x^{−r}로 바꾸면 일반항은 _{6}C_{r}(x^{2})^{6 − r}x^{−r} = _{6}C_{r}x^{12 − 3r}\n**풀이**: 12 − 3r = 0 → r = 4 → _{6}C_{4} = 15\n**함정**: (x^{2})^{6 − r} = x^{12 − 2r}입니다. 지수끼리 곱하는 것을 놓치면 r이 잘못 나옵니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "_{7}C_{0} + _{7}C_{1} + ⋯ + _{7}C_{7}의 값을 구하시오.", "x": "128|128개|128가지", "s": "**신호 읽기**: 이항계수 _{7}C_{0} ~ _{7}C_{7}을 모두 더하는 문제 → '괄호마다 2갈래' 장면입니다.\n**상황 번역**: (1 + 1)^{7}을 전개하면 각 항이 _{7}C_{r}이 됩니다. 또는 괄호 7개마다 '뽑는다/안 뽑는다' 두 갈래\n**풀이**: 2^{7} = 128\n**함정**: _{7}C_{0} = 1을 포함한 합입니다. 3번 예제처럼 일부가 빠진 합이면 따로 빼 줍니다.", "src": "변형 5"}, {"l": 2, "t": "self", "q": "파스칼의 삼각형의 성질을 이용하여 _{4}C_{1} + _{4}C_{2}를 하나의 조합 기호로 나타내고 그 값을 구하시오.", "x": null, "s": "**정답: _{5}C_{2} = 10**\n**신호 읽기**: \"파스칼의 삼각형\" → 위의 두 수를 더하면 바로 아래 수가 되는 규칙을 쓰라는 신호입니다.\n**상황 번역**: _{n − 1}C_{r − 1} + _{n − 1}C_{r} = _{n}C_{r}에서 n − 1 = 4, r = 2\n**풀이**: _{4}C_{1} + _{4}C_{2} = _{5}C_{2} = 10 (확인: 4 + 6 = 10)\n**함정**: 아래 칸의 r은 두 수 중 큰 쪽의 r(여기서는 2)입니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "(a + b)^{n}의 전개식에서 a^{n − r}b^{r}의 계수가 _{n}C_{r}인 이유를 '괄호에서 하나씩 뽑기' 장면으로 서술하시오.", "x": null, "s": "**정답: n개의 괄호에서 하나씩 뽑아 곱할 때, b를 뽑을 괄호 r개를 고르면 나머지 n − r개의 괄호에서는 자동으로 a를 뽑게 되어 a^{n − r}b^{r}이 나온다. 이렇게 고르는 방법이 _{n}C_{r}가지이므로 그 항이 _{n}C_{r}번 생기고, 이것이 계수가 된다.**\n**신호 읽기**: '계수 = 그 항이 만들어지는 경우의 수'라는 핵심 문장을 쓰는 서술형입니다.\n**상황 번역**: 예: (a + b)^{3}에서 a^{2}b는 b를 첫째, 둘째, 셋째 괄호 중 어디서 뽑느냐에 따라 3번 생깁니다(_{3}C_{1} = 3).\n**풀이**: 작은 예를 하나 곁들이면 서술이 완성됩니다.\n**함정**: 순서를 따지지 않는 이유(곱셈은 순서가 바뀌어도 같은 항)도 한 줄 쓰면 좋습니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "_{11}C_{0} − _{11}C_{1} + _{11}C_{2} − ⋯ −_{11}C_{11}의 값을 구하시오.", "x": "0|0개|0가지", "s": "**신호 읽기**: 부호가 번갈아 바뀌는 이항계수의 합 → [보충] 독해표 마지막 줄 (1 − 1)^{n}\n**상황 번역**: (1 + x)^{11}에 x = −1을 넣으면 각 항이 _{11}C_{r}(−1)^{r}가 됩니다.\n**풀이**: (1 − 1)^{11} = 0\n**함정**: 부호 패턴이 +로 시작해 번갈아 바뀌는지 확인합니다. 문제 식이 정확히 그 꼴입니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "자연수 n에 대하여 (1 + x)^{n}의 전개식에서 x의 계수와 x^{2}의 계수의 비가 1:3일 때, n의 값을 구하시오.", "x": "7|7개|7가지", "s": "**신호 읽기**: 계수의 비가 주어진 문제 → 두 계수를 n의 식으로 쓴 뒤 비례식을 세웁니다.\n**상황 번역**: x의 계수는 괄호 n개 중 1개에서 x를 뽑는 _{n}C_{1} = n, x^{2}의 계수는 2개에서 뽑는 _{n}C_{2} = {{n(n − 1)§2}}\n**풀이**: n:{{n(n − 1)§2}} = 1:3 → 3n = {{n(n − 1)§2}} → 6 = n − 1 → n = 7\n**함정**: 비례식에서 내항의 곱 = 외항의 곱을 쓸 때 위치를 바꾸지 않습니다. n ≠ 0이므로 양변을 n으로 나눌 수 있습니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "_{2}C_{2} + _{3}C_{2} + _{4}C_{2} + _{5}C_{2} + _{6}C_{2}의 값을 파스칼의 삼각형을 이용하여 구하시오.", "x": "35|35개|35가지", "s": "**신호 읽기**: [고난도] _{k}C_{2}를 연달아 더하는 합 → 파스칼의 삼각형을 사다리처럼 타고 내려가라는 신호입니다.\n**상황 번역**: 첫 항 _{2}C_{2}를 같은 값 _{3}C_{3}(= 1)으로 바꾸면 파스칼 규칙을 연속으로 쓸 수 있습니다.\n**풀이**: _{3}C_{3} + _{3}C_{2} = _{4}C_{3} → + _{4}C_{2} = _{5}C_{3} → + _{5}C_{2} = _{6}C_{3} → + _{6}C_{2} = _{7}C_{3} = 35\n**함정**: 직접 더해도 1 + 3 + 6 + 10 + 15 = 35로 확인할 수 있습니다. 규칙과 계산 두 방법으로 검산합니다.", "src": "변형 10"}]}, {"id": "p4", "u": "I", "ex": "PS", "t": "4. 뒷문 열기론", "color": "초록", "emoji": "🟢", "en": "Theory of the Back Door", "th": [["p", "확률은 '전체 무대 중 내가 원하는 장면이 차지하는 비율'입니다. 그런데 문제에 **\"적어도 하나는\"**, **\"~가 아닐\"**이라는 말이 나오면 앞문(원하는 경우를 직접 세기)은 경우가 여러 갈래로 쪼개져 붐빕니다. 이때 정답은 뒷문입니다. 원하지 않는 단 하나의 장면(전부 실패)을 세어 전체 1에서 빼면 됩니다. 이것이 여사건 P(A^{C}) = 1 − P(A)입니다."], ["p", "또 \"A **또는** B\"라는 말은 두 무대를 합치는 장면입니다. 두 무대가 겹치는 부분(A **그리고** B)을 두 번 세었으므로 한 번 빼 주어야 합니다. 이것이 확률의 덧셈정리 P(A ∪ B) = P(A) + P(B) − P(A ∩ B)입니다."], ["li", "**1:1 매칭 기호 독해법**: ==\"적어도 하나\"== → 뒷문(여사건) 1 − P(모두 실패). ==\"또는\"== → 덧셈정리(겹친 부분 한 번 빼기). ==\"동시에 일어나지 않는다\"(배반)== → P(A ∩ B) = 0이므로 그냥 더하기."], ["p", "**[보충] 확률 문장 번역표**"], ["tbl", [["문장", "기호", "도구"], ["A 또는 B", "A ∪ B", "P(A) + P(B) − P(A ∩ B)"], ["A와 B가 동시에", "A ∩ B", "겹친 부분"], ["A가 일어나지 않을", "A^{C}", "1 − P(A)"], ["적어도 하나", "전부 실패의 여사건", "1 − P(전부 실패)"], ["A, B 모두 일어나지 않을", "A^{C} ∩ B^{C} = (A ∪ B)^{C}", "1 − P(A ∪ B)"]]], ["p", "**[보충] 수학적 확률의 전제**: 각 경우가 일어날 가능성이 **같을 때**만 {{원하는 경우의 수§전체 경우의 수}}를 쓸 수 있습니다. 그래서 같은 색 공도 서로 다른 공으로 구별하여 셉니다."], ["p", "**[보충] 확률의 말 정리**: 같은 조건에서 반복할 수 있고 결과가 우연에 의해 정해지는 실험이나 관찰을 **시행**, 시행에서 일어날 수 있는 모든 결과의 집합을 **표본공간** S, 표본공간의 부분집합을 **사건**이라 합니다. 같은 시행을 아주 많이 반복할 때 사건이 일어난 상대도수가 가까워지는 값을 **통계적 확률**이라 하며, 수학적 확률을 구하기 어려운 상황(압정 던지기, 실제 불량률 등)에서 씁니다. 어떤 사건 A든 0 ≤ P(A) ≤ 1, P(S) = 1, P(∅) = 0입니다."]], "sum": ["신호: \"또는\", \"적어도 하나\" → **P(A ∪ B), 1 − P(A^{C})**", "**1:1 매칭 기호 독해법**: ==\"적어도 하나\"== → 뒷문(여사건) 1 − P(모두 실패). ==\"또는\"== → 덧셈정리(겹친 부분 한 번 빼기). ==\"동시에 일어나지 않는다\"(배반)== → P(A ∩ B) = 0이므로 그냥 더하기."], "fl": [["\"또는\", \"적어도 하나\" — 이 신호를 보면 꺼낼 도구는?", "P(A ∪ B), 1 − P(A^{C})"], ["문장: A 또는 B → 기호 / 도구?", "A ∪ B / P(A) + P(B) − P(A ∩ B)"], ["문장: A와 B가 동시에 → 기호 / 도구?", "A ∩ B / 겹친 부분"], ["문장: A가 일어나지 않을 → 기호 / 도구?", "A^{C} / 1 − P(A)"], ["문장: 적어도 하나 → 기호 / 도구?", "전부 실패의 여사건 / 1 − P(전부 실패)"]], "bk": {"q": "책을 덮고 「뒷문 열기론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"또는\", \"적어도 하나\"", "꺼낼 도구: P(A ∪ B), 1 − P(A^{C})", "1:1 매칭 기호 독해법", "전체 무대 세기", "원하는 장면 세기", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "두 개의 주사위를 동시에 던질 때, ==나오는 두 눈의 수의 합이 5==일 확률을 구하시오.", "x": null, "s": "**1. 전체 무대 세기** 두 주사위를 구별하면 6 × 6 = 36가지입니다.\n**2. 원하는 장면 세기** (1,4), (2,3), (3,2), (4,1)의 4가지\n**3. 정산** {{4§36}} = {{1§9}}", "ck": ["전체 무대 세기", "원하는 장면 세기", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "두 사건 A, B에 대하여 P(A) = {{1§2}}, P(B) = {{2§5}}, P(A ∩ B) = {{1§4}}일 때, P(A ∪ B)를 구하시오.", "x": null, "s": "**1. \"또는\" 번역** 두 무대를 합치고 겹친 부분을 한 번 뺍니다.\n**2. 덧셈정리 적용** {{1§2}} + {{2§5}} − {{1§4}} = {{10 + 8 − 5§20}}\n**3. 정산** {{13§20}}", "ck": ["\"또는\" 번역", "덧셈정리 적용", "정산"], "src": "분당 기출", "ex": 1}, {"l": 3, "t": "self", "q": "흰 공 3개와 검은 공 4개가 들어 있는 주머니에서 임의로 3개의 공을 동시에 꺼낼 때, ==흰 공이 적어도 1개== 나올 확률을 구하시오.", "x": null, "s": "**1. 뒷문 신호 포착** \"적어도 1개\" → 앞문은 흰 공 1, 2, 3개로 갈라지므로 뒷문(흰 공 0개)을 엽니다.\n**2. 뒷문 장면 세기** 전체 _{7}C_{3} = 35, 검은 공만 3개 _{4}C_{3} = 4\n**3. 정산** 1 − {{4§35}} = {{31§35}}", "ck": ["뒷문 신호 포착", "뒷문 장면 세기", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 3, "t": "self", "q": "두 사건 A, B에 대하여 P(A) = {{1§2}}, P(B) = {{1§3}}, P(A ∪ B) = {{2§3}}일 때, P(A ∩ B)와 P(A^{C} ∩ B^{C})를 각각 구하시오.", "x": null, "s": "**1. 덧셈정리 거꾸로 쓰기** P(A ∩ B) = P(A) + P(B) − P(A ∪ B) = {{1§2}} + {{1§3}} − {{2§3}} = {{1§6}}\n**2. \"둘 다 아닌\" 번역** A^{C} ∩ B^{C}는 두 무대 어디에도 없는 바깥 영역, 즉 (A ∪ B)^{C}입니다.\n**3. 정산** P(A ∩ B) = {{1§6}}, P(A^{C} ∩ B^{C}) = 1 − {{2§3}} = {{1§3}}", "ck": ["덧셈정리 거꾸로 쓰기", "\"둘 다 아닌\" 번역", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "sa", "q": "동전 3개를 동시에 던질 때, 앞면이 2개 나올 확률을 구하시오.", "x": "{{3§8}}|3/8", "s": "**신호 읽기**: 동전 여러 개의 결과 → 전체 무대(표본공간)부터 셉니다. 각 결과가 일어날 가능성이 같으므로 수학적 확률을 씁니다.\n**상황 번역**: 동전 3개를 구별하면 전체 무대는 2^{3} = 8가지. 앞면이 2개인 장면은 '뒷면이 될 동전 1개'를 고르는 것과 같습니다.\n**풀이**: _{3}C_{1} = 3 → {{3§8}}\n**함정**: 결과를 '앞면 0개, 1개, 2개, 3개'의 4가지로 세면 각 경우의 가능성이 같지 않아 틀립니다([보충] 수학적 확률의 전제).", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "두 개의 주사위를 동시에 던질 때, 나오는 두 눈의 수의 합이 7일 확률을 구하시오.", "x": "{{1§6}}|1/6", "s": "**신호 읽기**: 두 주사위 → 전체 무대 6 × 6 = 36\n**상황 번역**: 합이 7인 장면을 순서쌍으로 모두 적습니다.\n**풀이**: (1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1) → 6가지 → {{6§36}} = {{1§6}}\n**함정**: 두 주사위를 구별해야 각 장면의 가능성이 같아집니다. (3, 4)와 (4, 3)은 다른 장면입니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "1부터 10까지의 자연수가 하나씩 적힌 카드 10장 중 한 장을 뽑을 때, 2의 배수 또는 5의 배수가 나올 확률을 구하시오.", "x": "{{3§5}}|3/5", "s": "**신호 읽기**: \"또는\" → 덧셈정리(겹친 부분 한 번 빼기)\n**상황 번역**: 2의 배수 무대 {2, 4, 6, 8, 10}과 5의 배수 무대 {5, 10}이 10에서 겹칩니다.\n**풀이**: {{5§10}} + {{2§10}} − {{1§10}} = {{6§10}} = {{3§5}}\n**함정**: 겹친 10을 빼지 않으면 {{7§10}}이 됩니다. '또는'에는 언제나 겹침 확인이 따라옵니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "남학생 3명과 여학생 2명 중에서 임의로 2명의 대표를 뽑을 때, 남학생이 적어도 1명 뽑힐 확률을 구하시오.", "x": "{{9§10}}|9/10", "s": "**신호 읽기**: \"적어도 1명\" → 앞문(남 1명, 남 2명)보다 뒷문(남 0명)이 단순합니다.\n**상황 번역**: 뒷문 = 여학생만 2명 뽑히는 장면 = 여학생 2명 중 2명을 고르는 1가지\n**풀이**: 전체 _{5}C_{2} = 10 → 1 − {{1§10}} = {{9§10}}\n**함정**: 앞문으로 풀어도 {{3 × 2 + 3§10}} = {{9§10}}으로 같습니다. 두 방법을 비교해 보면 뒷문이 왜 편한지 체감됩니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "두 사건 A, B에 대하여 P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.2일 때, P(A ∪ B)를 구하시오.", "x": "0.7", "s": "**신호 읽기**: P(A ∪ B) → 덧셈정리\n**상황 번역**: 두 무대를 합치고 두 번 칠해진 겹친 부분을 한 번 뺍니다.\n**풀이**: 0.5 + 0.4 − 0.2 = 0.7\n**함정**: 확률은 1을 넘을 수 없습니다. 결과가 1보다 크면 겹친 부분을 빼지 않은 것입니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "5번 문항의 조건에서 P(A^{C} ∩ B^{C})를 구하시오.", "x": "0.3", "s": "**신호 읽기**: A^{C} ∩ B^{C} → \"둘 다 일어나지 않는\" 바깥 영역 → 뒷문\n**상황 번역**: A 밖이면서 B 밖인 곳은 두 무대를 합친 것의 바깥, 즉 (A ∪ B)^{C}입니다(드모르간).\n**풀이**: 1 − P(A ∪ B) = 1 − 0.7 = 0.3\n**함정**: P(A^{C}) × P(B^{C}) = 0.5 × 0.6 = 0.3으로 우연히 같아 보여도, 이 계산은 독립일 때만 쓸 수 있습니다. 원리는 드모르간입니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "\"적어도 하나\"라는 표현이 나올 때 여사건을 이용하는 것이 유리한 이유를 '앞문과 뒷문' 비유로 서술하시오.", "x": null, "s": "**정답: 앞문(원하는 경우)은 1개, 2개, 3개, ...처럼 여러 갈래로 갈라져 하나씩 세어 더해야 하지만, 뒷문(하나도 없는 경우)은 단 한 장면이다. 그래서 뒷문 하나만 세어 전체 1에서 빼면 훨씬 간단하고 실수가 적다.**\n**신호 읽기**: 비유를 지정한 서술형 → '갈라지는 쪽'과 '하나로 모이는 쪽'을 대비합니다.\n**상황 번역**: '적어도 하나'의 반대는 '하나도 없음' 하나뿐입니다.\n**풀이**: 식 P(적어도 하나) = 1 − P(하나도 없음)를 함께 쓰면 완성입니다.\n**함정**: '적어도 하나'의 반대를 '모두'로 쓰는 실수가 많습니다. 반대는 '하나도 없음'입니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "한 개의 주사위를 3번 던질 때, 6의 눈이 적어도 한 번 나올 확률을 구하시오.", "x": "{{91§216}}|91/216", "s": "**신호 읽기**: \"적어도 한 번\" → 뒷문(세 번 모두 6이 아님)\n**상황 번역**: 한 번 던질 때 6이 아닐 확률은 {{5§6}}. 세 번의 결과는 서로 영향을 주지 않으므로 곱합니다.\n**풀이**: 뒷문 ({{5§6}})^{3} = {{125§216}} → 1 − {{125§216}} = {{91§216}}\n**함정**: 앞문으로 하면 '1번만, 2번만, 3번 모두'를 각각 세어야 해서 훨씬 깁니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "숫자 1, 2, 3, 4, 5가 하나씩 적힌 카드 5장을 임의로 일렬로 나열할 때, 1과 2가 서로 이웃할 확률을 구하시오.", "x": "{{2§5}}|2/5", "s": "**신호 읽기**: \"이웃할 확률\" → 경우의 수(유형 1의 묶기)로 원하는 장면을 셉니다.\n**상황 번역**: 1과 2를 끈으로 묶으면 줄 서는 대상은 4개, 묶음 안 순서 2가지\n**풀이**: 원하는 장면 4! × 2 = 48, 전체 5! = 120 → {{48§120}} = {{2§5}}\n**함정**: 묶음 안의 순서(×2)를 빼먹으면 {{1§5}}이 됩니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "흰 공 4개와 검은 공 5개가 들어 있는 주머니에서 임의로 3개의 공을 동시에 꺼낼 때, 흰 공과 검은 공이 모두 나올 확률을 구하시오.", "x": "{{5§6}}|5/6", "s": "**신호 읽기**: [고난도] \"흰 공과 검은 공이 모두 나올\" → 앞문은 (흰1, 검2), (흰2, 검1)로 갈라집니다. 뒷문은 '한 가지 색만'입니다.\n**상황 번역**: 뒷문 = 흰 공만 3개 또는 검은 공만 3개. 두 장면은 동시에 일어날 수 없으므로(배반) 그냥 더합니다.\n**풀이**: 흰 공만 _{4}C_{3} = 4, 검은 공만 _{5}C_{3} = 10, 전체 _{9}C_{3} = 84 → 1 − {{14§84}} = {{70§84}} = {{5§6}}\n**함정**: 뒷문이 두 장면으로 이루어진 경우입니다. 뒷문도 빠짐없이 세었는지 확인합니다.", "src": "변형 10"}]}, {"id": "p5", "u": "I", "ex": "PS", "t": "5. 무대 줄이기론", "color": "파랑", "emoji": "🔵", "en": "Theory of the Shrinking Stage", "th": [["p", "조건부확률 P(B|A)는 문장에서 **\"A일 때\"**, **\"A였다고 할 때\"**, **\"A인 것이 확인되었을 때\"**라는 말로 나타납니다. 이 말이 나오는 순간 전체 무대는 사라지고 **A라는 작은 무대만 남습니다.** 그 작은 무대 안에서 B가 차지하는 비율을 구하는 것이므로, 분모가 P(A)로 바뀝니다."], ["p", "P(B|A) = {{P(A ∩ B)§P(A)}}"], ["p", "이 식을 거꾸로 쓰면 곱셈정리 P(A ∩ B) = P(A)P(B|A)가 됩니다. \"먼저 A가 일어나고, 그다음 B가 일어난다\"는 두 단계 장면을 곱셈으로 이어 붙이는 것입니다."], ["p", "또 무대를 줄였는데도 B의 비율이 그대로라면, 즉 P(B|A) = P(B)라면 A는 B에 아무 영향을 주지 못한 것입니다. 이를 **독립**이라 하며, 이때 P(A ∩ B) = P(A)P(B)가 성립합니다."], ["li", "**1:1 매칭 기호 독해법**: ==\"~일 때, ~일 확률\"== → 분모를 '~일 때'의 무대로 줄이기. ==\"꺼낸 공을 다시 넣지 않고\"== → 두 번째 무대가 줄어든 곱셈정리. ==\"서로 독립\"== → 그냥 곱하기 P(A)P(B)."], ["p", "**[보충] 무대 줄이기 판정표**"], ["tbl", [["문장", "번역", "식"], ["A일 때 B일 확률", "A 무대 안의 B 비율", "{{P(A ∩ B)§P(A)}}"], ["A이고 B일 확률", "두 단계 장면", "P(A)P(B|A)"], ["A, B가 서로 독립", "무대를 줄여도 비율 불변", "P(A ∩ B) = P(A)P(B)"], ["결과(B)를 보고 원인(A)을 묻는 문장", "결과 무대로 줄이기", "{{P(A ∩ B)§P(B)}}"]]], ["p", "**[보충] 배반과 독립은 다르다**: 배반은 \"두 무대가 겹치지 않는다(P(A ∩ B) = 0)\"이고, 독립은 \"한 무대가 다른 무대의 비율을 바꾸지 않는다\"입니다. 확률이 0이 아닌 두 사건이 배반이면 오히려 서로 독립이 될 수 없습니다."], ["p", "**[보충] 갈래마다 곱해서 더하기**: 결과가 여러 갈래(주머니 A 또는 B, 기계 A 또는 B)에서 나올 수 있으면, 갈래마다 (그 갈래를 고를 확률)×(그 갈래에서 결과가 나올 확률)을 구해 모두 더한 값이 '결과 무대' 전체입니다. 결과를 보고 원인을 묻는 문제는 이 전체를 분모로, 원하는 갈래 하나를 분자로 놓습니다."], ["p", "**[보충] 독립시행**: 서로 독립인 같은 시행을 n번 반복하는 것을 독립시행이라 합니다. 이때 성공이 r번 일어날 확률 _{n}C_{r} p^{r}(1 − p)^{n − r}은 유형 6의 이항분포로 그대로 이어집니다."]], "sum": ["신호: \"~일 때\", \"서로 독립\" → **{{P(A ∩ B)§P(A)}}, P(A)P(B)**", "**1:1 매칭 기호 독해법**: ==\"~일 때, ~일 확률\"== → 분모를 '~일 때'의 무대로 줄이기. ==\"꺼낸 공을 다시 넣지 않고\"== → 두 번째 무대가 줄어든 곱셈정리. ==\"서로 독립\"== → 그냥 곱하기 P(A)P(B)."], "fl": [["\"~일 때\", \"서로 독립\" — 이 신호를 보면 꺼낼 도구는?", "{{P(A ∩ B)§P(A)}}, P(A)P(B)"], ["문장: A일 때 B일 확률 → 번역 / 식?", "A 무대 안의 B 비율 / {{P(A ∩ B)§P(A)}}"], ["문장: A이고 B일 확률 → 번역 / 식?", "두 단계 장면 / P(A)P(B|A)"], ["문장: A, B가 서로 독립 → 번역 / 식?", "무대를 줄여도 비율 불변 / P(A ∩ B) = P(A)P(B)"], ["문장: 결과(B)를 보고 원인(A)을 묻는 문장 → 번역 / 식?", "결과 무대로 줄이기 / {{P(A ∩ B)§P(B)}}"]], "bk": {"q": "책을 덮고 「무대 줄이기론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"~일 때\", \"서로 독립\"", "꺼낼 도구: {{P(A ∩ B)§P(A)}}, P(A)P(B)", "1:1 매칭 기호 독해법", "무대 확인", "분모 교체", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "두 사건 A, B에 대하여 P(A) = {{3§5}}, P(A ∩ B) = {{2§5}}일 때, P(B|A)를 구하시오.", "x": null, "s": "**1. 무대 확인** P(B|A)는 A 무대로 줄인 뒤 그 안의 B 비율입니다.\n**2. 분모 교체** {{P(A ∩ B)§P(A)}} = {{2/5§3/5}}\n**3. 정산** {{2§3}}", "ck": ["무대 확인", "분모 교체", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "어느 학교 학생 100명을 대상으로 안경 착용 여부를 조사하였더니 남학생 60명 중 24명, 여학생 40명 중 16명이 안경을 쓰고 있었다. 이 학생 중 임의로 뽑은 한 명이 ==안경을 쓴 학생일 때==, 이 학생이 여학생일 확률을 구하고, '안경 착용'과 '남학생'이 서로 독립인지 판정하시오.", "x": null, "s": "**1. 무대 줄이기** 안경을 쓴 학생은 24 + 16 = 40명. 이 무대 안에서 여학생은 16명입니다.\n**2. 조건부확률** {{16§40}} = {{2§5}}\n**3. 독립 판정** P(안경) = {{40§100}} = {{2§5}}, P(안경|남) = {{24§60}} = {{2§5}}로 같으므로 서로 독립입니다.", "ck": ["무대 줄이기", "조건부확률", "독립 판정"], "src": "분당 기출", "ex": 1}, {"l": 3, "t": "self", "q": "흰 공 3개와 검은 공 2개가 들어 있는 주머니에서 공을 한 개씩 두 번 꺼낼 때, ==꺼낸 공은 다시 넣지 않는다==. 두 번 모두 흰 공이 나올 확률을 구하시오.", "x": null, "s": "**1. 첫 번째 무대** 첫 번째에 흰 공: {{3§5}}\n**2. 줄어든 두 번째 무대** 흰 공 하나가 빠져 흰 공 2개, 전체 4개: {{2§4}}\n**3. 정산** 곱셈정리 {{3§5}} × {{2§4}} = {{3§10}}", "ck": ["첫 번째 무대", "줄어든 두 번째 무대", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 3, "t": "self", "q": "주머니 A에는 흰 공 2개와 검은 공 2개, 주머니 B에는 흰 공 1개와 검은 공 3개가 들어 있다. 주사위 한 개를 던져 2 이하의 눈이 나오면 주머니 A에서, 3 이상의 눈이 나오면 주머니 B에서 공을 한 개 꺼낸다. ==꺼낸 공이 흰 공일 때==, 그 공이 주머니 A에서 나왔을 확률을 구하시오.", "x": null, "s": "**1. 두 갈래 장면** A에서 흰 공: {{1§3}} × {{2§4}} = {{1§6}}, B에서 흰 공: {{2§3}} × {{1§4}} = {{1§6}}\n**2. 결과 무대로 줄이기** 흰 공이 나온 무대 전체: {{1§6}} + {{1§6}} = {{1§3}}\n**3. 정산** {{1/6§1/3}} = {{1§2}}", "ck": ["두 갈래 장면", "결과 무대로 줄이기", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "sa", "q": "두 사건 A, B에 대하여 P(A) = 0.8, P(A ∩ B) = 0.2일 때, P(B|A)를 구하시오.", "x": "{{1§4}}|1/4", "s": "**신호 읽기**: P(B|A) → 무대를 A로 줄이고 그 안에서 B가 차지하는 비율을 구합니다.\n**상황 번역**: 분모는 새 무대 P(A), 분자는 그 무대 안의 B 부분 P(A ∩ B)\n**풀이**: {{0.2§0.8}} = {{1§4}}\n**함정**: P(A ∩ B) = 0.2를 그대로 답으로 쓰면 무대를 줄이지 않은 것입니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "1부터 10까지의 자연수가 하나씩 적힌 카드 10장 중 한 장을 뽑았더니 홀수였다. 이 카드가 5의 배수일 확률을 구하시오.", "x": "{{1§5}}|1/5", "s": "**신호 읽기**: \"뽑았더니 홀수였다. 이 카드가 5의 배수일 확률\" → '홀수였다'가 무대를 줄이는 말입니다.\n**상황 번역**: 새 무대 = 홀수 카드 {1, 3, 5, 7, 9} 5장. 이 안에서 5의 배수를 찾습니다.\n**풀이**: 5 한 장 → {{1§5}}\n**함정**: 전체 10장 기준으로 {{1§10}}이라고 쓰면 무대를 줄이지 않은 것입니다. '~였다', '~일 때'를 보면 분모부터 바꿉니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "흰 공 3개와 검은 공 4개가 들어 있는 주머니에서 공을 한 개씩 두 번 꺼낼 때(꺼낸 공은 다시 넣지 않음), 두 번 모두 검은 공이 나올 확률을 구하시오.", "x": "{{2§7}}|2/7", "s": "**신호 읽기**: \"꺼낸 공은 다시 넣지 않음\" → 두 번째 무대가 줄어든 곱셈정리\n**상황 번역**: 첫 번째에 검은 공을 꺼내면 주머니에는 검은 공 3개, 전체 6개가 남습니다.\n**풀이**: {{4§7}} × {{3§6}} = {{12§42}} = {{2§7}}\n**함정**: 두 번째 확률을 {{4§7}}로 그대로 쓰면 '다시 넣는' 경우가 됩니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "두 사건 A, B가 서로 독립이고 P(A) = {{1§3}}, P(B) = {{1§4}}일 때, P(A ∩ B)와 P(A ∪ B)를 각각 구하시오.", "x": null, "s": "**정답: P(A ∩ B) = {{1§12}}, P(A ∪ B) = {{1§2}}**\n**신호 읽기**: \"서로 독립\" → 겹친 부분을 그냥 곱으로 구할 수 있다는 신호입니다.\n**상황 번역**: 무대를 A로 줄여도 B의 비율이 그대로이므로 P(A ∩ B) = P(A)P(B)\n**풀이**: {{1§3}} × {{1§4}} = {{1§12}}. 덧셈정리 {{1§3}} + {{1§4}} − {{1§12}} = {{4 + 3 − 1§12}} = {{1§2}}\n**함정**: 독립이라도 '또는'은 덧셈정리로 구합니다. 곱은 '그리고'에만 씁니다.", "src": "변형 4"}, {"l": 2, "t": "self", "q": "한 개의 주사위를 던지는 시행에서 짝수의 눈이 나오는 사건을 A, 3의 배수의 눈이 나오는 사건을 B라 할 때, 두 사건 A, B가 서로 독립인지 판정하시오.", "x": null, "s": "**정답: 독립**\n**신호 읽기**: 독립 판정 → P(A ∩ B)와 P(A)P(B)가 같은지 비교합니다.\n**상황 번역**: A = {2, 4, 6}, B = {3, 6}, A ∩ B = {6}\n**풀이**: P(A ∩ B) = {{1§6}}, P(A)P(B) = {{1§2}} × {{1§3}} = {{1§6}} → 같으므로 독립. 무대 줄이기로도 P(B|A) = {{1§3}} = P(B)\n**함정**: '겹친다(배반이 아님)'와 '독립'은 다른 개념입니다([보충] 배반과 독립). 반드시 계산으로 판정합니다.", "src": "변형 5"}, {"l": 2, "t": "self", "q": "한 개의 주사위를 던지는 시행에서 짝수의 눈이 나오는 사건을 A, 4 이하의 눈이 나오는 사건을 B라 할 때, 두 사건 A, B가 서로 독립인지 판정하시오.", "x": null, "s": "**정답: 독립**\n**신호 읽기**: 5번과 같은 판정 방법입니다.\n**상황 번역**: A = {2, 4, 6}, B = {1, 2, 3, 4}, A ∩ B = {2, 4}\n**풀이**: P(A ∩ B) = {{2§6}} = {{1§3}}, P(A)P(B) = {{1§2}} × {{4§6}} = {{1§3}} → 독립\n**함정**: 직관으로 '관계가 있어 보인다'고 판단하지 않습니다. 독립은 비율이 같은지로만 정해집니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "조건부확률 P(B|A)의 분모가 P(A)가 되는 이유를 '무대 줄이기' 비유로 서술하시오.", "x": null, "s": "**정답: \"A일 때\"라는 말이 나오면 전체 무대는 사라지고 A라는 작은 무대만 남는다. 확률은 '지금 서 있는 무대에서 원하는 장면이 차지하는 비율'이므로, 비율을 재는 기준(분모)이 전체 1이 아니라 새 무대의 크기 P(A)가 된다. 분자는 새 무대 안에 남은 B, 즉 A ∩ B이다.**\n**신호 읽기**: 분모가 바뀌는 이유를 묻는 서술형 → '분모 = 지금 서 있는 무대'가 핵심 문장입니다.\n**상황 번역**: 2번 문항처럼 '홀수였다'를 들으면 짝수 카드는 무대에서 내려갑니다.\n**풀이**: 분자가 B가 아니라 A ∩ B인 이유(무대 밖의 B는 볼 수 없음)까지 쓰면 완성입니다.\n**함정**: 분모만 설명하고 분자를 설명하지 않으면 반쪽 답입니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "갑과 을이 각각 과녁을 한 번씩 쏠 때 맞힐 확률이 각각 {{1§2}}, {{1§3}}이고 서로 독립이다. 과녁을 적어도 한 명이 맞힐 확률을 구하시오.", "x": "{{2§3}}|2/3", "s": "**신호 읽기**: \"적어도 한 명\" → 뒷문(유형 4), \"서로 독립\" → 곱하기. 두 유형의 도구를 함께 씁니다.\n**상황 번역**: 뒷문 = 갑도 못 맞히고 을도 못 맞힘. 독립이므로 두 실패 확률을 곱합니다.\n**풀이**: (1 − {{1§2}}) × (1 − {{1§3}}) = {{1§2}} × {{2§3}} = {{1§3}} → 1 − {{1§3}} = {{2§3}}\n**함정**: {{1§2}} + {{1§3}} = {{5§6}}으로 더하면 둘 다 맞히는 경우가 두 번 세어집니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "두 사건 A, B가 서로 독립이고 P(A) = 0.6, P(B) = 0.2일 때, P(A ∪ B)를 구하시오.", "x": "0.68", "s": "**신호 읽기**: 독립 + \"또는\" → 곱으로 겹친 부분을 구한 뒤 덧셈정리\n**상황 번역**: P(A ∩ B) = P(A)P(B)\n**풀이**: P(A ∩ B) = 0.6 × 0.2 = 0.12 → P(A ∪ B) = 0.6 + 0.2 − 0.12 = 0.68\n**함정**: 독립이 아니었다면 P(A ∩ B)를 따로 알려 주어야 합니다. 독립 조건이 겹친 부분을 알려 주는 역할입니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "어느 공장에서 기계 A가 전체 제품의 40%, 기계 B가 60%를 생산하고, 불량률은 각각 2%, 1.5%이다. 임의로 고른 제품이 불량품일 때, 그 제품이 기계 A에서 생산되었을 확률을 구하시오.", "x": "{{8§17}}|8/17", "s": "**신호 읽기**: [고난도] \"불량품일 때, 기계 A에서 생산되었을 확률\" → 결과(불량)를 보고 원인(기계)을 묻는 문장 → [보충] 갈래마다 곱해서 더하기\n**상황 번역**: 불량품이 나오는 갈래는 두 개입니다. ① 기계 A로 가서 불량 ② 기계 B로 가서 불량. 두 갈래를 더한 것이 '불량' 무대 전체입니다.\n**풀이**: ① 0.4 × 0.02 = 0.008 ② 0.6 × 0.015 = 0.009. 불량 무대 = 0.017. 그 안에서 A 갈래 비율 {{0.008§0.017}} = {{8§17}}\n**함정**: 기계 A의 불량률 0.02를 그대로 답으로 쓰면 '기계 A일 때 불량일 확률'(P(불량|A))을 구한 것입니다. 무엇이 무대(조건)인지 문장에서 정확히 읽습니다.", "src": "변형 10"}]}, {"id": "p6", "u": "J", "ex": "PS", "t": "6. 한 판 평균 몫론", "color": "남색", "emoji": "🔷", "en": "Theory of the Fair Share", "th": [["p", "확률변수 X는 '시행 결과에 붙인 숫자 이름표'입니다. 동전을 던져 앞면 개수를 세면 결과마다 0, 1, 2 같은 숫자가 붙지요. 이 숫자들과 그 확률을 표로 정리한 것이 **확률분포**입니다. 표의 확률을 모두 더하면 반드시 1이 되어야 합니다."], ["p", "기댓값 E(X)는 \"같은 게임을 아주 많이 하면 **한 판에 평균 얼마씩 돌아오는가**\"라는 몫입니다. 그래서 각 값에 그 값이 나올 확률(비중)을 곱해 더합니다. 분산 V(X)는 실제 값이 평균에서 얼마나 출렁이는지를 재는 도구입니다."], ["p", "E(X) = Σ x_{i}p_{i}, V(X) = E(X^{2}) − {E(X)}^{2}, σ(X) = √{V(X)}"], ["p", "특히 \"성공 확률이 p인 시행을 **독립적으로** n**번 반복**할 때 성공 횟수\"라는 문장은 이항분포 B(n, p)의 신호입니다. 한 판에 평균 p번 성공하므로 n판이면 np번, 즉 E(X) = np라는 몫이 자연스럽게 나옵니다."], ["li", "**1:1 매칭 기호 독해법**: ==\"확률분포가 다음과 같을 때\"== → 확률의 합 = 1부터 세우기. ==\"==n==번 반복할 때 ~의 횟수\"== → B(n, p), E = np, V = np(1 − p). aX + b → 평균은 aE(X) + b, 표준편차는 |a|σ(X)(더한 b는 출렁임과 무관)."], ["p", "**[보충] 기댓값·분산 공식표**"], ["tbl", [["상황", "평균", "분산", "표준편차"], ["일반 확률변수 X", "Σ x_{i}p_{i}", "E(X^{2}) − {E(X)}^{2}", "√{V(X)}"], ["aX + b", "aE(X) + b", "a^{2}V(X)", "|a|σ(X)"], ["X ~ B(n, p)", "np", "np(1 − p)", "√{np(1 − p)}"]]], ["p", "**[보충] 이항분포의 확률**: P(X = r) = _{n}C_{r} p^{r}(1 − p)^{n − r}. 성공할 r번의 자리를 고르는 _{n}C_{r}(유형 3의 괄호 고르기와 같은 장면)에, 성공과 실패의 확률을 곱한 것입니다."], ["p", "**[보충] 범위 확률 읽기**: P(X ≥ k)처럼 범위로 묻는 확률은 확률분포표에서 해당하는 칸의 확률을 모두 더합니다. 더할 칸이 많으면 뒷문(유형 4)을 열어 1 − (나머지 칸의 합)으로 구합니다."]], "sum": ["신호: \"기댓값\", \"n번 반복할 때 횟수\" → **E = np, V = np(1 − p)**", "**1:1 매칭 기호 독해법**: ==\"확률분포가 다음과 같을 때\"== → 확률의 합 = 1부터 세우기. ==\"==n==번 반복할 때 ~의 횟수\"== → B(n, p), E = np, V = np(1 − p). aX + b → 평균은 aE(X) + b, 표준편차는 |a|σ(X)(더한 b는 출렁임과 무관)."], "fl": [["\"기댓값\", \"n번 반복할 때 횟수\" — 이 신호를 보면 꺼낼 도구는?", "E = np, V = np(1 − p)"], ["상황: 일반 확률변수 X → 평균 / 분산 / 표준편차?", "Σ x_{i}p_{i} / E(X^{2}) − {E(X)}^{2} / √{V(X)}"], ["상황: aX + b → 평균 / 분산 / 표준편차?", "aE(X) + b / a^{2}V(X) / |a|σ(X)"], ["상황: X ~ B(n, p) → 평균 / 분산 / 표준편차?", "np / np(1 − p) / √{np(1 − p)}"], ["1:1 매칭 기호 독해법이란?", "==\"확률분포가 다음과 같을 때\"== → 확률의 합 = 1부터 세우기. ==\"==n==번 반복할 때 ~의 횟수\"== → B(n, p), E = np, V = np(1 − p). aX + b → 평균은 aE(X) + b, 표준편차는 |a|σ(X)(더한 b는 출렁임과 무관)."]], "bk": {"q": "책을 덮고 「한 판 평균 몫론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"기댓값\", \"n번 반복할 때 횟수\"", "꺼낼 도구: E = np, V = np(1 − p)", "1:1 매칭 기호 독해법", "확률분포표 만들기", "평균 몫 계산", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "동전 2개를 동시에 던질 때 앞면이 나오는 동전의 개수를 확률변수 X라 하자. E(X)==와== V(X)를 구하시오.", "x": null, "s": "**1. 확률분포표 만들기** P(X = 0) = {{1§4}}, P(X = 1) = {{2§4}}, P(X = 2) = {{1§4}}\n**2. 평균 몫 계산** E(X) = 0 · {{1§4}} + 1 · {{2§4}} + 2 · {{1§4}} = 1\n**3. 정산** E(X^{2}) = {{2§4}} + {{4§4}} = {{3§2}} → V(X) = {{3§2}} − 1^{2} = {{1§2}}", "ck": ["확률분포표 만들기", "평균 몫 계산", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "확률변수 X가 가지는 값이 1, 2, 3이고 P(X = x) = ax (x = 1, 2, 3)일 때, 상수 a와 E(X)를 구하시오.", "x": null, "s": "**1. 확률의 합 = 1** a + 2a + 3a = 6a = 1 → a = {{1§6}}\n**2. 평균 몫 계산** E(X) = 1 · {{1§6}} + 2 · {{2§6}} + 3 · {{3§6}} = {{14§6}}\n**3. 정산** a = {{1§6}}, E(X) = {{7§3}}", "ck": ["확률의 합 = 1", "평균 몫 계산", "정산"], "src": "분당 기출", "ex": 1}, {"l": 3, "t": "self", "q": "한 개의 동전을 ==5번 던질 때== 앞면이 나오는 횟수를 확률변수 X라 하자. P(X = 3)을 구하시오.", "x": null, "s": "**1. 이항분포 신호 포착** 성공 확률 {{1§2}}인 시행을 독립적으로 5번 반복 → X ~ B(5, {{1§2}})\n**2. 자리 고르기** 앞면이 나올 3번의 자리를 고르기: _{5}C_{3} = 10\n**3. 정산** 10 × ({{1§2}})^{3}({{1§2}})^{2} = {{10§32}} = {{5§16}}", "ck": ["이항분포 신호 포착", "자리 고르기", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 3, "t": "self", "q": "확률변수 X가 이항분포 B(100, {{1§5}})을 따를 때, E(X), σ(X)와 E(3X − 2)==,== σ(3X − 2)를 각각 구하시오.", "x": null, "s": "**1. 이항분포 몫** E(X) = 100 × {{1§5}} = 20, V(X) = 100 × {{1§5}} × {{4§5}} = 16 → σ(X) = 4\n**2. 변환 독해** 평균은 3배 후 2를 빼고, 표준편차는 3배만 합니다.\n**3. 정산** E(3X − 2) = 58, σ(3X − 2) = 12", "ck": ["이항분포 몫", "변환 독해", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "sa", "q": "1, 2, 3, 4가 하나씩 적힌 카드 4장 중 한 장을 임의로 뽑을 때, 카드에 적힌 수를 확률변수 X라 하자. E(X)를 구하시오.", "x": "{{5§2}}|5/2", "s": "**신호 읽기**: \"E(X)\" → 한 판에 평균 얼마씩 돌아오는가를 구하는 문제입니다. 각 값 × 그 값의 확률을 더합니다.\n**상황 번역**: 카드 1, 2, 3, 4가 각각 {{1§4}}의 확률로 나옵니다.\n**풀이**: E(X) = (1 + 2 + 3 + 4) × {{1§4}} = {{10§4}} = {{5§2}}\n**함정**: 확률이 모두 같을 때는 기댓값이 값들의 평균과 같습니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "1번 문항의 확률변수 X에 대하여 V(X)를 구하시오.", "x": "{{5§4}}|5/4", "s": "**신호 읽기**: V(X) → 값이 평균에서 얼마나 출렁이는지. 공식 V(X) = E(X^{2}) − {E(X)}^{2}\n**상황 번역**: 먼저 제곱의 평균 E(X^{2})을 구하고, 평균의 제곱을 뺍니다.\n**풀이**: E(X^{2}) = {{1 + 4 + 9 + 16§4}} = {{15§2}} → V(X) = {{15§2}} − ({{5§2}})^{2} = {{30 − 25§4}} = {{5§4}}\n**함정**: '평균의 제곱'과 '제곱의 평균'의 순서를 바꾸면 음수가 나옵니다. 분산은 항상 0 이상입니다.", "src": "변형 2"}, {"l": 1, "t": "self", "q": "확률변수 X에 대하여 E(X) = 3, V(X) = 4일 때, E(2X + 1)과 V(2X + 1)을 각각 구하시오.", "x": null, "s": "**정답: E(2X + 1) = 7, V(2X + 1) = 16**\n**신호 읽기**: aX + b → [보충] 공식표 둘째 줄. 평균은 그대로 변환, 분산은 a^{2}배\n**상황 번역**: 모든 상금을 2배로 하고 1원씩 더 주면 평균 상금도 2배 후 1원 증가합니다. 하지만 1원을 더 주는 것은 모두에게 같으므로 출렁임은 바꾸지 못합니다.\n**풀이**: E = 2 × 3 + 1 = 7. V = 2^{2} × 4 = 16\n**함정**: 분산에 b를 더하거나 a를 한 번만 곱하는 실수가 흔합니다. 분산은 '제곱 단위'라 a^{2}배입니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "한 개의 주사위를 3번 던질 때 1의 눈이 나오는 횟수를 X라 하자. P(X = 1)을 구하시오.", "x": "{{25§72}}|25/72", "s": "**신호 읽기**: \"3번 던질 때 ~가 나오는 횟수\" → 이항분포 B(3, {{1§6}})\n**상황 번역**: 성공(1의 눈)이 일어날 1번의 자리를 고르고(_{3}C_{1}), 성공 1번과 실패 2번의 확률을 곱합니다.\n**풀이**: _{3}C_{1} × {{1§6}} × ({{5§6}})^{2} = 3 × {{25§216}} = {{75§216}} = {{25§72}}\n**함정**: _{3}C_{1}을 빠뜨리면 '첫 번째에만 성공'한 확률이 됩니다. 성공이 몇 번째에 오는지 자리 고르기가 필요합니다.", "src": "변형 4"}, {"l": 2, "t": "self", "q": "확률변수 X가 이항분포 B(10, {{1§2}})을 따를 때, E(X)와 V(X)를 구하시오.", "x": null, "s": "**정답: E(X) = 5, V(X) = {{5§2}}**\n**신호 읽기**: B(n, p)가 주어지면 공식 E = np, V = np(1 − p)를 바로 씁니다.\n**상황 번역**: 한 판 몫 {{1§2}}, 판 수 10\n**풀이**: E = 10 × {{1§2}} = 5, V = 10 × {{1§2}} × {{1§2}} = {{5§2}}\n**함정**: 표준편차를 묻는다면 √{{{5§2}}}입니다. 분산과 표준편차를 구별합니다.", "src": "변형 5"}, {"l": 2, "t": "self", "q": "확률변수 X가 이항분포 B(n, p)를 따르고 E(X) = 6, V(X) = 4일 때, n과 p의 값을 구하시오.", "x": null, "s": "**정답: n = 18, p = {{1§3}}**\n**신호 읽기**: 평균과 분산이 주어지고 n, p를 묻는 문제 → 두 식을 나누면 n이 사라집니다.\n**상황 번역**: np = 6, np(1 − p) = 4\n**풀이**: 둘째 식 ÷ 첫째 식: 1 − p = {{4§6}} = {{2§3}} → p = {{1§3}}. n = {{6§1/3}} = 18\n**함정**: p는 0과 1 사이의 확률입니다. 구한 값이 이 범위인지 확인합니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "이항분포 B(n, p)의 기댓값이 np가 되는 이유를 '한 판 평균 몫' 비유로 서술하시오.", "x": null, "s": "**정답: 한 번 시행할 때 성공은 1, 실패는 0으로 세면 한 판의 평균 몫은 1 × p + 0 × (1 − p) = p이다. 같은 시행을 독립적으로 n번 반복하면 판마다 평균 p씩 쌓이므로 전체 평균 성공 횟수는 p를 n번 더한 np가 된다.**\n**신호 읽기**: 비유를 지정한 서술형 → '한 판 몫 × 판 수' 구조를 씁니다.\n**상황 번역**: 예: 성공 확률 {{1§5}}인 게임을 100판 하면 평균 20번 성공합니다.\n**풀이**: 한 판의 기댓값을 먼저 계산해 보이는 것이 핵심 근거입니다.\n**함정**: \"공식이니까\"는 근거가 아닙니다. 한 판의 기댓값이 p인 이유를 꼭 씁니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "확률변수 X의 확률분포가 P(X = 0) = {{1§5}}, P(X = 1) = a, P(X = 2) = {{2§5}}일 때, P(X ≥ 1)을 구하시오.", "x": "{{4§5}}|4/5", "s": "**신호 읽기**: 확률분포표에 미지수 a가 있음 → 이론에서 말한 '확률의 합 = 1'부터 세웁니다. \"P(X ≥ 1)\" → [보충] 범위 확률 읽기\n**상황 번역**: 표의 확률을 모두 더하면 1\n**풀이**: {{1§5}} + a + {{2§5}} = 1 → a = {{2§5}}. P(X ≥ 1) = a + {{2§5}} = {{4§5}} (뒷문: 1 − P(X = 0) = {{4§5}})\n**함정**: 사실 a를 몰라도 뒷문으로 바로 구할 수 있습니다. 두 방법이 같은 값인지 확인합니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "확률변수 X가 가지는 값이 1, 2, 3, 4이고 P(X = x) = kx일 때, 상수 k와 P(X ≥ 3)을 구하시오.", "x": null, "s": "**정답: k = {{1§10}}, P(X ≥ 3) = {{7§10}}**\n**신호 읽기**: P(X = x) = kx → 확률의 합 = 1로 k부터 구합니다.\n**상황 번역**: X = 1, 2, 3, 4의 확률은 k, 2k, 3k, 4k\n**풀이**: 10k = 1 → k = {{1§10}}. P(X ≥ 3) = {{3§10}} + {{4§10}} = {{7§10}}\n**함정**: '≥ 3'에는 3이 포함됩니다. 범위의 등호를 확인합니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "확률변수 X가 이항분포 B(n, p)를 따르고 E(X) = 10, V(X) = 6일 때, n, p와 E(X^{2})의 값을 구하시오.", "x": null, "s": "**정답: n = 25, p = {{2§5}}, E(X^{2}) = 106**\n**신호 읽기**: [고난도] 6번과 같은 방법으로 n, p를 구한 뒤, E(X^{2})은 분산 공식을 거꾸로 씁니다.\n**상황 번역**: V(X) = E(X^{2}) − {E(X)}^{2} → E(X^{2}) = V(X) + {E(X)}^{2}\n**풀이**: 1 − p = {{6§10}} → p = {{2§5}}, n = {{10§2/5}} = 25. E(X^{2}) = 6 + 10^{2} = 106\n**함정**: E(X^{2})을 {E(X)}^{2} = 100으로 착각하지 않습니다. 둘의 차이가 바로 분산입니다.", "src": "변형 10"}]}, {"id": "p7", "u": "J", "ex": "PS", "t": "7. Z 번역기론", "color": "보라", "emoji": "🟣", "en": "Theory of the Z-Translator", "th": [["p", "키, 점수, 무게처럼 어떤 구간의 모든 실수 값을 가질 수 있는 확률변수를 **연속확률변수**라 합니다. 연속확률변수에서는 확률을 **곡선 아래의 넓이**로 읽습니다. 곡선 아래 전체 넓이는 1이고, 한 점에서의 확률은 넓이가 없으므로 0입니다. 그래서 P(X ≤ a)와 P(X < a)는 같습니다."], ["p", "이런 값들은 대부분 평균 근처에 많이 모이고 양 끝으로 갈수록 드물어지는 종 모양으로 퍼집니다. 이것이 **정규분포** N(m, σ^{2})입니다. 정규분포 곡선은 x = m에 대하여 좌우 대칭이고, m에서 가장 높으며, σ가 클수록 낮고 넓게 퍼지고 작을수록 높고 뾰족해집니다."], ["p", "그런데 평균과 표준편차가 다른 정규분포는 서로 말이 통하지 않는 외국어와 같습니다. 국어 90점과 수학 72점은 그대로는 비교할 수 없지요. 그래서 모든 정규분포를 하나의 공용어, 표준정규분포 N(0, 1)로 번역하는 기계가 필요합니다. 그것이 **Z 번역기** Z = {{X − m§σ}}입니다. \"평균에서 표준편차 몇 칸 떨어져 있는가\"로 바꾸는 것이므로, 번역된 Z값만 보면 상대적인 위치가 바로 보입니다. 번역이 끝나면 표준정규분포표 하나로 모든 확률을 읽을 수 있습니다."], ["li", "**1:1 매칭 기호 독해법**: ==\"==N(m, σ^{2})==을 따를 때 확률\"== → Z = {{X − m§σ}}로 번역 후 표 읽기. ==\"상대적으로 더 우수한\"== → Z값 비교. ==\"상위 ~%\", \"확률이 ~일 때== k==\"== → 표를 거꾸로 읽어 z값을 찾은 뒤 X로 되돌리기."], ["p", "**[보충] 표준정규분포표 (이 책에서 사용)**"], ["tbl", [["z", "0.5", "1.0", "1.5", "2.0", "2.5"], ["P(0 ≤ Z ≤ z)", "0.1915", "0.3413", "0.4332", "0.4772", "0.4938"]]], ["p", "**[보충] 대칭 활용 규칙**: P(Z ≥ 0) = P(Z ≤ 0) = 0.5. P(Z ≤ −a) = P(Z ≥ a) = 0.5 − P(0 ≤ Z ≤ a). P(−a ≤ Z ≤ b) = P(0 ≤ Z ≤ a) + P(0 ≤ Z ≤ b). 표에는 0부터 오른쪽 넓이만 있으므로, 구하는 넓이를 항상 '0을 기준으로 한 조각'들로 나누어 읽습니다. 실제 자료 분석에서는 공학 도구로 확률을 구할 수도 있습니다."]], "sum": ["신호: \"정규분포를 따를 때\", \"상대적으로 우수한\" → **Z = {{X − m§σ}}**", "**1:1 매칭 기호 독해법**: ==\"==N(m, σ^{2})==을 따를 때 확률\"== → Z = {{X − m§σ}}로 번역 후 표 읽기. ==\"상대적으로 더 우수한\"== → Z값 비교. ==\"상위 ~%\", \"확률이 ~일 때== k==\"== → 표를 거꾸로 읽어 z값을 찾은 뒤 X로 되돌리기."], "fl": [["\"정규분포를 따를 때\", \"상대적으로 우수한\" — 이 신호를 보면 꺼낼 도구는?", "Z = {{X − m§σ}}"], ["z: P(0 ≤ Z ≤ z) → 0.5 / 1.0 / 1.5 / 2.0 / 2.5?", "0.1915 / 0.3413 / 0.4332 / 0.4772 / 0.4938"], ["1:1 매칭 기호 독해법이란?", "==\"==N(m, σ^{2})==을 따를 때 확률\"== → Z = {{X − m§σ}}로 번역 후 표 읽기. ==\"상대적으로 더 우수한\"== → Z값 비교. ==\"상위 ~%\", \"확률이 ~일 때== k==\"== → 표를 거꾸로 읽어 z값을 찾은 뒤 X로 되돌리기."]], "bk": {"q": "책을 덮고 「Z 번역기론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"정규분포를 따를 때\", \"상대적으로 우수한\"", "꺼낼 도구: Z = {{X − m§σ}}", "1:1 매칭 기호 독해법", "Z 번역", "대칭으로 쪼개기", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "확률변수 X가 정규분포 N(50, 10^{2})을 따를 때, P(40 ≤ X ≤ 70)을 위의 표를 이용하여 구하시오.", "x": null, "s": "**1. Z 번역** X = 40 → Z = −1, X = 70 → Z = 2\n**2. 대칭으로 쪼개기** P(−1 ≤ Z ≤ 0) + P(0 ≤ Z ≤ 2) = 0.3413 + 0.4772\n**3. 정산** 0.8185", "ck": ["Z 번역", "대칭으로 쪼개기", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "영희의 국어 점수는 90점, 수학 점수는 72점이다. 국어 점수는 정규분포 N(70, 10^{2}), 수학 점수는 정규분포 N(60, 8^{2})을 따를 때, 영희가 ==상대적으로 더 우수한== 과목을 말하시오.", "x": null, "s": "**1. 국어 번역** Z = {{90 − 70§10}} = 2\n**2. 수학 번역** Z = {{72 − 60§8}} = 1.5\n**3. 정산** 평균에서 표준편차 2칸 위인 국어가 상대적으로 더 우수합니다.", "ck": ["국어 번역", "수학 번역", "정산"], "src": "분당 기출", "ex": 1}, {"l": 3, "t": "self", "q": "어느 과자 한 봉지의 무게는 평균 100 g, 표준편차 4 g인 정규분포를 따른다. 임의로 고른 과자 한 봉지의 무게가 106 g ==이상==일 확률을 구하시오.", "x": null, "s": "**1. Z 번역** Z = {{106 − 100§4}} = 1.5\n**2. 오른쪽 꼬리 읽기** P(Z ≥ 1.5) = 0.5 − P(0 ≤ Z ≤ 1.5)\n**3. 정산** 0.5 − 0.4332 = 0.0668", "ck": ["Z 번역", "오른쪽 꼬리 읽기", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 3, "t": "self", "q": "확률변수 X가 정규분포 N(m, 4^{2})을 따르고 P(X ≥ 64) = 0.1587일 때, 상수 m의 값을 구하시오.", "x": null, "s": "**1. 표 거꾸로 읽기** 0.1587 = 0.5 − 0.3413이므로 오른쪽 꼬리 넓이가 0.1587인 경계는 z = 1\n**2. Z 번역 되돌리기** {{64 − m§4}} = 1\n**3. 정산** m = 60", "ck": ["표 거꾸로 읽기", "Z 번역 되돌리기", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "sa", "q": "확률변수 X가 정규분포 N(60, 4^{2})을 따를 때, P(X ≤ 64)를 구하시오.", "x": "0.8413", "s": "**신호 읽기**: \"N(60, 4^{2})을 따를 때 확률\" → Z 번역 후 표 읽기\n**상황 번역**: 64는 평균 60에서 표준편차 4의 1칸 위 → z = {{64 − 60§4}} = 1\n**풀이**: P(Z ≤ 1) = P(Z ≤ 0) + P(0 ≤ Z ≤ 1) = 0.5 + 0.3413 = 0.8413\n**함정**: 표의 값 0.3413은 0부터 1까지의 넓이뿐입니다. 왼쪽 절반 0.5를 더해야 '1 이하 전체'가 됩니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "확률변수 X가 정규분포 N(m, σ^{2})을 따를 때, P(m − 2σ ≤ X ≤ m + 2σ)를 구하시오.", "x": "0.9544", "s": "**신호 읽기**: m ± 2σ → 평균에서 양쪽으로 표준편차 2칸씩 → −2 ≤ Z ≤ 2\n**상황 번역**: Z 번역기를 쓰면 m, σ가 무엇이든 같은 질문이 됩니다.\n**풀이**: P(−2 ≤ Z ≤ 2) = 2 × 0.4772 = 0.9544\n**함정**: 대칭이므로 한쪽 넓이를 두 배 합니다. 0.5를 더하지 않습니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "확률변수 X가 정규분포 N(m, σ^{2})을 따를 때, P(X ≥ m)의 값을 그래프의 대칭성으로 설명하여 구하시오.", "x": "0.5", "s": "**신호 읽기**: \"대칭성으로 설명\" → 정규분포 곡선이 x = m에서 좌우 대칭이라는 성질을 씁니다.\n**상황 번역**: 곡선 아래 전체 넓이 1이 x = m을 기준으로 똑같은 두 조각으로 나뉩니다.\n**풀이**: P(X ≥ m) = {{1§2}} = 0.5\n**함정**: 이 값은 m, σ와 관계없이 항상 0.5입니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "어느 시험의 점수는 정규분포 N(70, 10^{2})을 따른다. 90점 이상인 학생은 전체의 몇 %인지 구하시오.", "x": null, "s": "**정답: 2.28%**\n**신호 읽기**: \"90점 이상인 학생은 몇 %\" → 확률을 구한 뒤 백분율로 바꿉니다.\n**상황 번역**: 90점은 평균 70에서 표준편차 10의 2칸 위 → z = 2\n**풀이**: P(Z ≥ 2) = 0.5 − 0.4772 = 0.0228 → 2.28%\n**함정**: 오른쪽 꼬리는 0.5에서 표의 값을 뺍니다. 더하면 0.9772(90점 이하)가 됩니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "확률변수 X가 정규분포 N(50, 10^{2})을 따를 때, P(X ≤ 35)를 구하시오.", "x": "0.0668", "s": "**신호 읽기**: 평균보다 작은 쪽의 확률 → 음수 z가 나옵니다. [보충] 대칭 규칙을 씁니다.\n**상황 번역**: z = {{35 − 50§10}} = −1.5. 왼쪽 꼬리 P(Z ≤ −1.5)는 대칭으로 오른쪽 꼬리 P(Z ≥ 1.5)와 같습니다.\n**풀이**: 0.5 − 0.4332 = 0.0668\n**함정**: 표에는 음수 z가 없습니다. 거울에 비춰 양수로 바꿔 읽습니다.", "src": "변형 5"}, {"l": 2, "t": "self", "q": "어느 시험의 점수는 정규분포 N(70, 10^{2})을 따른다. 상위 2.28% 안에 들려면 최소 몇 점 이상이어야 하는지 구하시오.", "x": null, "s": "**정답: 90점**\n**신호 읽기**: \"상위 2.28% 안에 들려면\" → 확률이 주어지고 점수를 묻는 문제 → 표를 거꾸로 읽고 Z 번역을 되돌립니다.\n**상황 번역**: 오른쪽 꼬리 넓이 0.0228 → 0.5 − 0.0228 = 0.4772 → 표에서 z = 2\n**풀이**: {{X − 70§10}} = 2 → X = 90\n**함정**: 4번 문항을 거꾸로 한 문제입니다. 번역(X → Z)과 되돌리기(Z → X)를 같은 식으로 처리합니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "서로 다른 정규분포를 따르는 두 점수를 비교할 때 Z = {{X − m§σ}}로 바꾸는 이유를 'Z 번역기' 비유로 서술하시오.", "x": null, "s": "**정답: 평균과 표준편차가 다른 두 분포는 서로 다른 언어와 같아서 점수를 그대로 비교할 수 없다. Z = {{X − m§σ}}는 각 점수를 '평균에서 표준편차 몇 칸 떨어져 있는가'라는 공용어로 번역하므로, 번역된 Z값끼리는 상대적인 위치를 바로 비교할 수 있다.**\n**신호 읽기**: 비유를 지정한 서술형 → '서로 다른 언어 → 공용어 번역'의 흐름을 씁니다.\n**상황 번역**: 예제 2처럼 국어 90점(Z = 2)과 수학 72점(Z = 1.5)은 번역 후에야 비교가 됩니다.\n**풀이**: 분자 X − m은 '평균과의 차이', 분모 σ는 '한 칸의 크기'라는 점까지 쓰면 완성입니다.\n**함정**: \"점수가 높으니까 잘했다\"는 비교는 틀릴 수 있습니다. 같은 90점도 평균과 흩어진 정도에 따라 위치가 다릅니다.", "src": "변형 7"}, {"l": 3, "t": "self", "q": "두 정규분포 N(50, 4^{2})과 N(50, 8^{2})의 곡선 중 더 높고 뾰족한 것을 고르고, 그 이유를 서술하시오.", "x": null, "s": "**정답: N(50, 4^{2})**\n**신호 읽기**: 두 정규분포의 평균은 같고 표준편차만 다릅니다 → [이론]의 곡선 모양 성질을 씁니다.\n**상황 번역**: 곡선 아래 전체 넓이는 둘 다 1로 같습니다. 같은 넓이를 좁은 폭에 담으면 높아지고, 넓은 폭에 퍼뜨리면 낮아집니다.\n**풀이**: 표준편차가 작은 N(50, 4^{2})이 평균 근처에 더 많이 모여 있으므로 더 높고 뾰족합니다. 두 곡선 모두 x = 50에서 가장 높고 좌우 대칭입니다.\n**함정**: 평균이 같으므로 곡선의 중심 위치는 같습니다. 달라지는 것은 퍼진 정도와 높이뿐입니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "확률변수 X가 정규분포 N(30, 2^{2})을 따르고 P(X ≤ k) = 0.9938일 때, 상수 k의 값을 구하시오.", "x": "k = 35|k=35|35", "s": "**신호 읽기**: 확률이 주어지고 k를 묻는 문제 → 표를 거꾸로 읽습니다.\n**상황 번역**: 0.9938 = 0.5 + 0.4938 → 표에서 0.4938은 z = 2.5\n**풀이**: {{k − 30§2}} = 2.5 → k = 35\n**함정**: 0.9938에서 0.5를 먼저 빼야 표에서 찾을 수 있습니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "확률변수 X가 정규분포 N(m, σ^{2})을 따르고 P(X ≥ 80) = 0.0228, P(X ≤ 50) = 0.1587일 때, m과 σ의 값을 구하시오.", "x": null, "s": "**정답: m = 60, σ = 10**\n**신호 읽기**: [고난도] 미지수가 m, σ 두 개이고 확률 조건도 두 개 → 각각 Z 번역식을 세워 연립합니다.\n**상황 번역**: 0.0228 = 0.5 − 0.4772 → 80은 z = 2 (오른쪽). 0.1587 = 0.5 − 0.3413 → 50은 z = −1 (왼쪽)\n**풀이**: {{80 − m§σ}} = 2, {{50 − m§σ}} = −1 → 80 − m = 2σ, m − 50 = σ. 더하면 30 = 3σ → σ = 10, m = 60\n**함정**: 왼쪽 꼬리 조건은 z가 음수입니다. 부호를 놓치면 연립방정식의 해가 틀어집니다.", "src": "변형 10"}]}, {"id": "p8", "u": "J", "ex": "PS", "t": "8. 국 한 숟가락 맛보기론", "color": "갈색", "emoji": "🟤", "en": "Theory of Tasting the Soup", "th": [["p", "커다란 솥에 끓인 국의 간을 보려고 국 전체를 다 마시는 사람은 없습니다. 국을 잘 저은 뒤 **한 숟가락**만 떠서 맛을 보고 솥 전체의 간을 짐작합니다. 통계적 추정이 바로 이 장면입니다. 솥 전체가 **모집단**, 한 숟가락이 **표본**, 국을 잘 젓는 것이 **임의추출**(모든 대상이 뽑힐 가능성을 같게 하는 것)입니다. 모집단 전체를 조사하는 전수조사는 시간과 비용이 너무 들거나(전국 고등학생의 키), 조사하면 대상이 망가지는 경우(전구의 수명)가 많아서 표본조사를 씁니다."], ["p", "한 숟가락의 맛(표본평균 ‾{X})은 뜰 때마다 조금씩 다릅니다. 그런데 숟가락이 클수록(표본의 크기 n이 클수록) 맛이 솥 전체의 맛에 가까워지고 덜 출렁입니다. 이것을 식으로 쓰면 다음과 같습니다."], ["p", "E(‾{X}) = m, V(‾{X}) = {{σ^{2}§n}}, σ(‾{X}) = {{σ§√{n}}}"], ["p", "모집단이 정규분포를 따르거나 n이 충분히 크면 ‾{X}는 정규분포 N(m, {{σ^{2}§n}})을 따릅니다. 그래서 유형 7의 Z 번역기를 표준편차 {{σ§√{n}}}로 바꿔 끼우면 표본평균의 확률도 구할 수 있습니다."], ["p", "이제 거꾸로, 한 숟가락의 맛 x̄를 보고 솥 전체의 맛 m이 있을 법한 범위를 말할 수 있습니다. P(−1.96 ≤ Z ≤ 1.96) = 0.95이므로 모평균 m의 **신뢰도** 95% **신뢰구간**은"], ["p", "x̄ − 1.96{{σ§√{n}}} ≤ m ≤ x̄ + 1.96{{σ§√{n}}}"], ["p", "입니다. 신뢰도 99%이면 1.96 대신 2.58을 씁니다."], ["li", "**1:1 매칭 기호 독해법**: ==\"크기가== n==인 표본의 표본평균\"== → 평균 m, 표준편차 {{σ§√{n}}}. ==\"신뢰도== 95% ==(==99%==)로 추정\"== → x̄ ± 1.96{{σ§√{n}}} (2.58). ==\"신뢰구간의 길이\"== → 2 × 1.96{{σ§√{n}}}. ==\"표본비율\"== → 모비율 추정."], ["p", "**[보충] 추정에 쓰는** z**값**"], ["tbl", [["신뢰도", "95%", "99%"], ["P(−z ≤ Z ≤ z)", "0.95", "0.99"], ["z", "1.96", "2.58"], ["신뢰구간의 길이", "2 × 1.96{{σ§√{n}}}", "2 × 2.58{{σ§√{n}}}"]]], ["p", "**[보충] 모비율 추정**: 크기가 n인 표본에서 어떤 특성을 가진 비율을 표본비율 p̂라 합니다. n이 충분히 크면 p̂는 근사적으로 평균 p, 표준편차 √{{{p(1 − p)§n}}}인 정규분포를 따르므로, 모비율 p의 신뢰도 95% 신뢰구간은 p̂ − 1.96√{{{p̂(1 − p̂)§n}}} ≤ p ≤ p̂ + 1.96√{{{p̂(1 − p̂)§n}}}입니다."], ["p", "**[보충] 신뢰구간 해석**: \"신뢰도 95%\"는 모평균이 이 구간 안에 있을 확률이 95%라는 뜻이 아닙니다(모평균은 정해진 하나의 값입니다). 같은 방법으로 표본을 뽑아 신뢰구간을 여러 번 만들면, 그 구간들 중 약 95%가 실제 모평균(모비율)을 포함한다는 뜻입니다. 신뢰도를 99%로 높이면 구간은 넓어지고, 표본의 크기 n을 키우면 구간은 좁아집니다."]], "sum": ["신호: \"표본평균\", \"신뢰도 95%로 추정\" → **σ(‾{X}) = {{σ§√{n}}}, x̄ ± 1.96{{σ§√{n}}}**", "**1:1 매칭 기호 독해법**: ==\"크기가== n==인 표본의 표본평균\"== → 평균 m, 표준편차 {{σ§√{n}}}. ==\"신뢰도== 95% ==(==99%==)로 추정\"== → x̄ ± 1.96{{σ§√{n}}} (2.58). ==\"신뢰구간의 길이\"== → 2 × 1.96{{σ§√{n}}}. ==\"표본비율\"== → 모비율 추정."], "fl": [["\"표본평균\", \"신뢰도 95%로 추정\" — 이 신호를 보면 꺼낼 도구는?", "σ(‾{X}) = {{σ§√{n}}}, x̄ ± 1.96{{σ§√{n}}}"], ["신뢰도: P(−z ≤ Z ≤ z) → 95% / 99%?", "0.95 / 0.99"], ["신뢰도: z → 95% / 99%?", "1.96 / 2.58"], ["신뢰도: 신뢰구간의 길이 → 95% / 99%?", "2 × 1.96{{σ§√{n}}} / 2 × 2.58{{σ§√{n}}}"]], "bk": {"q": "책을 덮고 「국 한 숟가락 맛보기론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"표본평균\", \"신뢰도 95%로 추정\"", "꺼낼 도구: σ(‾{X}) = {{σ§√{n}}}, x̄ ± 1.96{{σ§√{n}}}", "1:1 매칭 기호 독해법", "숟가락의 평균", "숟가락의 출렁임", "정산"]}, "pr": [{"l": 3, "t": "self", "q": "정규분포 N(50, 10^{2})을 따르는 모집단에서 ==크기가 25인 표본==을 임의추출할 때, 표본평균 ‾{X}의 평균과 표준편차를 구하시오.", "x": null, "s": "**1. 숟가락의 평균** E(‾{X}) = m = 50\n**2. 숟가락의 출렁임** σ(‾{X}) = {{σ§√{n}}} = {{10§√{25}}}\n**3. 정산** 평균 50, 표준편차 2", "ck": ["숟가락의 평균", "숟가락의 출렁임", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "정규분포 N(50, 10^{2})을 따르는 모집단에서 크기가 25인 표본을 임의추출할 때, P(‾{X} ≥ 53)을 유형 7의 표를 이용하여 구하시오.", "x": null, "s": "**1. 표본평균의 분포** ‾{X} ~ N(50, 2^{2})\n**2. Z 번역 (표준편차 2로)** Z = {{53 − 50§2}} = 1.5\n**3. 정산** P(Z ≥ 1.5) = 0.5 − 0.4332 = 0.0668", "ck": ["표본평균의 분포", "Z 번역 (표준편차 2로)", "정산"], "src": "분당 기출", "ex": 1}, {"l": 3, "t": "self", "q": "어느 고등학교 학생의 키는 표준편차가 10 cm인 정규분포를 따른다. 이 학교 학생 100명을 임의추출하여 키를 조사하였더니 평균이 170 cm였다. 모평균 m을 ==신뢰도== 95%==로 추정==한 신뢰구간을 구하시오.", "x": null, "s": "**1. 표본평균의 출렁임** {{σ§√{n}}} = {{10§√{100}}} = 1\n**2. 95% 번역기 장착** 170 − 1.96 × 1 ≤ m ≤ 170 + 1.96 × 1\n**3. 정산** 168.04 ≤ m ≤ 171.96", "ck": ["표본평균의 출렁임", "95% 번역기 장착", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 3, "t": "self", "q": "표준편차가 10인 정규분포를 따르는 모집단에서 크기가 n인 표본을 임의추출하여 모평균을 신뢰도 95%로 추정하였더니 ==신뢰구간의 길이가 3.92==였다. n의 값을 구하시오.", "x": null, "s": "**1. 길이 공식 세우기** 2 × 1.96 × {{10§√{n}}} = 3.92\n**2. 정리** {{39.2§√{n}}} = 3.92 → √{n} = 10\n**3. 정산** n = 100", "ck": ["길이 공식 세우기", "정리", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "self", "q": "정규분포 N(60, 8^{2})을 따르는 모집단에서 크기가 16인 표본을 임의추출할 때, 표본평균 ‾{X}의 평균과 표준편차를 구하시오.", "x": null, "s": "**정답: 평균 60, 표준편차 2**\n**신호 읽기**: \"크기가 16인 표본의 표본평균\" → 숟가락 맛의 평균과 출렁임을 묻습니다.\n**상황 번역**: 숟가락 맛의 평균은 솥 전체의 평균과 같고, 출렁임은 숟가락 크기의 제곱근으로 나눈 만큼 줄어듭니다.\n**풀이**: E(‾{X}) = 60, σ(‾{X}) = {{8§√{16}}} = 2\n**함정**: {{8§16}}으로 나누면 틀립니다. 표준편차는 √{n}으로 나눕니다.", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "모표준편차가 6인 모집단에서 크기가 9인 표본을 임의추출할 때, 표본평균 ‾{X}의 분산을 구하시오.", "x": "4|4개|4가지", "s": "**신호 읽기**: \"표본평균의 분산\" → V(‾{X}) = {{σ^{2}§n}}\n**상황 번역**: 분산은 표준편차의 제곱이므로 n으로 그대로 나눕니다.\n**풀이**: {{6^{2}§9}} = {{36§9}} = 4\n**함정**: 1번과 비교해 보면, 표준편차는 √{n}으로, 분산은 n으로 나눕니다.", "src": "변형 2"}, {"l": 1, "t": "sa", "q": "1번 문항의 표본평균 ‾{X}에 대하여 P(‾{X} ≤ 62)를 구하시오.", "x": "0.8413", "s": "**신호 읽기**: 표본평균의 확률 → 유형 7의 Z 번역기에 표준편차 {{σ§√{n}}}을 끼웁니다.\n**상황 번역**: ‾{X} ~ N(60, 2^{2}) → z = {{62 − 60§2}} = 1\n**풀이**: P(Z ≤ 1) = 0.5 + 0.3413 = 0.8413\n**함정**: 모표준편차 8로 번역하면 z = 0.25가 되어 틀립니다. 표본평균의 확률에는 표본평균의 표준편차를 씁니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "모표준편차가 16인 정규분포를 따르는 모집단에서 크기가 64인 표본을 임의추출하였더니 표본평균이 80이었다. 모평균 m에 대한 신뢰도 95%의 신뢰구간을 구하시오.", "x": "76.08 ≤ m ≤ 83.92|76.08<=m<=83.92", "s": "**신호 읽기**: \"신뢰도 95%의 신뢰구간\" → x̄ ± 1.96{{σ§√{n}}}\n**상황 번역**: 숟가락 맛 80을 중심으로, 숟가락 출렁임 {{16§√{64}}} = 2의 1.96배만큼 양쪽으로 펼칩니다.\n**풀이**: 1.96 × 2 = 3.92 → 80 − 3.92 ≤ m ≤ 80 + 3.92\n**함정**: 중심은 표본평균 x̄입니다. 모평균 m은 모르는 값이라 구간으로 추정합니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "모표준편차가 10인 정규분포를 따르는 모집단에서 크기가 100인 표본을 임의추출하였더니 표본평균이 50이었다. 모평균 m에 대한 신뢰도 99%의 신뢰구간을 구하시오.", "x": "47.42 ≤ m ≤ 52.58|47.42<=m<=52.58", "s": "**신호 읽기**: 신뢰도 99% → 1.96 대신 2.58\n**상황 번역**: {{σ§√{n}}} = {{10§10}} = 1\n**풀이**: 50 ± 2.58 × 1 → 47.42 ≤ m ≤ 52.58\n**함정**: 신뢰도를 높이면 구간이 넓어집니다. 95%일 때(48.04 ~ 51.96)보다 넓은지 확인합니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "모표준편차가 10인 정규분포를 따르는 모집단에서 크기가 25인 표본으로 모평균을 신뢰도 95%로 추정할 때, 신뢰구간의 길이를 구하시오.", "x": "7.84", "s": "**신호 읽기**: \"신뢰구간의 길이\" → 오른쪽 끝 − 왼쪽 끝 = 2 × 1.96{{σ§√{n}}}\n**상황 번역**: 길이에는 x̄가 들어가지 않습니다. 중심에서 양쪽으로 펼친 폭의 두 배입니다.\n**풀이**: 2 × 1.96 × {{10§5}} = 2 × 1.96 × 2 = 7.84\n**함정**: 2를 곱하는 것을 빠뜨리면 반쪽 길이 3.92가 됩니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "\"모평균 m의 신뢰도 95% 신뢰구간\"이 무엇을 뜻하는지 '국 한 숟가락 맛보기' 비유를 이용하여 서술하시오.", "x": null, "s": "**정답: 국을 잘 저은 뒤 한 숟가락씩 떠서 맛을 보고 '솥 전체의 간은 이 범위일 것'이라고 말하는 일을 여러 번 반복한다고 하자. 신뢰도 95% 신뢰구간이란, 이렇게 만든 범위들 중 약 95%가 실제 솥 전체의 간(모평균)을 포함하도록 만드는 방법으로 얻은 구간이라는 뜻이다. 모평균이 이 구간 안에 있을 확률이 95%라는 뜻은 아니다.**\n**신호 읽기**: 신뢰도의 뜻을 묻는 서술형 → [보충] 신뢰구간 해석의 핵심 두 문장(여러 번 반복, 약 95%가 포함)을 씁니다.\n**상황 번역**: 숟가락마다 맛이 조금씩 다르므로 범위도 매번 조금씩 달라집니다. 솥 전체의 간은 하나로 정해져 있습니다.\n**풀이**: '모평균은 움직이지 않고, 움직이는 것은 구간'이라는 대비를 쓰면 완성입니다.\n**함정**: \"모평균이 95% 확률로 이 안에 있다\"는 흔한 오해입니다. 이렇게 쓰면 감점됩니다.", "src": "변형 7"}, {"l": 3, "t": "self", "q": "같은 신뢰도로 모평균을 추정할 때 표본의 크기를 4배로 늘리면 신뢰구간의 길이는 몇 배가 되는지 구하고, 그 이유를 서술하시오.", "x": null, "s": "**정답: {{1§2}}배**\n**신호 읽기**: 표본 크기와 신뢰구간 길이의 관계 → 길이 공식 2 × 1.96{{σ§√{n}}}에서 n의 위치를 봅니다.\n**상황 번역**: 숟가락이 클수록 맛이 덜 출렁여 범위를 좁게 말할 수 있습니다. 그런데 출렁임은 n이 아니라 √{n}에 반비례합니다.\n**풀이**: n을 4배 → √{4n} = 2√{n} → 분모가 2배 → 길이는 {{1§2}}배\n**함정**: 4배로 늘렸으니 {{1§4}}배라고 생각하기 쉽습니다. 길이를 절반으로 줄이려면 표본을 4배로 늘려야 합니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "어느 지역 고등학생 400명을 임의추출하여 조사하였더니 60%가 아침 식사를 한다고 답하였다. 이 지역 고등학생 전체의 아침 식사 비율 p를 신뢰도 95%로 추정한 신뢰구간을 구하시오. (단, √{0.0006} = 0.0245로 계산하고, 소수점 아래 넷째 자리에서 반올림한다.)", "x": "0.552 ≤ p ≤ 0.648|0.552<=p<=0.648", "s": "**신호 읽기**: \"~%가 ~라고 답하였다\" + \"비율 p를 추정\" → [보충] 모비율 추정\n**상황 번역**: 표본비율 p̂ = 0.6이 숟가락 맛이고, 출렁임은 √{{{p̂(1 − p̂)§n}}}입니다.\n**풀이**: √{{{0.6 × 0.4§400}}} = √{0.0006} = 0.0245. 1.96 × 0.0245 = 0.04802 ≈ 0.048 → 0.6 ± 0.048\n**함정**: 모평균 추정과 구조는 같고, 표준편차 자리에 비율용 식이 들어간다는 점만 다릅니다.", "src": "변형 9"}, {"l": 3, "t": "sa", "q": "모표준편차가 5인 정규분포를 따르는 모집단에서 크기가 n인 표본을 임의추출하여 모평균을 신뢰도 95%로 추정할 때, 신뢰구간의 길이가 0.98 이하가 되도록 하는 n의 최솟값을 구하시오.", "x": "400|400개|400가지", "s": "**신호 읽기**: [고난도] \"길이가 0.98 이하가 되도록 하는 n의 최솟값\" → 길이 공식으로 부등식을 세웁니다.\n**상황 번역**: 길이 = 2 × 1.96 × {{5§√{n}}} = {{19.6§√{n}}}\n**풀이**: {{19.6§√{n}}} ≤ 0.98 → √{n} ≥ 20 → n ≥ 400 → 최솟값 400\n**함정**: n이 커질수록 길이가 줄어드므로 부등호 방향이 'n ≥'가 됩니다. 방향을 바꿔 '최댓값'으로 답하지 않습니다.", "src": "변형 10"}]}, {"id": "g1", "u": "K", "ex": "GE", "t": "1. 가로등과 담장 사이 등거리 산책론", "color": "빨강", "emoji": "🔴", "en": "Theory of the Equidistant Walk", "th": [["p", "공원에 가로등(점) 하나와 곧은 담장(직선) 하나가 있습니다. 강아지가 \"가로등까지의 거리와 담장까지의 거리가 **언제나 같도록**\" 산책하면 어떤 길이 생길까요? 가로등을 감싸며 담장 반대쪽으로 활짝 벌어지는 곡선, 바로 **포물선**입니다. 가로등이 **초점** F, 담장이 **준선**입니다."], ["p", "초점이 F(p, 0), 준선이 x = −p일 때 포물선 위의 점 P(x, y)에 대하여 ‾{PF} = (준선까지의 거리)이므로"], ["p", "√{(x − p)^{2} + y^{2}} = |x + p| ⇒ y^{2} = 4px"], ["p", "이 식은 외우는 공식이 아니라 \"두 거리가 같다\"는 문장을 그대로 번역한 결과입니다. 그래서 포물선 문제에서 **초점까지의 거리**가 나오면, 계산하기 어려운 대각선 거리를 계산하기 쉬운 **준선까지의 수직 거리**로 바꾸는 것이 핵심 전략입니다."], ["li", "**1:1 매칭 기호 독해법**: ==\"초점까지의 거리\"== → 준선까지의 거리로 바꾸기(y^{2} = 4px에서는 x + p, x^{2} = 4py에서는 준선 y = −p까지의 거리 y + p). ==\"==‾{PA} + ‾{PF}==의 최솟값\"== → ‾{PF}를 준선까지 거리로 바꾼 뒤 점 A에서 준선에 수선 긋기."], ["p", "**[보충] 포물선 방정식 정리표**"], ["tbl", [["방정식", "초점", "준선", "열리는 방향"], ["y^{2} = 4px", "(p, 0)", "x = −p", "p > 0이면 오른쪽"], ["x^{2} = 4py", "(0, p)", "y = −p", "p > 0이면 위쪽"], ["(y − n)^{2} = 4p(x − m)", "(p + m, n)", "x = −p + m", "y^{2} = 4px를 평행이동"]]], ["p", "**[보충]** 4p **읽기**: y^{2} = 8x라면 4p = 8에서 p = 2입니다. 방정식에서 4p 자리의 수를 4로 나누면 꼭짓점에서 초점까지의 거리가 나옵니다."]], "sum": ["신호: \"초점까지의 거리\", \"준선\" → **초점 거리 = 준선 거리, y^{2} = 4px**", "**1:1 매칭 기호 독해법**: ==\"초점까지의 거리\"== → 준선까지의 거리로 바꾸기(y^{2} = 4px에서는 x + p, x^{2} = 4py에서는 준선 y = −p까지의 거리 y + p). ==\"==‾{PA} + ‾{PF}==의 최솟값\"== → ‾{PF}를 준선까지 거리로 바꾼 뒤 점 A에서 준선에 수선 긋기."], "fl": [["\"초점까지의 거리\", \"준선\" — 이 신호를 보면 꺼낼 도구는?", "초점 거리 = 준선 거리, y^{2} = 4px"], ["방정식: y^{2} = 4px → 초점 / 준선 / 열리는 방향?", "(p, 0) / x = −p / p > 0이면 오른쪽"], ["방정식: x^{2} = 4py → 초점 / 준선 / 열리는 방향?", "(0, p) / y = −p / p > 0이면 위쪽"], ["방정식: (y − n)^{2} = 4p(x − m) → 초점 / 준선 / 열리는 방향?", "(p + m, n) / x = −p + m / y^{2} = 4px를 평행이동"]], "bk": {"q": "책을 덮고 「가로등과 담장 사이 등거리 산책론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호 문장: \"초점까지의 거리\", \"준선\"", "꺼낼 도구: 초점 거리 = 준선 거리, y^{2} = 4px", "1:1 매칭 기호 독해법", "4p 읽기", "가로등 찾기", "담장 찾기"]}, "pr": [{"l": 3, "t": "self", "q": "포물선 y^{2} = 8x의 ==초점의 좌표와 준선의 방정식==을 구하시오.", "x": null, "s": "**1. 4p 읽기** 4p = 8에서 p = 2\n**2. 가로등 찾기** 초점 F(2, 0)\n**3. 담장 찾기** 준선 x = −2", "ck": ["4p 읽기", "가로등 찾기", "담장 찾기"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "포물선 y^{2} = 8x 위의 점 P에서 ==초점까지의 거리가 6==일 때, 점 P의 x좌표를 구하시오.", "x": null, "s": "**1. 거리 바꿔 타기** 초점까지의 거리 = 준선 x = −2까지의 거리 = x + 2\n**2. 방정식 세우기** x + 2 = 6\n**3. 정산** x = 4", "ck": ["거리 바꿔 타기", "방정식 세우기", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "==초점이== F(0, 2)==이고 준선이== y = −2인 포물선의 방정식을 구하시오.", "x": null, "s": "**1. 정의 번역** 점 P(x, y)에 대하여 √{x^{2} + (y − 2)^{2}} = |y + 2|\n**2. 양변 제곱** x^{2} + y^{2} − 4y + 4 = y^{2} + 4y + 4\n**3. 정산** x^{2} = 8y", "ck": ["정의 번역", "양변 제곱", "정산"], "src": "교과서 연계", "ex": 1}, {"l": 3, "t": "self", "q": "포물선 y^{2} = 4x의 초점을 F, 점 A(5, 2)라 하자. 포물선 위의 점 P에 대하여 ‾{PA} + ‾{PF}==의 최솟값==을 구하시오.", "x": null, "s": "**1. 거리 바꿔 타기** 초점 F(1, 0), 준선 x = −1. 점 P에서 준선에 내린 수선의 발을 H라 하면 ‾{PF} = ‾{PH}\n**2. 일직선 만들기** 점 A는 포물선 안쪽(2^{2} < 4 × 5)에 있으므로, A를 지나는 수평선은 포물선과 한 점에서 만납니다. ‾{PA} + ‾{PH}는 A, P, H가 이 수평선 위에 있을 때 가장 짧습니다.\n**3. 정산** 점 A에서 준선까지의 거리 5 − (−1) = 6", "ck": ["거리 바꿔 타기", "일직선 만들기", "정산"], "src": "태원고 적중 변형", "ex": 1}, {"l": 1, "t": "self", "q": "포물선 y^{2} = 4x의 초점의 좌표와 준선의 방정식을 구하시오.", "x": null, "s": "**정답: 초점 (1, 0), 준선 x = −1**\n**신호 읽기**: y^{2} = 4px 꼴 → [보충] 4p 읽기로 가로등(초점)과 담장(준선)을 찾습니다.\n**상황 번역**: 4p = 4이므로 꼭짓점에서 가로등까지, 꼭짓점에서 담장까지의 거리가 모두 p = 1\n**풀이**: 초점 (1, 0), 준선 x = −1\n**함정**: 초점과 준선은 꼭짓점을 사이에 두고 반대쪽에 있습니다. 부호가 반대인지 확인합니다.", "src": "변형 1"}, {"l": 1, "t": "self", "q": "포물선 x^{2} = −8y의 초점의 좌표와 준선의 방정식을 구하시오.", "x": null, "s": "**정답: 초점 (0, −2), 준선 y = 2**\n**신호 읽기**: x^{2} = 4py 꼴 → 위아래로 열리는 포물선입니다.\n**상황 번역**: 4p = −8 → p = −2. p < 0이므로 가로등이 아래쪽에 있고 포물선은 아래로 열립니다.\n**풀이**: 초점 (0, p) = (0, −2), 준선 y = −p = 2\n**함정**: p가 음수일 때 준선은 y = −p이므로 양수 2가 됩니다.", "src": "변형 2"}, {"l": 1, "t": "self", "q": "초점이 F(3, 0)이고 준선이 x = −3인 포물선의 방정식을 구하시오.", "x": null, "s": "**정답: y^{2} = 12x**\n**신호 읽기**: 초점과 준선이 주어짐 → 꼭짓점은 둘의 한가운데, p는 그 거리\n**상황 번역**: 초점 (3, 0), 준선 x = −3 → 꼭짓점 원점, p = 3\n**풀이**: y^{2} = 4 × 3 × x = 12x\n**함정**: 정의로 직접 세워도 됩니다: √{(x − 3)^{2} + y^{2}} = |x + 3|을 제곱하면 y^{2} = 12x", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "포물선 y^{2} = 12x 위의 점 P에서 초점까지의 거리가 9일 때, 점 P의 x좌표를 구하시오.", "x": "6|6개|6가지", "s": "**신호 읽기**: \"초점까지의 거리\" → 담장(준선)까지의 거리로 바꿔 타는 신호입니다.\n**상황 번역**: 4p = 12 → p = 3, 준선 x = −3. 포물선 위의 점에서 담장까지 거리는 x + 3\n**풀이**: x + 3 = 9 → x = 6\n**함정**: 초점까지의 대각선 거리를 √{(x − 3)^{2} + y^{2}}로 계산하면 y까지 구해야 해 길어집니다.", "src": "변형 4"}, {"l": 2, "t": "self", "q": "포물선 y^{2} = 4px가 점 (2, 4)를 지날 때, 상수 p의 값과 초점의 좌표를 구하시오.", "x": null, "s": "**정답: p = 2, 초점 (2, 0)**\n**신호 읽기**: \"점을 지날 때\" → 그 점의 좌표를 방정식에 대입합니다.\n**상황 번역**: (2, 4)를 y^{2} = 4px에 넣습니다.\n**풀이**: 16 = 4p × 2 → p = 2 → 초점 (2, 0)\n**함정**: 구한 p로 초점을 바로 읽습니다. 확인: (2, 4)에서 초점까지 4, 준선 x = −2까지 4로 같습니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "포물선 x^{2} = 4y 위의 점 중에서 초점까지의 거리가 5인 점의 y좌표를 구하시오.", "x": "4|4개|4가지", "s": "**신호 읽기**: x^{2} = 4py에서 \"초점까지의 거리\" → 담장 y = −p까지의 거리 y + p\n**상황 번역**: 4p = 4 → p = 1, 준선 y = −1\n**풀이**: y + 1 = 5 → y = 4\n**함정**: 위아래로 열린 포물선에서는 x가 아니라 y로 거리를 잽니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "포물선 위의 점에서 초점까지의 거리를 준선까지의 거리로 바꾸어 계산하는 이유를 '가로등과 담장' 비유로 서술하시오.", "x": null, "s": "**정답: 포물선 위의 점은 가로등(초점)과 담장(준선)까지의 거리가 항상 같은 점들이다. 초점까지의 거리는 대각선이라 계산이 복잡하지만, 담장까지의 거리는 수직으로 재는 거리라 좌표 하나로 바로 계산된다. 두 거리가 같으므로 쉬운 쪽으로 바꾸어 구한다.**\n**신호 읽기**: 비유를 지정한 서술형 → 정의(두 거리가 같다)와 계산의 편리함을 함께 씁니다.\n**상황 번역**: 예: y^{2} = 4px 위의 점에서 초점까지의 거리는 x + p로 바로 나옵니다.\n**풀이**: 4번, 6번 문항이
