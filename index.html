"b4", "u": "G", "ex": "2-2", "t": "4. 인형 뽑기 껍질 벗기기론", "color": "초록", "emoji": "🟢", "en": "Theory of Shell Separation", "th": [["p", "함수 안에 또 함수 기계가 중첩되어 있는 합성함수 방정식 f(f(x)) = k는 겉면 껍질을 먼저 해석하지 않으면 알맹이 구조를 읽을 수 없는 '다단계식 레이아웃' 구조를 가집니다. 러시아 마트료시카 인형을 열 때 바깥쪽 큰 인형을 먼저 분리해야 안쪽 인형이 나오는 이치와 같습니다."], ["p", "따라서 안쪽 식 전체를 검은 포장지로 감싸 하나의 문자인 **[빨간 상자(**t**)]**로 치환하여 복잡성을 차단합니다. 1단계로 y축에서 출발하는 수평 가로선(y = k)을 그어 이 결과물을 만들어 낸 알맹이 상자의 진짜 정체(숫자)를 확보하고, 2단계로 포장 상자를 열어 원래 함수에 그 숫자들을 높이 삼아 2차 가로선을 그음으로써 최종 정답인 인형(x)의 좌표를 추적합니다."], ["li", "**대칭성 꿀팁**: 그래프가 대칭형 산 모양(텐트 형태)이라면 최종 근을 일일이 구할 필요가 없습니다. 모든 실근의 좌우 대칭축이 고정되어 있으므로 '==모든 실근의 합== = 대칭축의 위치 × 만나는 교점의 개수'라는 기하학적 직관으로 1초 만에 거품을 걷어 낼 수 있습니다."], ["p", "**[보충] 놓치기 쉬운 체크**: 2단계의 가로선이 치역 밖이면 교점이 0개입니다. 가로선이 꼭대기를 스치면 교점이 1개뿐입니다."]], "sum": ["신호: ==f(f(x)) = k== → 안쪽 f(x)를 **빨간 상자 t**로 치환", "1단계: f(t) = k → 가로선 y = k를 그어 상자 t의 값들을 확보", "2단계: 각 t마다 f(x) = t → 가로선 y = t를 다시 그어 교점의 개수·위치를 정산", "==대칭형== 그래프: 모든 실근의 합 = 대칭축 위치 × 교점 개수", "체크: 2단계 가로선이 치역 밖이면 0개, 꼭대기를 스치면 1개"], "fl": [["f(f(x)) = k를 보면 가장 먼저 할 일은?", "f(x) = t로 치환해 f(t) = k부터 푼다"], ["2단계에서 하는 일은?", "구한 t마다 가로선 y = t를 원래 그래프에 그어 교점을 센다"], ["대칭축이 x = 2인 텐트형 그래프에서 교점이 4개면 실근의 합은?", "2 × 4 = 8"], ["2단계 가로선이 치역 밖이면?", "교점 0개"]], "bk": {"q": "책을 덮고 「인형 뽑기 껍질 벗기기론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["f(x) = t 치환 (빨간 상자)", "1단계: 가로선 y = k로 t 확보", "2단계: 가로선 y = t로 x 확보", "대칭형이면 실근의 합 = 대칭축 × 교점 수", "치역 밖 0개, 꼭대기 1개 체크"]}, "pr": [{"l": 3, "t": "self", "q": "0 ≤ x ≤ 4에서 정의된 대칭형 텐트 모양의 함수 f(x)가 있다. (f(0) = 0, f(2) = 4, f(4) = 0) 방정식 f(f(x)) = 2의 ==모든 실근의 합==을 구하시오.", "x": null, "s": "**1. 1차 포장지 해독** 안쪽 f(x) = t로 치환해 f(t) = 2를 풉니다. 높이가 2인 곳에 가로선을 그으면 비례상 정확히 산의 절반인 t = 1과 t = 3이 나옵니다.\n**2. 2차 알맹이 해독** 상자를 열어 진짜 x의 최종 가로선 2개를 긋습니다. [스토리 A] f(x) = 1: 대칭인 두 근 발생. [스토리 B] f(x) = 3: 대칭인 두 근 발생.\n**3. 정산** 그래프는 x = 2를 기준으로 대칭이므로 각 스토리의 두 실근의 합은 축의 2배인 4입니다 → 4 + 4 = 8", "ck": ["1차 포장지 해독", "2차 알맹이 해독", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "정의역이 {x | 0 ≤ x ≤ 2}인 함수 f(x)의 그래프가 x = 1을 꼭대기로 하는 텐트 모양이다. (f(0) = 0, f(1) = 2, f(2) = 0) 이때 방정식 f(f(x)) = 1을 만족하는 ==모든 실근의 합==을 구하시오.", "x": null, "s": "**1. 1차 포장지 해독** 안쪽 f(x) = t로 묶어 f(t) = 1을 마주합니다. 꼭대기 높이가 2이므로 높이 1인 지점에 가로선을 그으면 t = 0.5와 t = 1.5가 나옵니다.\n**2. 2차 알맹이 해독** 포장을 찢어 최종 두 갈래 식 f(x) = 0.5, f(x) = 1.5를 만듭니다.\n**3. 정산** 그래프는 x = 1을 거울 축으로 대칭이므로 두 스토리의 합이 각각 2입니다 → 2 + 2 = 4", "ck": ["1차 포장지 해독", "2차 알맹이 해독", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "함수 f(x) = x^{2} − 2x − 3에 대하여 방정식 f(f(x)) = 0의 ==서로 다른 실근의 개수==를 구하시오.", "x": null, "s": "**1. 1차 포장지 해독** 안쪽 식을 t로 치환하여 f(t) = 0을 독해합니다. (t + 1)(t − 3) = 0에서 t = −1, 3이 상자의 진짜 정체입니다.\n**2. 2차 알맹이 해독** 그래프 f(x) = (x − 1)^{2} − 4는 꼭짓점 높이가 −4인 아래로 볼록한 그릇 모양입니다. f(x) = −1 가로선은 꼭짓점보다 위이므로 교점 2개, f(x) = 3 가로선도 교점 2개입니다.\n**3. 정산** 교점을 모두 더합니다 → 2 + 2 = 4개", "ck": ["1차 포장지 해독", "2차 알맹이 해독", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "함수 f(x) = x^{2} − 4x + 3에 대하여 방정식 ==f(f(x)) = 3==의 모든 실근의 합을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** f(f(x)) = k → 안쪽 f(x)를 빨간 상자 t로 치환합니다.\n**2. 1단계: 상자 값 확보** f(t) = 3 → t^{2} − 4t = 0 → t = 0 또는 t = 4\n**3. 2단계: 가로선 다시 긋기** f(x) = 0 → x = 1, 3 (2개), f(x) = 4 → x^{2} − 4x − 1 = 0 → x = 2 ± √{5} (2개)\n**4. 대칭 정산** 그래프가 x = 2에 대해 대칭이므로 실근 4개의 합 = 2 × 4 = 8\n**정답: 8**", "ck": ["신호 문장 찾기", "1단계: 상자 값 확보", "2단계: 가로선 다시 긋기", "대칭 정산"], "src": "수능 스타일", "ex": 1}, {"l": 1, "t": "sa", "q": "함수 f(x)가 최고차항의 계수가 1인 이차함수이고 축이 x = 3이다. f(f(x)) = 0의 서로 다른 실근의 개수가 2일 때, f(3)의 값은?", "x": "0|0개|0가지", "s": "f(x) = t로 치환하면 외곽 식은 f(t) = 0입니다. 축이 x = 3이므로 f(x) = (x − 3)^{2} + f(3)입니다. 꼭짓점 높이 f(3)이 0보다 위면 상자가 아예 없고(실근 0개), 0보다 아래면 상자 t가 2개 생기고 둘 다 꼭짓점보다 높아서 교점이 2개씩 총 4개입니다. 실근이 딱 2개인 것은 꼭짓점이 x축에 닿아(f(3) = 0) 상자가 t = 3 하나뿐이고, 가로선 y = 3이 산을 두 번 관통할 때뿐입니다((x − 3)^{2} = 3, x = 3 ± √{3}).", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "텐트형 함수 f(x)가 f(0) = 0, f(1) = 2, f(2) = 0을 만족할 때, f(f(x)) = 1.5의 모든 실근의 합을 구하시오.", "x": "4|4개|4가지", "s": "f(t) = 1.5를 풀면 t = 0.75, 1.25입니다. 두 가로선 모두 교점이 2개씩이고 대칭축이 x = 1이므로 각 스토리의 합은 1 × 2 = 2, 총합은 2 + 2 = 4입니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "f(x)가 증가함수일 때, 방정식 f(f(x)) = x의 기하학적 의미는 함수 y = f(x)의 그래프와 어떤 직선의 교점을 찾는 문맥인지 기술하시오.", "x": ["직선 y = x", "직선 y = −x", "x축", "y축", "직선 y = 1"], "s": "f가 증가함수이면 f(x) > x인 곳에서는 f(f(x)) > f(x) > x, f(x) < x인 곳에서는 f(f(x)) < x가 되어 등호가 성립할 수 없습니다. 따라서 해는 y = f(x)가 거울선 y = x와 만나는 교점과 일치합니다.", "src": "변형 3"}, {"l": 2, "t": "sa", "q": "f(x) = −x + 2일 때, 방정식 f(f(x)) = 0을 만족하는 진짜 x의 값을 구하시오.", "x": "x = 0|x=0|0", "s": "f(t) = 0에서 −t + 2 = 0 → t = 2. f(x) = 2 → −x + 2 = 2 → x = 0.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "f(x) = x^{2} − 2x일 때, 방정식 f(f(x)) = −1을 만족하는 모든 실근의 합을 구하시오.", "x": "2|2개|2가지", "s": "f(t) = −1에서 t^{2} − 2t = −1 → (t − 1)^{2} = 0 → t = 1(중근). f(x) = 1 → x^{2} − 2x − 1 = 0. 근과 계수의 관계 (−{{b§a}})에 의해 실근의 합은 2입니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "0 ≤ x ≤ 2에서 정의된 대칭형 텐트 모양의 함수 f(x)가 f(0) = 0, f(1) = 2, f(2) = 0을 만족할 때, f(f(x)) = 0.5의 실근의 개수는?", "x": "4개|4|4가지", "s": "f(t) = 0.5를 풀면 t = 0.25, 1.75입니다. 두 값 모두 산의 높이 범위 0 ≤ y ≤ 2 안에 있으므로 각 가로선이 교점을 2개씩 만들어 총 4개입니다.", "src": "변형 6"}, {"l": 2, "t": "self", "q": "f(x)의 세 근이 1, 2, 3일 때, f(f(x)) = 0을 만족하는 상자 t의 조건과 단계별 풀이 레이아웃을 서술하시오.", "x": null, "s": "**정답: t = 1, 2, 3의 가로선을 원래 그래프에 긋고 만나는 교점의 x좌표를 추적한다.**\n안쪽 함수를 상자로 싸서 f(t) = 0 구조로 바꿉니다. f의 근이 1, 2, 3이므로 상자 t는 정확히 1, 2, 3입니다. 이 값을 높이 삼아 y = 1, y = 2, y = 3 가로선을 긋고 교점을 정산하는 레이아웃을 서술합니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "f(x)의 그래프가 다섯 점 (0, 3), (1, 0), (2, 3), (3, 0), (4, 3)을 차례로 이은 W모양이다. f(f(x)) = 3을 만족하는 실근의 개수를 구하는 과정을 쓰시오.", "x": "6개|6|6가지", "s": "f(t) = 3 가로선은 W의 위 꼭짓점 세 곳(t = 0, 2, 4)을 스칩니다. 이 값을 높이 삼아 다시 가로선을 그으면 y = 0은 바닥 꼭짓점 2곳(x = 1, 3), y = 2는 네 직선 구간을 하나씩 지나 4곳, y = 4는 최고 높이 3을 넘어 0곳입니다. 합계 2 + 4 + 0 = 6개입니다.", "src": "변형 8"}, {"l": 3, "t": "sa", "q": "f(0) = 1, f(1) = 0, f(2) = 2이고 세 점을 차례로 선분으로 이은 함수 f(x) (0 ≤ x ≤ 2)에 대하여 f(f(x)) = 2의 실근을 구하시오.", "x": "x = 2|x=2|2", "s": "f(t) = 2를 만족하는 상자는 그래프에서 높이 2인 오른쪽 끝 한 점뿐이므로 t = 2입니다. f(x) = 2도 같은 이유로 x = 2 하나입니다.", "src": "변형 9"}, {"l": 3, "t": "mc", "q": "f(x) = |x − 1|일 때, f(f(x)) = 0의 해를 구하시오.", "x": ["x = 0 또는 x = 2", "x = 1", "x = 0", "x = 2", "x = −1 또는 x = 1"], "s": "f(t) = 0에서 |t − 1| = 0 → t = 1. f(x) = 1 → |x − 1| = 1 → x − 1 = ± 1 → x = 0 또는 x = 2.", "src": "변형 10"}]}, {"id": "b5", "u": "G", "ex": "2-2", "t": "5. 3:3 미팅 매너론", "color": "파랑", "emoji": "🔵", "en": "Theory of One-to-One Match", "th": [["p", "역함수의 대원칙은 원래 함수가 '일대일 대응(One-to-One Correspondence)'이어야 한다는 것입니다. 역함수란 화살을 맞은 공역의 원소들이 뒤를 돌아 자기를 쏜 정의역을 향해 거꾸로 화살표를 되돌려 주는 역연산입니다. 만약 원래 함수가 위아래로 출렁이는 형태여서 서로 다른 두 명이 공역의 똑같은 한 원소를 찍었다면, 되감기를 할 때 화살표를 누구에게 돌려줘야 할지 몰라 모순이 생깁니다. 따라서 정의역과 공역이 실수 전체인 함수라면, 그래프가 도중에 끊겨서 공백이 생기거나 방향을 꺾어 오르락내리락하지 않고 한 방향으로만 영원히 전진(증가 또는 감소)해야 합니다."], ["li", "**실전 문제의 숨은 문맥**: 내신 시험에서 \"==역함수가 존재할 때==\"라는 문장을 만나면 \"그래프가 도중에 꺾이지 않고 한 방향으로만 쭉 뻗어 나가도록 기울기의 부호를 통일해라\"라는 행동 강령으로 읽어 내세요."], ["p", "**[보충] 구간별 직선 함수 체크 3단계**"], ["oli", "**연결**: 경계에서 두 조각이 붙어 있는가? (떨어져 있으면 빈 의자나 겹치는 지목이 생깁니다.)"], ["oli", "**방향 통일**: 모든 조각의 기울기 부호가 같은가? 두 조각이면 (첫 조각의 기울기) × (둘째 조각의 기울기) > 0."], ["oli", "**기울기 0 금지**: 평평한 구간이 있으면 여러 사람이 같은 값을 지목합니다."], ["p", "**[보충] 거울 보너스**: y = f(x)와 y = f^{−1}(x)는 직선 y = x에 대하여 대칭입니다. f가 ==증가함수==이면 두 그래프의 교점은 모두 y = x 위에 있으므로 f(x) = x를 풀면 됩니다."]], "sum": ["신호: \"==역함수가 존재==할 때\" → **일대일 대응**이어야 한다", "그래프가 꺾이지 않고 한 방향으로만: **기울기 부호 통일**", "구간별 직선 함수 3단계: ① 경계에서 연결 ② 기울기 부호 같음 (곱 > 0) ③ 기울기 0 금지", "절댓값 함수는 꺾이는 점에서 구간을 나눠 각 구간의 기울기를 확인", "거울 보너스: y = f(x)와 y = f^{−1}(x)는 y = x 대칭 · f가 ==증가함수==면 교점은 f(x) = x로"], "fl": [["\"역함수가 존재한다\"를 행동 강령으로 바꾸면?", "기울기의 부호를 통일해 한 방향으로만 뻗게 하라"], ["두 조각 직선 함수가 역함수를 가질 조건(기울기)?", "(첫 조각 기울기) × (둘째 조각 기울기) > 0"], ["일대일 함수와 일대일 대응의 차이는?", "일대일 대응은 치역 = 공역 (빈 의자가 없다)"], ["f가 증가함수일 때 y = f(x)와 역함수의 교점은?", "모두 직선 y = x 위 → f(x) = x를 푼다"]], "bk": {"q": "책을 덮고 「3:3 미팅 매너론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["역함수 존재 ⇔ 일대일 대응", "기울기 부호 통일", "경계에서 연결", "기울기 곱 > 0, 기울기 0 금지", "절댓값은 구간을 나눠 기울기 확인", "증가함수면 교점은 y = x 위"]}, "pr": [{"l": 3, "t": "self", "q": "구간에 따라 나누어진 함수 f(x) = ⦃(k − 3)x + 1 (x ≥ 0)¦(2k + 1)x + 1 (x < 0)⦄의 ==역함수가 존재==하도록 하는 k의 범위를 구하시오.", "x": null, "s": "**1. 연속성 독해** 경계선 x = 0에서 두 직선이 y = 1로 꼭 붙어 맞물려 있습니다. 끊어진 공백 지역이 없습니다.\n**2. 기울기 부호 일치** 미팅 화살표가 꼬이지 않으려면 두 구간 직선의 기울기 부호(방향)가 같아야 합니다.\n**3. 정산** (오른쪽 기울기) × (왼쪽 기울기) > 0을 적용합니다. (k − 3)(2k + 1) > 0 ⇒ k < −{{1§2}} 또는 k > 3", "ck": ["연속성 독해", "기울기 부호 일치", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "실수 전체의 집합에서 정의된 함수 f(x) = (2 − a)x + |x − 1|의 ==역함수가 존재==할 때, 실수 a의 값의 범위를 구하시오.", "x": null, "s": "**1. 절댓값 구간 분할 문맥** 절댓값 내부가 0이 되는 x = 1을 기준으로 두 토막으로 나눕니다. x ≥ 1일 때 f(x) = (3 − a)x − 1, x < 1일 때 f(x) = (1 − a)x + 1\n**2. 기울기 곱 양수 필터 가동** 두 직선의 기울기 부호가 같아야 하므로 곱이 양수여야 합니다.\n**3. 정산** (3 − a)(1 − a) > 0 ⇒ a < 1 또는 a > 3", "ck": ["절댓값 구간 분할 문맥", "기울기 곱 양수 필터 가동", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "함수 f(x) = ⦃(a + 3)x − 1 (x < 0)¦(2 − a)x − 1 (x ≥ 0)⦄의 ==역함수가 존재==하도록 하는 정수 a의 개수를 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"역함수가 존재\" → 일대일 대응, 그래프가 한 방향으로만 뻗어야 합니다.\n**2. 경계 연결 확인** x = 0에서 두 식 모두 −1 → 이미 연결되어 있습니다.\n**3. 기울기 부호 통일** (a + 3)(2 − a) > 0 → −3 < a < 2 (기울기 0도 자동 제외)\n**4. 정산** a = −2, −1, 0, 1 → 4개\n**정답: 4**", "ck": ["신호 문장 찾기", "경계 연결 확인", "기울기 부호 통일", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "함수 f(x) = x^{2} − 2x + 2 (x ≥ 1)의 역함수를 g(x)라 할 때, 두 곡선 y = f(x), y = g(x)의 두 교점을 양 끝점으로 하는 선분의 길이를 구하시오.", "x": null, "s": "**1. 일대일 대응 문맥 독해** f(x) = (x − 1)^{2} + 1은 x ≥ 1에서 끊어짐 없이 한 방향으로 증가하므로 역함수가 존재합니다.\n**2. 거울선과의 교점 파악** 증가함수와 그 역함수의 교점은 거울선 y = x와의 교점입니다. x^{2} − 2x + 2 = x → x^{2} − 3x + 2 = 0 → x = 1, 2\n**3. 정산** 교점 (1, 1), (2, 2) 사이의 거리 → √{(2 − 1)^{2} + (2 − 1)^{2}} = √{2}", "ck": ["일대일 대응 문맥 독해", "거울선과의 교점 파악", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 1, "t": "mc", "q": "함수 f(x) = (a − 5)x + 3이 실수 전체에서 역함수를 갖기 위한 a의 조건은?", "x": ["a ≠ 5", "a = 5", "a > 5", "a < 5", "a ≠ 0"], "s": "일차함수가 실수 전체에서 역함수를 가지려면 기울기가 0이 되면 안 됩니다. a − 5 ≠ 0 → a ≠ 5", "src": "변형 1"}, {"l": 1, "t": "sa", "q": "구간별 함수 f(x) = ⦃2x + 1 (x ≥ 1)¦(m − 1)x + 2 (x < 1)⦄의 역함수가 존재하기 위한 m의 값은?", "x": "m = 2|m=2|2", "s": "경계 x = 1에서 오른쪽 직선은 2 + 1 = 3, 왼쪽 직선은 (m − 1) + 2 = m + 1입니다. 둘이 붙어 있지 않으면 빈 의자(공백)나 겹치는 지목이 생기므로 m + 1 = 3 → m = 2입니다. 이때 왼쪽 기울기 m − 1 = 1이 오른쪽 기울기 2와 부호가 같아 화살표도 꼬이지 않습니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "함수 f(x) = |x − 2| + kx + 5의 역함수가 존재하지 않도록 하는 정수 k를 모두 구하시오.", "x": ["−1, 0, 1", "0", "−1, 1", "−2, −1, 0, 1, 2", "0, 1"], "s": "x ≥ 2 → (k + 1)x + 3, x < 2 → (k − 1)x + 7입니다. 역함수가 존재하려면 (k + 1)(k − 1) > 0 → k < −1 또는 k > 1이므로, 역함수가 존재하지 않는 정수 k는 −1, 0, 1입니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "일대일 대응과 일대일 함수의 차이를 미팅룸의 '공역 공백 의자' 개념으로 설명하시오.", "x": null, "s": "**정답: 일대일 함수는 공역에 화살표를 받지 못한 '빈 의자'가 있어도 되지만, 일대일 대응은 치역과 공역이 일치하여 남는 의자가 없어야 한다.**\n역함수가 존재하려면 되감기를 했을 때 모든 공역 원소가 화살표를 내보내야 하므로 빈 의자가 허용되지 않습니다.", "src": "변형 4"}, {"l": 2, "t": "mc", "q": "역함수가 존재하는 함수 f(x)가 증가함수일 때, y = f(x)와 그 역함수의 교점은 항상 어떤 직선 위에 존재하는가?", "x": ["직선 y = x", "직선 y = −x", "x축", "y축", "직선 x = 1"], "s": "증가함수와 그 역함수의 교점은 원래 함수와 거울선 y = x의 교점과 같으므로 항상 y = x 위에 있습니다.", "src": "변형 5"}, {"l": 2, "t": "mc", "q": "함수 f(x) = (3 − 2k)x + 7의 역함수가 존재하지 않도록 만드는 k의 값을 구하시오.", "x": ["k = {{3§2}}", "k = {{2§3}}", "k = 3", "k = −{{3§2}}", "k = 0"], "s": "기울기를 0으로 만들어 직선을 눕히면 역함수가 존재하지 않습니다. 3 − 2k = 0 → k = {{3§2}}", "src": "변형 6"}, {"l": 2, "t": "sa", "q": "집합 X = {1, 2, 3}에서 X로의 함수 중 역함수가 존재하는 함수의 총 개수를 구하시오.", "x": "6개|6|6가지", "s": "역함수가 존재하려면 세 손님 1, 2, 3이 겹침 없이 세 의자에 앉는 일대일 대응이어야 합니다. 3! = 6", "src": "변형 7"}, {"l": 3, "t": "mc", "q": "f(x) = x^{2} − 4x + 6 (x ≥ a)의 역함수가 존재하고, 원래 함수와 역함수의 교점이 1개가 되도록 하는 a의 범위는?", "x": ["2 < a ≤ 3", "a ≥ 2", "2 ≤ a < 3", "a > 3", "2 < a < 3"], "s": "역함수가 존재하려면 축 x = 2 기준으로 한쪽 날개만 써야 하므로 a ≥ 2입니다. 증가하는 날개와 역함수의 교점은 y = x와의 교점이므로 x^{2} − 4x + 6 = x → x^{2} − 5x + 6 = 0, 즉 x = 2, 3 중 정의역 x ≥ a 안에 들어오는 것만 남습니다. a = 2이면 2개, 2 < a ≤ 3이면 1개, a > 3이면 0개입니다.", "src": "변형 8"}, {"l": 3, "t": "mc", "q": "함수 f(x) = |x + 1| − |x − 3| + ax의 역함수가 존재하도록 하는 a의 범위를 구하시오.", "x": ["a < −2 또는 a > 0", "a > 0", "−2 < a < 0", "a < −2", "a ≠ 0"], "s": "x = −1과 x = 3을 기준으로 세 토막으로 나누면 기울기는 x > 3일 때 a, −1 ≤ x ≤ 3일 때 a + 2, x < −1일 때 a입니다. 부호가 모두 같아야 하므로 a(a + 2) > 0 → a < −2 또는 a > 0", "src": "변형 9"}, {"l": 3, "t": "self", "q": "역함수 구조에서 f(a) = b ⇔ f^{−1}(b) = a가 성립하는 본질적 이유를 '화살표 되감기' 비유로 서술하시오.", "x": null, "s": "**정답: 원래 함수 f가 a라는 원소에서 출발해 b를 맞혔다면, 역함수 f^{−1}는 b에서 출발해 화살표를 쐈던 a로 그대로 되돌아가는 되감기이기 때문이다.**\n일대일 대응이라면 화살표의 꼬리와 머리를 바꿔 거꾸로 감아도 엇갈림 없이 원래 출발점에 정확히 도착한다는 점을 서술합니다.", "src": "변형 10"}]}, {"id": "b6", "u": "H", "ex": "2-2", "t": "6. 자석의 밀어내는 힘론", "color": "남색", "emoji": "🔷", "en": "Theory of Asymptotic Symmetry", "th": [["p", "분수꼴 유리함수 그래프의 구조적 본질은 분모를 0으로 만들 수 없다는 금지에서 탄생하는 '점근선의 대칭성'입니다. 유리함수 우주에는 절대로 넘어서는 안 되는 수평·수직의 가이드라인(==점근선==)이 존재하며, 그래프는 이 선이라는 강력한 자석에 밀려 무한히 가까워지되 절대 닿지 못합니다. 이 두 자석 선이 직교하는 단 하나의 교점은 이 우주의 **심장(대칭의 중심점)**이 되며, 곡선은 이 심장을 지나는 기울기 ± 1인 두 대각선 거울에 대해 완벽한 선대칭을 이룹니다."], ["li", "**시각화 독해 비법**: ==대칭축==이나 ==점근선== 이야기가 나오면 식 변형부터 하지 말고 \"이 우주의 심장 좌표 (p, q)가 어디지?\"부터 찾으세요. 모든 대칭 직선은 무조건 이 심장을 지나야 대칭축의 자격을 얻습니다."], ["p", "**[보충] 심장 읽는 법**"], ["tbl", [["주어진 식", "심장 읽는 법"], ["y = {{k§x − p}} + q", "바로 (p, q)"], ["y = {{ax + b§cx + d}} (c ≠ 0, ad − bc ≠ 0)", "수직 점근선 x = −{{d§c}}, 수평 점근선 y = {{a§c}}"], ["대칭축", "y = (x − p) + q, y = − (x − p) + q"]]], ["p", "**[보충] 거리의 합 최솟값**: 그래프 위의 점에서 두 점근선까지의 거리는 |x − p|와 {{|k|§|x − p|}} 꼴이므로, 합의 최솟값은 절대부등식(산술평균과 기하평균의 관계)으로 2√{|k|}입니다."]], "sum": ["신호: ==점근선==, ==대칭== → 수식 변형보다 먼저 **심장 좌표 (p, q)**", "y = {{k§x − p}} + q → 점근선 x = p, y = q · 심장 (p, q)", "y = {{ax + b§cx + d}} → 수직 점근선 x = −{{d§c}}, 수평 점근선 y = {{a§c}}", "대칭축은 심장을 지나는 기울기 ±1 직선: y = (x − p) + q, y = −(x − p) + q", "그래프 위 점에서 두 점근선까지 거리 합의 최솟값 = 2√{|k|}"], "fl": [["y = {{2x − 1§x + 1}}의 심장 좌표는?", "(−1, 2)"], ["y = {{ax + b§cx + d}}의 수평 점근선은?", "y = {{a§c}}"], ["유리함수의 대칭축 기울기는?", "1 또는 −1, 반드시 심장 (p, q)를 지난다"], ["y = {{k§x − p}} + q 위의 점에서 두 점근선까지 거리 합의 최솟값은?", "2√{|k|} (산술·기하평균)"]], "bk": {"q": "책을 덮고 「자석의 밀어내는 힘론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["신호: 점근선, 대칭 → 심장 (p, q)", "y = k/(x − p) + q 의 점근선", "y = (ax + b)/(cx + d)의 점근선 x = −d/c, y = a/c", "대칭축 y = ±(x − p) + q", "점대칭의 중심 = 심장", "거리 합 최솟값 2√|k|"]}, "pr": [{"l": 3, "t": "self", "q": "유리함수 y = {{2x + 5§x − 1}}의 그래프가 두 직선 y = x + a와 y = −x + b에 대하여 각각 ==선대칭==일 때, a + b의 값을 구하시오.", "x": null, "s": "**1. 심장 좌표 추출** 분수 식을 쪼개어 점근선을 읽습니다. y = {{2(x − 1) + 7§x − 1}} = {{7§x − 1}} + 2 → 심장은 (1, 2)\n**2. 직선 관통 매칭** 두 직선은 그래프를 반으로 접는 거울선이므로 반드시 심장 (1, 2)를 지나야 합니다.\n**3. 정산** 2 = 1 + a → a = 1, 2 = −1 + b → b = 3 → a + b = 4", "ck": ["심장 좌표 추출", "직선 관통 매칭", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "유리함수 f(x) = {{ax + 1§2x − c}}의 그래프의 ==점근선==의 방정식이 x = 2, y = 1일 때, 상수 a, c의 합 a + c의 값을 구하시오.", "x": null, "s": "**1. 자석 바리케이드 역추적** 점근선이 x = 2, y = 1이라는 말은 심장이 (2, 1)이라는 뜻입니다.\n**2. 분모 공식 대입** 분모 2x − c가 x = 2에서 0이 되어야 하므로 4 − c = 0 → c = 4\n**3. 높이 공식 대입** x계수끼리의 비율 {{a§2}}가 수평 점근선 높이 1이 되어야 하므로 {{a§2}} = 1 → a = 2\n**4. 정산** a + c = 2 + 4 = 6", "ck": ["자석 바리케이드 역추적", "분모 공식 대입", "높이 공식 대입", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "함수 y = {{2x + 5§x + 1}}의 그래프가 점 (a, b)에 대하여 ==대칭==이고, 직선 y = x + c에 대하여 ==대칭==일 때, a + b + c의 값을 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"대칭\" → 수식 변형보다 먼저 심장 좌표 (p, q)\n**2. 심장 찾기** y = {{3§x + 1}} + 2 → 점근선 x = −1, y = 2, 심장 (−1, 2) → a = −1, b = 2\n**3. 대칭축** 대칭축은 심장을 지나는 기울기 ±1 직선 → y = x + c가 (−1, 2)를 지나야 하므로 c = 3\n**4. 정산** a + b + c = −1 + 2 + 3 = 4\n**정답: 4**", "ck": ["신호 문장 찾기", "심장 찾기", "대칭축", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "함수 f(x) = {{k§x}} (k > 0) 위의 임의의 점 P에서 두 점근선에 내린 수선의 발을 각각 Q, R이라 할 때, 직사각형 OQPR의 넓이를 구하고, 선분 PQ와 PR의 길이의 합의 ==최솟값==을 k에 관한 식으로 나타내시오. (단, 점 P는 제1사분면 위의 점)", "x": null, "s": "**1. 유리함수 본질 해석** 기본형의 두 점근선은 x축과 y축입니다. 점 P를 (a, {{k§a}})로 둡니다.\n**2. 넓이 문맥 독해** 넓이는 가로 a × 세로 {{k§a}}이므로 a가 약분되어 항상 k입니다.\n**3. 길이 합 최솟값 (절대부등식)** a + {{k§a}} ≥ 2√{a × {{k§a}}} = 2√{k}", "ck": ["유리함수 본질 해석", "넓이 문맥 독해", "길이 합 최솟값 (절대부등식)"], "src": "수능 기출 연계", "ex": 1}, {"l": 1, "t": "self", "q": "유리함수 y = {{x + 3§x − 2}}의 수직 점근선과 수평 점근선의 방정식을 각각 구하시오.", "x": null, "s": "**정답: 수직 점근선 x = 2, 수평 점근선 y = 1**\n분모를 0으로 만드는 x = 2가 수직 점근선, x계수의 비율 y = {{1§1}} = 1이 수평 점근선입니다.", "src": "변형 1"}, {"l": 1, "t": "mc", "q": "함수 y = {{2x − 1§x + 1}}의 그래프가 어떤 점에 대하여 대칭인지 그 심장 좌표를 구하시오.", "x": ["(−1, 2)", "(1, 2)", "(−1, −1)", "(2, −1)", "(1, −2)"], "s": "분모에서 수직선 x = −1, x계수 비율에서 수평선 y = 2를 읽어 합칩니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "유리함수 y = {{ax + b§x + c}}의 점근선이 x = 1, y = 3일 때, 상수 a, c의 값은?", "x": ["a = 3, c = −1", "a = 3, c = 1", "a = 1, c = −3", "a = −3, c = 1", "a = 1, c = 3"], "s": "수직 점근선이 x = 1이 되려면 분모 x + c가 x = 1에서 0이어야 하므로 c = −1. 수평 점근선 y = 3은 x계수의 비율 {{a§1}}과 같아야 하므로 a = 3.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "유리함수의 곡선이 점근선과 만날 수 없는 이유를 대수학적 법칙으로 서술하시오.", "x": null, "s": "**정답: y = {{k§x − p}} + q (k ≠ 0) 꼴에서 x = p는 분모를 0으로 만들어 쓸 수 없고, k ≠ 0이므로 {{k§x − p}}는 0이 될 수 없어 y = q도 될 수 없기 때문이다.**\n수직 점근선은 '0으로 나눌 수 없다', 수평 점근선은 '0이 아닌 수를 나눈 값은 0이 될 수 없다'는 두 원칙에서 자석의 힘이 나옴을 서술합니다.", "src": "변형 4"}, {"l": 2, "t": "sa", "q": "함수 y = {{x + 4§x − 1}}의 그래프를 평행이동하여 y = {{k§x}}와 겹치게 할 때, 상수 k의 값은?", "x": "5|5개|5가지", "s": "y = {{(x − 1) + 5§x − 1}} = {{5§x − 1}} + 1. 평행이동해도 변하지 않고 그래프 모양을 결정하는 분자 상수가 5이므로 k = 5입니다.", "src": "변형 5"}, {"l": 2, "t": "sa", "q": "유리함수 y = {{4x − 2§x − 3}}의 그래프가 직선 y = −x + b에 대하여 대칭일 때, 상수 b의 값은?", "x": "7|7개|7가지", "s": "심장은 (3, 4)입니다. 대칭축 y = −x + b가 심장을 지나야 하므로 4 = −3 + b → b = 7", "src": "변형 6"}, {"l": 2, "t": "mc", "q": "함수 y = {{x§x − 2}} 위의 제1사분면의 점 P에서 두 점근선에 내린 수선의 길이의 합의 최솟값은?", "x": ["2√{2}", "2", "4", "√{2}", "2√{3}"], "s": "y = {{2§x − 2}} + 1이므로 점근선은 x = 2, y = 1입니다. P(2 + a, 1 + {{2§a}})로 두면 두 수선의 길이는 a와 {{2§a}}이고, a + {{2§a}} ≥ 2√{a × {{2§a}}} = 2√{2}입니다.", "src": "변형 7"}, {"l": 3, "t": "sa", "q": "두 유리함수 y = {{x + 1§x − 1}}과 y = {{2x + 3§x − 2}}의 점근선들로 둘러싸인 도형의 넓이를 구하시오.", "x": "1|1개|1가지", "s": "첫 번째 함수의 점근선은 x = 1, y = 1, 두 번째는 x = 2, y = 2입니다. 네 선이 만드는 도형은 가로 1, 세로 1인 정사각형이므로 넓이는 1입니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "유리함수의 대칭축의 기울기가 항상 1 또는 −1인 본질적 이유를 기하학적으로 서술하시오.", "x": null, "s": "**정답: 기본형 y = {{k§x}}의 그래프는 직선 y = x와 y = −x에 대하여 대칭이고, 평행이동해도 이 거울선들의 기울기는 변하지 않기 때문이다.**\n평행이동은 모양과 각도를 보존하므로 대칭축의 기울기 ± 1이 그대로 유지됨을 설명합니다.", "src": "변형 9"}, {"l": 3, "t": "mc", "q": "함수 y = {{3x + 1§x − 1}}의 그래프가 지나지 않는 사분면을 점근선과 y절편 문맥으로 판정하시오.", "x": ["없음 (네 사분면을 모두 지난다)", "제1사분면", "제2사분면", "제3사분면", "제4사분면"], "s": "y = {{4§x − 1}} + 3이므로 심장은 (1, 3)입니다. y절편은 −1, x절편은 x = −{{1§3}}입니다. 오른쪽 가지는 제1사분면을 지나고, 왼쪽 가지는 x < −{{1§3}}에서 양수(제2사분면), −{{1§3}} < x < 0에서 음수(제3사분면), 0 < x < 1에서 음수(제4사분면)입니다.", "src": "변형 10"}]}, {"id": "b7", "u": "H", "ex": "2-2", "t": "7. 미사일 발사대 경계론", "color": "보라", "emoji": "🟣", "en": "Theory of Boundary Demarcation", "th": [["p", "곡선과 직선이 만나는 교점 개수를 판정할 때 이차방정식의 판별식(D)을 쓰는 것이 정석입니다. 그러나 무리함수는 시작점이라는 뚜렷한 경계에서 꼬리가 뚝 끊겨 나간 그래프입니다. 두 식을 연립해 무작정 제곱하는 순간, 존재하지 않는 반쪽(음수 쪽) '유령 곡선'까지 계산에 끼어듭니다. 판별식만 쓰면 가짜 교점이 계산되는 대참사가 생기므로, 눈으로 가르는 **[두 개의 경계 벽(시작점 통과선과 접선)]**을 직접 구해야 합니다."], ["li", "**미사일 비유 독해 강령**: 무리함수를 보면 항상 '==미사일 발사대==(시작점)'를 찾고, 루트 앞과 x 앞의 부호를 보고 미사일이 날아가는 방향을 읽으세요.     -   기준벽 1: 미사일 꼬리 끝(시작점)을 직선이 정확히 밟고 지나가는 순간 (D 쓰면 안 됨, 대입만 할 것)     -   기준벽 2: 미사일 등판에 직선이 스치듯 접하는 순간 (D = 0 필터 적용)"], ["p", "**[보충] 발사대와 방향** (a > 0)"], ["tbl", [["무리함수", "발사대(시작점)", "날아가는 방향"], ["y = √{a(x − p)} + q", "(p, q)", "오른쪽 위"], ["y = √{−a(x − p)} + q", "(p, q)", "왼쪽 위"], ["y = −√{a(x − p)} + q", "(p, q)", "오른쪽 아래"], ["y = −√{−a(x − p)} + q", "(p, q)", "왼쪽 아래"]]], ["p", "**[보충] 신호 문장**: \"==서로 다른 두 점에서 만나도록==\", \"==오직 한 점에서 만나도록==\", \"==만나지 않도록==\", \"==교점을 갖도록==\". 문장마다 두 벽 사이의 어느 칸을 묻는지가 다릅니다. 시작점을 지나는 순간은 교점에 포함되므로 보통 등호가 들어가고, 접하는 순간은 교점이 1개뿐이라 '두 점' 범위에서는 등호가 빠집니다."]], "sum": ["신호: \"==두 점에서 만나==\", \"==한 점에서 만나==\", \"==만나지 않==\", \"==교점==\" → **발사대(시작점)**부터", "무작정 제곱해 판별식만 쓰면 유령 곡선(반대 부호 반쪽)까지 세어 오답", "기준벽 1: 직선이 **시작점**을 지날 때 — 대입만 (교점에 포함되므로 보통 등호)", "기준벽 2: 직선이 곡선에 **접할 때** — D = 0", "방향: √ 앞 부호(위·아래) × x 앞 부호(오른쪽·왼쪽)"], "fl": [["y = √{a(x − p)} + q (a > 0)의 발사대와 방향은?", "(p, q), 오른쪽 위"], ["y = −√{−a(x − p)} + q (a > 0)의 방향은?", "왼쪽 아래"], ["무리함수와 직선의 교점 개수, 두 기준벽은?", "시작점을 지날 때(대입) · 접할 때(D = 0)"], ["제곱해서 판별식만 쓰면 왜 틀리나?", "y = −√{x} 같은 유령 곡선까지 함께 세기 때문"]], "bk": {"q": "책을 덮고 「미사일 발사대 경계론」의 신호 문장, 꺼낼 도구, 풀이 순서를 백지에 써 보세요.", "pts": ["발사대(시작점) 찾기", "√ 앞·x 앞 부호로 방향 읽기", "기준벽 1: 시작점 대입", "기준벽 2: 접할 때 D = 0", "제곱하면 유령 곡선 주의", "두 벽 사이 어느 칸인지 + 등호 처리"]}, "pr": [{"l": 3, "t": "self", "q": "무리함수 y = √{2x − 6}의 그래프와 직선 y = x + k가 서로 다른 ==두 점에서 만나==도록 하는 실수 k의 값의 범위를 구하시오.", "x": null, "s": "**1. 발사대 고정석 포착** y = √{2(x − 3)}이므로 발사대는 (3, 0)입니다.\n**2. 경계선 1 (아래쪽 벽)** 직선이 (3, 0)을 지나는 순간: 0 = 3 + k → k = −3 (두 점 접촉이므로 등호 포함)\n**3. 경계선 2 (위쪽 벽)** 연립 후 제곱하여 판별식 D = 0을 씁니다. √{2x − 6} = x + k → x^{2} + (2k − 2)x + k^{2} + 6 = 0, {{D§4}} = (k − 1)^{2} − (k^{2} + 6) = −2k − 5 = 0 → k = −{{5§2}} (접할 때는 1점이므로 등호 제외)\n**4. 정산** −3 ≤ k < −{{5§2}}", "ck": ["발사대 고정석 포착", "경계선 1 (아래쪽 벽)", "경계선 2 (위쪽 벽)", "정산"], "src": "태원고 기출", "ex": 1}, {"l": 2, "t": "self", "q": "무리함수 y = √{4 − 2x}의 그래프와 직선 y = −x + k가 서로 다른 ==두 점에서 만나==도록 하는 실수 k의 값의 범위를 구하시오.", "x": null, "s": "**1. 발사대 방향 독해** y = √{−2(x − 2)}이므로 발사대 (2, 0)에서 왼쪽 위로 날아가는 미사일입니다.\n**2. 경계 1 (시작점 대입)** 0 = −2 + k → k = 2 (등호 포함)\n**3. 경계 2 (접할 때)** 연립 후 제곱하면 x^{2} − 2(k − 1)x + k^{2} − 4 = 0, {{D§4}} = (k − 1)^{2} − (k^{2} − 4) = −2k + 5 = 0 → k = {{5§2}} (등호 제외)\n**4. 정산** 접할 때(2.5)보다 낮고 시작점(2)과 같거나 높아야 두 번 만납니다 → 2 ≤ k < {{5§2}}", "ck": ["발사대 방향 독해", "경계 1 (시작점 대입)", "경계 2 (접할 때)", "정산"], "src": "분당 기출", "ex": 1}, {"l": 2, "t": "self", "q": "함수 y = √{2x − 4}의 그래프와 직선 y = x + k가 ==서로 다른 두 점에서 만나==도록 하는 실수 k의 값의 범위를 구하시오.", "x": null, "s": "**1. 신호 문장 찾기** \"서로 다른 두 점에서 만나\" → 발사대(시작점)부터 찾습니다.\n**2. 기준벽 1: 발사대** 시작점 (2, 0)을 지날 때 0 = 2 + k → k = −2 (이때 x = 2, 4에서 두 점)\n**3. 기준벽 2: 접할 때** (x + k)^{2} = 2x − 4 → x^{2} + (2k − 2)x + k^{2} + 4 = 0, {{D§4}} = −2k − 3 = 0 → k = −{{3§2}}\n**4. 정산** 두 벽 사이(발사대 포함, 접선 제외) → −2 ≤ k < −{{3§2}}\n**정답: −2 ≤ k < −{{3§2}}**", "ck": ["신호 문장 찾기", "기준벽 1: 발사대", "기준벽 2: 접할 때", "정산"], "src": "모의고사 · 학평 연계", "ex": 1}, {"l": 3, "t": "self", "q": "무리함수 y = √{x}의 그래프 위의 점 P와 직선 y = x + 4 사이의 거리의 ==최솟값==을 구하시오.", "x": null, "s": "**1. 거리의 최솟값 문맥 독해** 직선 y = x + 4를 평행이동시켜 곡선과 처음으로 스치듯 접하는 순간(D = 0)을 찾습니다.\n**2. 접선 공식 매칭** √{x} = x + m ⇒ x^{2} + (2m − 1)x + m^{2} = 0\n**3. 정산** D = (2m − 1)^{2} − 4m^{2} = −4m + 1 = 0 ⇒ m = {{1§4}}. 평행한 두 직선 y = x + 4와 y = x + {{1§4}} 사이의 거리는 {{| 4 − {{1§4}} |§√{1^{2} + (−1)^{2}}}} = {{15√{2}§8}}", "ck": ["거리의 최솟값 문맥 독해", "접선 공식 매칭", "정산"], "src": "수능 기출 연계", "ex": 1}, {"l": 1, "t": "mc", "q": "무리함수 y = √{x + 2}의 발사대(시작점) 좌표를 구하시오.", "x": ["(−2, 0)", "(2, 0)", "(0, −2)", "(0, 2)", "(−2, 2)"], "s": "루트 안을 0으로 만드는 x = −2가 꼬리 의자이고, 그때 높이는 0입니다.", "src": "변형 1"}, {"l": 1, "t": "self", "q": "함수 y = √{3 − x}의 미사일 발사 방향을 사분면 문맥으로 설명하시오.", "x": null, "s": "**정답: 시작점 (3, 0)에서 왼쪽 위로 뻗는다 (그래프는 제1사분면과 제2사분면을 지난다)**\n루트 안 x 앞의 부호가 마이너스이므로 왼쪽으로, 루트 전체 앞의 부호가 플러스이므로 위로 날아갑니다. 0 < x < 3 구간에서는 제1사분면, x < 0 구간에서는 제2사분면을 지납니다.", "src": "변형 2"}, {"l": 1, "t": "mc", "q": "무리함수 y = √{x}의 그래프와 직선 y = k가 만나는 교점의 개수가 k의 값에 따라 어떻게 달라지는지 말하시오.", "x": ["k ≥ 0이면 1개, k < 0이면 0개", "항상 1개", "항상 2개", "k > 0이면 2개, k ≤ 0이면 0개", "k의 값에 관계없이 0개"], "s": "가로선이 미사일의 높이 범위(y ≥ 0) 안에 있으면 딱 한 번 만나지만, 미사일은 y = 0 아래로 내려가지 않으므로 k < 0이면 만나지 않습니다.", "src": "변형 3"}, {"l": 2, "t": "self", "q": "기계적으로 무리함수에 판별식만 쓰면 생기는 '유령 곡선의 저주(오답)'에 대해 서술하시오.", "x": null, "s": "**정답: 제곱하는 과정에서 원래 그래프에는 없는 반쪽짜리 가짜 곡선(유령)이 합쳐져 판별식 계산에 포함되므로 교점 개수가 틀리게 나오는 현상이다.**\n제곱이 부호를 지워 버리는 성질 때문에 그래프의 끊긴 경계를 인식하지 못함을 서술합니다.", "src": "변형 4"}, {"l": 2, "t": "mc", "q": "y = √{2x}와 y = x + k가 접할 때의 k값을 판별식 필터로 구하시오.", "x": ["k = {{1§2}}", "k = 1", "k = 2", "k = {{1§4}}", "k = −{{1§2}}"], "s": "2x = (x + k)^{2} → x^{2} + (2k − 2)x + k^{2} = 0, {{D§4}} = (k − 1)^{2} − k^{2} = −2k + 1 = 0 → k = {{1§2}}", "src": "변형 5"}, {"l": 2, "t": "mc", "q": "무리함수 y = √{x − 3}의 그래프와 직선 y = x + k가 만나지 않기 위한 k의 범위를 구하시오.", "x": ["k > −{{11§4}}", "k < −{{11§4}}", "k > −3", "k ≥ −{{11§4}}", "k < −3"], "s": "발사대는 (3, 0)이고 오른쪽 위로 날아갑니다. 접할 때: x − 3 = (x + k)^{2} → x^{2} + (2k − 1)x + k^{2} + 3 = 0, D = (2k − 1)^{2} − 4(k^{2} + 3) = −4k − 11 = 0 → k = −{{11§4}}. 시작점: 0 = 3 + k → k = −3. 직선을 올려 보면 k < −3이면 한 번, −3 ≤ k < −{{11§4}}이면 두 번, 접할 때 한 번 만나고, 그보다 높으면 만나지 않습니다. 따라서 k > −{{11§4}}", "src": "변형 6"}, {"l": 2, "t": "mc", "q": "함수 y = √{2x − 4}의 그래프와 직선 y = kx가 오직 한 점에서만 만나도록 하는 k의 값을 모두 구하시오.", "x": ["k = 0 또는 k = {{1§2}}", "k = {{1§2}}", "k = 0", "0 ≤ k < {{1§2}}", "k = 1"], "s": "발사대는 (2, 0)입니다. 접할 때: 2x − 4 = k^{2}x^{2} → k^{2}x^{2} − 2x + 4 = 0, {{D§4}} = 1 − 4k^{2} = 0 → k = {{1§2}}. 원점을 지나 발사대 (2, 0)을 지나는 직선의 기울기는 0입니다. k = 0이면 발사대 한 점만, 0 < k < {{1§2}}이면 두 점, k = {{1§2}}이면 한 점, 그보다 크거나 음수이면 만나지 않습니다.", "src": "변형 7"}, {"l": 3, "t": "mc", "q": "무리함수 y = −√{x + 1} (아래로 날아가는 미사일)과 직선 y = −x + k가 서로 다른 두 점에서 만나기 위한 k의 범위를 구하시오.", "x": ["−{{5§4}} < k ≤ −1", "−{{5§4}} ≤ k ≤ −1", "k > −{{5§4}}", "−1 ≤ k < 0", "k < −1"], "s": "미사일은 (−1, 0)에서 오른쪽 아래로 떨어집니다. 벽 1(시작점): 0 = 1 + k → k = −1 (등호 포함). 벽 2(접할 때): √{x + 1} = x − k에서 u = √{x + 1} (u ≥ 0)로 두면 u^{2} − u − (1 + k) = 0, 판별식 D = 1 + 4(1 + k) = 0 → k = −{{5§4}} (등호 제외). 직선을 아래에서 위로 올려 보면 k < −{{5§4}}이면 만나지 않고, k = −{{5§4}}이면 한 번 스치고, −{{5§4}} < k ≤ −1이면 두 번, k > −1이면 한 번 만납니다.", "src": "변형 8"}, {"l": 3, "t": "self", "q": "두 식을 연립하여 제곱할 때, 원래는 없던 가짜 근이 추가되는 이유를 부호의 관점에서 설명하시오.", "x": null, "s": "**정답: 양변을 제곱하면 y = √{x}와 가짜 유령 곡선 y = −√{x}가 모두 y^{2} = x라는 하나의 식으로 합쳐지면서 부호 조건이 사라지기 때문이다.**\n제곱은 마이너스 부호를 지워 단방향 무리함수를 양방향 포물선으로 넓혀 버린다는 점을 서술합니다.", "src": "변형 9"}, {"l": 3, "t": "self", "q": "무리함수 y = √{x − 2} + 1의 역함수를 구하고, 역함수의 '정의역 제한 조건'을 본체와 비교하여 서술하시오.", "x": null, "s": "**정답: 역함수 y = (x − 1)^{2} + 2 (x ≥ 1)**\n발사대가 (2, 1)이고 오른쪽 위로 날아가므로 본체의 치역은 y ≥ 1입니다. x와 y를 바꾸어 정리하면 x − 1 = √{y − 2} → y = (x − 1)^{2} + 2이고, 본체의 치역 y ≥ 1이 역함수의 정의역 x ≥ 1로 그대로 넘어갑니다.", "src": "변형 10"}]}];
const BOOKS = {"S1": {"title": "수학 내신 정복서: 상황매칭론", "sub": "공통수학1 독해서 — 문과 학생을 위한 수학 독해", "intro": [["p", "2026년 11월 · Biossam"], ["p", "수학 시험지는 숫자로 쓰인 가장 논리적인 비문학 지문입니다. 이 책은 공통수학1의 일곱 가지 핵심 유형을 무지개 7색 일상 상황으로 번역해, 문장을 읽는 순간 풀이 도구가 떠오르게 만듭니다."], ["h", "✍️ 교재 서문 (머리말)", 2], ["p", "**\"수학 시험지는 숫자로 쓰인 가장 논리적인 국어 비문학 지문일 뿐이다.\"**"], ["p", "많은 학생이 수학 문제를 마주하는 순간, 숨이 턱 막히며 머릿속으로 온갖 복잡한 수식과 공식부터 떠올리려고 합니다. 특히 스스로를 '뼛속까지 문과 성향'이라고 믿는 학생일수록 수학 기호가 주는 차가운 압박감에 눈앞이 흐려지곤 하죠."], ["p", "하지만 기억하세요. 여러분의 약점이라 생각했던 그 넘치는 '언어적 직관력'과 '독해력'은 사실 수학 시험지를 찢어발길 수 있는 가장 강력한 무기입니다. 출제자는 단 한 번도 여러분에게 무자비한 계산 노가다를 요구한 적이 없습니다. 단지 수식이라는 단단한 껍질 속에 일상적인 제한 상황을 숨겨두었을 뿐입니다."], ["p", "이 교재에 담긴 **[상황매칭론(Situation Matching Theory)]**은 수식을 기계적으로 외우는 주입식 솔루션이 아닙니다. 문제 속에 숨겨진 출제자의 의도를 국어적으로 읽어 내어, 택배 송장, 마트 장보기, 레이더 기지, 미사일 발사대와 같은 일상의 이야기로 1:1 번역해 내는 마스터키입니다."], ["p", "단원명이 바뀌고 숫자가 매워져도 본질적인 기하학적·대수적 뼈대는 움직이지 않는 '고정'입니다. 이 책에 수록된 분당 지역과 태원고 출제 경향을 담은 문항들을 통해 무지개 필터의 힘을 몸소 느껴 보세요. 여러분의 독해력은 이미 증명되었습니다. 이제 그 직관을 믿고 시험장에서 완벽한 만점을 쟁취하고 오십시오. 여러분의 위대한 도약을 온 마음으로 응원합니다."], ["h", "이 책 사용법", 2], ["h", "1. 7색 유형 지도 (공통수학1)", 3], ["tbl", [["색", "유형", "단원", "신호 문장", "꺼낼 도구"], ["빨강", "1. 택배 송장론", "다항식 (나머지정리·인수정리)", "\"~로 나눈 나머지\", \"나누어떨어진다\"", "나누는 식을 0으로 만드는 x 대입"], ["주황", "2. 가상 세계 통행증론", "복소수", "\"실수가 되도록\", \"순허수\"", "실수 칸·가상 칸 정리, i^{2} = −1"], ["노랑", "3. 쌍둥이 신분증론", "이차방정식 (판별식, 근과 계수)", "\"두 근을 α, β라 할 때\"", "합 −{{b§a}}, 곱 {{c§a}}, 판별식"], ["초록", "4. 수위선 읽기론", "이차방정식·이차함수·이차부등식", "\"만나는 점의 개수\", \"모든 실수 x에 대하여\"", "한쪽으로 모아 그래프와 x축 비교"], ["파랑", "5. 울타리 안 정상론", "이차함수의 최대·최소", "\"~의 범위에서 최댓값\"", "꼭짓점 위치 확인 + 양 끝 비교"], ["남색", "6. 오디션과 장보기론", "경우의 수 (순열과 조합)", "\"일렬로\", \"~개를 고르는\", \"이웃하지 않도록\"", "_{n}P_{r}, _{n}C_{r}, 먼저 세우고 사이에 끼우기"], ["보라", "7. 주문서와 가격표론", "행렬", "\"(i, j) 성분\", \"AB\"", "같은 칸 계산, 가로줄 × 세로줄"]]], ["h", "2. 한 유형을 공부하는 3단계", 3], ["li", "**심층 이론**: 왜 이 도구를 쓰는지 상황으로 이해합니다. 이 책에서 ==노란 형광펜==이 칠해진 말이 바로 '신호 문장'입니다. 문제를 풀 때도 같은 말에 직접 형광펜을 긋는 습관을 들이세요."], ["li", "**핵심 4단 연계 기출 해설**: 태원고 기출 스타일 → 분당권 내신 function fmt(s){
  if(s==null)return '';
  s=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const H=[];const ph=h=>'\u0001'+(H.push(h)-1)+'\u0002';
  const R=[[/\^\{([^{}]*)\}/g,(m,a)=>ph('<sup>'+a+'</sup>')],[/_\{([^{}]*)\}/g,(m,a)=>ph('<sub>'+a+'</sub>')],
    [/√\{([^{}]*)\}/g,(m,a)=>ph('√<span class="sq">'+a+'</span>')],[/‾\{([^{}]*)\}/g,(m,a)=>ph('<span class="ov">'+a+'</span>')],
    [/\{\{([^{}§]*)§([^{}§]*)\}\}/g,(m,a,b)=>ph('<span class="fr"><span>'+a+'</span><span>'+b+'</span></span>')],
    [/⟦([^⟦⟧]*)⟧/g,(m,a)=>ph('<span class="mx">'+a.split('¦').map(r=>'<span class="r">'+r.split('¤').map(c=>'<span>'+c+'</span>').join('')+'</span>').join('')+'</span>')],
    [/⦃([^⦃⦄]*)⦄/g,(m,a)=>ph('<span class="pw">'+a.split('¦').map(r=>'<span>'+r+'</span>').join('')+'</span>')]];
  for(let k=0;k<12;k++){const o=s;R.forEach(([re,f])=>{s=s.replace(re,f)});if(o===s)break}
  s=s.replace(/\^(-?\d+|[a-zA-Z])/g,'<sup>$1</sup>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
  for(let k=0;k<12&&/\u0001/.test(s);k++)s=s.replace(/\u0001(\d+)\u0002/g,(m,i)=>H[+i]);
  return s.replace(/\n/g,'<br>');
}

function dayRec(){const k=dayStr(today());if(!S.days[k])S.days[k]={sess:0,probs:0,ok:0,blanks:0,fl:0};return S.days[k]}

function recordProblem(pr,ok){
  const c=cs(pr.cid);c.seen=Math.max(c.seen,1);c.n++;
  c.acc=c.acc==null?(ok?1:0):c.acc*.7+(ok?.3:0);
  if(!pr.gen){const p=S.p[pr.id]||(S.p[pr.id]={n:0,ok:0,last:-1});p.n++;if(ok)p.ok++;p.last=today()}
  const wi=S.wrong.findIndex(w=>w.id===pr.id);
  if(!ok){if(wi<0){S.wrong.push({id:pr.id,cid:pr.cid,day:today(),g:pr.gen?{l:pr.l,t:pr.t,q:pr.q,x:pr.x,s:pr.s}:null});if(S.wrong.length>150)S.wrong.shift()}c.due=Math.min(c.due||today()+1,today()+1)}
  else if(wi>=0&&S.wrong[wi].day<today())S.wrong.splice(wi,1);
  if(RUN&&RUN.mode==='daily'){S.daily=S.daily||{done:{},log:{}};S.daily.done[pr.id]=today();const dk=dayStr(today());S.daily.log[dk]=(S.daily.log[dk]||0)+1}
  const d=dayRec();d.probs++;if(ok)d.ok++;save();
}
function recordBlank(cid,score,probAcc){
  const c=cs(cid);c.seen++;c.blank.push(score);if(c.blank.length>6)c.blank.shift();
  const good=score>=80&&(probAcc==null||probAcc>=.67), bad=score<50||(probAcc!=null&&probAcc<.34);
  if(good)c.box=Math.min(6,c.box+1);else if(bad)c.box=1;else c.box=Math.max(1,c.box);
  c.due=today()+INTERVAL[c.box];dayRec().blanks++;save();
}
function finishSessionDay(){const d=dayRec();d.sess++;const t=today();if(S.lastDay===t){}else if(S.lastDay===t-1)S.streak++;else S.streak=1;S.lastDay=t;save()}
const solvedOn=t=>{const d=S.days[dayStr(t)];return !!(d&&d.probs>0)};
function streakInfo(){const t=today();let s=solvedOn(t)?t:(solvedOn(t-1)?t-1:null);if(s==null)return {n:0,start:null};let n=0,d=s;while(solvedOn(d)){n++;d--}return {n,start:d+1}}
function curStreak(){return streakInfo().n}

// ===== 문제 고르기 =====
function pool(cid){return C[cid].pr.map((p,i)=>Object.assign({},p,{id:cid+'-'+i,cid}))}
function genOne(cid){const g=C[cid].gen;if(!g)return null;const p=GEN[pick(g)]();return Object.assign(p,{id:cid+'-g'+Math.random().toString(36).slice(2,8),cid,gen:true})}
const lastSeen=id=>S.p[id]?S.p[id].last:-99;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickOne(cid,lv,used){
  const all=shuffle(pool(cid)).filter(p=>!used.has(p.id));
  const t=today();
  const fresh=p=>lastSeen(p.id)<t;
  let c=all.filter(p=>p.l===lv&&fresh(p)).sort((a,b)=>lastSeen(a.id)-lastSeen(b.id));
  if(!c.length&&lv<=2&&C[cid].gen&&Math.random()<.85){const g=genOne(cid);if(g)return g}
  if(!c.length){for(const d of [1,-1,2,-2]){c=all.filter(p=>p.l===lv+d&&fresh(p));if(c.length)break}}
  if(!c.length&&C[cid].gen)return genOne(cid);
  if(!c.length)c=all.filter(p=>p.l===lv).concat(all);
  // 같은 레벨에서 유형 섞기: 이미 고른 유형과 다른 것 우선
  const ut=new Set([...used].map(id=>id.split('|')[1]).filter(Boolean));
  const d=c.find(p=>!ut.has(p.t))||c[0];
  return d||null;
}
function prepare(p){if(p.t==='mc')p.order=shuffle(p.x.map((_,i)=>i));return p}
function pickSet(specs){ // specs: [{cid,lv}]
  const used=new Set(),out=[];
  for(const s of specs){const p=pickOne(s.cid,s.lv,used);if(p){used.add(p.id);used.add(p.id+'|'+p.t);out.push(prepare(p))}}
  return out;
}
function levelsFromBlank(score){return score<50?[1,1,2]:score<80?[1,2,3]:[2,3,3]}
function spiralCids(exclude,k){
  const ids=rangeIds().filter(id=>id!==exclude&&S.c[id]&&S.c[id].seen);
  const t=today();
  const w=ids.map(id=>{const m=mastery(id);const c=S.c[id];return {id,w:(1-(m==null?0:m))+(c.due<=t?.6:0)+Math.random()*.4}}).sort((a,b)=>b.w-a.w);
  return w.slice(0,k).map(x=>x.id);
}
function wrongProblem(exclude){
  const cand=S.wrong.filter(w=>w.day<today()&&inRange(w.cid)&&w.cid!==exclude);
  if(!cand.length)return null;const w=cand[0];
  if(w.g)return prepare(Object.assign({},w.g,{id:w.id,cid:w.cid,gen:true,retry:true}));
  const i=+w.id.split('-').pop();const base=C[w.cid]&&C[w.cid].pr[i];if(!base)return null;
  return prepare(Object.assign({},base,{id:w.id,cid:w.cid,retry:true}));
}
function chooseBlank(){
  const ids=rangeIds();const t=today();
  const due=ids.filter(id=>S.c[id]&&S.c[id].seen&&S.c[id].due<=t).sort((a,b)=>(S.c[a].due-S.c[b].due)||((mastery(a)||0)-(mastery(b)||0)));
  const nw=ids.find(id=>!S.c[id]||!S.c[id].seen);
  // 복습할 개념이 2개 이상이거나 하루 이상 밀렸으면 복습 백지, 아니면 새 개념으로 나아가고 복습은 플래시·나선 문제로
  if(due.length&&(!nw||due.length>=2||S.c[due[0]].due<t))return {cid:due[0],isNew:false};
  if(nw)return {cid:nw,isNew:true};
  const low=ids.slice().sort((a,b)=>(mastery(a)||0)-(mastery(b)||0));
  return {cid:low[0],isNew:false};
}
function flashCards(exclude){
  const t=today();const ids=rangeIds().filter(id=>id!==exclude&&S.c[id]&&S.c[id].seen);
  let src=ids.filter(id=>S.c[id].due<=t+1);
  if(src.length<3)src=src.concat(ids.filter(id=>!src.includes(id)).sort((a,b)=>(mastery(a)||0)-(mastery(b)||0)));
  const cards=[];for(const id of src){const f=C[id].fl;cards.push({cid:id,q:f[Math.floor(Math.random()*f.length)][0],a:null,fi:null});}
  return shuffle(cards.slice(0,6)).slice(0,5).map(c=>{const f=C[c.cid].fl.find(x=>x[0]===c.q);return {cid:c.cid,q:f[0],a:f[1]}});
}

let DB=null,syncState='local',pushing=false,pending=false,pushT=null;
function schedulePush(){if(!DB)return;clearTimeout(pushT);pushT=setTimeout(pushRemote,1500)}
async function pushRemote(){if(!DB)return;if(pushing){pending=true;return}pushing=true;
  try{await DB.set({state:JSON.stringify(S),updatedAt:S.updatedAt});setSync('cloud')}catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){DB=null;setSync('local')}}
  pushing=false;if(pending){pending=false;pushRemote()}}
function setSync(s){syncState=s;const el=document.getElementById('sync');if(el){el.textContent=s==='cloud'?'☁︎ 기기 간 저장됨':s==='wait'?'☁︎ 연결 중…':'이 기기에 저장';el.className='sync '+s}}
async function initSync(){
  for(let i=0;i<20&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,250));
  if(!(window.claude&&window.claude.use))return;
  setSync('wait');
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync('local');return}
    const id=await user.id();if(!id){setSync('local');return}
    const ref=db.doc('data/users/'+id+'/progress');
    const timer=setTimeout(()=>setSync('local'),10000);
    const snap=await ref.get();clearTimeout(timer);DB=ref;
    let remote=null;if(snap.exists){try{remote=JSON.parse(snap.data().state)}catch(e){}}
    if(remote&&(remote.updatedAt||0)>(S.updatedAt||0)){S=migrate(Object.assign(fresh(),remote));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!RUN)render()}
    else if(!remote||(S.updatedAt||0)>(remote.updatedAt||0))await pushRemote();
    setSync('cloud');
  }catch(e){setSync('local')}
}

  // 내신 실전: 객관식·단답 19 + 서술형 3 = 22문항, 중상(실력)·상(심화) 50% 이상, 학평 유형 우선, 목표 50분
  const ids=rangeIds();const all=ids.flatMap(id=>pool(id));
  const pick=(arr,n,used)=>{const by={};shuffle(arr).sort((x,y)=>(y.h||0)-(x.h||0)).forEach(p=>{if(!used.has(p.id))(by[p.cid]=by[p.cid]||[]).push(p)});
    const order=shuffle(Object.keys(by));const out=[];let r=0;while(out.length<n&&order.some(c=>by[c].length>r)){for(const c of order){if(out.length>=n)break;if(by[c][r]){out.push(by[c][r]);used.add(by[c][r].id)}}r++}return out};
  const used=new Set();
  const objHi=pick(all.filter(p=>p.l>=2&&(p.t==='mc'||p.t==='sa')),12,used);
  const objLo=pick(all.filter(p=>p.l===1&&(p.t==='mc'||p.t==='sa')),19-objHi.length,used);
  const desc=pick(all.filter(p=>p.t==='self'&&p.l>=2),3,used);

}

  if(RUN&&RUN.mode==='exam'&&!a&&!st.reveal&&st.j<st.list.length-1)ui+=`<button class="ghost wide skipb" data-act="pskip">⏭ 나중에 풀기 (맨 뒤로 보내기)</button>`;
  let fb='';
  if(p.t==='self'&&st.reveal&&!a)fb=`<div class="sol"><b>모범 풀이</b><div>${fmt(p.s)}</div></div>${p.ck?`<div class="ckl"><b>✍️ 서술형 감점 체크 — 내 답안에 다 썼나요?</b>${p.ck.map(c=>`<label><input type="checkbox"> <span>${fmt(c)}</span></label>`).join('')}<p class="small muted">하나라도 빠졌으면 부분 점수가 깎여요.</p></div>`:''}<div class="two"><button class="rate r0" data-self="0">틀렸어요</button><button class="rate r2" data-self="1">맞았어요</button></div>`;
  if(a)fb=`<div class="fb ${a.ok?'ok':'no'}">${a.ok?'정답! 👏':'아쉬워요 — 오답노트에 담았어요'}</div><div class="sol"><b>풀이</b><div>${fmt(p.s)}</div></div><button class="big" data-act="pnext">${st.j+1<st.list.length?'다음 문제 ▶':'결과 보기 ▶'}</button>`;
  return ptimerHTML(st,p)+`<p class="step">문제 ${st.j+1} / ${st.list.length} ${st.levelNote&&st.j===0?`<span class="note">${st.levelNote}</span>`:''}</p>
  <div class="qmeta"><span class="tag s">${esc(C[p.cid].t)}</span><span class="tag lv${p.l}">${LV[p.l]}</span><span class="tag ty">${TY[p.t]}</span>${p.src?`<span class="tag ${p.ex?'hp':'src'}">${esc(p.src)}</span>`:''}${p.retry?'<span class="tag rt">오답 재도전</span>':''}</div>
  <div class="q">${fmt(p.q)}</div>${inkHTML(st)}${ui}${fb}`;
}
function doneHTML(){
  const ps=RUN.steps.find(s=>s.k==='probs');const fl=RUN.steps.find(s=>s.k==='flash');
  const ok=ps?ps.res.filter(x=>x).length:0,n=ps?ps.res.length:0;
  const mins=Math.max(1,Math.round((Date.now()-RUN.start)/60000));
  let blank='';
  if(RUN.blankScore!=null){const cid=RUN.blankCid||RUN.steps[0].cids[0];const st=S.c[cid];blank=`<div class="res"><b>${RUN.blankScore}점</b><span>백지 테스트${RUN.blankCids&&RUN.blankCids.length>1?' (단원)':''}</span></div>`;
    if(RUN.mode!=='blank'||RUN.blankCids.length===1){const d=st.due-today();blank+=`<p class="muted center">「${esc(C[cid].t)}」 다음 복습: <b>${d<=0?'오늘':d===1?'내일':d+'일 뒤'}</b> (복습 ${st.box}단계)</p>`}}
  const msg=RUN.blankScore!=null&&RUN.blankScore<50?'오늘 헷갈린 개념은 내일 다시 나와요. 반복이 실력이 돼요!':n&&ok/n>=.8?'훌륭해요! 이 속도면 4% 안쪽 충분히 가능해요.':'좋아요. 틀린 문제는 내일 다시 만나요.';
  let pace='';if(RUN.mode==='exam'&&n){const sec=Math.round((Date.now()-RUN.start)/1000),per=Math.round(sec/n),inT=sec<=RUN.target;pace=`<div class="card"><h3>⏱ 실전 속도</h3><p>걸린 시간 <b>${mmss(sec)}</b> / 목표 ${mmss(RUN.target)} · 문항당 평균 <b>${mmss(per)}</b> (목표 2:16)${RUN.steps.find(x=>x.k==='probs').skipped?` · 넘긴 문제 ${RUN.steps.find(x=>x.k==='probs').skipped}번`:''}</p><p class="small muted">${inT&&ok/n>=.8?'시간도 정확도도 좋아요! 실전 감각이 잡혀 있어요.':inT?'시간은 충분해요. 틀린 문제의 조건을 다시 읽는 연습을 해 봐요.':ok/n>=.8?'정확하지만 느려요. 아는 문제는 더 빨리 넘어가는 연습을 해요.':'시간과 정확도 모두 아쉬워요. 개념 정리부터 다시 보고 도전해요.'}</p></div>`}
  return `<div class="done"><div class="emoji">${RUN.mode==='session'?'🚌':RUN.mode==='exam'?'🎯':'✨'}</div><h2 class="h2 center">${RUN.mode==='session'?'오늘의 15분 끝!':'완료!'}</h2>
  <div class="resrow">${blank}${n?`<div class="res"><b>${ok}/${n}</b><span>문제 정답</span></div>`:''}${fl?`<div class="res"><b>${fl.res.filter(x=>x===2).length}/${fl.cards.length}</b><span>플래시 알았음</span></div>`:''}<div class="res"><b>${mins}분</b><span>학습 시간</span></div></div>
  <p class="center">${msg}</p>
  ${pace}
  ${ps&&n?`<div class="card"><h3>문제 다시 보기</h3>${ps.list.map((p,i)=>`<div class="rv ${ps.res[i]?'ok':'no'}"><span>${ps.res[i]?'○':'✕'}</span><span>${esc(C[p.cid].t)} · ${LV[p.l]} · ${TY[p.t]}</span></div>`).join('')}</div>`:''}
  <button class="big" data-act="finish">홈으로</button></div>`;
}
function nextStep(){RUN.i++;
  const st=RUN.steps[RUN.i];
  if(st&&st.k==='done'){
    if(RUN.mode==='session'){const ps=RUN.steps.find(s=>s.k==='probs');const own=ps.list.map((p,i)=>p.cid===RUN.blankCid?ps.res[i]:null).filter(x=>x!==null);
      const acc=own.length?own.filter(x=>x).length/own.length:null;recordBlank(RUN.blankCid,RUN.blankScore,acc);finishSessionDay()}
  }
  render();window.scrollTo(0,0)}

// ===== 이벤트 =====
document.addEventListener('click',e=>{
  const md=document.getElementById('modal');
  if(md.classList.contains('on')){const dbb=e.target.closest('[data-dexb]');if(dbb){const br=BREEDS[+dbb.dataset.dexb];ask(`<svg viewBox="0 -2 40 36" width="96" height="86">${bFace(br)}</svg>`,esc(br.n),esc(br.t),[{t:'📖 도감으로',cls:'go',fn:openDex}],'닫기');return}const mb=e.target.closest('[data-mb]');if(mb){const i=mb.dataset.mb;const fn=i==='x'?null:md._b[+i].fn;closeModal();if(fn)fn()}else if(e.target===md)closeModal();return}
  const b=e.target.closest('button,[data-act]');if(!b)return;const d=b.dataset;
  if(d.cat){findCat(d.cat,b);return}
  if(d.act==='dex'){openDex();return}
  if(d.act==='shelfopen'){shelfOpen(true);return}
  if(d.act==='shelfclose'){shelfOpen(false);mapOpen(false);return}
  if(d.act==='mapopen'){mapOpen(true);return}
  if(d.concept&&b.closest('#mapside'))mapOpen(false);
  if(d.shelf){S.shelf=S.shelf||[];const i=S.shelf.indexOf(d.shelf);if(i<0)S.shelf.push(d.shelf);else{S.shelf.splice(i,1);toast('서재에서 뺐어요')}save();render();return}
  if(d.book){const id=d.book;shelfOpen(false);if(VIEW==='run'&&RUN&&RUN.steps[RUN.i].k!=='done')ask('📗','개념 보러 갈까요?','진행 중인 활동은 여기서 끝나요.',[{t:'「'+C[id].t+'」 보기',cls:'go',fn:()=>go('concept',id)}]);else go('concept',id);return}
  if(d.act==='home'){if(VIEW==='run'&&RUN&&RUN.steps[RUN.i].k!=='done')ask('🏠','홈으로 갈까요?','지금까지 푼 문제는 저장돼요. 진행 중인 활동은 여기서 끝나요.',[{t:'홈으로 가기',cls:'go',fn:()=>go('home')}]);else go('home');return}
  if(d.act==='restart'){if(RUN&&RUN.re)ask('↺','처음부터 다시 할까요?','이 활동을 첫 단계부터 새로 시작해요.',[{t:'처음부터 다시',cls:'go',fn:()=>RUN.re()}]);return}
  if(d.act==='resetask'){ask('↺','무엇을 리셋할까요?','학습 기록은 한 번 지우면 되돌릴 수 없어요. (시험 날짜·범위 설정은 그대로 둬요)',[{t:'오답노트만 비우기',fn:()=>{S.wrong=[];save();toast('오답노트를 비웠어요');render()}},{t:'학습 기록 전체 초기화',cls:'red',fn:()=>ask('⚠️','정말 모두 지울까요?','숙련도, 복습 일정, 연속 학습일, 오답노트가 모두 사라져요.',[{t:'네, 모두 지우기',cls:'red',fn:resetAll}])}]);return}
  if(b.classList.contains('flip')){b.classList.toggle('open');return}
  if(d.go){go(d.go);return}
  if(d.grade){const g=+d.grade,o=curGrade();if(g!==o){S.rangeBy=S.rangeBy||{};S.rangeBy[o]=S.range;S.range=S.rangeBy[g]||RANGES_G[g][RANGES_G[g].length-1][0];save();toast('고'+g+' 범위로 바꿨어요');render()}return}
  if(d.unitpr){const u=d.unitpr;const cs=rangeIds().filter(id=>C[id].u===u);const pl=shuffle(cs.flatMap(id=>pool(id)).filter(p=>p.l>=2&&p.t!=='ox')).sort((a,b)=>(b.h||0)-(a.h||0)).slice(0,10);if(!pl.length){toast('문항이 부족해요');return}return startProbs(shuffle(pl).map(prepare),'단원 집중: '+UNITS[u].t)}
  if(d.range){S.range=d.range;save();render();return}
  if(d.concept){go('concept',d.concept);return}
  if(d.blankone){startBlank([d.blankone],'백지 테스트');return}
  if(d.blankunit){startBlank(CONCEPTS.filter(c=>c.u===d.blankunit&&inRange(c.id)).map(c=>c.id),UNITS[d.blankunit].t+' 단원 백지');return}
  if(d.practone){startProbs(pool(d.practone).map(prepare),C[d.practone].t+' · 기출 4 + 변형 10');return}
  if(d.plv!=null){PRACT.lv=+d.plv;render();return}
  if(d.pn){PRACT.n=+d.pn;render();return}
  const a=d.act;const st=RUN&&RUN.steps[RUN.i];
  if(a==='start')return startSession();
  if(a==='daily'){const t=dailyToday();const l=pickDaily();if(t>0&&t<3)l.length=3-t;return startProbs(l,'오늘의 3문제','daily')}
  if(a==='exam'){return startExam()}
  if(a==='pskip'){const st=RUN.steps[RUN.i];st.list.push(st.list.splice(st.j,1)[0]);st.skipped=(st.skipped||0)+1;st.reveal=false;toast('맨 뒤로 보냈어요. 나중에 다시 나와요');render();return}
  if(a==='mix'){const ids=rangeIds();return startProbs(practiceList(shuffle(ids),PRACT.n),'범위 섞어 풀기')}
  if(a==='wrongrun'){const list=S.wrong.filter(w=>inRange(w.cid)).slice(0,15).map(w=>{if(w.g)return prepare(Object.assign({},w.g,{id:w.id,cid:w.cid,gen:true,retry:true}));const base=C[w.cid].pr[+w.id.split('-').pop()];return base?prepare(Object.assign({},base,{id:w.id,cid:w.cid,retry:true})):null}).filter(Boolean);return startProbs(list,'오답 재도전','wrong')}
  if(a==='quit'){if(RUN&&RUN.steps[RUN.i].k!=='done'&&!b.dataset.sure){b.dataset.sure=1;b.textContent='나가기?';b.classList.add('warn');setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='✕';b.classList.remove('warn')}},2500);return}go('home');return}
  if(a==='finish'){go('home');return}
  if(a==='reset'){document.getElementById('resetbox').innerHTML='<p class="small">정말 모든 기록을 지울까요?</p><button class="ghost wide danger" data-act="reset2">네, 모두 지우기</button>';return}
  if(a==='reset2'){const r=S.range,ex=S.examDate,mp=S.map;S=fresh();S.range=r;S.examDate=ex;S.map=mp;save();toast('초기화했어요');go('home');return}
  if(!st)return;
  if(a==='fshow'&&st.k==='flash'&&!st.show){st.show=true;render();return}
  if(d.frate!=null&&st.k==='flash'){const v=+d.frate;st.res.push(v);const c=st.cards[st.j];if(v===0){const cc=cs(c.cid);cc.due=Math.min(cc.due,today()+1)}dayRec().fl++;save();st.j++;st.show=false;if(st.j>=st.cards.length)nextStep();else render();return}
  if(a==='next'){nextStep();return}
  if(a==='bcheck'){const m=document.getElementById('memo');st.memo=m?m.value:'';st.phase='check';render();window.scrollTo(0,0);return}
  if(d.chk){st.checked[d.chk]=!st.checked[d.chk];render();return}
  if(a==='bdone'){
    let n=0,k=0;const per={};st.cids.forEach(cid=>{const pts=C[cid].bk.pts;let kk=0;pts.forEach((_,i)=>{n++;if(st.checked[cid+':'+i]){k++;kk++}});per[cid]=Math.round(kk/pts.length*100)});
    RUN.blankScore=Math.round(k/n*100);RUN.blankCids=st.cids;
    if(RUN.mode==='blank'){st.cids.forEach(cid=>recordBlank(cid,per[cid],null));RUN.blankCid=st.cids.length===1?st.cids[0]:st.cids.slice().sort((x,y)=>per[x]-per[y])[0]}
    nextStep();return}
  if(st.k==='probs'){
    const p=st.list[st.j];
    const answer=(ok,extra)=>{st.ans=Object.assign({ok},extra);st.res[st.j]=ok;recordProblem(p,ok);render();const f=document.querySelector('.fb');if(f)f.scrollIntoView({behavior:'smooth',block:'center'})};
    if(d.pick!=null&&!st.ans)return answer(+d.pick===0,{pick:+d.pick});
    if(d.ox!=null&&!st.ans){const v=d.ox==='true';return answer(v===p.x,{pick:v})}
    if(a==='sacheck'&&!st.ans){const v=(document.getElementById('sain').value||'').trim();const norm=s=>String(s).replace(/\s/g,'').replace(/[−–]/g,'-').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/²/g,'^2').replace(/×/g,'*').replace(/(개|가지)$/,'').toLowerCase();return answer(String(p.x).split('|').some(x=>norm(x)===norm(v)),{val:v})}
    if(a==='reveal'){st.reveal=true;render();return}
    if(d.self!=null&&!st.ans)return answer(d.self==='1',{});
    if(a==='pnext'){st.j++;st.ans=null;st.reveal=false;if(st.j>=st.list.length)nextStep();else{render();window.scrollTo(0,0)}return}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='exdate'){S.examDate=e.target.value;save();toast('저장했어요');if(VIEW==='home')render()}
  if(e.target.dataset.map){S.map[e.target.dataset.map]=e.target.value;save();toast('범위를 바꿨어요')}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sain'){e.preventDefault();const b=document.querySelector('[data-act="sacheck"]');if(b)b.click()}});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1600)}

render();
initSync();

</script>
